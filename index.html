<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2a4bd7">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Caderneta de Fiscal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* VOICE everyday study, friendly and encouraging, never childish
   IDEA a fiscal's field notebook: lessons are pages, progress is stamped with an official carimbo
   PICTURE the notebook cover on Início: level ring, XP, streak and the countdown to the exam
   COLOUR white paper, ink navy, cobalt pen #2a4bd7 leads, highlighter yellow supports, stamp red marks wins and errors
   TYPE Archivo 800 for titles + Inter for text
   LAYOUT one column app, max 720px, bottom tab bar on phones, side tabs above 900px */
:root{color-scheme:light dark;--bg:light-dark(#ffffff,#0e1422);--card:light-dark(#f4f6fc,#172036);--line:light-dark(#dde2ef,#2a3552);--ink:light-dark(#14203a,#eef1fa);--soft:light-dark(#56607a,#a9b2c9);--pen:light-dark(#2a4bd7,#7f9bff);--pen2:light-dark(#e8edff,#1e2b55);--hl:#ffd84a;--stamp:light-dark(#d93a22,#ff7a5f);--ok:light-dark(#1d7a4c,#5fd39a);--okbg:light-dark(#e3f5ea,#123425);--errbg:light-dark(#fde7e2,#3a1a16)}
:root[data-theme=light]{color-scheme:light}
:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Inter,system-ui,sans-serif;overflow-x:clip;-webkit-tap-highlight-color:transparent}
h1,h2,h3{font-family:Archivo,Inter,sans-serif;font-weight:800;letter-spacing:-.02em;line-height:1.1;margin:0}
h1{font-size:clamp(26px,6vw,34px)}
h2{font-size:22px}
h3{font-size:17px}
button{font:inherit;color:inherit;cursor:pointer}
.app{max-width:760px;margin:0 auto;padding:max(16px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) 110px max(16px,env(safe-area-inset-left))}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}
.top small{display:block;color:var(--soft);font-size:13px}
.count{flex:none;background:var(--hl);color:#14203a;border-radius:12px;padding:6px 12px;text-align:center;font-weight:600;font-size:13px;line-height:1.2;max-width:110px}
.count b{display:block;font:800 22px/1 Archivo,sans-serif}
.cover{background:var(--pen);color:#fff;border-radius:22px;padding:20px;display:grid;grid-template-columns:auto minmax(0,1fr);gap:18px;align-items:center;position:relative;overflow:hidden}
.cover:after{content:"";position:absolute;inset:auto -40px -60px auto;width:180px;height:180px;border:14px solid rgba(255,255,255,.12);border-radius:50%}
.ring{width:108px;height:108px}
.ring text{fill:#fff;font:800 30px Archivo,sans-serif}
.cover h2{color:#fff;font-size:24px}
.cover p{margin:4px 0 10px;opacity:.9;font-size:14px}
.bar{height:10px;background:rgba(255,255,255,.25);border-radius:9px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--hl);border-radius:9px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.chip{background:rgba(255,255,255,.16);border-radius:99px;padding:5px 11px;font-size:13px;font-weight:600;white-space:nowrap}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:14px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:10px 16px;border-radius:14px;border:2px solid var(--pen);background:var(--pen);color:#fff;font-weight:600;text-align:center}
.btn.ghost{background:transparent;color:var(--pen)}
.btn.soft{background:var(--pen2);border-color:var(--pen2);color:var(--pen)}
.btn:disabled{opacity:.45;cursor:default}
.btn:focus-visible,.opt:focus-visible,.tab:focus-visible,.pill:focus-visible{outline:3px solid var(--hl);outline-offset:2px}
.sec{margin-top:26px}
.sec>h2{margin-bottom:10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px}
.row{display:flex;align-items:center;gap:12px;justify-content:space-between}
.mat{display:grid;gap:10px}
.mrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;align-items:center}
.mrow .track{grid-column:1/-1;height:8px;background:var(--line);border-radius:8px;overflow:hidden}
.mrow .track i{display:block;height:100%;background:var(--pen)}
.mrow small{color:var(--soft);font-size:13px;white-space:nowrap}
.muted{color:var(--soft);font-size:14px}
.list{display:grid;gap:10px}
.lesson{display:grid;grid-template-columns:44px minmax(0,1fr);gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px}
.lesson .dot{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--pen2);color:var(--pen);font:800 16px Archivo,sans-serif}
.lesson.done .dot{background:var(--stamp);color:#fff;transform:rotate(-8deg)}
.lesson h3{margin-bottom:2px}
.lesson .acts{grid-column:1/-1;display:flex;gap:8px;flex-wrap:wrap}
.lesson .acts .btn{min-height:44px;flex:1 1 140px;font-size:15px}
.pills{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.pill{flex:none;min-height:40px;padding:8px 14px;border-radius:99px;border:1.5px solid var(--line);background:var(--bg);font-weight:600;font-size:14px;white-space:nowrap}
.pill.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
label.f{display:grid;gap:6px;font-size:14px;font-weight:600}
select,textarea{font:inherit;font-size:16px;color:var(--ink);background:var(--bg);border:1.5px solid var(--line);border-radius:12px;padding:10px;width:100%}
textarea{min-height:110px;font-size:13px;font-family:ui-monospace,monospace}
.q{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px}
.qmeta{display:flex;justify-content:space-between;gap:8px;color:var(--soft);font-size:13px;margin-bottom:10px;flex-wrap:wrap}
.qtext{font-size:18px;line-height:1.45;margin:0 0 14px}
.opts{display:grid;gap:10px}
.opt{display:grid;grid-template-columns:34px minmax(0,1fr);gap:10px;align-items:center;text-align:left;min-height:52px;padding:10px 12px;border-radius:14px;border:2px solid var(--line);background:var(--bg)}
.opt b{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--pen2);color:var(--pen);font-family:Archivo,sans-serif}
.opt.sel{border-color:var(--pen)}
.opt.sel b{background:var(--pen);color:#fff}
.opt.ok{border-color:var(--ok);background:var(--okbg)}
.opt.ok b{background:var(--ok);color:#fff}
.opt.bad{border-color:var(--stamp);background:var(--errbg)}
.opt.bad b{background:var(--stamp);color:#fff}
.expl{margin-top:14px;padding:14px;border-radius:14px;background:var(--bg);border-left:5px solid var(--ok)}
.expl.bad{border-color:var(--stamp)}
.expl strong{display:block;font-family:Archivo,sans-serif;font-size:17px;margin-bottom:4px}
.qnav{display:flex;gap:10px;margin-top:14px}
.qnav .btn{flex:1}
.prog{height:8px;background:var(--line);border-radius:8px;overflow:hidden;margin:10px 0 14px}
.prog i{display:block;height:100%;background:var(--pen);transition:width .3s}
.slides{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;gap:12px;scrollbar-width:none}
.slide{flex:0 0 100%;scroll-snap-align:start;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:22px;min-height:260px}
.slide h3{font-size:21px;margin-bottom:10px}
.slide p{font-size:17px;margin:0}
.slide b{background:linear-gradient(transparent 55%,color-mix(in srgb,var(--hl) 70%,transparent) 55%);color:inherit}
.dots{display:flex;gap:6px;justify-content:center;margin:12px 0}
.dots i{width:8px;height:8px;border-radius:8px;background:var(--line)}
.dots i.on{background:var(--pen);width:22px}
.timer{font:800 20px Archivo,sans-serif;white-space:nowrap}
.navgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(40px,1fr));gap:6px;margin-top:12px}
.navgrid button{min-height:40px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);font-size:13px;font-weight:600}
.navgrid button.ans{background:var(--pen2);border-color:var(--pen)}
.navgrid button.cur{outline:2px solid var(--ink)}
.navgrid button.ok{background:var(--okbg);border-color:var(--ok)}
.navgrid button.bad{background:var(--errbg);border-color:var(--stamp)}
.score{font:800 clamp(52px,14vw,76px)/1 Archivo,sans-serif;color:var(--pen)}
.stamps{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.stamp{border:2px dashed var(--line);border-radius:16px;padding:14px;text-align:center;font-size:13px;color:var(--soft)}
.stamp svg{width:64px;height:64px;display:block;margin:0 auto 6px}
.stamp.got{border-style:solid;border-color:var(--stamp);color:var(--ink)}
.stamp h3{font-size:15px;color:inherit;margin-bottom:2px}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line)}
th.n,td.n{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,minmax(0,1fr));padding:6px max(6px,env(safe-area-inset-right)) max(8px,env(safe-area-inset-bottom)) max(6px,env(safe-area-inset-left));z-index:5}
.tab{border:0;background:none;display:grid;justify-items:center;gap:2px;font-size:12px;font-weight:600;color:var(--soft);min-height:52px;padding:4px;border-radius:12px}
.tab svg{width:24px;height:24px}
.tab.on{color:var(--pen);background:var(--pen2)}
.toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:12px 16px;border-radius:14px;display:flex;gap:12px;align-items:center;width:min(420px,calc(100% - 32px));z-index:9;box-shadow:0 8px 24px rgba(0,0,0,.2)}
.toast svg{width:44px;height:44px;flex:none;animation:thud .45s ease-out}
@keyframes thud{0%{transform:scale(2.2) rotate(-25deg);opacity:0}70%{transform:scale(.92) rotate(-8deg);opacity:1}100%{transform:scale(1) rotate(-8deg)}}
@media (prefers-reduced-motion:reduce){.toast svg{animation:none}.prog i{transition:none}}
.hidden{display:none!important}
.note{font-size:13px;color:var(--soft);margin-top:8px}
a{color:var(--pen)}
@media (min-width:900px){.app{padding-left:140px;max-width:900px}.tabs{top:0;right:auto;width:116px;grid-template-columns:1fr;align-content:start;gap:6px;padding:24px 10px;border-top:0;border-right:1px solid var(--line)}.toast{bottom:28px}}
@media (max-width:420px){.cover{grid-template-columns:1fr;text-align:left}.ring{width:92px;height:92px}.grid2{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div><h1 id="tNome">Caderneta de Fiscal</h1><small id="tOrgao"></small></div>
    <div class="count" id="tCount"></div>
  </header>
  <main id="view"></main>
</div>
<nav class="tabs" id="tabs" aria-label="Seções"></nav>
<div class="toast hidden" id="toast" role="status"></div>

<script type="application/json" id="dados-padrao">{"id":"patrocinio-fiscal-2026","nome":"Fiscal de Posturas","orgao":"Prefeitura de Patrocínio Paulista-SP","banca":"Império Concursos","dataProva":"2027-01-17","horaProva":"08:30","duracaoMin":180,"notaMinima":50,"materias":[{"id":"esp","nome":"Conhecimentos Específicos","curto":"Específicos","qtd":15,"valor":4.0},{"id":"port","nome":"Língua Portuguesa","curto":"Português","qtd":10,"valor":1.75},{"id":"mat","nome":"Matemática","curto":"Matemática","qtd":10,"valor":1.75},{"id":"ger","nome":"Conhecimentos Gerais","curto":"Gerais","qtd":5,"valor":1.0}],"aulas":[{"id":"a-post-1","materia":"esp","assunto":"Código de Posturas","titulo":"Código de Posturas: o básico","cards":[{"t":"O que é","b":"A **Lei 686/1973** é o Código de Posturas de Patrocínio Paulista. Tem 487 artigos em sete títulos: disposições gerais, higiene pública, bem-estar público, funcionamento de estabelecimentos, fiscalização, infrações e penalidades, disposições finais."},{"t":"Para que serve (art. 2º)","b":"Disciplina a **higiene pública**, o **bem-estar público** e a **localização e funcionamento** de estabelecimentos comerciais, industriais e de serviços, além das relações entre a Prefeitura e os munícipes."},{"t":"Quem faz cumprir (arts. 3º e 4º)","b":"Cabe ao **Prefeito e aos servidores municipais em geral** cumprir e fazer cumprir o código. Toda pessoa física ou jurídica é obrigada a **facilitar a fiscalização**."},{"t":"Como se lê o código","b":"Os dispositivos se aplicam em **sentido restrito**, sem analogia nem interpretação extensiva (art. 485). Os prazos são em **dias corridos**, sem contar o dia inicial; se vencer em sábado, domingo ou feriado, passa para o primeiro dia útil (art. 477)."},{"t":"LC 10/2013","b":"Acrescentou o **art. 303-A**: a Prefeitura, pela fiscalização de posturas, divulga no site a lista de bares, restaurantes, casas de show, cinemas, templos, escolas e similares com **alvará válido**, atualizada **diariamente**."}]},{"id":"a-post-2","materia":"esp","assunto":"Código de Posturas","titulo":"Terrenos, lixo e água parada","cards":[{"t":"Terreno limpo (art. 139)","b":"Terrenos urbanos e de expansão urbana devem ficar **limpos, capinados** e sem materiais nocivos. A limpeza é obrigatória **pelo menos 2 vezes por ano**. Não pode haver fossa aberta, escombros ou construção inabitável."},{"t":"Se o dono não limpar","b":"A fiscalização **intima** o proprietário com prazo de **5 dias**. Se não cumprir, a **Prefeitura limpa** e cobra as despesas. O Código Tributário cobra a **taxa de limpeza** sem prejuízo da **multa**."},{"t":"Lixo em terreno (art. 140)","b":"É proibido jogar lixo ou resíduo industrial em terreno urbano, **mesmo sem muro**, e nas margens de rodovias. A multa vale também para **quem mandou** transportar e para o **dono do veículo**. Estabelecimento perde a licença na **3ª reincidência**."},{"t":"Água (arts. 141 e 149)","b":"Todo terreno deve dar escoamento às águas. **Não é permitido** conservar **águas estagnadas**. Terreno pantanoso deve ser drenado e aterrado."}]},{"id":"a-post-3","materia":"esp","assunto":"Código de Posturas","titulo":"Sossego público","cards":[{"t":"Regra geral (art. 167)","b":"É proibido perturbar o sossego com ruídos **excessivos e evitáveis**. Som de qualquer tipo depende de **licença** da Prefeitura; sem ela: multa e retirada em **24 horas**, sob multa diária em dobro (art. 168)."},{"t":"Limites (art. 169)","b":"Veículos: até **85 dB** a 7 m. Máquinas e som em comércio: **55 dB das 7h às 19h** e **45 dB das 19h às 7h**, medidos a 5 m da divisa."},{"t":"Alto-falantes (arts. 170 e 171)","b":"No máximo **3 serviços**, a **500 m** um do outro. Nunca a menos de **100 m** de hospitais e escolas. Funcionam até **4 horas por dia**, entre **10h e 22h**; os fixos não podem tocar mais de 2 horas seguidas."},{"t":"O que é permitido (art. 177)","b":"Sinos de igreja (evitar antes das 5h e depois das 22h), sirenes, máquinas de obra licenciadas **das 7h às 19h** até 90 dB, buzinas de veículos entre 6h e 20h com moderação. Perto de hospitais (100 m) as proibições são **permanentes**."},{"t":"Fogos (art. 178, LC 51/2020)","b":"Proibidos fogos com mais de **65 dB** em **toda a área urbana**. **Balões** são proibidos em **todo o município**. Multa: **1 Unidade Fiscal do Município**. Fogos silenciosos são permitidos."},{"t":"Trabalho barulhento (art. 180)","b":"Perto de hospitais, escolas e residências, serviço com ruído só **entre 7h e 19h**. Em hotéis e pensões, silêncio completo **após 22h**."}]},{"id":"a-post-4","materia":"esp","assunto":"Código de Posturas","titulo":"Licença de localização e funcionamento","cards":[{"t":"Sem licença, não abre (art. 300)","b":"Nenhum estabelecimento pode se instalar, **nem transitoriamente**, sem licença prévia e pagamento da taxa. **Isenção de tributo não dispensa a licença.**"},{"t":"O alvará (art. 303)","b":"Contém localização, nome ou razão social, atividades e **horário de funcionamento**. Vale **3 anos**; para **ambulante**, até o **último dia do ano** em que foi emitido. Deve ficar em **lugar visível**. Extraviado: pedir outro em **5 dias**."},{"t":"Sem licença válida (art. 304)","b":"O estabelecimento pode ser **interditado**, depois de notificação com prazo máximo de **15 dias** para regularizar. A interdição não livra das multas."},{"t":"Mudança de endereço (art. 305)","b":"Precisa de **permissão** da Prefeitura, que verifica se o novo local atende à lei."},{"t":"Cassação (art. 306)","b":"Atividade diferente da licenciada; recusa em mostrar a licença; falta de higiene ou segurança; atividade nociva à saúde; local de desordem; perturbação do sossego; tributos não pagos; recusa obstinada a cumprir intimações. Depois da cassação: **3 anos** sem licença no mesmo ramo."},{"t":"Horário (art. 308, texto original)","b":"Indústria 7h–17h (sábado 7h–12h); comércio 8h–18h (sábado 8h–12h); domingos e feriados fechado, salvo **licença especial**. Atenção: esse capítulo foi alterado por leis de 2009 e 2013."}]},{"id":"a-post-5","materia":"esp","assunto":"Código de Posturas","titulo":"Comércio ambulante","cards":[{"t":"Licença (arts. 329 e 330)","b":"Sempre **especial e prévia**. É **pessoal e intransferível**, a título **precário**. Não dá direito a ponto fixo. Exige documentos, atestado de saúde e pagamento de taxas."},{"t":"Ajudante","b":"A licença não permite empregar outra pessoa na venda, nem como auxiliar, exceto quem só conduz o veículo."},{"t":"Fiscalização","b":"O ambulante deve **trazer consigo** a licença e a carteira profissional e mostrá-las sempre que pedido (arts. 332 e 433)."},{"t":"Sem licença (art. 333)","b":"**Multa + apreensão** das mercadorias. Devolução só depois da licença concedida e da multa paga."},{"t":"Onde pode parar (art. 334)","b":"Só temporariamente e por interesse público: em **ruas secundárias** (nunca avenidas e praças), a **15 m** no mínimo de qualquer esquina, e a **100 m** de loja que venda o mesmo artigo. Exceção: pipoca, doces, amendoim e sorvete. No carnaval, semana santa e finados a regra dos 100 m não se aplica."}]},{"id":"a-post-6","materia":"esp","assunto":"Código de Posturas","titulo":"Fiscalização, intimação e vistoria","cards":[{"t":"Fiscalização (arts. 431 a 434)","b":"O alvará fica em local **visível** e é mostrado quando pedido. Alimento **deteriorado** é apreendido e inutilizado na hora; o **suspeito** é interditado para exame."},{"t":"Intimação (art. 436)","b":"Indica o que cumprir e o prazo, que em geral **não passa de 8 dias**. Pode ser prorrogada uma vez, por **no máximo o mesmo período**. Descumprida: penalidade + nova intimação **por edital**."},{"t":"Vistoria (arts. 437 e 438)","b":"Feita por **comissão técnica especial**, na presença do dono, em dia e hora marcados (salvo risco iminente). Local fechado no dia marcado: **interdição**. Risco de desabamento: vistoria imediata, até com arrombamento, ouvida a Procuradoria."},{"t":"Inspeção para abrir (art. 440)","b":"Feita em regime de urgência, em até **8 dias** depois do pedido de licença."},{"t":"Laudo (art. 442)","b":"Toda vistoria gera **laudo**. Se a Prefeitura executar o serviço, o dono paga o custo **+ 20%** de administração. Recurso ao Prefeito não suspende medida urgente."}]},{"id":"a-post-7","materia":"esp","assunto":"Código de Posturas","titulo":"Auto de infração e multas","cards":[{"t":"Auto de infração (art. 447)","b":"Lavrado **imediatamente**. Contém data, hora e local, dados do infrator, descrição do fato, dispositivo infringido e assinaturas. **Não precisa de testemunhas.** Se o infrator se recusar a assinar, a recusa é anotada."},{"t":"Defesa","b":"**5 dias** a partir da lavratura, por requerimento ao **Prefeito**. Cuidado: no Código Sanitário estadual o prazo é de 10 dias."},{"t":"Quem julga (art. 448)","b":"O **Prefeito** confirma o auto e arbitra a pena, ouvido o órgão competente."},{"t":"Multa (art. 453)","b":"Paga em **5 dias** na tesouraria. Graduada em **mínimo, médio ou máximo**, conforme gravidade, atenuantes, agravantes e antecedentes."},{"t":"Valores (arts. 454 a 458)","b":"Percentuais do **salário mínimo** vigente na data da multa. Exemplos: higiene dos logradouros 5% a 70%; ambulante 3% a 100%; incêndio 30% a 300%; casos não especificados **10% a 300%**."},{"t":"Depois da multa (arts. 460 a 464)","b":"Não paga vai para **dívida ativa**. Quem deve multa não contrata nem recebe da Prefeitura. **Reincidência = multa em dobro**. Pagar a multa **não dispensa** de cumprir a exigência."}]},{"id":"a-post-8","materia":"esp","assunto":"Código de Posturas","titulo":"Embargo, demolição e apreensão","cards":[{"t":"Embargo (art. 465)","b":"Funcionar sem licença; prejudicar saúde, segurança ou sossego; não atender intimação. Exige notificação e **edital**; pode requisitar **força policial**. Só é levantado após cumprir as exigências e pagar multas."},{"t":"Alimento suspeito (art. 467)","b":"Interditado para exame por até **30 dias**, com **3 amostras** (exame, dono e laboratório). Contraprova em 10 dias (48 horas se perecível)."},{"t":"Demolição (art. 469)","b":"Para obra em risco ou irregular. O dono tem no máximo **7 dias** para iniciar. Feita pela Prefeitura: custo **+ 20%**."},{"t":"Apreensão (arts. 470 a 472)","b":"Coisas vão ao depósito, com **termo**. Não retiradas em **5 dias**: **leilão** (edital com 8 dias de antecedência). Perecíveis: **48 horas**. Saldo do leilão devolvido se pedido em 15 dias."},{"t":"Ambulante sem licença (art. 473)","b":"Doces são **inutilizados na hora**; carnes, frutas e verduras vão para **casas de caridade**."},{"t":"Quem responde (arts. 474 e 475)","b":"Incapazes e coagidos não são punidos diretamente: a pena recai sobre **pais, tutores, curadores** ou quem coagiu."}]},{"id":"a-ctm-1","materia":"esp","assunto":"Código Tributário","titulo":"Código Tributário: tributos e poder de polícia","cards":[{"t":"A lei","b":"**LC 55/2021**, de 30/12/2021. O art. 3º cria três **impostos** (IPTU, ITBI, ISSQN), **taxas** e duas **contribuições** (de melhoria e de iluminação pública)."},{"t":"Poder de polícia (art. 109)","b":"Atividade da administração que **limita ou disciplina** direito, interesse ou liberdade, em razão do **interesse público**: segurança, higiene, costumes, sossego, mercado."},{"t":"Taxas de poder de polícia","b":"Licença de **funcionamento**, **publicidade**, **obras** particulares, **ocupação** de vias e logradouros e **vigilância sanitária**."},{"t":"Taxas de serviço","b":"Coleta de lixo, **limpeza de terreno** e retirada de entulho, poda e remoção de árvore, inumação e exumação."},{"t":"Taxa de licença para funcionamento","b":"Lançada **de ofício**. Só se abre depois da inscrição e do pagamento. Fato gerador: início da atividade e, depois, todo **1º de janeiro**. À vista com até **10%** de desconto ou em até **4 parcelas**. Atraso: multa de **0,33% ao dia, até 20%**, mais juros de 1% ao mês."},{"t":"Estabelecimento (art. 118)","b":"Inclui residência aberta ao público por atividade profissional, veículo de ambulante, barraca, quiosque e depósito fechado."}]},{"id":"a-ctm-2","materia":"esp","assunto":"Código Tributário","titulo":"Código Tributário: impostos e processo","cards":[{"t":"IPTU (arts. 24 e 25)","b":"Fato gerador em **1º de janeiro**. **1% predial** e **3% territorial** sobre o valor venal. Se o imóvel não cumpre a função social: IPTU progressivo por 5 anos, até **15%**."},{"t":"ITBI e ISSQN","b":"ITBI: **3%**, e **1%** sobre a parte financiada (art. 52). ISSQN: **2%, 3% ou 5%**, conforme o item da lista de serviços (art. 84)."},{"t":"Infrações (arts. 258 a 261)","b":"A responsabilidade independe da intenção. **Reincidência**: mesma infração em até **5 anos**. **Denúncia espontânea** antes da fiscalização exclui a multa."},{"t":"Impugnação (arts. 270 e 271)","b":"Prazo de **15 dias** a partir da intimação. Suspende a cobrança do que foi contestado."},{"t":"Julgamento","b":"**1ª instância**: diretor do departamento que lançou o tributo, em até **30 dias**. **2ª instância**: Diretor do Departamento Jurídico, em até **90 dias**. Quem aceita a decisão e paga no prazo do recurso tem a multa reduzida em **50%**."},{"t":"Certidão negativa","b":"Emitida em até **10 dias**; vale **180 dias**."}]},{"id":"a-san-1","materia":"esp","assunto":"Código Sanitário SP","titulo":"Código Sanitário do Estado de SP","cards":[{"t":"A lei","b":"**Lei 10.083/1998**. Autoridade sanitária: profissionais da vigilância sanitária e epidemiológica em função fiscalizadora, sempre com **credencial**, com **livre acesso** a qualquer dia e hora."},{"t":"Penalidades (art. 112)","b":"13 tipos, entre eles advertência, prestação de serviços à comunidade, **multa de 10 a 10.000 UFESPs**, apreensão, inutilização, interdição, cancelamento de licença e **intervenção** (máximo de 180 dias)."},{"t":"Atenuantes e agravantes","b":"Atenuam: infrator **primário**, reparação espontânea, ação não decisiva para o evento. Agravam: dolo ou má-fé, vantagem financeira, omissão, coação, **reincidência**."},{"t":"Prazos","b":"Auto de infração em no mínimo **3 vias**; defesa em **10 dias**. Auto de multa em **4 vias**; recurso em **10 dias**, com efeito suspensivo **só contra multa**. Multa paga em **30 dias**. Prescrição: **5 anos**."}]},{"id":"a-lom-1","materia":"esp","assunto":"Lei Orgânica","titulo":"Lei Orgânica: Câmara e leis","cards":[{"t":"A lei","b":"**Lei Orgânica nº 2.048, de 04/11/2005**. Poderes do município: **Legislativo e Executivo**, independentes e harmônicos. Símbolos: **Brasão, Bandeira e Hino** (arts. 1º e 2º)."},{"t":"A Câmara (arts. 14 e 15)","b":"Composta de **9 vereadores**, eleitos pelo sistema proporcional, com mandato de **4 anos**. Idade mínima para vereador: **18 anos**."},{"t":"Sessões (arts. 20 e 21)","b":"São **públicas**, salvo decisão de **2/3** dos vereadores. Abrem com no mínimo **1/4** dos membros. Decisões por maioria de votos, presente a maioria dos membros. Posse dos vereadores às **10h de 1º de janeiro** (art. 22)."},{"t":"Emendas à Lei Orgânica (art. 43)","b":"Propostas por **1/3** dos vereadores, pelo **Prefeito** ou por **5% dos eleitores**. Votadas em **dois turnos** e aprovadas por **2/3**. Promulgadas pela **Mesa da Câmara**."},{"t":"Leis complementares (art. 45)","b":"Aprovadas por **maioria absoluta**. São leis complementares: código tributário, **código de obras**, **código de posturas**, plano diretor, regime dos servidores, guarda municipal e criação de cargos."},{"t":"Iniciativa (arts. 44 e 46)","b":"Qualquer vereador, comissão, o Prefeito ou **5% dos eleitores**. Só o **Prefeito** propõe leis sobre cargos e salários do Executivo, servidores, secretarias e orçamento."},{"t":"Sanção e veto (art. 49)","b":"O Prefeito tem **15 dias úteis** para vetar. **Silêncio = sanção.** A Câmara aprecia o veto em **30 dias** e só o derruba por **maioria absoluta**. Urgência pedida pelo Prefeito: Câmara decide em **45 dias** (art. 48)."}]},{"id":"a-lom-2","materia":"esp","assunto":"Lei Orgânica","titulo":"Lei Orgânica: Prefeito e servidores","cards":[{"t":"Prefeito e vice (arts. 56 a 58)","b":"Idade mínima de **21 anos**. Posse em **1º de janeiro** do ano seguinte à eleição. Se não assumir em **10 dias**, o cargo é declarado vago. Mandato de **4 anos**, com uma reeleição (art. 62)."},{"t":"Substituição (arts. 59 a 61)","b":"Substitui o Prefeito o **Vice**; na falta dos dois, o **Presidente da Câmara**. Vaga sem vice nos **3 primeiros anos**: nova eleição em **90 dias**. No **último ano**: o Presidente da Câmara completa o mandato."},{"t":"Ausência (art. 63)","b":"Prefeito e vice não podem sair do município por mais de **15 dias** sem licença da Câmara, sob pena de perder o cargo. Férias de **30 dias** por ano. Subsídio do vice: até **30%** do do Prefeito."},{"t":"Competência do município (art. 10)","b":"Legislar sobre interesse local; plano diretor; tributos; uso do solo; **conceder, renovar e cassar licença** de funcionamento de estabelecimentos que prejudiquem saúde, higiene, sossego ou segurança."},{"t":"Servidores (arts. 83 e 84)","b":"Regime jurídico **celetista** (CLT), como o deste concurso. Estabilidade conforme o art. 41 da Constituição. Guarda municipal só por **concurso público** (art. 85)."}]},{"id":"a-inf-1","materia":"esp","assunto":"Informática","titulo":"Word e Excel 2016","cards":[{"t":"Atalhos do Word (em português)","b":"**Ctrl+N** negrito · **Ctrl+I** itálico · **Ctrl+S** sublinhado · **Ctrl+E** centralizar · **Ctrl+J** justificar · **Ctrl+B** salvar · **Ctrl+O** novo documento · **Ctrl+Z** desfazer."},{"t":"Fórmulas do Excel","b":"Toda fórmula começa com **=**. SOMA, MÉDIA, MÁXIMO, MÍNIMO, SE, CONT.SE, PROCV. Intervalo com dois-pontos: **A1:A4**."},{"t":"Referência absoluta","b":"**$A$1** não muda ao copiar a fórmula. **A1** é relativa e se ajusta. **$A1** trava só a coluna; **A$1** trava só a linha."},{"t":"Internet e e-mail","b":"**Cc**: cópia visível. **Cco**: cópia oculta. **Phishing**: mensagem falsa que tenta roubar senha ou dados. **Backup**: cópia de segurança."}]},{"id":"a-port-1","materia":"port","assunto":"Crase","titulo":"Crase sem medo","cards":[{"t":"A regra","b":"Crase = preposição **a** + artigo **a**. Teste: troque por uma palavra masculina. Se virar **ao**, tem crase. \"Fui à feira\" → \"fui ao mercado\"."},{"t":"Nunca tem crase","b":"Antes de **verbo** (começou a chover), de palavra **masculina** (a pé), de **pronome de tratamento** (a Vossa Senhoria) e entre palavras repetidas (cara a cara)."},{"t":"Sempre tem","b":"Nas locuções femininas: **às vezes**, **à noite**, **à medida que**, e na indicação de horas: **às 8h30**."}]},{"id":"a-port-2","materia":"port","assunto":"Concordância","titulo":"Concordância verbal e nominal","cards":[{"t":"Haver = existir","b":"Fica no **singular**: \"**Houve** várias denúncias\", \"**Havia** muitos ambulantes\". O verbo **existir** concorda: \"Existem irregularidades\"."},{"t":"Fazer = tempo","b":"Também no singular: \"**Faz** dois anos que a lei mudou\"."},{"t":"Sujeito depois do verbo","b":"Ainda concorda: \"**Foram** notificados os comerciantes\". \"**Vendem-se** terrenos\" (= terrenos são vendidos)."}]},{"id":"a-port-3","materia":"port","assunto":"Regência","titulo":"Regência verbal","cards":[{"t":"Verbos que pedem \"a\"","b":"**Assistir** (ver): assistir **ao** jogo. **Obedecer**: obedecer **ao** regulamento. **Chegar** e **ir**: chegar **ao** local (não \"no\")."},{"t":"Preferir","b":"Prefere-se uma coisa **a** outra. Nunca \"prefiro mais\" nem \"do que\"."},{"t":"Implicar","b":"No sentido de acarretar, é direto: \"A infração **implica** multa\"."}]},{"id":"a-port-4","materia":"port","assunto":"Acentuação e pontuação","titulo":"Acentuação e pontuação","cards":[{"t":"Acentuação","b":"**Proparoxítonas**: todas (público). **Oxítonas** em a, e, o, em, ens (café, também). **Paroxítonas** em l, n, r, x, ps, ã, ditongo (fácil, hífen). Depois do acordo: **ideia**, **voo**, **itens** sem acento."},{"t":"Vírgula proibida","b":"**Nunca** entre sujeito e verbo: \"O fiscal municipal, lavrou\" está errado."},{"t":"Vírgula obrigatória","b":"Separa **vocativo** (\"Maria, feche a porta\") e **aposto** (\"Patrocínio, Terra do Diamante, fica em SP\")."}]},{"id":"a-port-5","materia":"port","assunto":"Classes e figuras","titulo":"Classes de palavras, \"que\", \"se\" e figuras","cards":[{"t":"Advérbio","b":"Modifica verbo, adjetivo ou outro advérbio: \"agiu **rapidamente**\"."},{"t":"O \"se\"","b":"**Apassivador**: vendem-se casas (= casas são vendidas). **Indeterminador**: precisa-se de fiscais. **Condicional**: se chover, adia. **Reflexivo**: ela se feriu."},{"t":"Conectivos","b":"**Desde que**, **caso**, **contanto que** = condição. **Embora** = concessão. **Porque**, **já que** = causa."},{"t":"Figuras","b":"**Metáfora**: comparação sem \"como\". **Metonímia**: troca por relação (ler Machado = ler a obra). **Hipérbole**: exagero. **Eufemismo**: suavização. **Antítese**: ideias opostas."}]},{"id":"a-mat-1","materia":"mat","assunto":"Porcentagem","titulo":"Porcentagem e descontos","cards":[{"t":"Fator","b":"Aumento de 20% = multiplicar por **1,2**. Desconto de 20% = multiplicar por **0,8**."},{"t":"Sucessivos","b":"Aumento de 20% e depois desconto de 20% **não** volta ao preço: 1,2 × 0,8 = 0,96 (cai 4%)."},{"t":"Quanto é de quanto","b":"18 acertos em 40 questões: 18 ÷ 40 = 0,45 = **45%**."}]},{"id":"a-mat-2","materia":"mat","assunto":"Regra de três","titulo":"Razão, proporção e regra de três","cards":[{"t":"Simples","b":"Monte as grandezas em colunas. **Diretamente** proporcionais: multiplica cruzado. **Inversamente**: inverta uma coluna antes."},{"t":"Composta","b":"Mais fiscais → menos dias (inversa). Mais estabelecimentos → mais dias (direta). Ex.: 6 fiscais, 90 locais, 5 dias. Com 4 fiscais e 120 locais: 5 × (120/90) × (6/4) = **10 dias**."}]},{"id":"a-mat-3","materia":"mat","assunto":"Juros","titulo":"Juros simples e compostos","cards":[{"t":"Simples","b":"J = C × i × t. R$ 2.000 a 3% ao mês por 8 meses: J = 480; montante = **R$ 2.480**."},{"t":"Compostos","b":"M = C × (1 + i)^t. R$ 1.000 a 10% ao ano por 2 anos: 1.000 × 1,1 × 1,1 = **R$ 1.210**."},{"t":"Dica","b":"Taxa e tempo sempre na **mesma unidade** (mês com mês, ano com ano)."}]},{"id":"a-mat-4","materia":"mat","assunto":"Equações e MMC","titulo":"Equações, MMC e MDC","cards":[{"t":"2º grau","b":"ax² + bx + c = 0. **Soma das raízes = −b/a**; **produto = c/a**. x² − 7x + 10 = 0 → raízes 2 e 5."},{"t":"MMC","b":"\"Quando vão coincidir de novo?\" é MMC. Visitas a cada 6 e 8 dias → MMC(6, 8) = **24 dias**."},{"t":"MDC","b":"\"Dividir em partes iguais, o maior possível\" é MDC."}]},{"id":"a-mat-5","materia":"mat","assunto":"Medidas e geometria","titulo":"Medidas, PA, probabilidade e áreas","cards":[{"t":"Medidas","b":"1 m³ = **1.000 litros**. 1 m² = 10.000 cm². 1 km = 1.000 m."},{"t":"Áreas","b":"Retângulo: base × altura. Triângulo: base × altura ÷ 2. Círculo: π × r². **Pitágoras**: a² = b² + c² (3, 4, 5 e 6, 8, 10)."},{"t":"PA","b":"aₙ = a₁ + (n − 1) × r. PA (3, 7, 11…): a₂₀ = 3 + 19 × 4 = **79**."},{"t":"Probabilidade","b":"Casos favoráveis ÷ casos possíveis. 5 bolas azuis em 10: **1/2**."}]},{"id":"a-ger-1","materia":"ger","assunto":"Patrocínio Paulista","titulo":"Patrocínio Paulista","cards":[{"t":"Origem","b":"Surgiu do **garimpo de diamantes** nos rios **Santa Bárbara** e **Sapucaizinho**, no século XIX. Por isso é chamada de **Terra do Diamante**."},{"t":"Nome","b":"Virou vila em **1885** como **Patrocínio do Sapucaí**. Passou a se chamar Patrocínio Paulista na década de 1940."},{"t":"Localização","b":"Nordeste paulista, na **divisa com Minas Gerais**, a cerca de **400 km** da capital. Área de uns **603 km²**. Gentílico: **patrocinense**."},{"t":"Apelidos","b":"**Cidade das Cooperativas**. Integra a **Rota da Fé**, roteiro de peregrinação."}]},{"id":"a-ger-2","materia":"ger","assunto":"Atualidades","titulo":"Como estudar atualidades","cards":[{"t":"Quanto vale","b":"São só **5 questões** valendo 1 ponto cada. Não vale gastar muito tempo aqui."},{"t":"Rotina","b":"15 minutos te":"Questão inédita (formato da banca)"},{"id":"q006","materia":"esp","assunto":"Código Sanitário SP","enunciado":"No processo sanitário estadual, o recurso tem efeito suspensivo:","alternativas":["em todos os casos","apenas contra a pena de multa","apenas contra a interdição","em nenhum caso"],"correta":1,"explicacao":"Art. 137.","origem":"inedita","fonte":"Questão inédita (formato da banca)"},{"id":"q007","materia":"esp","assunto":"Código Sanitário SP","enunciado":"A intervenção em estabelecimento, prevista no Código Sanitário de SP, não pode passar de:","alternativas":["30 dias","90 dias","180 dias","1 ano"],"correta":2,"explicacao":"Art. 114, § 2º.","origem":"inedita","fonte":"Questão inédita (formato da banca)"},{"id":"q008","materia":"esp","assunto":"Código Sanitário SP","enunciado":"O auto de infração sanitária deve ser lavrado em, no mínimo:","alternativas":["1 via","2 vias","3 vias","4 vias"],"correta":2,"explicacao":"Art. 124. O auto de multa é que tem 4 vias.","origem":"inedita","fonte":"Questão inédita (formato da banca)"},{"id":"q009","materia":"esp","assunto":"Poder de polícia","enunciado":"A fiscalização do cumprimento do Código de Posturas pelo município é manifestação do poder:","alternativas":["hierárquico","disciplinar","de polícia","judiciário"],"correta":2,"explicacao":"Posturas limitam liberdades em nome do interesse público: poder de polícia.","origem":"inedita","fonte":"Questão inédita (formato da banca)"},{"id":"q010","materia":"esp","assunto":"Poder de polícia","enunciado":"A taxa de licença de localização e funcionamento tem como fato gerador:","alternativas":["a propriedade do imóvel","a prestação de serviço de qualquer natureza","o exercício regular do poder de polícia","a valorização do imóvel por obra pública"],"correta":2,"explicacao":"CTM, art. 109, e CTN, art. 77.","origem":"inedita","fonte":"Questão inédita (formato da banca)"},{"id":"q011","materia":"esp","assunto":"Poder de polícia","enunciado":"O fiscal apreende, sem ordem judi · Agente Fiscal de Obras e Posturas"},{"id":"r127","materia":"ger","assunto":"História do Brasil","enunciado":"A Constituição de 1988 teve como um de seus principais ícones o presidente da Assembleia Constituinte:","alternativas":["Ulysses Guimarães","Tancredo Neves","José Sarney","Leonel Brizola"],"correta":0,"explicacao":"Ulysses Guimarães presidiu a Constituinte e chamou o texto de Constituição Cidadã. (Gabarito conferido pela Caderneta; o oficial não veio junto.)","origem":"prova","fonte":"2022 · Pref. Princesa/SC · Agente Fiscal de Obras e Posturas"},{"id":"r128","materia":"esp","assunto":"Outros temas de fiscalização","enunciado":"Pela NBR 9050, a indicação luminosa de permissão ou impedimento de travessia na faixa apropriada é o:","alternativas":["guia de balizamento","faixa elevada","foco de pedestres","linha guia"],"correta":2,"explicacao":"É o semáforo de pedestres. (Gabarito conferido pela Caderneta; o oficial não veio junto.)","origem":"prova","fonte":"2022 · Pref. Princesa/SC · Agente Fiscal de Obras e Posturas","extra":true},{"id":"r129","materia":"esp","assunto":"Outros temas de fiscalização","enunciado":"NÃO é fator gerador de acidentes de trabalho:","alternativas":["depósitos organizados e limpos","iluminação inadequada","máquinas sem proteção","arranjo físico inadequado"],"correta":0,"explicacao":"Organização e limpeza previnem acidentes. (Gabarito conferido pela Caderneta; o oficial não veio junto.)","origem":"prova","fonte":"2022 · Pref. Princesa/SC · Agente Fiscal de Obras e Posturas","extra":true},{"id":"r130","materia":"port","assunto":"Crase","enunciado":"Preencha as lacunas: \"A má postura pode tornar a pessoa mais vulnerável ___ violência urbana\" e \"causa estresse nos ossos ___ ponto de alterar sua forma\".","alternativas":["a – a","a – à","à – à","à – a"],"correta":3,"explicacao":"Vulnerável a + a violência = à. \"A ponto de\": antes de palavra masculina não há crase. (Gabarito conferido pela Caderneta; o oficial não veio junto.)","origem":"prova","fonte":"AGIRH 2020 · Pref. Cachoeira Paulista/SP · Agente Fiscal de Posturas"},{"id":"r131","materia":"port","assunto":"Ortografia","enunciado":"Marque C (certo) ou E (errado) para o uso das palavras: ( ) O juiz absorveu o réu. ( ) O rapaz ascendeu profissionalmente com muita rapidez. ( ) Sustamos o empréstimo bancário por ora.","alternativas":["C – E – C","E – C – C","E – E – E","E – C – E"],"correta":1,"explicacao":"O juiz absolve (inocenta); absorver é sugar. Ascender = subir. Sustar = suspender. (Gabarito conferido pela Caderneta; o oficial não veio junto.)","origem":"prova","fonte":"AGIRH 2020 · Pref. Cachoeira Paulista/SP · Agente Fiscal de Posturas"},{"id":"r132","materia":"port","assunto":"Concordância","enunciado":"A concordância está correta em:","alternativas":["Rezem baixos, por favor.","Vocês falaram bonito.","É precisa muita paciência para aguentar tudo isso.","Feito a denúncia, recolheram-se a seus recintos."],"correta":1,"explicacao":"\"Bonito\" e \"baixo\" funcionam como advérbio e não variam. O certo seria \"é preciso\" e \"feita a denúncia\". (Gabarito conferido pela Caderneta; o oficial não veio junto.)","origem":"prova","fonte":"AGIRH 2020 · Pref. Cachoeira Paulista/SP · Agente Fiscal de Posturas"},{"id":"r133","materia":"port","assunto":"Concordância","enunciado":"Quanto à concordância nominal: I) A paciente parece meia confusa. II) É proibido entrada de alimentos. III) Há motivos bastantes para nova cirurgia. IV) Ela mesmo compareceu. Estão corretas:","alternativas":["I e II","I e III","II e III","II e IV"],"correta":2,"explicacao":"Meio (advérbio) não varia; \"ela mesma\". Sem artigo, \"é proibido entrada\" está certo; \"bastantes\" concorda com motivos. (Gabarito conferido pela Caderneta; o oficial não veio junto.)","origem":"prova","fonte":"AGIRH 2020 · Pref. Cachoeira Paulista/SP · Agente Fiscal de Posturas"},{"id":"r134","materia":"port","assunto":"Conectivos","enunciado":"I) \"Mas\" introduz oração coordenada adversativa, com ideia de oposição. II) \"Se\" pode introduzir oração subordinada condicional. Está correto:","alternativas":["somente o item I","os itens I e II","nenhum dos itens","somente o item II"],"correta":1,"explicacao":"Os dois conceitos estão certos. (Gabarito conferido pela Caderneta; o oficial não veio junto.)","origem":"prova","fonte":"AGIRH 2020 · Pref. Cachoeira Paulista/SP · Agente Fiscal de Posturas"},{"id":"r135","materia":"port","assunto":"Ortografia","enunciado":"Após o Acordo Ortográfico, a sequência com hífen empregado corretamente é:","alternativas":["intraracial / antissocial / alémtúmulo / vice-almirante","auto-escola / minissaia / mandachuva / portarretrato","hiperrenquitado / semiaberto / microondas / auto-peça","anti-imperialista / pré-história / semianalfabeto / autoaprendizagem"],"correta":3,"explicacao":"Hífen quando o prefixo termina com a mesma vogal que inicia a palavra (anti-imperialista); autoescola, micro-ondas e autopeça. (Gabarito conferido pela Caderneta; o oficial não veio junto.)","origem":"prova","fonte":"AGIRH 2020 · Pref. Cachoeira Paulista/SP · Agente Fiscal de Posturas"},{"id":"r136","materia":"mat","assunto":"Porcentagem","enunciado":"O quilo da tilápia passou de R$ 25,00 para R$ 28,00. A variação percentual foi de:","alternativas":["12%","15%","18%","21%"],"correta":0,"explicacao":"Aumento de 3 sobre 25: 3 ÷ 25 = 0,12. (Gabarito conferido pela Caderneta; o oficial não veio junto.)","origem":"prova","fonte":"AGIRH 2020 · Pref. Cachoeira Paulista/SP · Agente Fiscal de Posturas"},{"id":"r137","materia":"mat","assunto":"Equações","enunciado":"Camila encheu 6 vezes um copo grande (x) e 3 vezes um copo pequeno (y) e obteve 2 litros. A equação certa é:","alternativas":["x/6 + y/3 = 2","6(x + 3y) = 2","3(6x + 2y) = 2","6x + 3y = 2"],"correta":3,"explicacao":"Seis copos grandes mais três pequenos somam 2 litros. (Gabarito conferido pela Caderneta; o oficial não veio junto.)","origem":"prova","fonte":"AGIRH 2020 · Pref. Cachoeira Paulista/SP · Agente Fiscal de Posturas"},{"id":"r138","materia":"mat","assunto":"Equações","enunciado":"Um time foi campeão invicto em 12 jogos e fez 28 pontos (vitória = 3, empate = 1). Foram:","alternativas":["6 vitórias e 6 empates","7 vitórias e 5 empates","8 vitórias e 4 empates","9 vitórias e 3 empates"],"correta":2,"explicacao":"v + e = 12 e 3v + e = 28. Subtraindo: 2v = 16, v = 8. (Gabarito conferido pela Caderneta; o oficial não veio junto.)","origem":"prova","fonte":"AGIRH 2020 · Pref. Cachoeira Paulista/SP · Agente Fiscal de Posturas"},{"id":"r139","materia":"mat","assunto":"Regra de três","enunciado":"Um valor diário fixo é dividido entre os funcionários. Com 4 contratados, cada um recebe R$ 350,00. Para cada um receber R$ 175,00, é preciso contratar:","alternativas":["6 pessoas","7 pessoas","8 pessoas","9 pessoas"],"correta":2,"explicacao":"Total = 4 × 350 = 1.400. 1.400 ÷ 175 = 8 (grandezas inversas). (Gabarito conferido pela Caderneta; o oficial não veio junto.)","origem":"prova","fonte":"AGIRH 2020 · Pref. Cachoeira Paulista/SP · Agente Fiscal de Posturas"},{"id":"r140","materia":"mat","assunto":"Geometria","enunciado":"A aresta de um cubo com o mesmo volume de um bloco de 16 cm × 8 cm × 4 cm é:","alternativas":["8 cm","9 cm","11 cm","12 cm"],"correta":0,"explicacao":"Volume = 512 cm³ = 8³. (Gabarito conferido pela Caderneta; o oficial não veio junto.)","origem":"prova","fonte":"AGIRH 2020 · Pref. Cachoeira Paulista/SP · Agente Fiscal de Posturas"},{"id":"r141","materia":"mat","assunto":"Raciocínio","enunciado":"Sobre os números naturais, é INCORRETO afirmar:","alternativas":["Todo natural tem sucessor.","Todo natural, exceto o zero, tem antecessor.","A soma de dois naturais é sempre natural.","O produto de dois naturais nem sempre é natural."],"correta":3,"explicacao":"O produto de naturais é sempre natural. (Gabarito conferido pela Caderneta; o oficial não veio junto.)","origem":"prova","fonte":"AGIRH 2020 · Pref. Cachoeira Paulista/SP · Agente Fiscal de Posturas"},{"id":"r142","materia":"mat","assunto":"Raciocínio","enunciado":"Vírus dobram de volume a cada minuto e enchem o recipiente em 6 minutos. A metade estava ocupada em:","alternativas":["3 minutos","4 minutos","5 minutos","6 minutos"],"correta":2,"explicacao":"Se dobra a cada minuto, um minuto antes de encher estava na metade. (Gabarito conferido pela Caderneta; o oficial não veio junto.)","origem":"prova","fonte":"AGIRH 2020 · Pref. Cachoeira Paulista/SP · Agente Fiscal de Posturas"},{"id":"r143","materia":"mat","assunto":"Equações","enunciado":"A soma dos quadrados de dois números é 1.600 e o menor é 24. O maior é:","alternativas":["26","28","30","32"],"correta":3,"explicacao":"1.600 − 576 = 1.024 = 32². (Gabarito conferido pela Caderneta; o oficial não veio junto.)","origem":"prova","fonte":"AGIRH 2020 · Pref. Cachoeira Paulista/SP · Agente Fiscal de Posturas"},{"id":"r144","materia":"esp","assunto":"Poder de polícia","enunciado":"Sobre penalidades em um código de posturas, é correto afirmar:","alternativas":["A multa é aplicada em grau mínimo, médio ou máximo, considerando a gravidade, as atenuantes ou agravantes e os antecedentes do infrator.","Reincidente específico é quem já foi punido por qualquer outra infração.","A multa desobriga o infrator de cumprir a exigência.","A multa isenta o infrator de reparar o dano."],"correta":0,"explicacao":"Mesma regra do Código de Posturas de Patrocínio Paulista (arts. 453, 462 e 464). (Gabarito conferido pela Caderneta; o oficial não veio junto.)","origem":"prova","fonte":"AGIRH 2020 · Pref. Cachoeira Paulista/SP · Agente Fiscal de Posturas"},{"id":"r145","materia":"esp","assunto":"Informática","enunciado":"No Word, imagens e gráficos são adicionados a um documento pela guia:","alternativas":["Revisão","Exibir","Inserir","Layout"],"correta":2,"explicacao":"A guia Inserir reúne imagens, gráficos, tabelas e formas. (Gabarito conferido pela Caderneta; o oficial não veio junto.)","origem":"prova","fonte":"AGIRH 2020 · Pref. Cachoeira Paulista/SP · Agente Fiscal de Posturas"},{"id":"r146","materia":"esp","assunto":"Informática","enunciado":"Com A1 = 3, A2 = 6 e A3 = 9, a fórmula =MÉDIA(SOMA(A1:A3); SOMA(A1:A2); SOMA(A2:A3)) retorna:","alternativas":["14","18","28","34"],"correta":0,"explicacao":"Somas: 18, 9 e 15. Média = 42 ÷ 3 = 14. (Gabarito conferido pela Caderneta; o oficial não veio junto.)","origem":"prova","fonte":"AGIRH 2020 · Pref. Cachoeira Paulista/SP · Agente Fiscal de Posturas"},{"id":"r147","materia":"port","assunto":"Crase","enunciado":"Na frase \"Só assim serão garantidas saúde mental e qualidade de vida àqueles que cuidam dos seus e precisam cuidar de si mesmos\", as expressões \"àqueles\" e \"mesmos\" podem ser trocadas, segundo a norma, por:","alternativas":["à quem … próprios","à pessoas … próprios","à quem … próprio","às pessoas … próprias","à qualquer pessoa … próprios"],"correta":3,"explicacao":"Crase antes de \"pessoas\" (feminino plural, com artigo); \"próprias\" concorda com pessoas. Nunca há crase antes de quem ou qualquer. (Gabarito conferido pela Caderneta; o oficial não veio junto.)","origem":"prova","fonte":"Vunesp 2025 · Pref. São José do Rio Preto/SP · Agente Fiscal de Posturas"},{"id":"r148","materia":"mat","assunto":"Regra de três","enunciado":"Uma área de 14.200 m² foi coberta em três dias. No 1º, 3 homens em 2 horas cobriram 426 m². No 2º, 2 homens trabalharam 2h30. No 3º, 27 homens terminaram. Com a mesma produtividade, eles trabalharam:","alternativas":["6 horas","6h30","8 horas","7h30","7 horas"],"correta":4,"explicacao":"426 ÷ 6 homem-hora = 71 m² por homem-hora. Dia 2: 5 × 71 = 355. Faltam 14.200 − 781 = 13.419 m² = 189 homem-hora; 189 ÷ 27 = 7 h. (Gabarito conferido pela Caderneta; o oficial não veio junto.)","origem":"prova","fonte":"Vunesp 2025 · Pref. São José do Rio Preto/SP · Agente Fiscal de Posturas"},{"id":"r149","materia":"mat","assunto":"Juros","enunciado":"Um produto foi pago em 3 parcelas (1ª no ato, as outras nos dois meses seguintes). O saldo devedor cresce 10% ao mês. O cliente pagou R$ 330, R$ 330 e R$ 726. A soma dos algarismos do preço à vista V é:","alternativas":["5","8","6","7","9"],"correta":2,"explicacao":"726 ÷ 1,1 = 660; (660 + 330) ÷ 1,1 = 900; V = 900 + 330 = 1.230. 1 + 2 + 3 + 0 = 6. (Gabarito conferido pela Caderneta; o oficial não veio junto.)","origem":"prova","fonte":"Vunesp 2025 · Pref. São José do Rio Preto/SP · Agente Fiscal de Posturas"},{"id":"r150","materia":"mat","assunto":"Equações","enunciado":"Uma empresa ficou com 60 funcionários após contratar novos. Cada novo teve um encontro com cada veterano: 416 encontros. Os novos eram menos que os veteranos. Com 2 novos a menos, os encontros seriam:","alternativas":["308","312","216","165","265"],"correta":1,"explicacao":"n(60 − n) = 416 dá n = 8 e 52 veteranos. Com 6 novos: 6 × 52 = 312. (Gabarito conferido pela Caderneta; o oficial não veio junto.)","origem":"prova","fonte":"Vunesp 2025 · Pref. São José do Rio Preto/SP · Agente Fiscal de Posturas"},{"id":"r151","materia":"mat","assunto":"Equações","enunciado":"Um computador processou 3.300 testes em 52h30, sem parar. Cada teste A leva 1min04s e cada teste B, 49 s. A diferença entre as quantidades de A e B é:","alternativas":["340","360","380","400","420"],"correta":0,"explicacao":"64A + 49B = 189.000 s e A + B = 3.300. Então 15A = 27.300: A = 1.820, B = 1.480. (Gabarito conferido pela Caderneta; o oficial não veio junto.)","origem":"prova","fonte":"Vunesp 2025 · Pref. São José do Rio Preto/SP · Agente Fiscal de Posturas"},{"id":"r152","materia":"esp","assunto":"Informática","enunciado":"No Word 2016, uma palavra está em Negrito e Itálico e deve ficar só Sublinhada. Com a palavra selecionada, clica-se:","alternativas":["no ícone Sublinhado e depois nos ícones Negrito e Itálico","no ícone Sublinhado, apenas","nos ícones Negrito e Itálico, apenas","no Pincel de Formatação e depois em Sublinhado","em Sublinhado e depois em Limpar Toda a Formatação"],"correta":0,"explicacao":"Negrito e Itálico funcionam como liga e desliga. Limpar formatação apagaria o sublinhado também. (Gabarito conferido pela Caderneta; o oficial não veio junto.)","origem":"prova","fonte":"Vunesp 2025 · Pref. São José do Rio Preto/SP · Agente Fiscal de Posturas"},{"id":"r153","materia":"esp","assunto":"Informática","enunciado":"Ao limitar um Google Forms a 1 resposta por pessoa, o Google:","alternativas":["exige compartilhamento só dentro da organização","aceita só respostas por wi-fi","só funciona no Chrome","usa o IP para impedir duplicidade","exige que o respondente faça login no Google"],"correta":4,"explicacao":"O controle é feito pela conta Google de quem responde. (Gabarito conferido pela Caderneta; o oficial não veio junto.)","origem":"prova","fonte":"Vunesp 2025 · Pref. São José do Rio Preto/SP · Agente Fiscal de Posturas"},{"id":"r154","materia":"esp","assunto":"Poder de polícia","enunciado":"Servidores obstruem parte de uma via pública em manifestação. Pela Constituição, é correto dizer que a reunião:","alternativas":["é proibida para servidores","torna a lei desnecessária","garante greve sem desconto em qualquer caso","só vale com autorização policial","é válida se pacífica e sem armas, com aviso prévio à autoridade"],"correta":4,"explicacao":"CF, art. 5º, XVI: não depende de autorização, só de aviso prévio. (Gabarito conferido pela Caderneta; o oficial não veio junto.)","origem":"prova","fonte":"Vunesp 2025 · Pref. São José do Rio Preto/SP · Agente Fiscal de Posturas"},{"id":"r155","materia":"esp","assunto":"Outros temas de fiscalização","enunciado":"Servidora que recebe vantagem econômica para omitir ato de ofício comete improbidade por enriquecimento ilícito e está sujeita, entre outras penas, a:","alternativas":["prisão por violar princípios","suspensão dos direitos políticos até 14 anos","multa aumentada em dez vezes","perda da função e suspensão por até 12 anos, por dano ao erário","perda do cargo também por conduta culposa"],"correta":1,"explicacao":"Lei 8.429/1992, arts. 9º e 12, I, com a redação de 2021. (Gabarito conferido pela Caderneta; o oficial não veio junto.)","origem":"prova","fonte":"Vunesp 2025 · Pref. São José do Rio Preto/SP · Agente Fiscal de Posturas","extra":true},{"id":"r156","materia":"esp","assunto":"Outros temas de fiscalização","enunciado":"Aposentada que cobra de empresas para \"acelerar\" processos na repartição, alegando influência sobre servidores, pratica:","alternativas":["tráfico de influência","corrupção ativa","contrabando","advocacia administrativa","usurpação de função pública"],"correta":0,"explicacao":"Código Penal, art. 332. (Gabarito conferido pela Caderneta; o oficial não veio junto.)","origem":"prova","fonte":"Vunesp 2025 · Pref. São José do Rio Preto/SP · Agente Fiscal de Posturas","extra":true},{"id":"r157","materia":"esp","assunto":"Outros temas de fiscalização","enunciado":"A ordem de prioridade da Política Nacional de Resíduos Sólidos é:","alternativas":["redução, reutilização, reciclagem, tratamento e disposição final","coleta, coleta seletiva, reciclagem, aterro, incineração","segregação, coleta, coleta seletiva, remediação","coleta, segregação, coleta seletiva, disposição","não geração, redução, reutilização, reciclagem, tratamento e disposição final adequada"],"correta":4,"explicacao":"Lei 12.305/2010, art. 9º. (Gabarito conferido pela Caderneta; o oficial não veio junto.)","origem":"prova","fonte":"Vunesp 2025 · Pref. São José do Rio Preto/SP · Agente Fiscal de Posturas","extra":true},{"id":"r158","materia":"esp","assunto":"Outros temas de fiscalização","enunciado":"Lavra de minério sem autorização que contamina água do abastecimento público configura:","alternativas":["só infração federal","infração federal e estadual","crime ambiental","contravenção penal","só infração estadual"],"correta":2,"explicacao":"Lei 9.605/1998 (crimes ambientais). (Gabarito conferido pela Caderneta; o oficial não veio junto.)","origem":"prova","fonte":"Vunesp 2025 · Pref. São José
