autônomo, para propor ação de indenização contra Karina. Realizada a instrução processual, a sentença foi julgada improcedente. Durante o prazo para interposição de apelação, Arthur veio a falecer. Diante da situação hipotética, é correto afirmar que o prazo para interposição da apelação","alternativas":["será suspenso, com prosseguimento de onde parou, após nomeação de novo advogado.","será prorrogado automaticamente por mais 15 (quinze) dias.","será interrompido, com prosseguimento de onde parou, após peticionamento de novo advogado.","será restituído em proveito de Helena, contra quem começará a correr novamente depois da intimação.","não se suspende nem se interrompe, devendo Helena ser diligente e constituir rapidamente novo advogado."],"correta":3,"explicacao":"Gabarito oficial: D. Art. 1.004, CPC: falecendo o advogado durante o prazo do recurso, o prazo é restituído à parte e volta a correr depois da intimação.","origem":"prova","fonte":"Vunesp · TJSP · Escrevente Técnico Judiciário · 2025 · questão 28"},{"id":"oj-esc25-29","materia":"pcivil","assunto":"Lei 9.099/95 - JEC","enunciado":"Dona Maria, costureira autônoma, compareceu ao Juizado Especial Cível e, de forma oral, narrou que adquiriu uma máquina de costura da loja Retalhão pelo valor de 5 salários-mínimos. O equipamento apresentou defeito na primeira semana e, diante da recusa da loja em substituí-lo ou devolver o valor pago, Maria propôs ação requerendo a restituição do valor ou a entrega de um novo produto. Diante da situação hipotética, assinale a alternativa correta.","alternativas":["Dona Maria deverá escolher entre a restituição do valor ou a entrega de um novo produto, uma vez que, nos juizados especiais, não é possível apresentar pedidos alternativos ou cumulados.","Registrado o pedido de Dona Maria, independentemente de distribuição e autuação, a Secretaria do Juizado designará a sessão de conciliação com a loja Retalhão, a realizar-se no prazo de quinze dias.","Caso a loja Retalhão comparecesse inicialmente junto com Dona Maria, a sessão de conciliação seria instaurada no prazo de até trinta dias, dispensados o registro prévio de pedido e a citação.","Caso a loja Retalhão fosse citada e apresentasse pedido contraposto, este deveria ser indeferido por não ser permitido nos juizados especiais.","Por ser o réu pessoa jurídica, Dona Maria deverá ser assistida por advogado, independentemente do valor da causa."],"correta":1,"explicacao":"Gabarito oficial: B. Art. 16, Lei 9.099: registrado o pedido, independentemente de distribuição e autuação, a Secretaria designa a sessão de conciliação em 15 dias.","origem":"prova","fonte":"Vunesp · TJSP · Escrevente Técnico Judiciário · 2025 · questão 29","extra":true},{"id":"oj-esc25-30","materia":"pcivil","assunto":"Juizado da Fazenda Pública","enunciado":"A Fundação Municipal de Cultura de Santa Aurora, vinculada ao Município de Santa Aurora, contratou a microempresa Luz & Som Ltda. – ME para fornecer equipamentos de iluminação para comemoração do aniversário da Fundação. O contrato previa o pagamento de 50 salários- -mínimos. Apesar da execução integral do serviço, a Fundação deixou de efetuar o pagamento. Diante disso, a microempresa ajuizou ação de cobrança contra a Fundação perante o Juizado Especial da Fazenda Pública, atribuindo à causa o valor correspondente ao contrato. A sentença julgou a ação procedente. Diante da situação hipotética, assinale a alternativa correta.","alternativas":["A sentença deverá ser anulada e o processo remetido para vara comum em razão das partes.","Caso não seja apresentado recurso, a sentença será objeto de reexame necessário.","Em que pese a Fundação seja pessoa jurídica de direito público, terá o prazo de 10 (dez) dias úteis para apresentar recurso contra a sentença.","Por se tratar de causa proposta perante o Juizado Especial da Fazenda Pública, não se admite recurso, exceto para evitar dano de difícil ou incerta reparação.","Se a sentença transitar em julgado, o pagamento será feito no prazo máximo de 30 (trinta) dias, contados da entrega da requisição do juiz à autoridade citada para a causa."],"correta":2,"explicacao":"Gabarito oficial: C. Lei 12.153/2009, art. 7º: não há prazo diferenciado para a Fazenda; o recurso inominado tem prazo de 10 dias (úteis).","origem":"prova","fonte":"Vunesp · TJSP · Escrevente Técnico Judiciário · 2025 · questão 30","extra":true},{"id":"oj-esc25-31","materia":"const","assunto":"Inviolabilidade do domicílio (art. 5º, XI)","enunciado":"O policial Severo foi chamado a atender um flagrante delito que o sujeito apelidado de Pernalonga estava cometendo dentro da casa deste. Chegando ao local do crime no final da tarde e evidenciada a prática de infração penal, Severo constatou que era hipótese de flagrante delito. Coincidentemente, o policial avistou em uma casa vizinha Carcará, criminoso foragido e que tinha mandado de prisão expedido por autoridade judicial. Diante da situação, face ao adiantado da hora, e, obviamente, não havendo consentimento dos moradores, pairou dúvidas acerca da possibilidade de adentrar nos domicílios de Pernalonga e Carcará para efetuar as prisões. Face a situação hipotética, é correto afirmar, de acordo com o disposto na Constituição de 1988, que","alternativas":["Severo pode ingressar no período noturno apenas na casa de Carcará, pois há ordem judicial a ser cumprida – mandado de prisão.","Severo pode ingressar em ambas as casas para efetuar as prisões nos períodos diurno ou noturno.","ainda que persistisse a situação de flagrante durante o período noturno, Severo somente poderia adentrar na casa de Pernalonga durante o dia para efetuar a prisão.","a casa é asilo inviolável, não podendo Severo adentrar nas duas casas no período noturno, podendo entrar nas duas casas apenas no período diurno.","Severo não pode ingressar na casa de Carcará no período noturno, mas pode ingressar na casa de Pernalonga uma vez caraterizada no momento do ingresso a situação de flagrante delito."],"correta":4,"explicacao":"Gabarito oficial: E. CF, art. 5º, XI: em flagrante delito pode-se entrar a qualquer hora; por determinação judicial (mandado), só durante o dia.","origem":"prova","fonte":"Vunesp · TJSP · Escrevente Técnico Judiciário · 2025 · questão 31"},{"id":"oj-esc25-32","materia":"const","assunto":"Remédios constitucionais","enunciado":"A respeito das ações constitucionais, assinale a alternativa correta.","alternativas":["O autor da ação popular, inexistente situação de comprovada má-fé, bem como os impetrantes de habeas data não estão sujeitos ao pagamento de custas processuais.","Mandado de segurança coletivo pode ser proposto por entidade sindical ou partido político com representação na assembleia legislativa.","São gratuitas as ações de mandado de segurança e habeas corpus.","Ocorrendo ilegalidade ou abuso de poder por autoridade pública que viole a liberdade de locomoção, a ação cabível será o mandado de segurança.","Na ação popular, salvo comprovada má-fé, tanto o autor popular como o réu estarão isentos do pagamento de custas processuais e ônus sucumbenciais."],"correta":0,"explicacao":"Gabarito oficial: A. CF, art. 5º, LXXIII: o autor da ação popular, salvo má-fé, é isento de custas; LXXVII: HC e habeas data são gratuitos.","origem":"prova","fonte":"Vunesp · TJSP · Escrevente Técnico Judiciário · 2025 · questão 32"},{"id":"oj-esc25-33","materia":"const","assunto":"Nacionalidade (art. 12)","enunciado":"Joaquim, integrante da carreira diplomática portuguesa, prestando serviço em Angola, foi casado em primeiras núpcias com a atriz portuguesa Catarina, tendo nascido a filha Josefina. Posteriormente, Joaquim se separou e casou-se com Rúbia, tenista e brasileira naturalizada, tendo nascido da união a filha Sandra. Josefina e Sandra nasceram em Angola quando apenas o genitor estava a serviço de Portugal. Tendo interesse que as filhas sigam a carreira diplomá tica, mas pela República Federativa do Brasil, assinale a alternativa correta à luz das disposições da Constituição de 1988.","alternativas":["Josefina pode se tornar brasileira naturalizada se comprovar idoneidade moral e vier a residir por um ano na República Federativa do Brasil, sendo permitido seguir a carreira diplomática brasileira.","Josefina e Sandra não podem ser consideradas brasileiras natas, não sendo, assim, permitido seguir a carreira diplomática brasileira.","Caso Sandra tenha sido registrada na repartição competente brasileira em Angola, será considerada brasileira naturalizada, podendo seguir a carreira diplomática.","Sandra poderá seguir a carreira diplomática brasileira, se vier a residir no Brasil e optar, em qualquer tempo, depois de atingida a maioridade, pela nacionalidade brasileira.","Josefina e Sandra podem seguir a carreira diplomática brasileira se adquirirem a nacionalidade brasileira e houver reciprocidade em favor dos brasileiros, exi gida residência permanente no Brasil."],"correta":3,"explicacao":"Gabarito oficial: D. Sandra é filha de mãe brasileira nascida no exterior: pode ser nata se vier a residir no Brasil e optar pela nacionalidade após a maioridade (art. 12, I, \"c\"). Diplomata é cargo privativo de nato (art. 12, § 3º, V).","origem":"prova","fonte":"Vunesp · TJSP · Escrevente Técnico Judiciário · 2025 · questão 33"},{"id":"oj-esc25-34","materia":"const","assunto":"Administração Pública (arts. 37 a 41)","enunciado":"O engenheiro Alípio foi admitido como servidor público concursado de autarquia estadual, tendo se efetivado. É correto afirmar, à luz do disposto na Constituição de 1988, que Alípio","alternativas":["não estará sujeito a teto remuneratório mensal máximo por ser servidor público da administração indireta estadual.","estará sujeito ao limite remuneratório mensal máximo pago a título de subsídio ao Governador do Estado.","caso instituído pelo estado-membro, poderá aderir a plano de previdência complementar na modalidade benefício definido, observado o limite máximo previsto para o regime geral da previdência social.","estará sujeito ao teto remuneratório mensal máximo pago a título de subsídio aos Desembargadores do Tribunal de Justiça Estadual.","poderá ter seus proventos de aposentadoria do regime próprio de previdência superiores ao limite máximo fixado pelo Regime Geral de Previdência Social, observadas as normas constitucionais relativas ao regime de previdência complementar."],"correta":1,"explicacao":"Gabarito oficial: B. Art. 37, XI: no Executivo estadual (inclusive autarquias), o limite é o subsídio do Governador. O teto dos Desembargadores só vale se a Constituição estadual adotar o subteto único (art. 37, § 12).","origem":"prova","fonte":"Vunesp · TJSP · Escrevente Técnico Judiciário · 2025 · questão 34"},{"id":"oj-esc25-35","materia":"const","assunto":"Direitos sociais (art. 7º)","enunciado":"João trabalhava como empregado da empresa Alfa em regime ininterrupto de revezamento, sendo filiado ao respectivo sindicato. Através de negociação coletiva firmada pelos sindicatos representativos das categorias, foi fixada jornada superior a seis horas por turno, bem como acordada redução salarial. Tendo ocorrido a extinção do vínculo laboral recentemente, e pretendendo João ingressar com reclamação trabalhista para cobrança de diversas verbas em face da empresa, pode-se afirmar que a Constituição de 1988","alternativas":["não permite negociação coletiva estabelecendo redução salarial, mas permite mediante negociação coletiva a fixação de jornada superior a seis horas por turno, dispondo João do prazo máximo de 05 anos, após a extinção do contrato de trabalho, para ingressar com reclamação trabalhista.","permite negociação coletiva estabelecendo redução salarial e aumento da jornada de trabalho, e João terá direito de ação quanto aos créditos resultantes da relação de trabalho com prazo prescricional de 10 anos após a data de extinção do contrato de trabalho.","permite negociação coletiva estabelecendo a redução salarial, mas não permite negociação para fixação de jornada superior a seis horas por turno, e João deverá ingressar com reclamação trabalhista no prazo máximo de 02 anos após a extinção do contrato de trabalho.","não autoriza negociação coletiva estabelecendo jornada superior a seis horas por turno, devendo a empresa indenizá-lo pelas horas extraordinárias, dispondo João do prazo máximo de 02 anos após a extinção do contrato de trabalho para ingressar com reclamação trabalhista.","permite negociação coletiva fixando jornada superior a seis horas por turno e também redução salarial mediante convenção ou acordo coletivo, e João poderá ingressar com reclamação trabalhista no prazo máximo de 02 anos após a extinção do contrato de trabalho para a cobrança de verbas trabalhistas."],"correta":4,"explicacao":"Gabarito oficial: E. Art. 7º, VI e XIV: redução salarial e jornada maior que 6h em turnos ininterruptos são possíveis por negociação coletiva; XXIX: prescrição de 2 anos após a extinção do contrato.","origem":"prova","fonte":"Vunesp · TJSP · Escrevente Técnico Judiciário · 2025 · questão 35"},{"id":"oj-esc25-36","materia":"adm","assunto":"Estatuto SP - afastamentos (art. 78)","enunciado":"João, servidor público do Estado de São Paulo, é um atleta de destaque em sua modalidade esportiva. Ele recebeu um convite para participar de duas competições importantes: (1) os Jogos Sul-Americanos, que acontecerão na Colômbia, onde representará o Brasil, conforme requisição formal da Confederação Brasileira de sua modalidade; e (2) o torneio interestadual, em Minas Gerais, no qual a equipe do clube esportivo que irá representar, baseada em São Paulo, irá competir com chances reais de pódio. O clube esportivo fez a solicitação de seu afastamento para o segundo caso. Supondo que João buscou a devida autorização junto à autoridade competente, é correto afirmar, com base no Estatuto dos Funcionários Públicos Civis do Estado de São Paulo (Lei no 10.261/1968), que o afastamento de João para participar","alternativas":["de ambas as competições será com prejuízo do vencimento ou remuneração, por se tratar de atividades esportivas não relacionadas diretamente às atribuições do cargo, independentemente de autorização da autoridade competente.","dos Jogos Sul-Americanos será com prejuízo do vencimento ou remuneração, pois se trata de uma competição internacional.","dos Jogos Sul-Americanos será sem prejuízo do vencimento ou remuneração, e o torneio interestadual de clubes será com prejuízo do vencimento ou remuneração, sempre mediante autorização do governador.","dos Jogos Sul-Americanos será sem prejuízo do vencimento ou remuneração, e o torneio interestadual de clubes será igualmente sem prejuízo, em virtude da relevância esportiva.","de ambas as competições será sem prejuízo do vencimento ou remuneração, desde que haja a devida autorização do governador."],"correta":2,"explicacao":"Gabarito oficial: C. Lei 10.261/68: competição oficial representando o país é sem prejuízo do vencimento; o torneio de clube é com prejuízo, sempre com autorização.","origem":"prova","fonte":"Vunesp · TJSP · Escrevente Técnico Judiciário · 2025 · questão 36"},{"id":"oj-esc25-37","materia":"adm","assunto":"Estatuto SP - posse e exercício","enunciado":"Maria, recém-aprovada em concurso público para o cargo civil no Governo do Estado de São Paulo, tomou posse em 15 de agosto de 2025. No entanto, em 10 de setembro de 2025, Maria sofreu um acidente doméstico e necessitou de repouso absoluto, impossibilitando sua entrada em exercício no prazo. No dia 12 de setembro de 2025, sua advogada protocolou um requerimento solicitando a prorrogação do prazo para início do exercício por mais 90 dias. Não houve qualquer pedido de licença por motivo de saúde por parte de Maria. A autoridade competente, avaliando o caso, concedeu a prorrogação solicitada para o início do exercício, porém, apenas até 14 de outubro de 2025. De acordo com o Estatuto dos Funcionários Públicos Civis do Estado de São Paulo (Lei no 10.261/1968) e com a situação hipotética descrita, é correto afirmar que","alternativas":["a autoridade competente agiu corretamente ao fixar o prazo para início do exercício em 14 de outubro, posto que o prazo regular é de 45 dias, postergável por mais 15.","se, porventura, Maria não entrar em exercício dentro do prazo estabelecido, será considerada sem efeito a sua nomeação, sendo dispensado o ato de exoneração.","se, porventura, Maria não entrar em exercício dentro do prazo estabelecido será exonerada do cargo.","a autoridade competente agiu errado ao fixar o prazo limite, posto que a legislação não fixa prazo máximo para a prorrogação do início do exercício em cargo público.","se, porventura, Maria não entrar em exercício dentro do prazo estabelecido nada ocorrerá, posto que o afastamento de Maria se deve por questão de saúde."],"correta":2,"explicacao":"Gabarito oficial: C. Lei 10.261/68: o funcionário que não entra em exercício no prazo é exonerado do cargo.","origem":"prova","fonte":"Vunesp · TJSP · Escrevente Técnico Judiciário · 2025 · questão 37"},{"id":"oj-esc25-38","materia":"adm","assunto":"Estatuto SP - reintegração","enunciado":"De acordo com a Lei no 10.261/1968 (Estatuto dos Funcionários Públicos Civis do Estado de São Paulo), a reintegração de servidor público estadual é","alternativas":["o reingresso no serviço público, decorrente da decisão judicial passada em julgado, com ressarcimento de prejuízos resultantes do afastamento.","feita para cargo do mesmo padrão de vencimento ou de igual remuneração, ressalvados os casos de reintegração a pedido.","feita para cargo do mesmo padrão de vencimento ou superior, ainda que se trate de reintegração a pedido.","considerada ato privativo do governador do Estado de São Paulo, após análise e parecer conclusivo do procurador-geral do Estado.","o reingresso no serviço público, decorrente da decisão administrativa transitada em julgado, com ou sem ressarcimento de prejuízos resultantes do afastamento."],"correta":0,"explicacao":"Gabarito oficial: A. Lei 10.261/68: reintegração é o reingresso no serviço público decorrente de decisão judicial passada em julgado, com ressarcimento dos prejuízos.","origem":"prova","fonte":"Vunesp · TJSP · Escrevente Técnico Judiciário · 2025 · questão 38"},{"id":"oj-esc25-39","materia":"adm","assunto":"Improbidade administrativa","enunciado":"A empresa Construções Rápidas Ltda., uma construtora de médio porte com atuação predominante em projetos de infraestrutura básica em pequenos municípios do interior, foi processada por ato de improbidade administrativa, na modalidade de lesão ao erário, em razão de superfaturamento comprovado em contrato de pavimentação de vias urbanas com a Prefeitura Municipal de Y. Auditoria do Tribunal de Contas competente confirmou o dano ao patrimônio público. Durante a fase de fixação das sanções, a defesa da Construções Rápidas Ltda. demonstrou que a empresa é a principal empregadora da cidade, gerando centenas de postos de trabalho diretos e indiretos, e que sua falência, decorrente de uma sanção excessivamente severa, causaria um grave impacto social e econômico no município, com o fechamento de postos de trabalho, a interrupção de projetos em andamento e a perda de arrecadação de impostos. Com base na situação hipotética e nas disposições da Lei no 8.429/1992 (Lei de Improbidade Administrativa), assinale a alternativa correta.","alternativas":["A manutenção das atividades da pessoa jurídica é um critério a ser considerado na aplicação das sanções, mas apenas se o dano ao erário for de pequena monta e não houver dolo comprovado.","A Lei de Improbidade Administrativa não permite que o juiz leve em consideração os efeitos econômicos e sociais na aplicação das sanções à pessoa jurídica, devendo focar na reparação integral do dano ao erário.","A possibilidade de consideração pelo juiz dos efeitos econômicos e sociais das sanções sobre pessoas jurídicas apenadas nos termos da Lei de Improbidade Administrativa aplica-se exclusivamente às entidades sem fins lucrativos.","Na fixação das sanções à empresa Construções Rápidas Ltda., o juiz deverá considerar os efeitos econômicos e sociais das penalidades, buscando viabilizar a manutenção das atividades da empresa, mesmo diante do superfaturamento.","A preocupação com os efeitos econômicos e sociais das sanções é um critério que só pode ser invocado pela defesa da pessoa jurídica em fase recursal, após a fixação da pena em primeira instância."],"correta":3,"explicacao":"Gabarito oficial: D. Lei 8.429/92, art. 17-C, § 3º (redação 2021): nas sanções à pessoa jurídica, o juiz considera os efeitos econômicos e sociais, para viabilizar a manutenção das atividades.","origem":"prova","fonte":"Vunesp · TJSP · Escrevente Técnico Judiciário · 2025 · questão 39","extra":true},{"id":"oj-esc25-40","materia":"adm","assunto":"Improbidade administrativa","enunciado":"A Organização da Sociedade Civil Esperança Viva, pessoa jurídica de direito privado sem fins lucrativos, celebrou com a Prefeitura Municipal de X o instrumento jurídico apropriado para a gestão de um projeto social de atendimento a crianças e adolescentes em situação de vulnerabilidade, utilizando integralmente recursos provenientes do erário público municipal. Durante a execução do projeto, verificou-se que o Sr. João da Silva, presidente da Esperança Viva, em conluio com a Sra. Maria Souza, servidora pública municipal responsável pela fiscalização do termo de parceria, desviou parte dos recursos repassados pela prefeitura para fins pessoais, por meio da apresentação de notas fiscais falsas relativas a serviços nunca prestados. Tal conduta gerou um prejuízo significativo aos cofres públicos e comprometeu o atendimento às crianças e aos adolescentes beneficiados pelo projeto. Com base na situação hipotética e nas disposições da Lei no 8.429/1992 (Lei de Improbidade Administrativa), assinale a alternativa correta.","alternativas":["A Sra. Maria Souza é a única, no caso, que pode ser responsabilizada por ato de improbidade administrativa, pois a lei não alcança instituições sem fins lucrativos.","O Sr. João da Silva, em razão de celebrar instrumento jurídico com a Administração e utilizar recursos de origem pública, sujeita-se às sanções da Lei de Improbidade Administrativa.","A conduta do Sr. João da Silva configura meramente um ilícito civil, não estando abrangida pelas disposições da Lei de Improbidade Administrativa, que se restringe a atos dolosos praticados especificamente por agentes públicos diretos e equiparados.","A Lei de Improbidade Administrativa não se aplica ao Sr. João da Silva, por não ser este considerado como agente público nos termos desta Lei.","Somente a Organização da Sociedade Civil Esperança Viva pode ser responsabilizada, por ser a entidade que celebrou o instrumento jurídico, não podendo haver automática desconsideração da personalidade jurídica."],"correta":1,"explicacao":"Gabarito oficial: B. Lei 8.429/92, art. 2º, parágrafo único: quem celebra parceria e recebe recursos públicos sujeita-se às sanções da lei.","origem":"prova","fonte":"Vunesp · TJSP · Escrevente Técnico Judiciário · 2025 · questão 40","extra":true},{"id":"oj-esc25-41","materia":"adm","assunto":"Improbidade - enriquecimento ilícito (art. 9º)","enunciado":"João é servidor público municipal concursado e no momento ocupa a função de secretário Municipal de Obras e Serviços Públicos de uma pequena cidade. Aproveitando-se de sua posição, João solicitou e recebeu de um empresário local, que frequentemente participava das licitações do município, um “presente” de grande valor, a título de “ajuda de custo” para uma viagem particular que faria com sua família. Em troca, João agilizou e facilitou a aprovação de projetos do referido empresário na prefeitura, sem seguir os trâmites regulares, e inclusive “fechou os olhos” para algumas irregularidades que deveriam ser fiscalizadas por sua secretaria, garantindo que a empresa do empresário fosse sempre beneficiada em futuros contratos. Com base nesta situação hipotética, é correto afirmar que","alternativas":["João está sujeito, entre outras sanções, à perda dos bens ou valores acrescidos ilicitamente ao patrimônio, perda da função pública, suspensão dos direitos políticos por até 14 anos, pagamento de multa civil equivalente ao valor do acréscimo patrimonial.","a simples demonstração de recebimento, por João, de vantagem oriunda de pessoa com interesse em decisão da Secretaria de Obras e Serviços Públicos é razão suficiente para a condenação por improbidade, sendo desnecessária a demonstração da conexão entre a vantagem recebida e a expectativa da prática de ato ilegal.","ainda que a conduta de João possa, em tese, figurar como ato de improbidade que importa violação de princípio da Administração Pública, como agente político, não está João sujeito à Lei de Improbidade Administrativa (Lei no 8.429/1992), mas sim à lei de crimes de responsabilidade dos prefeitos.","João não está sujeito a sanções com base na Lei de Improbidade Administrativa (Lei no 8.429/1992), pois as condutas descritas não se amoldam perfeitamente à tipologia fixada nesta lei, a qual exige correspondência direta entre a conduta descrita e a praticada para que se possa falar em improbidade, considerando-se o princípio da legalidade estrita.","eventual não apresentação de ação civil por improbidade administrativa pelo Ministério Público, após análise em inquérito civil especialmente aberto para a apuração das condutas descritas no enunciado, tem como efeito o bloqueio da aplicação, pela própria Administração, de sanções disciplinares a João. 13 Legislação Interna"],"correta":0,"explicacao":"Gabarito oficial: A. Art. 9º e art. 12, I, Lei 8.429/92: perda dos bens acrescidos, perda da função, suspensão dos direitos políticos até 14 anos e multa equivalente ao acréscimo.","origem":"prova","fonte":"Vunesp · TJSP · Escrevente Técnico Judiciário · 2025 · questão 41"},{"id":"oj-esc25-42","materia":"legesp","assunto":"Resolução TJSP 963/2025 (eproc)","enunciado":"Considere que o juiz diretor realizou reunião para informar os servidores da Comarca sobre a implantação do sistema eproc. A ideia era reforçar a importância de que todos os servidores conheçam as condições de funcionamento do sistema e consigam orientar partes e advogados sobre os passos a serem seguidos para o protocolo correto de petições. Logo após a divulgação do cronograma de implantação, Fabiana, escrevente judiciária, foi designada para atender o público externo e esclarecer dúvidas sobre o assunto. Com base na Resolução no 963/2025, Fabiana poderá afirmar corretamente que","alternativas":["o protocolo de petição em sistema processual equivocado não produzirá prejuízo às partes, pois houve o direcionamento do ato ao Poder Judiciário; portanto, caso comprovado o equívoco, a Secretaria da Vara deve intimar o representante processual para que regularize o ato, no prazo de 05 (cinco) dias.","as ações poderão, na fase de implantação do sistema, ser propostas no eproc e no esaj, pelo prazo de 60 (sessenta) dias, findo o qual somente será admitido o uso do sistema eproc.","os processos com tramitação no esaj serão migrados para o eproc, devendo as partes promover a transmissão dos arquivos do processo para o novo sistema, de acordo com as condições previstas na Resolução.","o cumprimento definitivo de sentença oriundo de processo que tramitou no sistema legado deverá ser iniciado no sistema eproc, mediante o protocolo de petição inicial autônoma e juntada de cópia integral do processo de conhecimento.","os processos ajuizados antes da implantação do sistema eproc, bem como os recursos, incidentes e processos dependentes ou conexos, continuarão tramitando no sistema legado até o seu encerramento, ressalvada a hipótese de migração."],"correta":4,"explicacao":"Gabarito oficial: E. Os processos anteriores à implantação seguem no sistema legado até o fim, salvo migração.","origem":"prova","fonte":"Vunesp · TJSP · Escrevente Técnico Judiciário · 2025 · questão 42","extra":true},{"id":"oj-esc25-43","materia":"legesp","assunto":"Resolução TJSP 850/2021 (teletrabalho)","enunciado":"Felipe é escrevente técnico judiciário e tem o interesse de desempenhar as suas atividades no regime de teletrabalho. Por estar no exercício do cargo há dois anos (estágio probatório) e lotado no gabinete da magistrada titular da Vara, ele tem dúvidas sobre a real possibilidade de ser enquadrado no regime, motivo pelo qual procura sua colega de trabalho, Fernanda, para sanar dúvidas sobre o assunto. Com base na situação hipotética e no disposto na Resolução no 850/2021, Fernanda poderá afirmar corretamente que","alternativas":["Felipe, após enquadrado no teletrabalho, somente poderá trabalhar no regime presencial caso autorizado pela juíza titular da Vara.","ele não pode ser enquadrado no regime, por estar em estágio probatório.","o colega, caso passe ao regime de teletrabalho, perderá o auxílio-transporte relativo ao dia em teletrabalho, mas não o auxílio-alimentação.","Felipe poderá ser enquadrado no teletrabalho, desde que menos de 50% do quadro de servidores da unidade esteja em trabalho remoto.","o servidor, em regime de teletrabalho, tem o direito ao auxílio tecnológico, a ser utilizado na aquisição dos bens e serviços necessários ao exercício de suas atividades funcionais em ambiente remoto."],"correta":2,"explicacao":"Gabarito oficial: C. No dia de teletrabalho o servidor perde o auxílio-transporte, mas mantém o auxílio-alimentação.","origem":"prova","fonte":"Vunesp · TJSP · Escrevente Técnico Judiciário · 2025 · questão 43","extra":true},{"id":"oj-esc25-44","materia":"legesp","assunto":"LC 1.111/2010 (carreiras TJSP)","enunciado":"Tânia é escrevente judiciária e tem a intenção de se tornar chefe de seção judiciária. Com base nessa informação e no disposto na Lei Complementar no 1.111/2010, é correto afirmar:","alternativas":["Tânia deve ter dez anos de carreira, formação em Direito, Economia ou Administração e não ter sofrido penalidade disciplinar nos últimos cinco anos para ser nomeada.","para ser nomeada ao cargo, Tânia deve ser indicada pelo juiz diretor do foro.","Tânia não pode ocupar o cargo, por se tratar de função reservada a magistrados.","para concorrer ao cargo, Tânia deve participar de processo seletivo promovido pelo Comitê de Recursos Humanos, a ser composto de entrevista com os candidatos e avaliação escrita.","Tânia deve ter exercido anteriormente cargos dessa natureza, ainda que em substituição, ou comprovar experiência adequada, de acordo com critérios estabelecidos pelo Comitê de Recursos Humanos para ser nomeada."],"correta":4,"explicacao":"Gabarito oficial: A.","origem":"prova","fonte":"Vunesp · TJSP · Escrevente Técnico Judiciário · 2025 · questão 44","extra":true},{"id":"oj-esc25-45","materia":"legesp","assunto":"Regimento Interno do TJSP","enunciado":"Em relação às normas relacionadas a sessões, reuniões, audiências, pauta e ordem dos trabalhos, previstas no Regimento Interno do Tribunal de Justiça de São Paulo, assinale a alternativa correta.","alternativas":["Nenhum feito será julgado na ausência do relator, ainda que já tenha proferido voto, salvo se, iniciado o julgamento, vier ele a se afastar, computando-se os votos proferidos.","A ata da sessão de julgamento mencionará a data e a hora de início e de encerramento, quem presidiu os trabalhos, os nomes, pela ordem de antiguidade, dos desembargadores presentes e do representante do Ministério Público, devendo ser aprovada e assinada no final da própria sessão.","Para cada sessão, será organizada uma pauta de julgamento, com observância da ordem de apresentação dos feitos, em relação aos da mesma classe; os apresentados no mesmo dia serão inscritos segundo a ordem ascendente numérica, e somente podem ser julgados, sem prévia inclusão em pauta, o habeas corpus e os embargos de declaração em matéria criminal.","Salvo deliberação em contrário, recaindo a data da sessão em feriado ou dia em que não haja expediente forense, os feitos incluídos em pauta serão julgados na sessão ordinária seguinte, mediante nova publicação.","Quando, na votação de questão indecomponível ou de questões distintas, formarem-se correntes divergentes, sem que se alcance a maioria exigida, prevalecerá o voto do presidente do órgão responsável pelo julgamento."],"correta":0,"explicacao":"Gabarito oficial: A.","origem":"prova","fonte":"Vunesp · TJSP · Escrevente Técnico Judiciário · 2025 · questão 45","extra":true},{"id":"oj-esc25-46","materia":"legesp","assunto":"Normas da Corregedoria (NSCGJ)","enunciado":"Cesar é escrevente técnico judiciário e foi responsável por elaborar um ofício de comunicação, direcionado ao chefe do Poder Executivo do município X, contendo decisão judicial que ordena o fornecimento de relação descrevendo todas as notas fiscais emitidas nos últimos cinco anos por uma empresa executada em processo judicial. Com base na situação hipotética e no disposto nas normas da Corregedoria Geral de Justiça, é correto afirmar que","alternativas":["Cesar pode assinar o ofício de comunicação, pois a decisão é subscrita pelo juiz competente.","o ofício deverá ser assinado pelo juiz, por se tratar de ato direcionado a uma autoridade.","o ofício precisará ser assinado pelo juiz, pois as informações solicitadas estão protegidas por sigilo fiscal.","Cesar não pode assinar ofícios de comunicação, pois a sua competência legal é para redigir os seus termos.","Cesar deve assinar o ofício de comunicação, independentemente da matéria e do destinatário, por se tratar de mera execução de ato ordinatório."],"correta":1,"explicacao":"Gabarito oficial: B. Pelas NSCGJ, ofícios dirigidos a autoridades (como o chefe do Executivo) são assinados pelo juiz.","origem":"prova","fonte":"Vunesp · TJSP · Escrevente Técnico Judiciário · 2025 · questão 46"},{"id":"oj-esc25-47","materia":"atual","assunto":"Atualidades 2025","enunciado":"Na noite de quinta-feira (12.06.2025), as Forças de Defesa de Israel atingiram dezenas de alvos no Irã. Explosões foram registradas em Teerã e em outras cidades do país. O regime iraniano ameaçou Israel e Estados Unidos, ao afirmar que os países iriam “pagar caro”. O líder supremo iraniano, o aiatolá Ali Khamenei, disse que Israel receberia “um destino amargo”. No dia seguinte, depois que as Forças israelenses realizaram uma segunda ofensiva, o Irã lançou centenas de mísseis balísticos. Alguns deles atingiram Tel Aviv, furando o sistema de defesa de Israel. (g1. Disponível em: https://shre.ink/tQPr. Adaptado) O primeiro-ministro Benjamin Netanyahu justificou o ataque israelense afirmando que","alternativas":["líderes do Hamas estavam refugiados em Teerã planejando ataques a Israel.","drones iranianos foram lançados tendo como alvo a embaixada americana em Tel Aviv.","o Hezbollah recebera tanques e mísseis do governo iraniano para atacar Tel Aviv.","o objetivo da operação era impedir o avanço do programa nuclear iraniano.","o aiatolá Khamenei convocara reservistas com a intenção de ajudar a Palestina."],"correta":3,"explicacao":"Gabarito oficial: D. Israel justificou o ataque de junho de 2025 com a necessidade de impedir o avanço do programa nuclear iraniano.","origem":"prova","fonte":"Vunesp · TJSP · Escrevente Técnico Judiciário · 2025 · questão 47","extra":true},{"id":"oj-esc25-48","materia":"atual","assunto":"Atualidades 2025","enunciado":"Um projeto de lei enviado pelo Palácio do Planalto ao Congresso e aprovado em comissão especial da Câmara, no dia 16 de julho de 2025, pretende reduzir a desigualdade do sistema tributário brasileiro, no qual os super-ricos pagam proporcionalmente muito menos tributos sobre seus rendimentos do que o resto da população brasileira. Segundo um estudo divulgado por uma organização britânica que atua no combate à desigualdade, os 10% de brasileiros mais pobres pagam, em proporção da sua renda, três vezes mais tributos do que 0,1% mais rico da população. A pesquisa aponta que os mais pobres comprometem 32% da sua renda com tributos, contra 10% dos mais ricos. (DW. Disponível em https://shre.ink/t2me. Adaptado) De acordo com o mencionado projeto,","alternativas":["mais de 25 milhões de pessoas serão beneficiadas com a isenção do IR.","quem ganha mais de R$ 600 mil por ano, a alíquota será de 10%.","as pessoas que ganham até R$ 7,35 mil reais por mês ficarão isentas do tributo.","os rendimentos de estrangeiros serão tributados em 50%, no caso de envio de valores ao exterior.","as pessoas que ganham até R$ 5 mil reais por mês ficarão isentas do imposto de renda."],"correta":4,"explicacao":"Gabarito oficial: E. O projeto de reforma do IR de 2025 isenta quem ganha até R$ 5 mil por mês.","origem":"prova","fonte":"Vunesp · TJSP · Escrevente Técnico Judiciário · 2025 · questão 48","extra":true},{"id":"oj-esc25-49","materia":"atual","assunto":"Atualidades 2025","enunciado":"No dia 30 de janeiro de 2025, o presidente americano fez a seguinte afirmação comentando a intenção do BRICS: “Vamos exigir um compromisso desses países aparentemente hostis de que eles não criarão uma nova moeda nem apoiarão qualquer outra moeda para substituir o poderoso dólar americano, caso contrário, eles enfrentarão 100% de tarifas e deverão dizer adeus às vendas para a maravilhosa economia dos EUA”. O bloco agora enfrenta problemas em relação ao assunto porque um dos países fundadores pretende protagonismo em relação ao tema. (CPG. Disponível em: https://shre.ink/t21e. Adaptado) Segundo analistas,","alternativas":["a China quer que o yuan seja a moeda de transações do BRICS.","o Brasil propôs o real como moeda comum do bloco.","a Rússia oferece o rublo como alternativa ao dólar.","a África do Sul justifica a estabilidade do ZAR como a melhor solução.","a Índia insiste que as transações do bloco sejam feitas em rúpia."],"correta":0,"explicacao":"Gabarito oficial: A. Analistas apontaram que a Índia resiste à moeda comum e insiste em transações em rúpia.","origem":"prova","fonte":"Vunesp · TJSP · Escrevente Técnico Judiciário · 2025 · questão 49","extra":true},{"id":"oj-esc25-50","materia":"atual","assunto":"Estatuto da Pessoa com Deficiência","enunciado":"Soraia tem 45 anos, tem impedimento, de longo prazo, de natureza intelectual e sensorial, os quais, em interação com duas barreiras – urbanísticas e atitudinais –, obstruem sua participação plena e efetiva na sociedade em igualdade de condições com as demais pessoas. Ela está atualmente em curatela – exercida por Mário –, e como quer se tornar mãe, deseja adotar uma criança. No dia em que procuraria atendimento jurídico para saber se poderia se inscrever no cadastro de nacional de adoção, Soraia desmaiou. Em face do estado de inconsciência, foi atendida sem consentimento prévio. Quando acordou, estava no hospital, oportunidade na qual o médico, responsável pelo atendimento, lhe informou que estava desenvolvendo uma pesquisa científica com indícios de benefícios diretos para sua saúde, e disse que não havia outra pesquisa de eficácia comparável sendo realizada com participantes não curatelados, perguntou, então, se ela gostaria de participar da pesquisa. Com base na situação hipotética apresentada e no disposto na Lei no 13.146/2015 (Estatuto da Pessoa com Deficiência), assinale a alternativa correta.","alternativas":["Para Soraia ser considerada como pessoa com deficiência, ela deverá se submeter a uma avaliação biopsicossocial, realizada por equipe multiprofissional e interdisciplinar, que considerará os impedimentos enfrentados por ela, os fatores socioambientais e psicológicos e a limitação no desempenho das atividades diárias e sociais, a qual poderá ocorrer por meio da tecnologia de telemedicina, vedando-se o exame por análise documental.","Soraia é considerada como pessoa com deficiência, em virtude dos impedimentos de longo prazo que, ao interagirem com duas barreiras, dificultam sua participação na vida em sociedade. O fato de ela estar em curatela impede que ela participe da pesquisa científica, conforme expressa vedação legal. Assim, sua participação na pesquisa científica depende do encerramento judicial da curatela.","A deficiência de Soraia não afeta sua plena capacidade civil, de forma que ela pode exercer o direito à adoção, como adotante, em igualdade de oportunidades com as demais pessoas. Ademais, ela tem direito a receber atendimento prioritário como na tramitação processual e procedimentos judiciais e administrativos em que for parte ou interessada, em todos os atos e diligências, o que não é extensivo ao seu acompanhante.","Apesar de estar atualmente em curatela, Soraia não pode ser considerada como uma pessoa com deficiência, pois, para tanto, é preciso que o indivíduo tenha impedimento de longo prazo de natureza física, mental, intelectual e sensorial, que, combinado com pelo menos três barreiras – urbanísticas, arquitetônicas, nos transportes, nas comunicações ou atitudinais – impeça sua participação na sociedade.","Como Soraia estava inconsciente no momento do atendimento médico, é imprescindível que Mário, o curador, apresente consentimento expresso, livre e esclarecido previamente ao atendimento, sob pena da prática de infração administrativa pela equipe médica. 16 Matemática ____ ras c unho"],"correta":2,"explicacao":"Gabarito oficial: C. Lei 13.146/2015, art. 6º: a deficiência não afeta a plena capacidade civil, inclusive para adotar; art. 9º, VII: prioridade na tramitação processual, direito que não se estende ao acompanhante (art. 9º, § 1º).","origem":"prova","fonte":"Vunesp · TJSP · Escrevente Técnico Judiciário · 2025 · questão 50"},{"id":"oj-esc25-51","materia":"mat","assunto":"Conjuntos e razões","enunciado":"Um encontro reúne 84 musicistas que são especialistas em piano ou violão, sendo que alguns são apenas violonistas, alguns são apenas pianistas e os demais que são pianistas e violonistas. Considerando apenas os musicistas com especialidade em um único instrumento, a razão entre o número dos que são pianistas e o número dos que são violonistas é igual a 4/7. Considerando as especialidades desses musicistas, a razão entre o número dos que são pianistas e o número dos que são violonistas é igual 7/10. O algarismo das unidades do número de musicistas nesse encontro que são violonistas, mas não são pianistas é","alternativas":["3.","2.","6.","4.","5."],"correta":1,"explicacao":"Gabarito oficial: B. Monte as equações com só pianistas = 4k e só violonistas = 7k e use a razão total 7/10.","origem":"prova","fonte":"Vunesp · TJSP · Escrevente Técnico Judiciário · 2025 · questão 51"},{"id":"oj-esc25-52","materia":"mat","assunto":"Porcentagem","enunciado":"Sofia digitalizou todos os processos arquivados em um depósito em 33 dias. Nos primeiros 9 dias ela digitalizou 36% dos processos, concluindo 27 processos por dia e, nos demais dias, ela concluiu os demais processos, digitalizando N processos a cada dia. O algarismo das unidades de N é","alternativas":["6.","5.","7.","4.","8."],"correta":4,"explicacao":"Gabarito oficial: E. 9 dias × 27 = 243 processos = 36% → total 675. Restam 432 em 24 dias = 18 por dia. Algarismo das unidades: 8.","origem":"prova","fonte":"Vunesp · TJSP · Escrevente Técnico Judiciário · 2025 · questão 52"},{"id":"oj-esc25-54","materia":"mat","assunto":"Média aritmética","enunciado":"Certo dia, em um treino de lances livres de uma equipe de basquetebol, apenas André e Carlos faltaram. Considerando os atletas presentes nesse treino, a média aritmética do número de lances livres convertidos foi igual a 48. No dia seguinte, André fez o treino sozinho e a média aritmética do número de lances livres convertidos pelos atletas que treinaram nesses dois dias foi igual a 50. Finalmente, no terceiro dia, Carlos fez o treino sozinho e a média aritmética do número de lances livres convertidos por todos os atletas dessa equipe nesses três dias foi igual a 49. Sabendo que André converteu 53 lances livres a mais do que Carlos, o número de atletas dessa equipe de basquetebol é igual a","alternativas":["19.","18.","17.","20.","16."],"correta":0,"explicacao":"Gabarito oficial: A (19 atletas). Use somas: n·48 na 1ª média; somando André e Carlos, compare as médias 50 e 49.","origem":"prova","fonte":"Vunesp · TJSP · Escrevente Técnico Judiciário · 2025 · questão 54"},{"id":"oj-esc25-55","materia":"mat","assunto":"Matemática","enunciado":"Ao usar o OneDrive com o MS-Windows 11, em sua configuração padrão, um arquivo da nuvem marcado como disponível localmente pode deixar de estar disponível localmente","alternativas":["se o servidor da nuvem for desligado acidentalmente.","se a internet do servidor da nuvem ficar fora do ar por mais de dez minutos.","em caso de queda da internet local, o que impede que ele seja atualizado e causa sua exclusão automática.","por falta de espaço no dispositivo local, de modo que o arquivo pode ser excluído do dispositivo mesmo sem ação direta do usuário.","caso o usuário local saia da sessão do Windows, fazendo com que o arquivo seja excluído e só volte a ser sincronizado no próximo login, automaticamente."],"correta":3,"explicacao":"Gabarito oficial: D.","origem":"prova","fonte":"Vunesp · TJSP · Escrevente Técnico Judiciário · 2025 · questão 55"},{"id":"oj-esc25-56","materia":"mat","assunto":"Matemática","enunciado":"Um usuário do MS-Word 365, em sua configuração padrão, recebeu um documento de texto contendo uma lista numerada de 1 a 5. No entanto, essa lista deveria ser numerada de 20 a 25. Para alterar a lista numerada conforme a necessidade, o usuário deve","alternativas":["clicar com o botão primário do mouse no número 5 da lista numerada e, no menu de contexto aberto, escolher a opção “Iniciar Numeração em...”, que abre a janela na qual pode ser colocado o número 20, para ajustar toda a lista.","clicar com o botão secundário do mouse no número 5 da lista numerada e, no menu de contexto aberto, escolher a opção “Iniciar Numeração em...”, que abre a janela na qual pode ser colocado o número 20, para ajustar toda a lista.","clicar com o botão secundário do mouse no número 1 da lista numerada e, no menu de contexto aberto, escolher a opção “Definir Valor de Numeração...”, que abre a janela na qual pode ser colocado o número 20, para ajustar toda a lista.","clicar com o botão primário do mouse no número 1 da lista numerada e, no menu de contexto aberto, escolher a opção “Valor de Numeração...”, que abre a janela na qual pode ser colocado o número 20, para ajustar toda a lista.","remover toda a lista item por item e iniciar uma nova lista escolhendo o botão Lista personalizada do grupo Lista da guia Inserir."],"correta":2,"explicacao":"Gabarito oficial: C.","origem":"prova","fonte":"Vunesp · TJSP · Escrevente Técnico Judiciário · 2025 · questão 56"},{"id":"oj-esc25-60","materia":"info","assunto":"Correio eletrônico","enunciado":"Observe a descrição do seguinte e-mail, denominado e-mail 1: De: A Para: B Cc: C Cco: D Assunto: manual O usuário B, ao receber o e-mail 1, clicou em Responder a Todos e enviou a resposta, que se tornou o e-mail 2. Todos os usuários que receberam o e-mail 2 clicaram em Responder a Todos e enviaram uma resposta. Considerando que todos os e-mails, desde o e-mail 1, foram enviados e recebidos com sucesso por meio do Gmail, em sua configuração padrão, assinale a alternativa que apresenta corretamente a quantidade de e-mails recebidos, respectivamente, pelos usuários A, B, C e D.","alternativas":["3, 4, 4 e 4.","2, 3, 3 e 4.","2, 2, 3 e 1.","3, 2, 3 e 1.","2, 3, 3 e 1."],"correta":4,"explicacao":"Gabarito oficial: E. Quem está em Cco (D) não aparece para os outros: \"responder a todos\" de B não inclui D. Contando as respostas: A=2, B=3, C=3, D=1.","origem":"prova","fonte":"Vunesp · TJSP · Escrevente Técnico Judiciário · 2025 · questão 60"},{"id":"oj-esc25-61","materia":"info","assunto":"Internet e busca","enunciado":"Um usuário do buscador www.google.com, em sua configuração padrão, deseja buscar páginas que contenham, simultaneamente, as três palavras seguintes no corpo da página: “segurança”, “dados” e “privacidade”. Assinale a alternativa que apresenta corretamente a expressão de busca que deve ser usada no buscador.","alternativas":["intext:segurança +dados +privacidade","allintext:segurança dados privacidade","intext:segurança * dados * privacidade","“segurança dados privacidade”","segurança +dados +privacidade"],"correta":1,"explicacao":"Gabarito oficial: B. O operador allintext: exige que todas as palavras apareçam no corpo da página.","origem":"prova","fonte":"Vunesp · TJSP · Escrevente Técnico Judiciário · 2025 · questão 61"},{"id":"oj-esc25-62","materia":"info","assunto":"MS-Teams","enunciado":"Em um chat do MS-Teams, em sua configuração padrão, qual é o formato correto para citar um usuário (fulano) de modo que o Teams envie uma notificação automaticamente a esse usuário?","alternativas":["!fulano","#fulano#","#fulano","@fulano","&fulano"],"correta":3,"explicacao":"Gabarito oficial: D. No Teams, @nome menciona a pessoa e dispara notificação.","origem":"prova","fonte":"Vunesp · TJSP · Escrevente Técnico Judiciário · 2025 · questão 62"},{"id":"oj-esc25-63","materia":"info","assunto":"Windows: pastas e arquivos","enunciado":"Um usuário abriu uma pasta local em seu computador, por meio do Explorador de Arquivos do MS-Windows 11, ambos na configuração padrão, e nela estavam somente os seguintes arquivos vazios: normas_sindicato.txt busca_indicios.txt indicativo_correto.txt Introducao.txt processo_inicial.txt Em seguida, usou a barra de pesquisa do Explorador de Arquivos na mesma pasta, para pesquisar nessa pasta pelo nome dos arquivos com o seguinte padrão de pesquisa: ind* Quanto aos arquivos retornados como resultado dessa pesquisa, é correto afirmar que","alternativas":["apareceram os arquivos busca_indicios.txt e indica tivo_correto.txt, apenas.","apareceram os arquivos normas_sindicato.txt, busca_indicios.txt, indicativo_correto.txt, Introducao. txt e processo_inicial.txt.","apareceu o arquivo indicativo_correto.txt, apenas.","apareceram os arquivos normas_sindicato.txt, busca_indicios.txt e indicativo_correto.txt, apenas.","nenhum arquivo coincide com o padrão de pesquisa. 21 Raciocínio Lógico ____ R A S C U ____ N H ____ O"],"correta":0,"explicacao":"Gabarito oficial: A. A busca \"ind*\" do Explorador encontra palavras do nome que começam por \"ind\" (inclusive após _ ): busca_indicios e indicativo_correto.","origem":"prova","fonte":"Vunesp · TJSP · Escrevente Técnico Judiciário · 2025 · questão 63"},{"id":"oj-esc25-64","materia":"mat","assunto":"Raciocínio lógico: negação","enunciado":"Considere a proposição “Se estou correndo ou jogando futebol, então amanhã estarei de férias”. Uma negação lógica dessa proposição é equivalente a:","alternativas":["Se amanhã não estarei de férias, então não estou correndo e não estou jogando futebol.","Ou estou correndo ou jogando futebol ou amanhã estarei de férias.","Estou correndo ou jogando futebol, e amanhã não estarei de férias.","Ou não estou correndo ou não estou jogando futebol ou amanhã não estarei de férias.","Se não estou correndo ou não estou jogando futebol, então amanhã não estarei de férias."],"correta":2,"explicacao":"Gabarito oficial: C. Negação de \"Se P então Q\" é \"P e não Q\": \"Estou correndo ou jogando futebol, e amanhã não estarei de férias\".","origem":"prova","fonte":"Vunesp · TJSP · Escrevente Técnico Judiciário · 2025 · questão 64"},{"id":"oj-esc25-65","materia":"mat","assunto":"Raciocínio lógico: sequências","enunciado":"Considere a sequência A = (1, 4, 7, 10, 13, 16, 19, …), formada a partir de um padrão lógico. A partir da sequência A, foi formada a sequência B = (1, 4, 7, 1, 0, 1, 3, 1, 6, 1, 9, …). O 245o termo da sequência B é","alternativas":["8.","4.","0.","5.","7."],"correta":0,"explicacao":"Gabarito oficial: A. B é a sequência de algarismos de A escritos em fila. Conte os algarismos até a posição 245.","origem":"prova","fonte":"Vunesp · TJSP · Escrevente Técnico Judiciário · 2025 · questão 65"},{"id":"oj-esc25-66","materia":"mat","assunto":"Raciocínio lógico: posições","enunciado":"Em um restaurante, Ana, Eva, Bruno, Davi e Carla estavam sentados, nessa ordem, ao redor de uma mesa circular com cinco assentos. Em uma disposição circular, cada pessoa tem duas pessoas ao seu lado, uma do lado esquerdo e outra do lado direito; nessa mesa, ao lado esquerdo de Ana estava Eva. Após algum tempo, Fábio chegou para juntar-se ao grupo; todos se levantaram, cumprimentaram Fábio e os seis sentaram-se em uma mesa circular com seis assentos. Nessa nova disposição, ninguém se sentou ao lado das mesmas pessoas que estavam ao seu lado anteriormente; a pessoa que se sentou ao lado esquerdo de Davi não é a mesma pessoa que se sentou ao lado direito de Carla; a pessoa ao lado direito de Ana não é Davi; e Eva não se sentou ao lado de Carla. Nessa mesa com seis assentos, sentaram-se ao lado de Fábio, em alguma ordem,","alternativas":["Bruno e Davi.","Carla e Eva.","Ana e Carla.","Davi e Ana.","Eva e Bruno."],"correta":1,"explicacao":"Gabarito oficial: B (Carla e Eva ao lado de Fábio). Teste as restrições em uma mesa circular.","origem":"prova","fonte":"Vunesp · TJSP · Escrevente Técnico Judiciário · 2025 · questão 66"},{"id":"oj-esc25-67","materia":"mat","assunto":"Raciocínio lógico","enunciado":"As lojas matrizes A, B e C têm uma filial cada uma, que são, não necessariamente nessa ordem, as lojas D, E e F. A loja A tem 20 funcionários a mais do que sua filial, e a filial F tem um terço do número de funcionários de sua matriz. Os números de funcionários das lojas A, B e C são, respectivamente, 33, 24 e 42, e o total de funcionários dessas seis lojas é igual a 128. Sabendo que a filial E tem o mesmo número de funcionários de uma das outras duas filiais, o número de funcionários da loja C e sua filial excede o número de funcionários da loja A e sua filial em","alternativas":["8.","5.","6.","4.","7."],"correta":3,"explicacao":"Gabarito oficial: D (4).","origem":"prova","fonte":"Vunesp · TJSP · Escrevente Técnico Judiciário · 2025 · questão 67"},{"id":"oj-esc25-68","materia":"mat","assunto":"Raciocínio lógico: verdades e mentiras","enunciado":"O professor de Educação Física viu que 5 de seus alunos disputaram uma corrida de 100 metros rasos, mas, como estava distante da pista, só conseguiu identificar que não houve empate em posição alguma, porém não soube dizer quem chegou em qual posição. Ao se aproximar dos alunos e perguntar quem havia vencido, obteve as seguintes respostas: Larson: Eu não venci a corrida. Leandro: Liam foi o terceiro colocado. Liam: Lorenzo chegou na frente de Larson. Lorenzo: Luciano foi o penúltimo colocado. Luciano: Lorenzo não venceu a corrida. Sabendo que os dois últimos colocados mentiram em suas respostas e que os três primeiros falaram a verdade, conclui-se que o terceiro colocado nessa corrida foi o","alternativas":["Leandro.","Lorenzo.","Liam.","Luciano.","Larson."],"correta":4,"explicacao":"Gabarito oficial: E (Larson foi o terceiro). Teste quem são os dois últimos (mentirosos).","origem":"prova","fonte":"Vunesp · TJSP · Escrevente Técnico Judiciário · 2025 · questão 68"},{"id":"oj-esc25-69","materia":"mat","assunto":"Raciocínio lógico: sequências","enunciado":"Considere a sequência 200, 207, 209, 198, 205, 207, 196, 203, 205, 194, … Essa sequência tem alguns elementos que se repetem, como, por exemplo, o 205, que está nas posições 5 e 9, e alguns elementos que ocorrem apenas uma vez, como o 0 (zero), que se encontra na posição","alternativas":["312.","292.","295.","301.","323."],"correta":3,"explicacao":"Gabarito oficial: D (posição 301). O padrão +7, +2, −11 reduz 4 a cada bloco de 3 termos.","origem":"prova","fonte":"Vunesp · TJSP · Escrevente Técnico Judiciário · 2025 · questão 69"},{"id":"oj-esc25-70","materia":"mat","assunto":"Raciocínio lógico: proposições","enunciado":"Considere as proposições p e q a seguir: p: É dia de verão. q: As pessoas estão felizes e os carrinhos de picolé estão vazios. Se o valor lógico de p → ∼q é falso, então tem valor lógico verdadeiro o que se afirma em:","alternativas":["ou não é dia de verão, ou as pessoas estão felizes e os carrinhos de picolé não estão vazios.","ou é dia de verão, ou as pessoas estão felizes e os carrinhos de picolé estão vazios.","não é dia de verão e as pessoas não estão felizes e os carrinhos de picolé não estão vazios.","é dia de verão e as pessoas não estão felizes e os carrinhos de picolé não estão vazios.","é dia de verão e as pessoas estão felizes e os carrinhos de picolé estão vazios."],"correta":4,"explicacao":"Gabarito oficial: E. p → ~q é falso só se p é V e ~q é F, ou seja, q é V: é verão e as pessoas estão felizes e os carrinhos vazios.","origem":"prova","fonte":"Vunesp · TJSP · Escrevente Técnico Judiciário · 2025 · questão 70"},{"id":"oj-esc21-01","materia":"port","assunto":"Interpretação de texto","enunciado":"O estabelecimento de sentido no texto se dá pela inter- -relação entre a área do amor e a da","alternativas":["psicologia, enfatizando-se que a primeira vira ostentação quando se faz joguinho dramático.","finança, enfatizando-se que a primeira dispensa grandes investimentos para que logre êxito.","etiqueta, enfatizando-se que a primeira pode trazer prejuízos à vida social se promove escândalos.","saúde, enfatizando-se que a primeira pode trazer problemas físicos se o amor é exagerado.","economia, enfatizando-se que a primeira exige o dispêndio de recursos de forma intensa."],"correta":4,"explicacao":"Gabarito oficial: E. O cronista relaciona amor e economia (pagamento à vista, poupança, parcelas).","origem":"prova","fonte":"Vunesp · TJSP · Escrevente Técnico Judiciário · 2021 · questão 1","texto":"Amor é para gastar\n\nNa economia da vida, o maior desperdício é fazer poupança de amor. Prejuízo na certa. Amor é para gastar, mostrar, ostentar. O amor, aliás, é a mais saudável forma de ostentação que existe no mundo. Vai por mim, amar é luxo só. Triste de quem sente e esconde, de quem sente e fica no joguinho dramático, de quem sente e guarda a sete chaves. Sinto muito. Amor é da boca para fora. Amor é um escândalo que não se abafa. “Eu te amo” é para ser dito, desbocadamente. Guardar “eu te amo” é prejudicial à saúde. Na economia amorosa, só existe pagamento à vista, missa de corpo presente. O amor não se parcela, não admite suaves prestações.\n\nNão existe essa de amor só amanhã, como na placa do fiado do boteco. Amor é hoje, aqui, agora... Amor não se sonega, amor é tudo a declarar.\n\n(Xico Sá, “Amor é para gastar”. Em: http://www.itatiaia.com.br)"},{"id":"oj-esc21-02","materia":"port","assunto":"Interpretação de texto","enunciado":"A frase inicial do 2o parágrafo sintetiza o ponto de vista do autor: “Vai por mim, amar é luxo só.” Coerente com esse posicionamento, o autor reconhece que o amor é","alternativas":["uma lembrança do passado que se legitima como poupança.","um sentimento que deve ser declarado e vivido no tempo presente.","uma dívida de boteco que se intensifica quando é paga aos poucos.","uma ilusão que vai sendo construída ao longo da vida das pessoas.","um desperdício na vida das pessoas se não for bem guardado."],"correta":1,"explicacao":"Gabarito oficial: B. \"Amar é luxo só\": o amor deve ser declarado e vivido agora.","origem":"prova","fonte":"Vunesp · TJSP · Escrevente Técnico Judiciário · 2021 · questão 2","texto":"Amor é para gastar\n\nNa economia da vida, o maior desperdício é fazer poupança de amor. Prejuízo na certa. Amor é para gastar, mostrar, ostentar. O amor, aliás, é a mais saudável forma de ostentação que existe no mundo. Vai por mim, amar é luxo só. Triste de quem sente e esconde, de quem sente e fica no joguinho dramático, de quem sente e guarda a sete chaves. Sinto muito. Amor é da boca para fora. Amor é um escândalo que não se abafa. “Eu te amo” é para ser dito, desbocadamente. Guardar “eu te amo” é prejudicial à saúde. Na economia amorosa, só existe pagamento à vista, missa de corpo presente. O amor não se parcela, não admite suaves prestações.\n\nNão existe essa de amor só amanhã, como na placa do fiado do boteco. Amor é hoje, aqui, agora... Amor não se sonega, amor é tudo a declarar.\n\n(Xico Sá, “Amor é para gastar”. Em: http://www.itatiaia.com.br)"},{"id":"oj-esc21-03","materia":"port","assunto":"Concordância verbal","enunciado":"De acordo com a norma-padrão, a reescrita de informações do texto está correta quanto à concordância verbal em:","alternativas":["Tristes daqueles que sente e esconde, que sente e fica no joguinho dramático.","Quando se usa sete chaves para guardar o amor, ele vai da boca para fora.","Existe sentimentos, como o amor, que são escândalos e que não se abafa.","Acontece que, quando há suaves prestações, o amor está sendo poupado.","Joguinhos dramáticos expõe o perfil daquela pessoa que sente e esconde."],"correta":3,"explicacao":"Gabarito oficial: D. \"Acontece que, quando há suaves prestações...\" — \"haver\" (existir) é impessoal; as demais têm erro.","origem":"prova","fonte":"Vunesp · TJSP · Escrevente Técnico Judiciário · 2021 · questão 3","texto":"Amor é para gastar\n\nNa economia da vida, o maior desperdício é fazer poupança de amor. Prejuízo na certa. Amor é para gastar, mostrar, ostentar. O amor, aliás, é a mais saudável forma de ostentação que existe no mundo. Vai por mim, amar é luxo só. Triste de quem sente e esconde, de quem sente e fica no joguinho dramático, de quem sente e guarda a sete chaves. Sinto muito. Amor é da boca para fora. Amor é um escândalo que não se abafa. “Eu te amo” é para ser dito, desbocadamente. Guardar “eu te amo” é prejudicial à saúde. Na economia amorosa, só existe pagamento à vista, missa de corpo presente. O amor não se parcela, não admite suaves prestações.\n\nNão existe essa de amor só amanhã, como na placa do fiado do boteco. Amor é hoje, aqui, agora... Amor não se sonega, amor é tudo a declarar.\n\n(Xico Sá, “Amor é para gastar”. Em: http://www.itatiaia.com.br)"},{"id":"oj-esc21-04","materia":"port","assunto":"Crase","enunciado":"No trecho do 3o parágrafo – Guardar “eu te amo” é prejudicial à saúde. –, a crase mantém-se se a expressão destacada for substituída por:","alternativas":["pessoa que o esconde.","pessoas que o escondem.","qualquer pessoa que o esconda.","quem o esconde.","todos que o escondem."],"correta":0,"explicacao":"Gabarito oficial: A. Crase antes de \"pessoa\" (substantivo feminino com artigo): \"prejudicial à pessoa que o esconde\".","origem":"prova","fonte":"Vunesp · TJSP · Escrevente Técnico Judiciário · 2021 · questão 4","texto":"Amor é para gastar\n\nNa economia da vida, o maior desperdício é fazer poupança de amor. Prejuízo na certa. Amor é para gastar, mostrar, ostentar. O amor, aliás, é a mais saudável forma de ostentação que existe no mundo. Vai por mim, amar é luxo só. Triste de quem sente e esconde, de quem sente e fica no joguinho dramático, de quem sente e guarda a sete chaves. Sinto muito. Amor é da boca para fora. Amor é um escândalo que não se abafa. “Eu te amo” é para ser dito, desbocadamente. Guardar “eu te amo” é prejudicial à saúde. Na economia amorosa, só existe pagamento à vista, missa de corpo presente. O amor não se parcela, não admite suaves prestações.\n\nNão existe essa de amor só amanhã, como na placa do fiado do boteco. Amor é hoje, aqui, agora... Amor não se sonega, amor é tudo a declarar.\n\n(Xico Sá, “Amor é para gastar”. Em: http://www.itatiaia.com.br)"},{"id":"oj-esc21-05","materia":"port","assunto":"Interpretação de texto","enunciado":"Releia as passagens do texto. • \u0007Na economia amorosa, só existe pagamento à vista, missa de corpo presente. O amor não se parcela... • \u0007Não existe essa de amor só amanhã, como na placa do fiado do boteco. Amor é hoje... • \u0007Amor não se sonega, amor é tudo a declarar. Na organização e estruturação das informações no texto, conclui-se corretamente que, em cada par de expressões destacadas, as relações entre as ideias se baseiam no sentido de","alternativas":["discrepância.","consequência.","semelhança.","analogia.","harmonia."],"correta":0,"explicacao":"Gabarito oficial: A. As passagens mostram a discrepância (oposição) entre o amor e o fiado/parcelado.","origem":"prova","fonte":"Vunesp · TJSP · Escrevente Técnico Judiciário · 2021 · questão 5","texto":"Amor é para gastar\n\nNa economia da vida, o maior desperdício é fazer poupança de amor. Prejuízo na certa. Amor é para gastar, mostrar, ostentar. O amor, aliás, é a mais saudável forma de ostentação que existe no mundo. Vai por mim, amar é luxo só. Triste de quem sente e esconde, de quem sente e fica no joguinho dramático, de quem sente e guarda a sete chaves. Sinto muito. Amor é da boca para fora. Amor é um escândalo que não se abafa. “Eu te amo” é para ser dito, desbocadamente. Guardar “eu te amo” é prejudicial à saúde. Na economia amorosa, só existe pagamento à vista, missa de corpo presente. O amor não se parcela, não admite suaves prestações.\n\nNão existe essa de amor só amanhã, como na placa do fiado do boteco. Amor é hoje, aqui, agora... Amor não se sonega, amor é tudo a declarar.\n\n(Xico Sá, “Amor é para gastar”. Em: http://www.itatiaia.com.br)"},{"id":"oj-esc21-06","materia":"port","assunto":"Regência e preposições","enunciado":"Em conformidade com a norma-padrão, as lacunas do texto devem ser preenchidas, respectivamente, com:","alternativas":["Sobre ... que ... em ... de que","Perante ... que ... à ... em que","Com ... de que ... a ... a que","Sob ... que ... em ... que","Devido ... que ... a ... com que"],"correta":2,"explicacao":"Gabarito oficial: C.","origem":"prova","fonte":"Vunesp · TJSP · Escrevente Técnico Judiciário · 2021 · questão 6","texto":"Perto do apagão\n\n____ a falta de chuvas nos últimos dois meses, inferiores ao padrão já escasso do mesmo período de 2020, ficou mais evidente a ameaça ____ a geração de energia se mostre insuficiente para manter o fornecimento até novembro, quando se encerra o período seco.\n\nNovas simulações do Operador Nacional do Sistema (ONS) mostram agravamento, com destaque para a região Sul, onde o nível dos reservatórios até 24 de agosto caiu para 30,7% – a projeção anterior apontava para 50% no fechamento do mês. Mesmo no cenário mais favorável, que pressupõe um amplo conjunto de medidas, como acionamento de grande capacidade de geração térmica, importação de energia e postergação de manutenção de equipamentos, o país chegaria ____ novembro praticamente sem sobra de potência, o que amplia a probabilidade de apagões. Embora se espere que tais medidas sejam suficientes para evitar racionamento neste ano, não se descartam sobressaltos pontuais, no contexto da alta demanda ____ o sistema será submetido. Se o regime de chuvas no verão não superar a média dos últimos anos, a margem de manobra para 2022 será ainda menor. Calcula-se que, nesse quadro, a geração térmica, mais cara, tenha de permanecer durante todo o período úmido, o que seria algo inédito. Desde já o país precisa considerar os piores cenários e agir com toda a prudência possível, com foco em investimentos na geração, modernização de turbinas em hidrelétricas antigas e planejamento para ampliar a resiliência do sistema.\n\n(Editorial. Folha de S.Paulo, 27.08.2021. Adaptado)"},{"id":"oj-esc21-07","materia":"port","assunto":"Interpretação de texto","enunciado":"As informações do editorial permitem concluir corretamente que","alternativas":["a geração térmica, a importação de energia e a postergação de manutenção de equipamentos livram o país de um apagão.","a geração de energia no país está comprometida pela falta de chuvas, o que exige atenção pelo risco de apagão.","o regime das chuvas, que já chegou a causar preocupação no país pelo risco de apagão, estará normalizado até novembro.","a geração de energia térmica em 2022 tenderá a estar mais cara, graças ao verão úmido e à superação dos índices pluviométricos.","a previsão de chuvas para 2022 será um problema menor, considerando-se os níveis dos reservatórios em 50% em 2021."],"correta":1,"explicacao":"Gabarito oficial: B. O editorial r. (5o parágrafo) • \u0007... o que seria algo inédito. (5o parágrafo) No contexto em que estão empregadas, as formas verbais expressam, correta e respectivamente, sentido de:","alternativas":["ação concluída; imperativo; hipótese.","ação frequente; presente; certeza.","ação anterior a outra; futuro; desejo.","ação concluída; futuro; hipótese.","ação frequente; presente; dúvida."],"correta":3,"explicacao":"Gabarito oficial: D. \"caiu\" = ação concluída; \"será\" = futuro; \"seria\" = hipótese (futuro do pretérito).","origem":"prova","fonte":"Vunesp · TJSP · Escrevente Técnico Judiciário · 2021 · questão 8","texto":"Perto do apagão\n\n____ a falta de chuvas nos últimos dois meses, inferiores ao padrão já escasso do mesmo período de 2020, ficou mais evidente a ameaça ____ a geração de energia se mostre insuficiente para manter o fornecimento até novembro, quando se encerra o período seco.\n\nNovas simulações do Operador Nacional do Sistema (ONS) mostram agravamento, com destaque para a região Sul, onde o nível dos reservatórios até 24 de agosto caiu para 30,7% – a projeção anterior apontava para 50% no fechamento do mês. Mesmo no cenário mais favorável, que pressupõe um amplo conjunto de medidas, como acionamento de grande capacidade de geração térmica, importação de energia e postergação de manutenção de equipamentos, o país chegaria ____ novembro praticamente sem sobra de potência, o que amplia a probabilidade de apagões. Embora se espere que tais medidas sejam suficientes para evitar racionamento neste ano, não se descartam sobressaltos pontuais, no contexto da alta demanda ____ o sistema será submetido. Se o regime de chuvas no verão não superar a média dos últimos anos, a margem de manobra para 2022 será ainda menor. Calcula-se que, nesse quadro, a geração térmica, mais cara, tenha de permanecer durante todo o período úmido, o que seria algo inédito. Desde já o país precisa considerar os piores cenários e agir com toda a prudência possível, com foco em investimen mento até novembro, quando se encerra o período seco.\n\nNovas simulações do Operador Nacional do Sistema (ONS) mostram agravamento, com destaque para a região Sul, onde o nível dos reservatórios até 24 de agosto caiu para 30,7% – a projeção anterior apontava para 50% no fechamento do mês. Mesmo no cenário mais favorável, que pressupõe um amplo conjunto de medidas, como acionamento de grande capacidade de geração térmica, importação de energia e postergação de manutenção de equipamentos, o país chegaria ____ novembro praticamente sem sobra de potência, o que amplia a probabilidade de apagões. Embora se espere que tais medidas sejam suficientes para evitar racionamento neste ano, não se descartam sobressaltos pontuais, no contexto da alta demanda ____ o sistema será submetido. Se o regime de chuvas no verão não superar a média dos últimos anos, a margem de manobra para 2022 será ainda menor. Calcula-se que, nesse quadro, a geração térmica, mais cara, tenha de permanecer durante todo o período úmido, o que seria algo inédito. Desde já o país precisa considerar os piores cenários e agir com toda a prudência possível, com foco em investimentos na geração, modernização de turbinas em hidrelétricas antigas e planejamento para ampliar a resiliência do sistema.\n\n(Editorial. Folha de S.Paulo, 27.08.2021. Adaptado)"},{"id":"oj-esc21-11","materia":"port","assunto":"Interpretação de texto","enunciado":"No conto, o narrador explora a ideia de","alternativas":["inversão de papéis de gênero.","questionamento da liberdade.","fugacidade do sentimento.","desapego da vida ao natural.","desalento dos apaixonados."],"correta":2,"explicacao":"Gabarito oficial: C. O conto explora a fugacidade do sentimento: \"ela sabe que tudo vai acabar\".","origem":"prova","fonte":"Vunesp · TJSP · Escrevente Técnico Judiciário · 2021 · questão 11","texto":"Vida ao natural\n\nPois no Rio tinha um lugar com uma lareira. E quando ela percebeu que, além do frio, chovia nas árvores, não pôde acreditar que tanto lhe fosse dado. O acordo do mundo com aquilo que ela nem sequer sabia que precisava como numa fome. Chovia, chovia. O fogo aceso pisca para ela e para o homem. Ele, o homem, se ocupa do que ela nem sequer lhe agradece; ele atiça o fogo na lareira, o que não lhe é senão dever de nascimento. E ela – que é sempre inquieta, fazedora de coisas e experimentadora de curiosidades – pois ela nem lembra sequer de atiçar o fogo; não é seu papel, pois se tem o seu homem para isso. Não sendo donzela, que o homem então cumpra a sua missão. O mais que ela faz é às vezes instigá-lo: “aquela acha*”, diz-lhe, “aquela ainda não pegou”. E ele, um instante antes que ela acabe a frase que o esclareceria, ele por ele mesmo já notara a acha, homem seu que é, e já está atiçando a acha. Não a comando seu, que é a mulher de um homem e que perderia seu estado se lhe desse ordem. A outra mão dele, a livre, está ao alcance dela. Ela sabe, e não a toma. Quer a mão dele, sabe que quer, e não a toma. Tem exatamente o que precisa: pode ter. Ah, e dizer que isto vai acabar, que por si mesmo não pode durar. Não, ela não está se referindo ao fogo, refere-se ao que sente. O que sente nunca dura, o que sente sempre acaba, e pode nunca mais voltar. Encarniça-se então sobre o momento, come-lhe o fogo, e o fogo doce arde, arde, flameja. Então, ela que sabe que tudo vai acabar, pega a mão livre do homem, e ao prendê-la nas suas, ela doce arde, arde, flameja. (Clarice Lispector, Os melhores contos [seleção Walnice Nogueira Galvão], 1996) * pequeno pedaço de madeira usado para lenha"},{"id":"oj-esc21-12","materia":"port","assunto":"Pronomes e referência","enunciado":"Em uma passagem do texto, o pronome é seguido do seu referente para evitar uma interpretação equivocada. Isso ocorre em:","alternativas":["Ela sabe, e não a toma. Quer a mão dele, sabe que quer...","... e ao prendê-la nas suas, ela doce arde, arde, flameja.","Ele, o homem, se ocupa do que ela nem sequer lhe agradece...","... ele por ele mesm as redes sociais “Cringe mesmo é fumar” assevera que","alternativas":["ser criança, jovem ou adolescente no mundo de hoje tem a vantagem de poder escolher opções saudáveis ao cigarro tradicional, como é o caso dos pods.","buscar uma vida saudável implica fazer escolhas e, nesse caso, o uso de cigarros eletrônicos é uma saída para crianças, jovens e adolescentes afastarem- -se do tabaco.","fumar está na contramão de uma vida saudável e, por essa razão, é importante que crianças, jovens e adolescentes evitem virar reposição de novos consumidores.","estar em sintonia com as orientações da OMS permite que crianças, jovens e adolescentes se tornem alvo de estratégias de venda da indústria do tabaco.","desenvolver a conscientização de crianças, jovens e adolescentes tem como finalidade torná-los cringes, perfil que se contrapõe às tendências das redes sociais."],"correta":2,"explicacao":"Gabarito oficial: C. O slogan afirma que fumar vai contra uma vida saudável; é preciso conscientizar os jovens.","origem":"prova","fonte":"Vunesp · TJSP · Escrevente Técnico Judiciário · 2021 · questão 19","texto":"O Dia Nacional de Combate ao Fumo (29 de agosto) foi criado em 1986, com o objetivo de reforçar as ações nacionais de conscientização sobre os danos sociais, de saúde, econômicos e ambientais causados pelo tabaco. A campanha promovida pelo Inca (Instituto Nacional de Câncer) este ano chama-se Comprometa-se a parar de fumar. O instituto lembra que o tabagismo é um fator de risco importante para a Covid-19, por isso parar de fumar se torna uma medida de proteção à saúde de todos os cidadãos.\n\nPeças criadas para redes sociais com a frase “Cringe mesmo é fumar” fazem parte da campanha. Os materiais desenvolvidos pelo Ministério da Saúde, em parceria com a Organização Pan-Americana de Saúde, destacam a importância de proteger a saúde de crianças, jovens e adolescentes, que são alvo de estratégias de venda para que possam se tornar um mercado repositor de novos consumidores, já que o consumo de tabaco mata mais da metade de seus usuários. Vale lembrar que os cigarros eletrônicos, ou pods, não são opções mais saudáveis ao cigarro tradicional. No Brasil, a comercialização desses dispositivos é proibida, já que não foi autorizada pela Agência Nacional de Vigilância Sanitária (Anvisa). Muitos países que liberaram sua venda estão revendo as suas posições depois de novas orientações da Organização Mundial da Saúde (OMS).\n\n(https://doutorjairo.uol.com.br)\n\nCringe: Para os integrantes da geração Z, é um adjetivo usado para classificar pessoas que fazem coisas fora de moda, ultrapassadas, cafonas mesmo. Eles também costumam classificar atitudes ou objetos. Nesse caso, ela é usada como sinônimo de vergonha alheia. (https://g1.globo.com)"},{"id":"oj-esc21-20","materia":"port","assunto":"Interpretação de texto","enunciado":"De acordo com as informações do 2o parágrafo, parar de fumar, no contexto da pandemia vivida no mundo, é uma ação de","alternativas":["medo, porque se juntas duas doenças de alto poder letal às pessoas.","empatia, porque envolve a preocupação com o coletivo social.","orgulho, porque reforça a determinação para superar o vício.","exibicionismo, porque as mortes pela Covid-19 não diminuirão.","respeito, porque devolve a autoestima para a maioria da população."],"correta":1,"explicacao":"Gabarito oficial: B. Parar de fumar na pandemia é empatia: preocupação com o coletivo.","origem":"prova","fonte":"Vunesp · TJSP · Escrevente Técnico Judiciário · 2021 · questão 20","texto":"O Dia Nacional de Combate ao Fumo (29 de agosto) foi criado em 1986, com o objetivo de reforçar as ações nacionais de conscientização sobre os danos sociais, de saúde, econômicos e ambientais causados pelo tabaco. A campanha promovida pelo Inca (Instituto Nacional de Câncer) este ano chama-se Comprometa-se a parar de fumar. O instituto lembra que o tabagismo é um fator de risco importante para a Covid-19, por isso parar de fumar se torna uma medida de proteção à saúde de todos os cidadãos.\n\nPeças criadas para redes sociais com a frase “Cringe mesmo é fumar” fazem parte da campanha. Os materiais desenvolvidos pelo Ministério da Saúde, em parceria com a Organização Pan-Americana de Saúde, destacam a importância de proteger a saúde de crianças, jovens e adolescentes, que são alvo de estratégias de venda para que possam se tornar um mercado repositor de novos consumidores, já que o consumo de tabaco mata mais da metade de seus usuários. Vale lembrar que os cigarros eletrônicos, ou pods, não são opções mais saudáveis ao cigarro tradicional. No Brasil, a comercialização desses dispositivos é proibida, já que não foi autorizada pela Agência Nacional de Vigilância Sanitária (Anvisa). Muitos países que liberaram sua venda estão revendo as suas posições depois de novas orientações da Organização Mundial da Saúde (OMS).\n\n(https://doutorjairo.uol.com.br)\n\nCringe: Para os integrantes da geração Z, é um adjetivo usado para classificar pessoas que fazem coisas fora de moda, ultrapassadas, cafonas mesmo. Eles também costumam classificar atitudes ou objetos. Nesse caso, ela é usada como sinônimo de vergonha alheia. (https://g1.globo.com)"},{"id":"oj-esc21-21","materia":"port","assunto":"Relações de sentido","enunciado":"Os materiais desenvolvidos pelo Ministério da Saúde, em parceria com a Organização Pan-Americana de Saúde, destacam a importância de proteger a saúde de crianças, jovens e adolescentes, que são alvo de estratégias de venda para que possam se tornar um mercado repositor de novos consumidores, já que o consumo de tabaco mata mais da metade de seus usuários. No trecho destacado do 3o parágrafo, há três orações que expressam, correta e respectivamente, sentidos de","alternativas":["explicação, finalidade e causa.","restrição, causa e consequência.","adição, comparação e consequência.","causa, consequência e causa.","explicação, finalidade e comparação."],"correta":0,"explicacao":"Gabarito oficial: A (explicação, finalidade
