":"mat","assunto":"Média","enunciado":"Despesas somam R$ 4.800 com média de R$ 600. O número de valores é:","alternativas":["4","6","8","10","12"],"correta":2,"explicacao":"4.800 ÷ 600 = 8. (Gabarito conferido pela Caderneta; o oficial não veio junto.)","origem":"prova","fonte":"Avança SP 2026 · Pref. Nova Odessa/SP · Fiscal de Obras e Posturas"},{"id":"r195","materia":"mat","assunto":"Porcentagem","enunciado":"V ou F: ( ) 84 é 15% de 560. ( ) 2% de 5 é 0,1. ( ) 7 é 10% de 77. ( ) 13 é 50% de 27.","alternativas":["V – F – F – F","V – V – F – F","F – V – V – V","F – F – F – V","F – V – V – F"],"correta":1,"explicacao":"15% de 560 = 84; 2% de 5 = 0,1; 10% de 77 = 7,7; 50% de 27 = 13,5. (Gabarito conferido pela Caderneta; o oficial não veio junto.)","origem":"prova","fonte":"Avança SP 2026 · Pref. Nova Odessa/SP · Fiscal de Obras e Posturas"},{"id":"r196","materia":"esp","assunto":"Informática","enunciado":"A sigla do endereço de um recurso na rede, como um site, é:","alternativas":["Desktop","Info","SSU","URL","UOL"],"correta":3,"explicacao":"URL: Uniform Resource Locator. (Gabarito conferido pela Caderneta; o oficial não veio junto.)","origem":"prova","fonte":"Avança SP 2026 · Pref. Nova Odessa/SP · Fiscal de Obras e Posturas"},{"id":"r197","materia":"esp","assunto":"Informática","enunciado":"Para atualizar uma Tabela Dinâmica do Excel após incluir novos dados na fonte:","alternativas":["fechar e reabrir o arquivo","Inserir > Atualizar Linhas","botão direito na tabela > Atualizar","excluir e recriar a tabela","colar os dados dentro da tabela"],"correta":2,"explicacao":"Também pelo atalho Alt+F5. (Gabarito conferido pela Caderneta; o oficial não veio junto.)","origem":"prova","fonte":"Avança SP 2026 · Pref. Nova Odessa/SP · Fiscal de Obras e Posturas"},{"id":"r198","materia":"esp","assunto":"Informática","enunciado":"A ______ do Windows é composta pela barra de tarefas e pelo plano de fundo onde se organizam os ícones.","alternativas":["área de trabalho","acessibilidade","fonte","captura","área de totalização"],"correta":0,"explicacao":"É a Área de Trabalho (desktop). (Gabarito conferido pela Caderneta; o oficial não veio junto.)","origem":"prova","fonte":"Avança SP 2026 · Pref. Nova Odessa/SP · Fiscal de Obras e Posturas"},{"id":"r199","materia":"esp","assunto":"Rotina do fiscal","enunciado":"Viola o princípio da legalidade o fiscal que:","alternativas":["cria uma proibição nova por conta própria, sem lei","multa empresa que desobedece lei vigente","autoriza obra que cumpre a lei","nega alvará por falta de certidão exigida em lei","interdita local perigoso com base no poder de polícia"],"correta":0,"explicacao":"O agente público só pode fazer o que a lei permite. (Gabarito conferido pela Caderneta; o oficial não veio junto.)","origem":"prova","fonte":"Avança SP 2026 · Pref. Nova Odessa/SP · Fiscal de Obras e Posturas"},{"id":"r200","materia":"esp","assunto":"Rotina do fiscal","enunciado":"A poluição sonora pode causar:","alternativas":["problemas respiratórios","contaminação de rios","aquecimento global","surdez temporária ou permanente","degradação do solo"],"correta":3,"explicacao":"Tema ligado ao sossego público do Código de Posturas. (Gabarito conferido pela Caderneta; o oficial não veio junto.)","origem":"prova","fonte":"Avança SP 2026 · Pref. Nova Odessa/SP · Fiscal de Obras e Posturas"},{"id":"r201","materia":"esp","assunto":"Outros temas de fiscalização","enunciado":"É ______ vender ou prometer vender parcela de loteamento ou desmembramento não registrado.","alternativas":["permitido","vedado","obrigatório","liberado","recomendado"],"correta":1,"explicacao":"Lei 6.766/1979, art. 37. (Gabarito conferido pela Caderneta; o oficial não veio junto.)","origem":"prova","fonte":"Avança SP 2026 · Pref. Nova Odessa/SP · Fiscal de Obras e Posturas","extra":true},{"id":"r202","materia":"esp","assunto":"Outros temas de fiscalização","enunciado":"A Licença de Instalação (LI) ambiental:","alternativas":["autoriza o início das operações","paralisa obras com falhas","aprova a viabilidade antes dos projetos","restringe o canteiro","autoriza a instalação do empreendimento conforme as especificações aprovadas"],"correta":4,"explicacao":"Sequência: Licença Prévia, de Instalação e de Operação. (Gabarito conferido pela Caderneta; o oficial não veio junto.)","origem":"prova","fonte":"Avança SP 2026 · Pref. Nova Odessa/SP · Fiscal de Obras e Posturas","extra":true},{"id":"r203","materia":"esp","assunto":"Outros temas de fiscalização","enunciado":"Pela Política Nacional de Resíduos Sólidos, o local contaminado pela disposição de substâncias ou resíduos é a:","alternativas":["área contaminada","jardim municipal","unidade de conservação","parque público","corredor ecológico"],"correta":0,"explicacao":"Lei 12.305/2010, art. 3º, II. (Gabarito conferido pela Caderneta; o oficial não veio junto.)","origem":"prova","fonte":"Avança SP 2026 · Pref. Nova Odessa/SP · Fiscal de Obras e Posturas","extra":true}],"notaExtra":"Questões de \"Outros temas de fiscalização\" caíram em provas de outras cidades, mas não estão no edital deste concurso. Elas ficam fora dos simulados.","maisQuestoes":{"antes":"O","nome":"Gran Questões","url":"https://questoes.grancursosonline.com.br/concursos/fiscal-de-posturas","depois":"deixa resolver provas de fiscal de posturas sem limite, no site deles."}},{"id":"oficial-justica-tjsp-2026","nome":"Oficial de Justiça","orgao":"Tribunal de Justiça de SP · 38ª CJ (Franca)","banca":"Vunesp","dataProva":"2027-03-14","horaProva":"13:00","duracaoMin":240,"notaMinima":50,"materias":[{"id":"port","nome":"Língua Portuguesa (Bloco I)","curto":"Português","qtd":15,"valor":1.0},{"id":"penal","nome":"Direito Penal","curto":"Penal","qtd":6,"valor":1.0},{"id":"ppenal","nome":"Direito Processual Penal","curto":"Proc. Penal","qtd":7,"valor":1.0},{"id":"pcivil","nome":"Direito Processual Civil","curto":"Proc. Civil","qtd":9,"valor":1.0},{"id":"const","nome":"Direito Constitucional","curto":"Constitucional","qtd":5,"valor":1.0},{"id":"adm","nome":"Direito Administrativo","curto":"Administrativo","qtd":4,"valor":1.0},{"id":"civil","nome":"Direito Civil","curto":"Civil","qtd":4,"valor":1.0},{"id":"legesp","nome":"Legislação Especial e Normas da Corregedoria","curto":"Leg. Especial","qtd":5,"valor":1.0},{"id":"atual","nome":"Atualidades e Estatuto da Pessoa com Deficiência","curto":"Atualidades","qtd":3,"valor":1.0},{"id":"mat","nome":"Matemática e Raciocínio Lógico","curto":"Mat. e Lógica","qtd":7,"valor":1.0},{"id":"info","nome":"Informática","curto":"Informática","qtd":5,"valor":1.0}],"aulas":[{"id":"a-oj-0","materia":"legesp","assunto":"Visão geral","titulo":"O concurso e a prova","cards":[{"t":"O cargo","b":"Oficial de Justiça do **TJSP**, banca **Vunesp**. Vencimento de **R$ 9.856,95**. Inscrições até **10/12/2026**. Prova em **14/03/2027**, à tarde. Franca integra a **38ª Circunscrição Judiciária (6ª RAJ)**, com Patrocínio Paulista e Pedregulho."},{"t":"A prova objetiva","b":"**70 questões** de 5 alternativas, todas com o mesmo peso. **Bloco I**: Português (15). **Bloco II**: Conhecimentos Específicos (40). **Bloco III**: Gerais (15: 3 de atualidades, 7 de matemática e raciocínio lógico, 5 de informática)."},{"t":"Como passa","b":"Nota de 0 a 10. É preciso acertar **50% do Bloco I e 50% do Bloco II** (eliminatórios) e tirar **nota 5 ou mais** no conjunto. O Bloco III só classifica."},{"t":"Discursiva","b":"No mesmo dia: **2 questões discursivas** sobre Conhecimentos Específicos. Tempo total: **5 horas** para objetiva + discursiva. Só tem a discursiva corrigida quem fica entre os mais bem classificados da objetiva."},{"t":"Onde focar","b":"O Bloco II vale 40 das 70 questões. Prioridade: **CPC** (atos do oficial, citação, intimação, penhora, avaliação), **CPP** (citação, prisão, busca), **crimes contra a Administração**, **Estatuto SP** e **Normas da Corregedoria**."}]},{"id":"a-oj-1","materia":"pcivil","assunto":"Oficial de justiça (art. 154)","titulo":"O oficial de justiça no CPC","cards":[{"t":"O que faz (art. 154)","b":"Faz **pessoalmente** citações, prisões, penhoras, arrestos e demais diligências, **sempre que possível com 2 testemunhas**, certificando lugar, dia e hora. Executa ordens do juiz, devolve o mandado ao cartório, ajuda a manter a ordem, **faz avaliações** e **certifica propostas de acordo**."},{"t":"Proposta de acordo","b":"Se uma parte propõe acordo durante a diligência, o oficial **certifica no mandado**. O juiz intima a outra parte para se manifestar em **5 dias**. **Silêncio = recusa** (art. 154, parágrafo único)."},{"t":"Responsabilidade (art. 155)","b":"Escrivão e oficial respondem **civil e regressivamente** quando, **sem justo motivo**, se recusam a cumprir no prazo os atos impostos, ou praticam **ato nulo com dolo ou culpa**."},{"t":"Quantos oficiais (art. 151)","b":"Em cada comarca, **no mínimo tantos oficiais quantos forem os juízos**."},{"t":"Depositário (arts. 159 a 161)","b":"Guarda bens penhorados, arrestados, sequestrados ou arrecadados. Responde por **dolo ou culpa**, perde a remuneração e tem direito ao que gastou. **Não existe prisão do depositário infiel** (Súmula Vinculante 25)."},{"t":"Atos executivos (art. 782)","b":"O oficial cumpre os atos executivos e pode atuar em **comarcas contíguas** de fácil comunicação e da **mesma região metropolitana**. O juiz requisita **força policial** quando necessário."}]},{"id":"a-oj-2","materia":"pcivil","assunto":"Tempo dos atos processuais (art. 212)","titulo":"Horário dos atos e prazos","cards":[{"t":"Horário (art. 212)","b":"Atos em **dias úteis, das 6h às 20h**. O ato iniciado antes pode terminar depois das 20h se o adiamento prejudicar a diligência ou causar grave dano."},{"t":"Exceção importante","b":"**Citações, intimações e penhoras** podem ser feitas nas férias, feriados e fora do horário **sem autorização judicial**, respeitado o art. 5º, XI, da CF (casa: sem consentimento, só de dia)."},{"t":"Feriados (art. 216)","b":"Para efeito forense, **sábados, domingos** e dias sem expediente forense são feriados."},{"t":"Contagem (arts. 219 e 220)","b":"Prazos em dias: **só dias úteis**. Prazos ficam **suspensos de 20/12 a 20/01**."},{"t":"Início do prazo (art. 231)","b":"Correio: **juntada do AR**. Oficial de justiça: **juntada do mandado cumprido**. Vários réus: a **última juntada**. Citação eletrônica: **5º dia útil** após a confirmação de recebimento."},{"t":"No processo penal é diferente","b":"CPP, art. 798: prazos **contínuos**, não se conta o dia do começo; terminando em domingo/feriado, prorroga para o dia útil seguinte. Art. 798-A: suspensão de 20/12 a 20/01, **salvo réu preso, Maria da Penha e medidas urgentes**."}]},{"id":"a-oj-3","materia":"pcivil","assunto":"Citação (arts. 238 a 240)","titulo":"Citação no CPC: regras gerais","cards":[{"t":"Conceito (art. 238)","b":"Ato que **convoca o réu, o executado ou o interessado** para integrar a relação processual. Deve ser feita em até **45 dias** da propositura."},{"t":"Indispensável (art. 239)","b":"Sem citação o processo não vale. O **comparecimento espontâneo supre** a falta ou nulidade; o prazo corre da data do comparecimento."},{"t":"Efeitos (art. 240)","b":"Citação válida, **mesmo por juízo incompetente**: induz **litispendência**, torna **litigiosa a coisa** e constitui **em mora** o devedor. A interrupção da prescrição **retroage à propositura**."},{"t":"Quem recebe (art. 242)","b":"Pessoal: réu, representante legal ou procurador. Ausente o citando, vale na pessoa do **mandatário, administrador, preposto ou gerente**, se a ação decorrer de atos deles. Locador ausente do país: o **administrador do imóvel** que recebe aluguéis."},{"t":"Onde (art. 243)","b":"Em **qualquer lugar** onde o réu esteja. **Militar** na ativa: na unidade onde serve, se não conhecida a residência ou nela não for encontrado."},{"t":"Quando NÃO citar (art. 244)","b":"Salvo para evitar perecimento do direito: quem está em **culto religioso**; parentes do morto no dia e nos **7 dias** seguintes; **noivos** nos **3 dias** após o casamento; **doente grave**. Incapaz mental (art. 245): o oficial **certifica minuciosamente** e o juiz nomeia médico."}]},{"id":"a-oj-4","materia":"pcivil","assunto":"Citação por hora certa (art. 252)","titulo":"Citação: modalidades, mandado, hora certa e edital","cards":[{"t":"Ordem das modalidades (art. 246)","b":"Preferência: **meio eletrônico** (em até 2 dias úteis). Sem confirmação em 3 dias úteis: **correio**, **oficial de justiça**, escrivão (se o citando vier ao cartório) ou **edital**."},{"t":"Correio não serve (art. 247)","b":"Ações de **estado**; citando **incapaz**; **pessoa de direito público**; local sem entrega domiciliar; autor que justificadamente pedir outra forma. Nesses casos, oficial de justiça (art. 249)."},{"t":"Como citar (art. 251)","b":"**Ler o mandado** e **entregar a contrafé**; certificar se recebeu ou recusou; obter a **nota de ciente** ou certificar que não a deu."},{"t":"Hora certa (arts. 252 e 253)","b":"**2 procuras** sem êxito + **suspeita de ocultação** → intimar pessoa da família (ou vizinho; em condomínio, o **porteiro** que recebe correspondência) de que voltará no **dia útil seguinte**, na hora marcada. Voltando, se o réu não estiver, **dá a citação por feita**, deixa a contrafé e adverte sobre o **curador especial**. Não precisa de novo despacho."},{"t":"Depois da hora certa (art. 254)","b":"O escrivão envia **carta, telegrama ou e-mail** ao réu em **10 dias** da juntada do mandado."},{"t":"Edital (arts. 256 a 258)","b":"Réu desconhecido/incerto ou lugar ignorado, incerto ou inacessível. Publicação na internet (site do tribunal e **plataforma do CNJ**). Prazo de **20 a 60 dias**. Quem pede edital com dolo paga multa de **5 salários mínimos**."}]},{"id":"a-oj-5","materia":"pcivil","assunto":"Intimações (arts. 269 a 275)","titulo":"Intimações no CPC","cards":[{"t":"Conceito (art. 269)","b":"Ato que dá **ciência** a alguém dos atos e termos do processo."},{"t":"Ordem","b":"Preferência pelo **meio eletrônico** (art. 270). Depois, **publicação** no órgão oficial (art. 272), **correio** ou o próprio escrivão (art. 274). O **oficial de justiça** entra quando os outros meios falharem (art. 275)."},{"t":"Endereço desatualizado (art. 274)","b":"Presumem-se **válidas** as intimações enviadas ao endereço dos autos se a mudança **não foi comunicada** ao juízo."},{"t":"Certidão do oficial (art. 275, § 1º)","b":"Deve ter: **lugar** e **descrição da pessoa** intimada (com número e órgão do documento, se possível); **entrega da contrafé**; **nota de ciente** ou certidão de que a pessoa não a apôs."},{"t":"Hora certa e edital","b":"Se necessário, a intimação também pode ser feita **com hora certa ou por edital** (art. 275, § 2º)."}]},{"id":"a-oj-6","materia":"pcivil","assunto":"Execução: citação e penhora (art. 829)","titulo":"Execução: citação, arresto e penhora","cards":[{"t":"Citação para pagar (art. 829)","b":"Executado tem **3 dias** para pagar. Do mandado já consta a ordem de **penhora e avaliação**, cumpridas pelo oficial **logo após o prazo**, com auto e intimação. Pagando em 3 dias, os honorários de 10% caem **pela metade** (art. 827)."},{"t":"Arresto (art. 830)","b":"Não encontrou o executado? **Arresta** bens suficientes. Nos **10 dias** seguintes, procura-o **2 vezes em dias distintos**; havendo suspeita de ocultação, cita **por hora certa**. Feita a citação e passado o prazo, o arresto **vira penhora**."},{"t":"Impenhoráveis (art. 833)","b":"Móveis da residência (salvo de elevado valor), roupas, **salários**, instrumentos de profissão, **seguro de vida**, pequena propriedade rural trabalhada pela família, **poupança até 40 salários mínimos**, fundo partidário. Não vale contra dívida do próprio bem; salário e poupança podem ser penhorados para **alimentos**."},{"t":"Ordem (art. 835)","b":"**Dinheiro** (prioritário) → títulos públicos → títulos e valores mobiliários → **veículos** → **imóveis** → móveis → semoventes → navios e aeronaves → ações e quotas → faturamento → pedras e metais preciosos → direitos."},{"t":"Penhora inútil (art. 836)","b":"Se tudo será consumido pelas custas, não se penhora. O oficial **descreve na certidão** os bens da residência ou do estabelecimento; o executado fica como depositário provisório."},{"t":"Auto e depósito (arts. 838 a 840)","b":"Penhora = **apreensão + depósito**; um só auto se tudo terminar no mesmo dia. Dinheiro e joias: **banco oficial**. Móveis e imóveis urbanos: **depositário judicial** (na falta, o exequente). Imóveis rurais e máquinas agrícolas: **com o executado**, mediante caução."}]},{"id":"a-oj-7","materia":"pcivil","assunto":"Arrombamento (art. 846)","titulo":"Penhora: intimação, arrombamento e avaliação","cards":[{"t":"Intimação (arts. 841 e 842)","b":"Feita a penhora, intima-se o executado (pelo advogado; sem advogado, pessoalmente, de preferência por correio). Se a penhora foi feita **na presença dele**, já está intimado. Imóvel: intima-se também o **cônjuge**, salvo separação absoluta."},{"t":"Onde penhorar (art. 845)","b":"Onde estiverem os bens, **mesmo com terceiros**. Imóveis e veículos com certidão: por **termo nos autos**. Bens em outra comarca: **carta**."},{"t":"Portas fechadas (art. 846)","b":"O oficial **comunica ao juiz** e pede ordem de arrombamento. Deferida, **2 oficiais** cumprem, arrombam cômodos e móveis e lavram **auto circunstanciado com 2 testemunhas**. Força policial se necessário. Auto em **duplicata**: uma via ao escrivão, outra à autoridade policial (desobediência ou resistência)."},{"t":"Avaliação (arts. 870 a 872)","b":"Feita pelo **oficial de justiça**. Se exigir conhecimento técnico e o valor comportar, o juiz nomeia **avaliador** (laudo em até 10 dias). Laudo indica **bens, características, estado e valor**."},{"t":"Dispensa e nova avaliação (arts. 871 e 873)","b":"Dispensa: uma parte aceita a estimativa da outra; bens com cotação em bolsa; títulos; **veículos com preço médio conhecido**. Nova avaliação: **erro ou dolo** do avaliador, mudança posterior do valor ou **fundada dúvida**."},{"t":"Outros mandados","b":"**Busca e apreensão** no cumprimento de obrigação de fazer: **2 oficiais**, com as regras do arrombamento (art. 536, § 2º). Entrega de coisa: busca e apreensão (móvel) ou **imissão na posse** (imóvel) (arts. 538 e 806). Possessórias: mandado de **manutenção ou reintegração** (art. 563)."}]},{"id":"a-oj-8","materia":"ppenal","assunto":"Citação no processo penal","titulo":"Citação e intimação no CPP e no JECrim","cards":[{"t":"Por mandado (arts. 351 e 352)","b":"Réu no território do juiz: **mandado**. Fora: **carta precatória** (art. 353). No estrangeiro em lugar sabido: **carta rogatória**, suspendendo a prescrição."},{"t":"Requisitos (art. 357)","b":"**Leitura do mandado** e **entrega da contrafé** (com dia e hora); certidão da entrega e da **aceitação ou recusa**."},{"t":"Casos especiais (arts. 358 a 360)","b":"**Militar**: por intermédio do **chefe do serviço**. **Funcionário público**: notifica-se **ele e o chefe da repartição**. **Preso**: citado **pessoalmente**."},{"t":"Edital e hora certa (arts. 361 a 363)","b":"Não encontrado: **edital de 15 dias**. Se **se oculta**: o oficial certifica e faz **hora certa** (regras do CPC); se o réu não aparecer, recebe **defensor dativo**."},{"t":"Intimações (arts. 370 a 372)","b":"Mesmas regras da citação. Defensor **constituído**: por **publicação**, com o nome do acusado. **MP e defensor nomeado**: intimação **pessoal**."},{"t":"JECrim (Lei 9.099, arts. 66 a 68)","b":"Citação **pessoal**, no Juizado ou por mandado. **Não há edital**: réu não encontrado → peças vão ao **juízo comum**. Intimação por correspondência com AR, por oficial de justiça (sem precatória) ou qualquer meio idôneo. Deve constar a necessidade de vir **com advogado**."}]},{"id":"a-oj-9","materia":"ppenal","assunto":"Prisão (arts. 283 e 284)","titulo":"Prisão, flagrante e busca","cards":[{"t":"Quando prender (art. 283)","b":"Só em **flagrante** ou por **ordem escrita e fundamentada** do juiz. **Qualquer dia e hora**, respeitada a inviolabilidade do domicílio. **Força** só se indispensável (resistência ou fuga)."},{"t":"Mandado (arts. 285 e 286)","b":"Lavrado pelo escrivão e assinado pela autoridade; identifica a pessoa, a infração e a fiança. Em **duplicata**: uma via fica com o preso (dia, hora e lugar); ele assina recibo na outra. Recusa: **2 testemunhas**."},{"t":"Réu escondido em casa (art. 293)","b":"Intimar o morador a entregá-lo. **De dia**: 2 testemunhas e entrada à força. **À noite**: cercar a casa, torná-la incomunicável e **arrombar ao amanhecer**."},{"t":"Flagrante (arts. 301 a 303)","b":"Está cometendo; acabou de cometer; **perseguido logo após**; **encontrado logo depois** com objetos que façam presumir a autoria. Crime permanente: flagrante enquanto durar."},{"t":"Busca domiciliar (arts. 243 e 245)","b":"Mandado indica a casa e o morador, o motivo e os fins. **De dia** (à noite só com consentimento). Antes de entrar, **mostrar e ler o mandado**. Desobediência: arromba. Ausentes os moradores, chama-se um **vizinho**. Auto com **2 testemunhas**."},{"t":"Busca pessoal (arts. 244 e 249)","b":"Independe de mandado em caso de prisão ou fundada suspeita. **Mulher é revistada por mulher**, se não atrasar a diligência."}]},{"id":"a-oj-10","materia":"ppenal","assunto":"Testemunhas (arts. 202 a 225)","titulo":"Testemunhas, júri, nulidades e HC","cards":[{"t":"Testemunhas (arts. 202 a 204)","b":"**Toda pessoa** pode ser testemunha. Depoimento **oral**, sem trazer por escrito (pode consultar breves apontamentos)."},{"t":"Falta da testemunha (art. 218)","b":"Regularmente intimada e sem motivo justificado: **condução coercitiva**."},{"t":"Depoimento antecipado (art. 225)","b":"Testemunha que vai se ausentar ou que, por **enfermidade ou velhice**, pode não estar viva na instrução."},{"t":"Júri (arts. 436 a 446)","b":"Jurado: maior de **18 anos** e de notória idoneidade. Serviço **obrigatório**. Sorteados são convocados **pelo correio ou outro meio hábil** (art. 434)."},{"t":"Nulidades (arts. 563 e 570)","b":"Sem **prejuízo**, não há nulidade. Falta ou nulidade de citação/intimação fica **sanada** se o interessado comparece antes de o ato se consumar, ainda que só para alegá-la."},{"t":"Habeas corpus (arts. 647 a 654)","b":"Cabe contra violência ou coação ilegal à **liberdade de locomoção**. Pode ser impetrado por **qualquer pessoa**, a favor de si ou de outro, e pelo MP."}]},{"id":"a-oj-11","materia":"penal","assunto":"Aplicação da lei penal (arts. 1º a 4º)","titulo":"Direito Penal: parte geral do edital","cards":[{"t":"Lei penal no tempo (arts. 1º a 4º)","b":"**Não há crime sem lei anterior**. Lei mais benéfica **retroage**, até depois do trânsito em julgado. Lei excepcional ou temporária é **ultra-ativa**. Tempo do crime: **momento da ação ou omissão**."},{"t":"Lugar e território (arts. 5º a 7º)","b":"Lugar do crime: **ubiquidade** (ação ou resultado). Territorialidade com exceções de extraterritorialidade."},{"t":"Contagem (arts. 10 e 11)","b":"No prazo **penal** o dia do começo **conta**. Desprezam-se frações de dia nas penas."},{"t":"Ação penal (arts. 100 a 106)","b":"Regra: **pública**. Representação é **irretratável depois da denúncia**. Decadência: **6 meses** do dia em que se soube quem é o autor."},{"t":"Extinção da punibilidade (art. 107)","b":"Morte do agente; anistia, graça e indulto; abolitio criminis; **prescrição, decadência e perempção**; renúncia ou perdão aceito; retratação; perdão judicial."},{"t":"Prescrição (art. 115)","b":"Prazo **cai pela metade** se o agente tinha **menos de 21** anos no crime ou **mais de 70** na sentença."}]},{"id":"a-oj-12","materia":"penal","assunto":"Crimes contra a Administração","titulo":"Crimes que caem para oficial de justiça","cards":[{"t":"Violação de domicílio (art. 150)","b":"Não é crime entrar **de dia**, com as formalidades legais, para **prisão ou outra diligência**, nem a **qualquer hora** se há crime acontecendo. \"Casa\" inclui quarto de hotel ocupado e escritório fechado ao público; não inclui bar ou casa de jogo."},{"t":"Funcionário público (art. 327)","b":"Quem exerce cargo, emprego ou função pública, **mesmo transitoriamente ou sem remuneração**. Equiparados: paraestatais e empresas contratadas para atividade típica."},{"t":"Os verbos que diferenciam","b":"**Exigir** = concussão (316). **Solicitar/receber** = corrupção passiva (317). **Oferecer/prometer** = corrupção ativa (333). Retardar ato **por interesse pessoal** = prevaricação (319). **Por indulgência**, não punir subordinado = condescendência (320). **Patrocinar interesse privado** = advocacia administrativa (321)."},{"t":"Peculato (art. 312)","b":"Apropriar-se ou desviar bem de que tem a posse em razão do cargo. Existe **culposo**: reparar o dano **antes da sentença irrecorrível extingue** a punibilidade; depois, **reduz pela metade**."},{"t":"Contra o oficial na diligência","b":"**Resistência** (329): opor-se com **violência ou ameaça**; se o ato não se executa, reclusão de 1 a 3 anos. **Desobediência** (330): descumprir ordem legal, sem violência. **Desacato** (331): ofender o funcionário em razão da função."},{"t":"Administração da Justiça","b":"Rasgar edital ou violar selo (336). Denunciação caluniosa (339). Autoacusação falsa (341). **Falso testemunho** (342). Tirar coisa própria em poder de terceiro por ordem judicial (346). **Fraude processual** (347). **Exploração de prestígio** (357). Desobediência a decisão sobre perda de direito (359)."}]},{"id":"a-oj-13","materia":"const","assunto":"Direitos e garantias (art. 5º)","titulo":"Constitucional: o que o edital pede","cards":[{"t":"Arts. 1º a 4º","b":"Fundamentos: **soberania, cidadania, dignidade, valores sociais do trabalho e da livre iniciativa, pluralismo político**. Objetivos (art. 3º) usam verbos: construir, garantir, erradicar, promover. Relações internacionais: art. 4º."},{"t":"Art. 5º no dia a dia do oficial","b":"**Casa** é asilo inviolável: sem consentimento, só em **flagrante, desastre, socorro** ou, **de dia**, por **ordem judicial**. Prisão só em flagrante ou por ordem escrita e fundamentada. Prisão civil só do **devedor de alimentos**."},{"t":"Arts. 12 a 16","b":"Nacionalidade (natos e naturalizados; cargos privativos de nato). Direitos políticos: voto obrigatório dos 18 aos 70; facultativo para analfabetos, maiores de 70 e de 16 a 18."},{"t":"Arts. 37 a 41","b":"Princípios **LIMPE**. Concurso válido por **até 2 anos**, prorrogável **uma vez**. Estabilidade após **3 anos** + **avaliação especial**. Perda do cargo: sentença transitada, processo administrativo, avaliação periódica."},{"t":"Arts. 92 a 99","b":"Garantias dos juízes: **vitaliciedade** (2 anos no 1º grau), **inamovibilidade**, **irredutibilidade**. Vedações e **quarentena de 3 anos**. Juizados especiais e justiça de paz (art. 98)."},{"t":"Arts. 125, 127 e 134","b":"Justiça estadual: competência na Constituição do Estado; lei de organização judiciária de iniciativa do **TJ**. **MP**: defesa da ordem jurídica e dos interesses indisponíveis. **Defensoria**: defesa dos necessitados."}]},{"id":"a-oj-14","materia":"adm","assunto":"Estatuto SP","titulo":"Administrativo: Estatuto SP e improbidade","cards":[{"t":"Conceitos (arts. 1º, 3º e 4º)","b":"Funcionário público: pessoa **legalmente investida em cargo público**. Cargo: conjunto de **atribuições e responsabilidades** cometidas a um funcionário."},{"t":"Provimento e vida funcional","b":"O edital cita os arts. 11, 13, 14, 46, 47, 57, 78, 110, 120, 127 e 176. Caem em prova: formas de provimento, **reintegração** (volta por decisão judicial transitada, com ressarcimento), **posse e exercício** (quem não entra em exercício no prazo é **exonerado**) e **afastamentos** (competição oficial pelo país: sem prejuízo do vencimento)."},{"t":"Deveres e proibições (arts. 241 a 243)","b":"Deveres: **assiduidade, pontualidade, urbanidade, sigilo**, representar contra irregularidades. Proibido: listas de donativos na repartição; gerência de empresas que contratam com o Estado; atividades estranhas ao serviço no expediente."},{"t":"Penas (art. 251)","b":"**Repreensão, suspensão, multa, demissão, demissão a bem do serviço público, cassação de aposentadoria ou disponibilidade.** No Estatuto paulista não existe \"advertência\"."},{"t":"Improbidade: art. 9º","b":"**Enriquecimento ilícito** com **dolo**: receber vantagem de quem tem interesse em ato do agente, adquirir bens incompatíveis com a renda etc."},{"t":"Improbidade: art. 13","b":"Posse e exercício dependem da entrega da **declaração de imposto de renda**, atualizada **anualmente** e na saída. Recusar ou declarar falso: **demissão**."}]},{"id":"a-oj-15","materia":"civil","assunto":"Personalidade e capacidade (arts. 1º a 5º)","titulo":"Direito Civil e LINDB","cards":[{"t":"Pessoa natural (arts. 1º a 10)","b":"Personalidade começa no **nascimento com vida** (nascituro protegido). **Absolutamente incapaz: menor de 16**. Relativos: 16 a 18, ébrios habituais, viciados, quem não pode exprimir vontade, pródigos. Emancipação: pais, casamento, emprego público efetivo, colação de grau, economia própria. **Comoriência**: mortes simultâneas."},{"t":"Ausência e personalidade (arts. 11 a 25)","b":"Direitos da personalidade: **intransmissíveis e irrenunciáveis**. Ausência: juiz declara e nomeia **curador** (cônjuge, salvo separado há mais de 2 anos)."},{"t":"Pessoas jurídicas (arts. 40 a 62)","b":"Direito público interno: União, Estados, DF, Municípios, **autarquias**. Existência da privada começa com o **registro**. Desconsideração: **desvio de finalidade ou confusão patrimonial**."},{"t":"Domicílio (arts. 70 a 78)","b":"Residência com **ânimo definitivo**. Várias residências: qualquer delas. Sem residência: **onde for encontrado**. Necessário: incapaz, **servidor**, militar, marítimo, **preso**."},{"t":"Bens (arts. 79 a 103)","b":"Imóveis por lei: direitos reais sobre imóveis e **sucessão aberta**. Móveis por lei: **energias**, direitos pessoais patrimoniais. Benfeitorias: necessárias, úteis, voluptuárias. Bens públicos: uso comum, especial e **dominicais**; **não sofrem usucapião**."},{"t":"Negócio jurídico, prescrição e LINDB","b":"**Nulo**: absolutamente incapaz, objeto ilícito, simulação. **Anulável** (4 anos): erro, dolo, coação, estado de perigo, lesão, fraude. Prescrição geral **10 anos**; reparação civil **3**; alimentos **2**. Decadência legal: juiz conhece **de ofício**. LINDB: vigência em **45 dias**; omissão: analogia, costumes, princípios."},{"t":"Mandato, posse e garantias","b":"Mandato geral só dá poderes de **administração**; alienar e hipotecar exige **poderes especiais e expressos**. Posse justa: **não violenta, clandestina ou precária**. Penhor: posse da coisa móvel com o credor (no rural, industrial e de veículos, fica com o devedor)."}]},{"id":"a-oj-16","materia":"legesp","assunto":"Lei 6.830/80 (execução fiscal)","titulo":"Legislação especial","cards":[{"t":"Execução fiscal (Lei 6.830/80)","b":"Cobra a **Dívida Ativa** (tributária e não tributária) da União, Estados, DF, Municípios e autarquias. Despacho inicial = ordem de **citação, penhora, arresto, registro e avaliação** (art. 7º)."},{"t":"Citação na LEF (art. 8º)","b":"Prazo de **5 dias** para pagar ou garantir. Regra: **correio com AR**. AR não voltou em 15 dias: **oficial ou edital** (30 dias; 60 se o executado estiver fora do país). O despacho que ordena a citação **interrompe a prescrição**."},{"t":"Penhora e prazo do oficial (arts. 11 e 37)","b":"Ordem: dinheiro → títulos com cotação → **pedras e metais** → imóveis → navios e aeronaves → veículos → móveis → direitos. O oficial cumpre as diligências em **10 dias**, salvo força maior justificada."},{"t":"Resolução CNJ 354/2020","b":"Permite cumprir citação e intimação **por meio eletrônico** (inclusive aplicativos de mensagem), pela **secretaria ou pelo oficial**, com comprovante ou **certidão detalhada** de como o destinatário foi identificado. Mensagem de **voz**, só em caso de ocultação."},{"t":"Lei 11.608/2003 (taxa judiciária)","b":"Taxa pela prestação de serviços forenses, devida nas ações, execuções, cautelares, jurisdição voluntária e recursos. **Isentos**: União, Estado, Município, autarquias, fundações e **Ministério Público**. As **despesas de diligência do oficial** são cobradas à parte."},{"t":"Normas da Corregedoria (NSCGJ)","b":"O edital cita trechos do **Tomo I** (caps. I, III, IV, VII, X e XI), com destaque para o **Capítulo VII (arts. 994 a 1.091-A)**. Leia direto no portal do TJSP (Corregedoria > Normas Judiciais). Questões reais deste app trazem regras sobre mandados, correições e consulta processual."}]},{"id":"a-oj-17","materia":"atual","assunto":"Estatuto da Pessoa com Deficiência","titulo":"Conhecimentos gerais","cards":[{"t":"Estatuto da Pessoa com Deficiência","b":"Deficiência: **impedimento de longo prazo** (físico, mental, intelectual ou sensorial) que, com **uma ou mais barreiras**, obstrui a participação. Avaliação **biopsicossocial**, por equipe multiprofissional."},{"t":"Capacidade (arts. 6º e 84 a 86)","b":"A deficiência **não afeta a plena capacidade civil** (casar, ter filhos, adotar). Curatela é **extraordinária** e atinge só atos **patrimoniais e negociais**. Existe a **tomada de decisão apoiada**."},{"t":"Prioridade e acesso à justiça (arts. 9º, 79 e 80)","b":"Atendimento prioritário, inclusive na **tramitação processual**. Tecnologia assistiva para quem atua no processo (parte, testemunha, advogado, juiz)."},{"t":"Trabalho (arts. 34 a 38)","b":"Vedada discriminação em **todas as etapas** (seleção, exames, ascensão). Banca de concurso deve seguir o Estatuto."},{"t":"Atualidades","b":"Fatos **a partir do 1º semestre de 2026**. Leia um resumo semanal de notícias (política, economia, ciência, internacional). As questões de 2025 do app servem para treinar o formato da Vunesp."},{"t":"Informática e matemática","b":"Windows 10+, Word, Excel, Teams, OneDrive, e-mail e internet. Matemática: porcentagem, regra de três, juros simples, MMC/MDC, geometria. Lógico: negação, equivalência, sequências."}]},{"id":"a-oj-18","materia":"port","assunto":"Interpretação de texto","titulo":"Português da Vunesp","cards":[{"t":"Como a Vunesp cobra","b":"Textos jornalísticos e crônicas. Perguntas de **interpretação**, **sinônimos no contexto**, **conectivos**, **concordância, regência, crase, colocação pronominal e pontuação**. As questões reais do app trazem o texto completo."},{"t":"Crase em 10 segundos","b":"Troque a palavra feminina por uma masculina: se aparecer \"**ao**\", tem crase. Nunca antes de **verbo**, palavra **masculina**, **\"uma\"** ou pronomes como \"todos\", \"ela\"."},{"t":"Verbos impessoais","b":"\"**Haver**\" (existir) e \"**fazer**\" (tempo) ficam no **singular**: \"Houve problemas\", \"Faz dois anos\", \"Deve haver bens\"."},{"t":"Colocação pronominal","b":"Palavras que **atraem** o pronome: **não, nunca, jamais**, que, quando, se, pronomes indefinidos. Não comece frase com pronome oblíquo (\"Me disseram\" → \"Disseram-me\"). Futuro: **mesóclise** (\"lembrar-se-ão\")."},{"t":"Vírgula","b":"**Nunca** entre sujeito e verbo. Isola oração explicativa, aposto, vocativo e adjunto adverbial deslocado."}]}],"questoes":[{"id":"oj-esc25-01","materia":"port","assunto":"Interpretação de texto","enunciado":"Com as informações do texto, conclui-se corretamente que Stephen Hawking","alternativas":["é celebrado pela sua colaboração para a ciência e para a matemática.","é considerado um professor renomado devido a seu carisma e carinho.","teve um papel insignificante no desenvolvimento da ciência e da matemática.","contribuiu para Stephen Toope tornar-se um renomado professor.","foi incapaz de garantir mais popularidade à ciência e à matemática."],"correta":0,"explicacao":"Gabarito oficial: A. O texto destaca o legado de Hawking para a ciência e a matemática; as demais alternativas contradizem o texto.","origem":"prova","fonte":"Vunesp · TJSP · Escrevente Técnico Judiciário · 2025 · questão 1","texto":"A Universidade de Cambridge, onde Stephen Hawking realizou boa parte de suas contribuições, enfatizou que ele era uma “inspiração para milhões” de pessoas e deixa ao mundo “um legado indelével”. Em um comunicado, Stephen Toope, vice-reitor dessa instituição acadêmica, disse que o renomado professor era um “indivíduo único”, que será lembrado com “calor e carinho”, não só na universidade, mas também em todo o mundo. “Suas contribuições excepcionais para o conhecimento científico e a popularidade da ciência e da matemática deixaram um legado indelével”, afirmou a academia da universidade. (https://www.estadao.com.br/ciencia, 14.03.2018. Adaptado)"},{"id":"oj-esc25-02","materia":"port","assunto":"Crase e regência","enunciado":"A Universidade de Cambridge, ____ Stephen Hawking dedicou boa parte de suas contribuições, considera o renomado professor como uma inspiração ____, ____ quais deixa um legado indelével. De acordo com a norma-padrão, as lacunas da frase devem ser preenchidas, respectivamente, com:","alternativas":["a qual … à pessoas em geral … as","à qual … a milhões de pessoas … às","à que … às pessoas do mundo … as","à qual … à muitas pessoas … às","a qual … as muitas pessoas … às"],"correta":1,"explicacao":"Gabarito oficial: B. \"Dedicar-se a\" + \"a qual\" = \"à qual\"; \"inspiração a milhões\" (sem crase antes de numeral/plural masculino); \"às quais\" (deixa legado às pessoas).","origem":"prova","fonte":"Vunesp · TJSP · Escrevente Técnico Judiciário · 2025 · questão 2","texto":"A Universidade de Cambridge, onde Stephen Hawking realizou boa parte de suas contribuições, enfatizou que ele era uma “inspiração para milhões” de pessoas e deixa ao mundo “um legado indelével”. Em um comunicado, Stephen Toope, vice-reitor dessa instituição acadêmica, disse que o renomado professor era um “indivíduo único”, que será lembrado com “calor e carinho”, não só na universidade, mas também em todo o mundo. “Suas contribuições excepcionais para o conhecimento científico e a popularidade da ciência e da matemática deixaram um legado indelével”, afirmou a academia da universidade. (https://www.estadao.com.br/ciencia, 14.03.2018. Adaptado)"},{"id":"oj-esc25-03","materia":"port","assunto":"Sinônimos","enunciado":"Na frase do 2o parágrafo “Suas contribuições excepcionais para o conhecimento científico e a popularidade da ciência e da matemática deixaram um legado indelével”..., os termos destacados significam, correta e respectivamente:","alternativas":["brilhantes; permanente.","relevantes; efêmero.","prescindíveis; raro.","excelentes; transitório.","profícuas; transformador."],"correta":0,"explicacao":"Gabarito oficial: A. \"Excepcionais\" = brilhantes, fora do comum; \"indelével\" = que não se apaga, permanente.","origem":"prova","fonte":"Vunesp · TJSP · Escrevente Técnico Judiciário · 2025 · questão 3","texto":"A Universidade de Cambridge, onde Stephen Hawking realizou boa parte de suas contribuições, enfatizou que ele era uma “inspiração para milhões” de pessoas e deixa ao mundo “um legado indelével”. Em um comunicado, Stephen Toope, vice-reitor dessa instituição acadêmica, disse que o renomado professor era um “indivíduo único”, que será lembrado com “calor e carinho”, não só na universidade, mas também em todo o mundo. “Suas contribuições excepcionais para o conhecimento científico e a popularidade da ciência e da matemática deixaram um legado indelével”, afirmou a academia da universidade. (https://www.estadao.com.br/ciencia, 14.03.2018. Adaptado)"},{"id":"oj-esc25-04","materia":"port","assunto":"Concordância, regência e colocação","enunciado":"Assinale a alternativa que atende à norma-padrão de concordância verbal, de regência e de colocação pronominal.","alternativas":["A universidade e o mundo todo lembrarão de Stephen Hawking, o que é coerente ao seu perfil inspirador.","Se lembrará a universidade e o mundo todo de Stephen Hawking, o que é coerente perante o seu perfil inspirador.","A universidade e o mundo todo lembrar-se-ão de Stephen Hawking, o que é coerente com o seu perfil inspirador.","Lembrarão-se de Stephen Hawking a universidade e o mundo todo, o que é coerente sobre o seu perfil inspirador.","A universidade e o mundo todo se lembrará de Stephen Hawking, o que é coerente do seu perfil inspirador."],"correta":2,"explicacao":"Gabarito oficial: C. Sujeito composto anteposto leva o verbo ao plural; \"lembrar-se de\"; mesóclise no futuro (lembrar-se-ão); \"coerente com\".","origem":"prova","fonte":"Vunesp · TJSP · Escrevente Técnico Judiciário · 2025 · questão 4","texto":"A Universidade de Cambridge, onde Stephen Hawking realizou boa parte de suas contribuições, enfatizou que ele era uma “inspiração para milhões” de pessoas e deixa ao mundo “um legado indelével”. Em um comunicado, Stephen Toope, vice-reitor dessa instituição acadêmica, disse que o renomado professor era um “indivíduo único”, que será lembrado com “calor e carinho”, não só na universidade, mas também em todo o mundo. “Suas contribuições excepcionais para o conhecimento científico e a popularidade da ciência e da matemática deixaram um legado indelével”, afirmou a academia da universidade. (https://www.estadao.com.br/ciencia, 14.03.2018. Adaptado)"},{"id":"oj-esc25-05","materia":"port","assunto":"Pontuação e pronomes","enunciado":"Assinale a alternativa que atende à norma-padrão de pontuação e de emprego de pronome.","alternativas":["Stephen Hawking contribuiu muito com a Univer sidade de Cambridge e era, uma inspiração para milhões de pessoas, deixando-as um legado indelével.","Stephen Hawking que contribuiu muito com a Universidade de Cambridge, era uma inspiração para milhões de pessoas, deixando-lhes um legado indelével.","Stephen Hawking, contribuiu muito com a Univer sidade de Cambridge, e era uma inspiração para milhões de pessoas, deixando-as um legado indelével.","Stephen Hawking, que contribuiu muito com a Universidade de Cambridge, era uma inspiração para milhões de pessoas, deixando-lhes um legado indelével.","Stephen Hawking contribuiu muito com a Universidade de Cambridge e era uma inspiração para milhões de pessoas, deixando-nas um legado indelével."],"correta":3,"explicacao":"Gabarito oficial: D. Oração adjetiva explicativa entre vírgulas; \"deixar algo a alguém\" pede objeto indireto: \"deixando-lhes\".","origem":"prova","fonte":"Vunesp · TJSP · Escrevente Técnico Judiciário · 2025 · questão 5","texto":"A Universidade de Cambridge, onde Stephen Hawking realizou boa parte de suas contribuições, enfatizou que ele era uma “inspiração para milhões” de pessoas e deixa ao mundo “um legado indelével”. Em um comunicado, Stephen Toope, vice-reitor dessa instituição acadêmica, disse que o renomado professor era um “indivíduo único”, que será lembrado com “calor e carinho”, não só na universidade, mas também em todo o mundo. “Suas contribuições excepcionais para o conhecimento científico e a popularidade da ciência e da matemática deixaram um legado indelével”, afirmou a academia da universidade. (https://www.estadao.com.br/ciencia, 14.03.2018. Adaptado)"},{"id":"oj-esc25-06","materia":"port","assunto":"Interpretação de texto","enunciado":"As informações do editorial permitem inferir corretamente que","alternativas":["as autoridades governamentais vêm demonstrando certa fragilidade no combate à violência contra a mulher, razão pela qual os dados confirmam a presença do feminicídio de forma tão intensa.","o fato de a questão da violência contra as mulheres ser uma responsabilidade da gestão pública significa que o tema deva deixar de ser tratado como algo também da esfera da moral e particular.","a criação da Lei do Feminicídio, em 2015, foi um marco relevante no combate à violência contra a mulher, e, desde então, os estudos comprovam que não houve uma escalada dos casos.","a realização do Agosto Lilás coincidiu com a divulgação do Mapa Nacional da Violência de Gênero, que comprova que as Leis Maria da Penha e do Feminicídio obtiveram êxito além do esperado.","os problemas relativos ao combate à violência contra a mulher interessam a um grupo específico da sociedade, então, as autoridades governamentais desconhecem as necessidades desse grupo."],"correta":0,"explicacao":"Gabarito oficial: A. O editorial aponta falha nos mecanismos de proteção e números altos, o que permite inferir fragilidade no combate.","origem":"prova","fonte":"Vunesp · TJSP · Escrevente Técnico Judiciário · 2025 · questão 6","texto":"Epidemia de violência de gênero tem de ser contida Com a realização do Agosto Lilás, o Brasil dedicou um mês para desenvolver campanhas de conscientização e combate à violência contra a mulher, celebrando a Lei Maria da Penha. Mas, infelizmente, a realidade cruel que envolve esse tipo de crime se mostra implacável e, em meio aos eventos, a divulgação do Mapa Nacional da Violência de Gênero comprova que ainda há muito a ser feito. Divulgados na última semana, números organizados a partir de dados extraídos do Ministério da Justiça e Segu rança Pública revelam que o país apresentou média de quatro feminicídios e 187 estupros de mulheres por dia no primeiro semestre de 2025. O levantamento detalha, ainda, que 718 mulheres morreram em razão do gênero de janeiro a junho deste ano, conforme os registros de ocorrências. O bárbaro diagnóstico expõe a falha nos mecanismos de proteção e escancara a gravidade desse contexto. Um recorte mais amplo mostra que, desde a criação da Lei do Feminicídio, em 2015, o Brasil contabilizou 12.380 vítimas desse crime, e a média de quatro homicídios por dia se repete há cinco anos. Esse roteiro de horror permanente precisa ser interrompido. É urgente que sejam adotadas medidas para melhorar a articulação para o enfrentamento da violência de gênero. As estatísticas assustadoras não podem ser consideradas de interesse apenas da parcela da população que diariamente está na mira dos abusos domésticos e dos ataques nas ruas. E o tema não pode continuar sendo tratado como algo da esfera da moral e particular. Acabar com a violência contra as mulheres é uma responsabilidade da gestão pública e precisa ser encarada como prioridade.\n\nA sociedade brasileira não pode aceitar que o país se transforme, cada vez mais, em um território de perigo para meninas e mulheres. Essa epidemia de violência precisa ser contida, e o Estado, o Judiciário e as forças de segurança, especialmente as polícias especializadas, têm que executar ações de forma conjunta diante do quadro alarmante. O abuso sexual, a morte e a agressão por gênero não podem fazer parte do cotidiano nacional. As políticas públicas precisam amparar as mulheres presas em relacionamentos violentos, oferecendo a elas a certeza de que há caminho longe desse horror. (Editorial. https://www.correiobraziliense.com.br/opiniao, 01.09.2025. Adaptado)"},{"id":"oj-esc25-07","materia":"port","assunto":"Classes de palavras","enunciado":"No texto, o assombro com a violência que vitima as mulheres aparece expresso em palavras por meio de um substantivo, um adjetivo e um advérbio, correta e respectivamente destacados nas passagens:","alternativas":["... as mulheres presas em relacionamentos violentos... (6o parágrafo) / ... diante do quadro alarmante. (5o parágrafo) / ... diariamente está na mira... (4o parágrafo)","... há caminho longe desse horror... (6o parágrafo) / O bárbaro diagnóstico expõe a falha... (2o parágrafo) / Mas, infelizmente, a realidade cruel... (1o parágrafo)","Um recorte mais amplo mostra... (3o parágrafo) / As estatísticas assustadoras não podem... (4o parágrafo) / ... há caminho longe desse horror... (6o parágrafo)","... escancara a gravidade desse contexto. (3o parágrafo) / Esse roteiro de horror permanente... (3o pará grafo) / ... especialmente as polícias especializadas... (5o parágrafo)","O bárbaro diagnóstico expõe a falha... (2o parágrafo) / Um recorte mais amplo mostra... (3o parágrafo) / ... ainda há muito a ser feito. (1o parágrafo)"],"correta":1,"explicacao":"Gabarito oficial: B. \"horror\" (substa lo mostra que, desde a criação da Lei do Feminicídio, em 2015, o Brasil contabilizou 12.380 vítimas desse crime, e a média de quatro homicídios por dia se repete há cinco anos. Esse roteiro de horror permanente precisa ser interrompido. É urgente que sejam adotadas medidas para melhorar a articulação para o enfrentamento da violência de gênero. As estatísticas assustadoras não podem ser consideradas de interesse apenas da parcela da população que diariamente está na mira dos abusos domésticos e dos ataques nas ruas. E o tema não pode continuar sendo tratado como algo da esfera da moral e particular. Acabar com a violência contra as mulheres é uma responsabilidade da gestão pública e precisa ser encarada como prioridade.\n\nA sociedade brasileira não pode aceitar que o país se transforme, cada vez mais, em um território de perigo para meninas e mulheres. Essa epidemia de violência precisa ser contida, e o Estado, o Judiciário e as forças de segurança, especialmente as polícias especializadas, têm que executar ações de forma conjunta diante do quadro alarmante. O abuso sexual, a morte e a agressão por gênero não podem fazer parte do cotidiano nacional. As políticas públicas precisam amparar as mulheres presas em relacionamentos violentos, oferecendo a elas a certeza de que há caminho longe desse horror. (Editorial. https://www.correiobraziliense.com.br/opiniao, 01.09.2025. Adaptado)"},{"id":"oj-esc25-09","materia":"port","assunto":"Coesão: conectivos","enunciado":"Com a realização do Agosto Lilás, o Brasil dedicou um mês para desenvolver campanhas de conscientização e combate à violência contra a mulher, celebrando a Lei Maria da Penha. Mas, infelizmente, a realidade cruel que envolve esse tipo de crime se mostra implacável e, em meio aos eventos, a divulgação do Mapa Nacional da Violência de Gênero comprova que ainda há muito a ser feito. (1o parágrafo) Os termos “Com”, “para”, “Mas” e “e” estabelecem, correta e respectivamente, relações de sentido de:","alternativas":["meio, conformidade, conclusão e oposição.","modo, conformidade, oposição e conclusão.","causa, consequência, adição e conclusão.","modo, finalidade, conclusão e adição.","meio, finalidade, oposição e adição."],"correta":4,"explicacao":"Gabarito oficial: E. \"Com\" = meio; \"para\" = finalidade; \"Mas\" = oposição; \"e\" = adição.","origem":"prova","fonte":"Vunesp · TJSP · Escrevente Técnico Judiciário · 2025 · questão 9","texto":"Epidemia de violência de gênero tem de ser contida Com a realização do Agosto Lilás, o Brasil dedicou um mês para desenvolver campanhas de conscientização e combate à violência contra a mulher, celebrando a Lei Maria da Penha. Mas, infelizmente, a realidade cruel que envolve esse tipo de crime se mostra implacável e, em meio aos eventos, a divulgação do Mapa Nacional da Violência de Gênero comprova que ainda há muito a ser feito. Divulgados na última semana, números organizados a partir de dados extraídos do Ministério da Justiça e Segu rança Pública revelam que o país apresentou média de quatro feminicídios e 187 estupros de mulheres por dia no primeiro semestre de 2025. O levantamento detalha, ainda, que 718 mulheres morreram em razão do gênero de janeiro a junho deste ano, conforme os registros de ocorrências. O bárbaro diagnóstico expõe a falha nos mecanismos de proteção e escancara a gravidade desse contexto. Um recorte mais amplo mostra que, desde a criação da Lei do Feminicídio, em 2015, o Brasil contabilizou 12.380 vítimas desse crime, e a média de quatro homicídios por dia se repete há cinco anos. Esse roteiro de horror permanente precisa ser interrompido. É urgente que sejam adotadas medidas para melhorar a articulação para o enfrentamento da violência de gênero. As estatísticas assustadoras não podem ser consideradas de interesse apenas da parcela da população que diariamente está na mira dos abusos domésticos e dos ataques nas ruas. E o tema não pode continuar sendo tratado como algo da esfera da moral e particular. Acabar com a violência contra as mulheres é uma responsabilidade da gestão pública e precisa ser encarada como prioridade.\n\nA sociedade brasileira não pode aceitar que o país se transforme, cada vez mais, em um território de perigo para meninas e mulheres. Essa epidemia de violência precisa ser contida, e o Estado, o Judiciário e as forças de segurança, especialmente as polícias especializadas, têm que executar ações de forma conjunta diante do quadro alarmante. O abuso sexual, a morte e a agressão por gênero não podem fazer parte do cotidiano nacional. As políticas públicas precisam amparar as mulheres presas em relacionamentos violentos, oferecendo a elas a certeza de que há caminho longe desse horror. (Editorial. https://www.correiobraziliense.com.br/opiniao, 01.09.2025. Adaptado)"},{"id":"oj-esc25-10","materia":"port","assunto":"Relações de sentido","enunciado":"Há uma relação de consequência e causa, nessa ordem, explicitada na passagem:","alternativas":["... desde a criação da Lei do Feminicídio, em 2015, o Brasil contabilizou 12.380 vítimas desse crime... (3o parágrafo)","... o Estado, o Judiciário e as forças de segurança, especialmente as polícias especializadas, têm que executar ações de forma conjunta... (5o parágrafo)","... 718 mulheres morreram em razão do gênero de janeiro a junho deste ano, conforme os registros de ocorrências. (2o parágrafo)","... a divulgação do Mapa Nacional da Violência de Gênero comprova que ainda há muito a ser feito. (1o parágrafo)","... o país apresentou média de quatro feminicídios e 187 estupros de mulheres por dia no primeiro semestre de 2025. (2o parágrafo)"],"correta":2,"explicacao":"Gabarito oficial: C. \"718 mulheres morreram (consequência) em razão do gênero (causa)\".","origem":"prova","fonte":"Vunesp · TJSP · Escrevente Técnico Judiciário · 2025 · questão 10","texto":"Epidemia de violência de gênero tem de ser contida Com a realização do Agosto Lilás, o Brasil dedicou um mês para desenvolver campanhas de conscientização e  mulheres presas em relacionamentos violentos, oferecendo a elas a certeza de que há caminho longe desse horror. (Editorial. https://www.correiobraziliense.com.br/opiniao, 01.09.2025. Adaptado)"},{"id":"oj-esc25-11","materia":"port","assunto":"Interpretação de texto","enunciado":"Da perspectiva apresentada pelo cronista, conclui-se corretamente que","alternativas":["brasileiros e cabo-verdianos são povos intensamente musicais, sendo estes caracterizados por expressarem por meio das canções o seu amor ao país em que vivem.","memórias ancestrais encontram na música dos brasileiros e dos cabo-verdianos a forma de serem transportadas para o futuro, sendo a voz daqueles a mais celebrada.","montanhas longínquas do interior de Santiago abrigam as tristezas do povo cabo-verdiano, que busca inspirações nas canções dos brasileiros para romper o silenciamento.","todos os cabo-verdianos nutrem amor pela música, que passam a amar intensamente depois de nascerem e por meio da qual buscam expressar suas memórias.","cantores como Cesária Évora e Orlando Pantera ratificam a superioridade de Cabo Verde em relação a outros países, principalmente o Brasil, cujo povo é bem musical."],"correta":0,"explicacao":"Gabarito oficial: A. O cronista aproxima brasileiros e cabo-verdianos como povos intensamente musicais que expressam o amor ao país pela música.","origem":"prova","fonte":"Vunesp · TJSP · Escrevente Técnico Judiciário · 2025 · questão 11","texto":"Passaporte da cultura\n\nAo lado dos brasileiros, o povo mais musical que tive o privilégio de conhecer são os cabo-verdianos. O amor incondicional que nutrem pelo país e pelos seus ritmos não tem paralelo. Um amor libertador, que não precisa possuir para se validar. Um amor não exigente, mas que se faz presente na língua que todos aprendem a falar desde o berço — ou melhor, a declamar e a cantar desde o ventre. Não é exagero: todos os cabo-verdianos que conheço são poetas. Embora se reconheça Cesária Évora como sendo a voz que revelou a alma do arquipélago, existe nas montanhas longínquas do interior de Santiago um gênero que já sofrera os seus desafios de silenciamento. Uma música catártica, crua e negra com a qual gerações novas se reconciliaram e aprenderam a reivindicar a sua herança africana. A música continua a ser o passaporte da cultura cabo-verdiana no mundo. Está presente em todos os momentos marcantes da história do país, e é por meio dela que as memórias ancestrais são catalogadas e transportadas para o futuro.\n\nUm dos músicos mais celebrados da nação é Orlando Pantera, um cometa que viveu na terra por escassos 33 anos. Não gravou nenhum álbum, morreu no dia em que iniciaria, em Paris, as gravações do disco que confirmaria aquilo que os habitantes da ilha de Santiago já sabiam: era um gênio. E um dos poucos que conseguiu transportar para a canção o sentir das gentes dos campos, os esquecidos, os seus ritmos e desejos. (Kalaf Epalanga. Minha pátria é a língua pretuguesa: Crônicas. 2023. Adaptado)"},{"id":"oj-esc25-12","materia":"port","assunto":"Sentido figurado","enunciado":"Identifica-se termo empregado em sentido figurado, destacado em negrito, na passagem:","alternativas":["Um dos músicos mais celebrados da nação é Orlando Pantera, um cometa que viveu na terra... (2o parágrafo)","O amor incondicional que nutrem pelo país e pelos seus ritmos não tem paralelo... (1o parágrafo)","Embora se reconheça Cesária Évora como sendo a voz que revelou a alma do arquipélago... (2o parágrafo)","A música continua a ser o passaporte da cultura cabo-verdiana no mundo. (2o parágrafo)","... as gravações do disco que confirmaria aquilo que os habitantes da ilha de Santiago já sabiam... (3o parágrafo)"],"correta":0,"explicacao":"Gabarito oficial: A. Chamar Orlando Pantera de \"cometa\" é metáfora: passagem brilhante e breve.","origem":"prova","fonte":"Vunesp · TJSP · Escrevente Técnico Judiciário · 2025 · questão 12","texto":"Passaporte da cultura\n\nAo lado dos brasileiros, o povo mais musical que tive os termos destacados significam, correta e respectivamente:","alternativas":["impingido; imutável; comunicar.","consensual; intensa; remontar.","ilimitado; perturbadora; restringir.","irrestrito; libertadora; passar.","hesitante; antiquada, levar."],"correta":3,"explicacao":"Gabarito oficial: D (incondicional = irrestrito; catártica = libertadora; transportar = passar).","origem":"prova","fonte":"Vunesp · TJSP · Escrevente Técnico Judiciário · 2025 · questão 13","texto":"Passaporte da cultura\n\nAo lado dos brasileiros, o povo mais musical que tive o privilégio de conhecer são os cabo-verdianos. O amor incondicional que nutrem pelo país e pelos seus ritmos não tem paralelo. Um amor libertador, que não precisa possuir para se validar. Um amor não exigente, mas que se faz presente na língua que todos aprendem a falar desde o berço — ou melhor, a declamar e a cantar desde o ventre. Não é exagero: todos os cabo-verdianos que conheço são poetas. Embora se reconheça Cesária Évora como sendo a voz que revelou a alma do arquipélago, existe nas montanhas longínquas do interior de Santiago um gênero que já sofrera os seus desafios de silenciamento. Uma música catártica, crua e negra com a qual gerações novas se reconciliaram e aprenderam a reivindicar a sua herança africana. A música continua a ser o passaporte da cultura cabo-verdiana no mundo. Está presente em todos os momentos marcantes da história do país, e é por meio dela que as memórias ancestrais são catalogadas e transportadas para o futuro.\n\nUm dos músicos mais celebrados da nação é Orlando Pantera, um cometa que viveu na terra por escassos 33 anos. Não gravou nenhum álbum, morreu no dia em que iniciaria, em Paris, as gravações do disco que confirmaria aquilo que os habitantes da ilha de Santiago já sabiam: era um gênio. E um dos poucos que conseguiu transportar para a canção o sentir das gentes dos campos, os esquecidos, os seus ritmos e desejos. (Kalaf Epalanga. Minha pátria é a língua pretuguesa: Crônicas. 2023. Adaptado)"},{"id":"oj-esc25-14","materia":"port","assunto":"Concordância verbal","enunciado":"A concordância verbal está em conformidade com a norma-padrão em:","alternativas":["Orlando Pantera transpõem para a canção o sentir das gentes dos campos, os esquecidos.","Para os cabo-verdianos, o país e os seus ritmos conta com um amor que não tem paralelo.","Todos os momentos marcantes da história de Cabo Verde dispõe da presença da música.","Em Cabo Verde, houveram artistas cujas músicas remetem às memórias ancestrais.","São poucos que mantêm uma relação com o sentir das gentes, como Orlando Pantera."],"correta":4,"explicacao":"Gabarito oficial: E. \"São poucos que mantêm\": \"mantêm\" concorda com \"poucos\" (plural). As demais têm erro de concordância.","origem":"prova","fonte":"Vunesp · TJSP · Escrevente Técnico Judiciário · 2025 · questão 14","texto":"Passaporte da cultura\n\nAo lado dos brasileiros, o povo mais musical que tive o privilégio de conhecer são os cabo-verdianos. O amor incondicional que nutrem pelo país e pelos seus ritmos não tem paralelo. Um amor libertador, que não precisa possuir para se validar. Um amor não exigente, mas que se faz presente na língua que todos aprendem a falar desde o berço — ou melhor, a declamar e a cantar desde o ventre. Não é exagero: todos os cabo-verdianos que conheço são poetas. Embora se reconheça Cesária Évora como sendo a voz que revelou a alma do arquipélago, existe nas montanhas longínquas do interior de Santiago um gênero que já sofrera os seus desafios de silenciamento. Uma música catártica, crua e negra com a qual gerações novas se reconciliaram e aprenderam a reivindicar a sua herança africana. A música continua a ser o passaporte da cultura cabo-verdiana no mundo. Está presente em todos os momentos marcantes da história do país, e é por meio dela que as memórias ancestrais são catalogadas e transportadas para o futuro.\n\nUm dos músicos mais celebrados da nação é Orlando Pantera, um cometa que viveu na terra por escassos 33 anos. Não gravou nenhum álbum, morreu no dia em que iniciaria, em Paris, as gravações do disco que confirmaria aquilo que os habitantes da ilha de Santiago já sabiam: era um gênio. E um dos poucos que conseguiu transportar para a canção o sentir das gentes dos campos, os esquecidos, os seus ritmos e desejos. (Kalaf Epalanga. Minha pátria é a língua pretuguesa: Crônicas. 2023. Adaptado)"},{"id":"oj-esc25-15","materia":"port","assunto":"Pontuação","enunciado":"Considere as passagens: • \u0007... mas que se faz presente na língua que todos aprendem a falar desde o berço — ou melhor, a declamar e a cantar desde o ventre. (1o parágrafo) • \u0007... morreu no dia em que iniciaria, em Paris, as gravações do disco... (3o parágrafo) As vírgulas empregadas nas passagens transcritas apresentam o mesmo motivo de emprego, respectivamente, nas expressões destacadas em:","alternativas":["O que o cidadão pretende, por enquanto, é que se acelerem as principais obras urbanas. / Tudo que ele via naquele momento, na entrada de casa, era seus bons amigos chegando.","Durante a conversa com leitores, o autor explorou grandes temas, a saber, política, liberdade e justiça. / O livro era um marco na história da editora que, bem famosa, seria reinaugurada.","Ao ponderar sobre os negócios, no entanto, ele não sabia que havia informações obscuras. / Era preciso entender que, na condição precária do carro, um acidente era quase inevitável.","Todos esperavam um reajuste no salário, por isso, já estavam fazendo planos com o dinheiro. / O rosto do rapaz estava marcado, de fato, por lágrimas, que sugeriam seu sofrimento.","O livro que ele escreveu era muito ruim, isto é, nem deveria ter sido publicado. / Era preciso que a professora organizasse, na sala, um debate sobre o tema."],"correta":4,"explicacao":"Gabarito oficial: E. Compare o motivo de cada vírgula (expressão explicativa e adjunto adverbial intercalado).","origem":"prova","fonte":"Vunesp · TJSP · Escrevente Técnico Judiciário · 2025 · questão 15","texto":"Passaporte da cultura\n\nAo lado dos brasileiros, o povo mais musical que tive o privilégio de conhecer são os cabo-verdianos. O amor incondicional que nutrem pelo país e pelos seus ritmos não tem paralelo. Um amor libertador, que não precisa possuir para se validar. Um amor não exigente, mas que se faz presente na língua que todos aprendem a falar desde o berço — ou melhor, a declamar e a cantar desde o ventre. Não é exagero: todos os cabo-verdianos que conheço são poetas. Embora se reconheça Cesária Évora como sendo a voz que revelou a alma do arquipélago, existe nas montanhas longínquas do interior de Santiago um gênero que já sofrera os seus desafios de silenciamento. Uma música catártica, crua e negra com a qual gerações novas se reconciliaram e aprenderam a reivindicar a sua herança africana. A música continua a ser o passaporte da cultura cabo-verdiana no mundo. Está presente em todos os momentos marcantes da história do país, e é por meio dela que as memórias ancestrais são catalogadas e transportadas para o futuro.\n\nUm dos músicos mais celebrados da nação é Orlando Pantera, um cometa que viveu na terra por escassos 33 anos. Não gravou nenhum álbum, morreu no dia em que iniciaria, em Paris, as gravações do disco que confirmaria aquilo que os habitantes da ilha de Santiago já sabiam: era um gênio. E um dos poucos que conseguiu transportar para a canção o sentir das gentes dos campos, os esquecidos, os seus ritmos e desejos. (Kalaf Epalanga. Minha pátria é a língua pretuguesa: Crônicas. 2023. Adaptado)"},{"id":"oj-esc25-16","materia":"port","assunto":"Concordância nominal","enunciado":"Considere as informações: • \u0007Estigma ____ por mulheres asiáticas que pedem divórcio (https://www.terra.com.br/noticias, 31.08.2025. Adaptado.) • \u0007Quando, a energia elétrica caiu em praticamente toda a Península Ibérica, em Madri, era meio-dia e ____. O que se seguiu a partir daí foi o que se espera em situações como essa: caos. (https://www.nexojornal.com.br, 30.04.2025. Adaptado.) • \u0007NASA trouxe para Terra ____ gramas de um tipo de asteroide que “pode ter acelerado o surgimento da vida” (https://expresso.pt/sociedade/ciencia, 27.09.2023. Adaptado) De acordo com a norma-padrão, as lacunas das frases devem ser preenchidas, respectivamente, com:","alternativas":["enfrentada … meia … duzentas e cinquenta","enfrentado … meia … duzentos e cinquenta","enfrentado … meio … duzentos e cinquenta","enfrentados … meio … duzentas e cinquenta","enfrentada … meio … duzentas e cinquenta"],"correta":1,"explicacao":"Gabarito oficial: B. \"Estigma enfrentado\" (masculino); \"meio-dia e meia\" (meia hora); \"duzentos e cinquenta\" concorda com o substantivo masculino.","origem":"prova","fonte":"Vunesp · TJSP · Escrevente Técnico Judiciário · 2025 · questão 16"},{"id":"oj-esc25-17","materia":"penal","assunto":"Falsidade documental (art. 293)","enunciado":"É crime, expressamente previsto no “caput” combinado com o inciso IV do art. 293 do CP, falsificar cautela de penhor emitida por entidade de direito público. Na hipótese de o documento de cautela ser legitimamente cancelado pela entidade, mediante a aposição de um carimbo, a conduta do sujeito que suprime tal carimbo, visando a uma nova utilização da cautela de penhor, é","alternativas":["típica e punida com a mesma pena, tendo em vista a equivalência das condutas de falsificar e suprimir.","atípica, tendo em vista ausência de expressa previsão legal para a punição da supressão.","típica e punida pelo próprio “caput” combinado com o inciso IV do art. 293 do CP, tendo em vista que a supressão também é considerada uma forma de falsificação.","típica e punida pelo CP, tendo em vista que o bem jurídico também é atingido pela supressão.","atípica, tendo em vista que não se pode admitir interpretação extensiva para que a supressão seja englobada pelo conceito de falsificação."],"correta":3,"explicacao":"Gabarito oficial: D. Art. 293, § 2º, CP: suprimir carimbo ou sinal de inutilização de papel legítimo, para torná-lo novamente utilizável, é crime próprio, com pena diferente (reclusão de 1 a 4 anos). A conduta é típica.","origem":"prova","fonte":"Vunesp · TJSP · Escrevente Técnico Judiciário · 2025 · questão 17"},{"id":"oj-esc25-18","materia":"penal","assunto":"Falsa identidade (art. 307)","enunciado":"O crime de falsa identidade previsto no art. 307 do CP apenas é punível se","alternativas":["não constitui elemento de crime mais grave.","cometido por funcionário público.","cometido em conjunto por aquele a que se atribui falsa identidade e pelo terceiro que cede a própria identidade para utilização.","causa prejuízo a terceiro.","causa prejuízo à Administração Pública."],"correta":0,"explicacao":"Gabarito oficial: A. Art. 307: o crime é expressamente subsidiário — \"se o fato não constitui elemento de crime mais grave\".","origem":"prova","fonte":"Vunesp · TJSP · Escrevente Técnico Judiciário · 2025 · questão 18"},{"id":"oj-esc25-19","materia":"penal","assunto":"Crimes contra a Administração (art. 313-A)","enunciado":"Com relação ao crime previsto no art. 313-A do CP (inserção de dados falsos em sistema de informações), é correto afirmar que, para que o crime se configure,","alternativas":["é necessário que o funcionário efetivamente insira dados falsos, não caracterizando figura típica a facilitação para inserção.","é necessário que haja efetivo dano a administrado, não caracterizando figura típica a mera intenção de causar dano.","basta o mero fim de obtenção de vantagem indevida para si ou terceiro, não sendo necessário que o agente obtenha vantagem efetiva.","é necessário que haja efetivo dano à Administração, não caracterizando figura típica a mera intenção de causar dano.","é necessário que o funcionário efetivamente insira dados falsos, não caracterizando figura típica a exclusão de dados corretos."],"correta":2,"explicacao":"Gabarito oficial: C. Art. 313-A é crime formal: basta o fim de obter vantagem indevida ou causar dano; não precisa obter a vantagem.","origem":"prova","fonte":"Vunesp · TJSP · Escrevente Técnico Judiciário · 2025 · questão 19"},{"id":"oj-esc25-20","materia":"penal","assunto":"Crimes contra a Administração (art. 320)","enunciado":"O crime de condescendência criminosa caracteriza-se quando o funcionário público deixa de responsabilizar subordinado que cometeu infração no exercício do cargo ou, quando lhe falte competência, não leva o fato ao conhecimento da autoridade competente. Complementa a descrição da ação típica o elemento","alternativas":["“para satisfazer interesse pessoal”.","“causando prejuízo ao serviço público”.","“ainda que por reconhecida nobreza”.","“mediante promessa de vantagem indevida”.","“por indulgência”. Direito Processual Penal"],"correta":4,"explicacao":"Gabarito oficial: E. Art. 320 (condescendência criminosa): \"deixar o funcionário, por indulgência, de responsabilizar subordinado...\".","origem":"prova","fonte":"Vunesp · TJSP · Escrevente Técnico Judiciário · 2025 · questão 20"},{"id":"oj-esc25-21","materia":"ppenal","assunto":"Impedimento e suspeição do juiz","enunciado":"De acordo com o Código de Processo Penal, é correto afirmar que o juiz será considerado","alternativas":["suspeito se tiver aconselhado qualquer das partes.","impedido se for credor ou devedor, tutor ou curador, de qualquer das partes.","suspeito se tiver funcionado como juiz de outra instância, pronunciando-se, de fato ou de direito, sobre a questão.","impedido se um parente seu (no caso, seu primo) responde a processo que tenha de ser julgado por qualquer das partes.","suspeito se o seu cônjuge for diretamente interessado no feito."],"correta":0,"explicacao":"Gabarito oficial: A. Art. 254, IV, CPP: o juiz é suspeito se tiver aconselhado qualquer das partes.","origem":"prova","fonte":"Vunesp · TJSP · Escrevente Técnico Judiciário · 2025 · questão 21","extra":true},{"id":"oj-esc25-22","materia":"ppenal","assunto":"Acusado e defensor","enunciado":"Sobre o tema “Do acusado e seu defensor”, é correto afirmar:","alternativas":["o acusado poderá realizar sua própria defesa, bastando, para tanto, possuir o grau de bacharel em Direito, sendo desnecessária sua inscrição na Ordem dos Advogados do Brasil.","a falta de defensor público, dativo ou particular impedirá o processamento e o julgamento do acusado ausente; todavia, não impedirá o processamento e o julgamento do acusado foragido.","quando nomeados pelo juiz, os advogados, como defensores dativos, têm a faculdade de declinar da nomeação, sendo desnecessário declarar o motivo da recusa.","em caso de abandono do processo pelo defensor, cumulado com a não localização do acusado, o processo será sobrestado até a prisão do acusado.","a constituição de defensor independerá de instrumento de mandato se o acusado o indicar por ocasião do interrogatório."],"correta":4,"explicacao":"Gabarito oficial: E. Art. 266, CPP: a constituição de defensor independe de instrumento de mandato se o acusado o indicar no interrogatório.","origem":"prova","fonte":"Vunesp · TJSP · Escrevente Técnico Judiciário · 2025 · questão 22","extra":true},{"id":"oj-esc25-23","materia":"ppenal","assunto":"Citação no processo penal","enunciado":"Sobre a temática da citação judicial no processo penal, é correto afirmar:","alternativas":["a notificação judicial para o comparecimento de funcionário público em juízo, na condição de acusado, não deve ser endereçada ao próprio acusado, mas tão somente ao chefe da repartição a que pertence o funcionário acusado.","o militar deve ser citado por intermédio do chefe do respectivo serviço.","se o réu estiver preso, será requisitada a sua apresentação em juízo, no dia e hora designados, ao diretor do presídio onde se encontra recolhido, por isso desnecessária a citação pessoal do preso.","se o réu não for encontrado, será citado por edital, com o prazo de 120 (cento e vinte) dias.","não sendo encontrado o acusado, será procedida a citação por carta-convite."],"correta":1,"explicacao":"Gabarito oficial: B. Art. 358, CPP: a citação do militar far-se-á por intermédio do chefe do respectivo serviço.","origem":"prova","fonte":"Vunesp · TJSP · Escrevente Técnico Judiciário · 2025 · questão 23"},{"id":"oj-esc25-24","materia":"ppenal","assunto":"Procedimento comum (art. 396)","enunciado":"No tocante ao tema “instrução criminal – procedimento comum”, assinale a alternativa correta.","alternativas":["O procedimento será comum ordinário quando tiver por objeto crime cuja sanção máxima cominada seja inferior a 4 (quatro) anos de pena privativa de liberdade.","Nos procedimentos ordinário e sumário, oferecida a denúncia ou queixa, o juiz, se não a rejeitar liminarmente, recebê-la-á e ordenará a citação do acusado para responder à acusação, por escrito, no prazo de 10 (dez) dias.","Os processos que apurem a prática de crime hediondo ou violência contra a mulher terão prioridade de tramitação em todas as instâncias, desde que haja requerimento expresso do Ministério Público ou do(a) ofendido(a).","O procedimento será comum sumário quando tiver por objeto crime cuja sanção máxima cominada for igual ou superior a 4 (quatro) anos de pena privativa de liberdade.","O procedimento comum será ordinário, sumário, sumariíssimo e especial."],"correta":1,"explicacao":"Gabarito oficial: B. Art. 396, CPP: recebida a denúncia, o juiz ordena a citação para resposta à acusação, por escrito, em 10 dias.","origem":"prova","fonte":"Vunesp · TJSP · Escrevente Técnico Judiciário · 2025 · questão 24"},{"id":"oj-esc25-25","materia":"ppenal","assunto":"Lei 9.099/95 - JECrim","enunciado":"Sobre os Juizados Especiais Criminais, assinale a alternativa correta.","alternativas":["Os embargos de declaração não interrompem o prazo para a interposição de recurso.","Da decisão de rejeição da denúncia ou queixa caberá recurso em sentido estrito, que poderá ser julgado por turma composta de três juízes em exercício no primeiro grau de jurisdição, reunidos na sede do juizado.","Da sentença caberá apelação, a qual será interposta no prazo de 15 (quinze) dias, contados da ciência da decisão pelo Ministério Público, pelo réu e seu defensor, por petição escrita, da qual constarão as razões e o pedido do recorrente.","No recurso de apelação, a parte recorrida terá o prazo de 10 (dez) dias para oferecer sua resposta escrita.","Os erros materiais não poderão ser corrigidos de ofício pelo juiz, motivo pelo qual a parte interessada deverá opor embargos de declaração no prazo de 3 (três) dias, contados da ciência da decisão. Direito Processual Civil"],"correta":3,"explicacao":"Gabarito oficial: D. Art. 82, § 2º, Lei 9.099: o recorrido tem 10 dias para responder à apelação.","origem":"prova","fonte":"Vunesp · TJSP · Escrevente Técnico Judiciário · 2025 · questão 25","extra":true},{"id":"oj-esc25-26","materia":"pcivil","assunto":"Tempo dos atos processuais (art. 212)","enunciado":"Tom emprestou R$ 50.000,00 a Gael mediante a assinatura de uma nota promissória com vencimento no prazo 30 dias. Passado o prazo, Gael não realizou o pagamento, razão pela qual Tom ajuizou ação de execução de título extrajudicial requerendo a citação de Gael para pagar a dívida em 3 dias, sob pena de penhora de bens. Citado, Gael manteve-se inerte. O juiz então determinou a penhora do automóvel de Gael. O oficial de justiça compareceu à casa de Gael em um sábado, às 21h, para efetivar a diligência. Diante da situação hipotética, é correto afirmar que o ato processual é","alternativas":["nulo, pois ainda que possa ser realizado em finais de semana e feriados, deve ser realizado das 6 (seis) às 20 (vinte) horas.","válido, por se tratar de ato que, por sua natureza, tem característica de urgente.","válido, independentemente de autorização judicial.","nulo, pois depende de autorização judicial específica para a realização fora do horário do expediente.","nulo, pois deverá ser realizado em dias úteis."],"correta":2,"explicacao":"Gabarito oficial: C. Art. 212, § 2º, CPC: penhora e citação podem ser feitas no período de férias, feriados ou fora do horário (6h-20h), independentemente de autorização judicial.","origem":"prova","fonte":"Vunesp · TJSP · Escrevente Técnico Judiciário · 2025 · questão 26"},{"id":"oj-esc25-27","materia":"pcivil","assunto":"Alimentos (art. 528)","enunciado":"João, de 10 anos, representado por sua mãe, ajuíza ação de alimentos contra seu pai, Carlos, alegando que este não contribui regularmente para seu sustento. Nos autos, resta comprovado que a mãe arca sozinha com todas as despesas de João, enquanto Carlos possui emprego estável e renda mensal líquida de R$ 6.000,00. João requer o pagamento de R$ 30.000,00 pelos alimentos em atraso, bem como a fixação de alimentos mensais no valor de R$ 1.800,00. Em sentença, o juiz julga totalmente procedentes os pedidos de João. Diante da situação hipotética, sendo certo que a sentença ainda não transitou em julgado, assinale a alternativa correta.","alternativas":["Carlos poderá parcelar o valor dos alimentos em atraso, não podendo a parcela, somada ao valor mensal, ser superior R$ 3.000,00.","Carlos terá o prazo de cinco dias para pagar o valor integral decidido em sentença.","O juiz só poderá requerer o desconto em folha de pagamento caso Carlos atrase alguma parcela.","Caso reste verificada conduta procrastinatória de Carlos, o juiz poderá, desde que mediante requerimento de João, dar ciência ao Ministério Público dos indícios da prática do crime de abandono material.","João poderá executar desde logo os alimentos nos mesmos autos."],"correta":0,"explicacao":"Gabarito oficial: A. Os alimentos pretéritos podem ser descontados da renda do executado de forma parcelada, desde que, somados à parcela mensal, não ultrapassem 50% dos ganhos líquidos (art. 529, § 3º, CPC) — aqui, R$ 3.000,00.","origem":"prova","fonte":"Vunesp · TJSP · Escrevente Técnico Judiciário · 2025 · questão 27"},{"id":"oj-esc25-28","materia":"pcivil","assunto":"Prazos processuais","enunciado":"Helena contratou Arthur, advogado
