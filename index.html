 agrária, moradia, educação e trabalho escravo, informou ontem a Organização das Nações Unidas (ONU). Comitê da entidade pelos direitos econômicos e sociais pede uma revisão do Bolsa-Família, uma maior eficiência do programa e sua “universalização”. Por fim, constata: a cultura da violência e da impunidade reina no País. A ONU sugere que o Brasil amplie o Bolsa-Família para camadas da população que não recebem os benefícios, incluindo os indígenas. E cobra a “revisão” dos mecanismos de acompanhamento do programa para garantir acesso de todas as famílias pobres, aumentando ainda a renda distribuída. Há duas semanas, o comitê sabatinou membros do governo em Genebra, na Suíça. O documento com as sugestões é resultado da avaliação dos peritos do comitê que inclui o exame de dados passados pelo governo e por cinco relatórios alternativos apresentados por organizações não-governamentais (ONGs). Os peritos reconhecem os avanços no combate à pobreza, mas insistem que a injustiça social prevalece. Um dos pontos considerados como críticos é a diferença de expectativa de vida e de pobreza entre brancos e negros. A sugestão da ONU é que o governo tome medidas “mais focadas”. Na visão do órgão, a exclusão é decorrente da alta proporção de pessoas sem qualquer forma de segurança social, muitos por estarem no setor informal da economia.\n\n(www.estadao.com.br/nacional/not_nac377078,0.htm. 26.05.2009. Adaptado)"},{"id":"oj-tjsp09-05","materia":"port","assunto":"Interpretação de texto","enunciado":"No 1.º parágrafo do texto, o termo universalização aparece grafado entre aspas. Isso ocorre porque se pretende enfatizar que o benefício deve","alternativas":["atingir a todas as pessoas que o solicitem, independente mente de classe social.","ser proporcionado a um contingente de pessoas que está fora da pobreza.","estar na mira de pessoas incautas, que dele se beneficiam sem terem direito.","ser, paulatinamente, oferecido a um número menor de pessoas dentro e fora do país.","estender-se a todas as famílias pobres e a camadas da população excluídas de recebê-lo."],"correta":4,"explicacao":"Gabarito oficial: E. \"Universalização\" entre aspas: estender o benefício a todas as famílias pobres e camadas excluídas.","origem":"prova","fonte":"Vunesp · TJSP · Oficial de Justiça · 2009 · questão 5","texto":"ONU pede ampliação de programas sociais do Brasil SÃO PAULO – Os programas adotados no governo federal ainda não são suficientes para lidar com problemas de desigualdade, reforma agrária, moradia, educação e trabalho escravo, informou ontem a Organização das Nações Unidas (ONU). Comitê da entidade pelos direitos econômicos e sociais pede uma revisão do Bolsa-Família, uma maior eficiência do programa e sua “universalização”. Por fim, constata: a cultura da violência e da impunidade reina no País. A ONU sugere que o Brasil amplie o Bolsa-Família para camadas da população que não recebem os benefícios, incluindo os indígenas. E cobra a “revisão” dos mecanismos de acompanhamento do programa para garantir acesso de todas as famílias pobres, aumentando ainda a renda distribuída. Há duas semanas, o comitê sabatinou membros do governo em Genebra, na Suíça. O documento com as sugestões é resultado da avaliação dos peritos do comitê que inclui o exame de dados passados pelo governo e por cinco relatórios alternativos apresentados por organizações não-governamentais (ONGs). Os peritos reconhecem os avanços no combate à pobreza, mas insistem que a injustiça social prevalece. Um dos pontos considerados como críticos é a diferença de expectativa de vida e de pobreza entre brancos e negros. A sugestão da ONU é que o governo tome medidas “mais focadas”. Na visão do órgão, a exclusão é decorrente da alta proporção de pessoas sem qualquer forma de segurança social, muitos por estarem no setor informal da economia.\n\n(www.estadao.com.br/nacional/not_nac377078,0.htm. 26.05.2009. Adaptado)"},{"id":"oj-tjsp09-06","materia":"port","assunto":"Significação das palavras","enunci stica","alternativas":["apresentam um cenário pouco alentador da vida argentina.","corroboram o sucesso vivenciado com o crescimento do PIB.","são bastante contraditórios e, por isso, pouco confiáveis.","traçam um quadro de confiança no governo de Cristina Kirchner.","ilustram a frase formulada pela presidente Cristina Kirchner."],"correta":0,"explicacao":"Gabarito oficial: A.","origem":"prova","fonte":"Vunesp · TJSP · Oficial de Justiça · 2009 · questão 13","texto":"Um tango para lá de desafinado Uma imagem, uma constatação, uma estatística e uma frase resumem o estado das coisas na Argentina. A imagem: pedreiros acrescentando mais um andar às lajes das favelas de Buenos Aires. Enquanto a atividade da construção civil em geral está em queda, as precárias villas portenhas não param de crescer – na falta de espaço, para cima. A constatação: a quantidade cada vez maior de galões de água expostos sobre carros estacionados, principalmente na periferia da capital argentina. Este é o sinal convencionado pelos proprietários para anunciar que seus veículos usados estão à venda. Mais automóveis enfeitados com galões, mais pessoas com necessidade urgente de dinheiro. A estatística: a mortalidade infantil na província de Buenos Aires subiu 8% em 2007. Tudo isso dá a ideia de que algo vai muito mal na Argentina. A população da capital que vive em moradias irregulares aumentou 30% nos últimos dois anos. Três em cada quatro argentinos dizem não ganhar o suficiente para cobrir os gastos diários. E, no mesmo ano em que o PIB da Argentina cresceu incríveis 8,7%, o mais básico dos indicadores sociais só piorou na principal província do país. Favelas em expansão, renda relativa em baixa e bebês morrendo – no mínimo, o governo deveria estar reconsiderando suas políticas econômicas e sociais. A presidente argentina diz que não é o caso. Formulada por Cristina Kirchner em um comício da campanha para as eleições legislativas do próximo domingo, eis a frase: “Encontramos o caminho e devemos segui-lo e aprofundá-lo”. (Veja, 24.06.2009)"},{"id":"oj-tjsp09-14","materia":"port","assunto":"Relações de sentido","enunciado":"Na frase – E, no mesmo ano em que o PIB da Argentina cresceu incríveis 8,7%, o mais básico dos indicadores sociais só piorou na principal província do país. – a relação entre o crescimento do PIB e o mais básico dos indicadores sociais revela","alternativas":["uma perspectiva otimista para a economia e a vida social do país.","a possibilidade de a população progredir mesmo com a economia estagnada.","um caos social que vem sendo combatido sem ônus à população carente.","uma contradição flagrante entre a economia e as condições de vida no país.","o apoio do povo à economia do país, sem abrir mão das regalias sociais."],"correta":3,"explicacao":"Gabarito oficial: D.","origem":"prova","fonte":"Vunesp · TJSP · Oficial de Justiça · 2009 · questão 14","texto":"Um tango para lá de desafinado Uma imagem, uma constatação, uma estatística e uma frase resumem o estado das coisas na Argentina. A imagem: pedreiros acrescentando mais um andar às lajes das favelas de Buenos Aires. Enquanto a atividade da construção civil em geral está em queda, as precárias villas portenhas não param de crescer – na falta de espaço, para cima. A constatação: a quantidade cada vez maior de galões de água expostos sobre carros estacionados, principalmente na periferia da capital argentina. Este é o sinal convencionado pelos proprietários para anunciar que seus veículos usados estão à venda. Mais automóveis enfeitados com galões, mais pessoas com necessidade urgente de dinheiro. A estatística: a mortalidade infantil na província de Buenos Aires subiu 8% em 2007. Tudo isso dá a ideia de que algo vai muito mal na Argentina. A população da capital que vive em moradias irregulares aumentou 30% nos últimos dois anos. Três em cada quatro argentinos dizem não ganhar o suficiente para cobrir os gastos diários. E, no mesmo ano em que o PIB da Argentina cresceu incríveis 8,7%, o mais básico dos indicadores sociais só piorou na principal província do país. Favelas em expansão, renda relativa em baixa e bebês morrendo – no mínimo, o governo deveria estar reconsiderando suas políticas econômicas e sociais. A presidente argentina diz que não é o caso. Formulada por Cristina Kirchner em um comício da campanha para as eleições legislativas do próximo domingo, eis a frase: “Encontramos o caminho e devemos segui-lo e aprofundá-lo”. (Veja, 24.06.2009)"},{"id":"oj-tjsp09-15","materia":"port","assunto":"Interpretação de texto","enunciado":"De acordo com o ponto de vista do autor,","alternativas":["a estabilidade do governo de Cristina Kirchner implica manutenção de sua política.","seria prudente que o governo de Cristina Kirchner revisasse aspectos da política econômica e social.","a resolução dos problemas sociais é o foco da política de Cristina Kirchner.","a situação da Argentina, ainda que difícil, é bem conduzida por Cristina Kirchner.","Cristina Kirchner mudou consideravelmente, para melhor, a vida na Argentina."],"correta":1,"explicacao":"Gabarito oficial: B.","origem":"prova","fonte":"Vunesp · TJSP · Oficial de Justiça · 2009 · questão 15","texto":"Um tango para lá de desafinado Uma imagem, uma constatação, uma estatística e uma frase resumem o estado das coisas na Argentina. A imagem: pedreiros acrescentando mais um andar às lajes das favelas de Buenos Aires. Enquanto a atividade da construção civil em geral está em queda, as precárias villas portenhas não param de crescer – na falta de espaço, para cima. A constatação: a quantidade cada vez maior de galões de água expostos sobre carros estacionados, principalmente na periferia da capital argentina. Este é o sinal convencionado pelos proprietários para anunciar que seus veículos usados estão à venda. Mais automóveis enfeitados com galões, mais pessoas com necessidade urgente de dinheiro. A estatística: a mortalidade infantil na província de Buenos Aires subiu 8% em 2007. Tudo isso dá a ideia d a Argentina.","Cristina, encontra o caminho, e recompõe a Argentina.","Cristina encontra o caminho e recompõe a Argentina."],"correta":4,"explicacao":"Gabarito oficial: E. Não se separa sujeito do verbo por vírgula. Gabarito oficial: E.","origem":"prova","fonte":"Vunesp · TJSP · Oficial de Justiça · 2009 · questão 20"},{"id":"oj-tjsp09-21","materia":"ppenal","assunto":"Testemunhas (arts. 202 a 225)","enunciado":"A regularidade na intimação da testemunha, que será ouvida em juízo, poderá implicar a","alternativas":["validade de seu depoimento.","sua condução coercitiva.","absolvição do acusado.","condenação do acusado.","nulidade de seu depoimento."],"correta":1,"explicacao":"Gabarito oficial: B. Art. 218, CPP: a testemunha regularmente intimada que falta sem motivo pode ser conduzida coercitivamente.","origem":"prova","fonte":"Vunesp · TJSP · Oficial de Justiça · 2009 · questão 21"},{"id":"oj-tjsp09-22","materia":"ppenal","assunto":"Testemunhas (art. 225)","enunciado":"De acordo com o preceituado no art. 225 do CPP, o juiz poderá tomar antecipadamente o depoimento da testemunha que","alternativas":["requerer, por escrito, que seu depoimento seja feito antecipadamente.","manifestar em audiência o desejo de ser ouvida antecipadamente.","decidir fixar residência fora do estado.","necessitar de intérprete.","estiver acometida de um mal incurável."],"correta":4,"explicacao":"Gabarito oficial: E. Art. 225, CPP: depoimento antecipado de testemunha que precise ausentar-se, ou por velhice/enfermidade, possa não estar viva na instrução.","origem":"prova","fonte":"Vunesp · TJSP · Oficial de Justiça · 2009 · questão 22"},{"id":"oj-tjsp09-23","materia":"ppenal","assunto":"Peritos","enunciado":"Considere as afirmações no que tange ao perito. I. Não cabe às partes intervir na nomeação do perito. II. Todo perito, ainda que não oficial, está sujeito à disciplina judiciária. III. Os analfabetos podem ser peritos, desde que comprovado seu notório saber jurídico. Está correto apenas o contido em","alternativas":["I e II.","I e III.","I.","II.","III."],"correta":0,"explicacao":"Gabarito oficial: A. Art. 275 e 276, CPP: perito, ainda que não oficial, sujeita-se à disciplina judiciária; as partes não intervêm na nomeação. Analfabetos não podem ser peritos (art. 279).","origem":"prova","fonte":"Vunesp · TJSP · Oficial de Justiça · 2009 · questão 23","extra":true},{"id":"oj-tjsp09-24","materia":"ppenal","assunto":"Tribunal do Júri (arts. 436 a 446)","enunciado":"Os jurados sorteados, preferencialmente, serão convocados para comparecerem ao Tribunal do Júri","alternativas":["pessoalmente.","por meio do oficial de justiça.","pelo correio ou qualquer outro meio hábil.","por telefone.","por e-mail."],"correta":2,"explicacao":"Gabarito oficial: C. Art. 434, CPP: jurados sorteados são convocados pelo correio ou qualquer outro meio hábil.","origem":"prova","fonte":"Vunesp · TJSP · Oficial de Justiça · 2009 · questão 24"},{"id":"oj-tjsp09-25","materia":"ppenal","assunto":"Intimação da pronúncia","enunciado":"Quanto à intimação da decisão de pronúncia, pode-se afirmar que I. o acusado solto que não for encontrado será intimado por edital; II. o acusado preso será intimado por via postal; III. o acusado solto será intimado pessoalmente, desde que seu advogado ainda não tenha sido intimado pelo diário oficial. Está correto apenas o contido em","alternativas":["I e II.","I e III.","II e III.","I.","III."],"correta":3,"explicacao":"Gabarito oficial: D. Art. 420, CPP: intimação pessoal do acusado; o acusado solto não encontrado é intimado por edital.","origem":"prova","fonte":"Vunesp · TJSP · Oficial de Justiça · 2009 · questão 25","extra":true},{"id":"oj-tjsp09-27","materia":"legesp","assunto":"Lei 6.830/80 (execução fiscal)","enunciado":"Na execução da dívida pública estadual, sobre como a penhora ou arresto de bens será feita, aponte a alternativa correta.","alternativas":["Em execução fiscal, a ordem da nomeação de bens à penhora pelo devedor, submete-se à aceitação ou não da Fazenda Pública.","A nomeação de bens à penhora independe de ordem legal, cabendo ao devedor indicar os que lhe aprouver, procedendo-se à constrição.","Os bens móveis precedem as pedras e metais preciosos na ordem legal de arresto ou penhora de bens do devedor.","A penhora efetuada em dinheiro será convertida em depósito em favor do credor, assegurando-se a correção monetária até o final do processo.","A penhora que recai sobre imóvel nunca pode alcançar os frutos obtidos com os alugueres, que devem ser recebidos pelo devedor."],"correta":0,"explicacao":"Gabarito oficial: A. A nomeação de bens pelo executado segue a ordem do art. 11 da LEF e depende da aceitação da Fazenda.","origem":"prova","fonte":"Vunesp · TJSP · Oficial de Justiça · 2009 · questão 27"},{"id":"oj-tjsp09-29","materia":"legesp","assunto":"Lei 6.830/80 (execução fiscal)","enunciado":"Em relação à penhora realizada em execução fiscal, aponte a alternativa correta.","alternativas":["Se a penhora recair sobre bem imóvel, far-se-á a citação ao cônjuge do devedor, sob pena de nulidade do ato.","A avaliação de bens penhorados deve ser feita sempre pelo oficial de justiça, mesmo que não tenha lavrado o auto de penhora.","Em qualquer fase do processo poderá ser deferida a substituição da penhora, pelo executado, por outro bem, independentemente da ordem legal.","A Fazenda Pública poderá requerer o reforço da penhora insuficiente ou a substituição dos bens penhorados, mesmo fora da ordem legal.","O executado que pagar parte da dívida, que julgar incontroversa, deve garantir a execução, em sua totalidade, para fins de embargos."],"correta":3,"explicacao":"Gabarito oficial: D. Art. 15, II, LEF: a Fazenda pode pedir substituição dos bens penhorados, independentemente da ordem, e reforço da penhora insuficiente.","origem":"prova","fonte":"Vunesp · TJSP · Oficial de Justiça · 2009 · questão 29"},{"id":"oj-tjsp09-36","materia":"penal","assunto":"Falsidade documental","enunciado":"Com relação aos crimes relacionados à falsidade documental, pode-se afirmar que I. é criminosa a conduta daquele que exibe, voluntariamente, à polícia, carteira de motorista que sabe ser falsa; II. o médico, não funcionário público, que emite atestado falso, pratica crime específico chamado de falsidade de atestado médico; III. o crime de falsidade ideológica prevê uma causa de aumento de pena na hipótese de o agente ser funcionário público e cometer o crime prevalecendo-se do cargo. Está correto o contido em","alternativas":["I, somente.","I e II, somente.","I e III, somente.","II e III, somente.","I, II e III."],"correta":4,"explicacao":"Gabarito oficial: E. I: exibir voluntariamente CNH falsa é uso de documento falso (art. 304). II: art. 302 (atestado médico falso). III: art. 299, parágrafo único (aumento de 1/6 para funcionário).","origem":"prova","fonte":"Vunesp · TJSP · Oficial de Justiça · 2009 · questão 36"},{"id":"oj-tjsp09-37","materia":"penal","assunto":"Falsificação de selo (art. 296)","enunciado":"O crime de falsificação de selo ou sinal público consiste","alternativas":["tão somente na alteração do documento.","tão somente da adulteração do documento.","tão somente na fabricação do documento.","na fabricação ou alteração do documento.","tão somente na criação do documento."],"correta":3,"explicacao":"Gabarito oficial: D. Art. 296: \"falsificar, fabricando-os ou alterando-os\" selos ou sinais públicos.","origem":"prova","fonte":"Vunesp · TJSP · Oficial de Justiça · 2009 · questão 37"},{"id":"oj-tjsp09-38","materia":"penal","assunto":"Peculato (art. 312)","enunciado":"O crime de peculato","alternativas":["pode ser praticado por qualquer pessoa, ainda que sem a participação do funcionário público.","prevê a modalidade culposa.","não prevê a modalidade culposa.","é punido com pena de detenção de 3 (três) a 10 (dez) anos.","é punido exclusivamente com pena de multa, que varia de acordo com o salário do funcionário público."],"correta":1,"explicacao":"Gabarito oficial: B. Art. 312, § 2º: existe peculato culposo (detenção de 3 meses a 1 ano).","origem":"prova","fonte":"Vunesp · TJSP · Oficial de Justiça · 2009 · questão 38"},{"id":"oj-tjsp09-39","materia":"penal","assunto":"Funcionário público para fins penais (art. 327)","enunciado":"Assinale a única alternativa que não apresenta necessariamente exemplos de funcionário público para fins penais.","alternativas":["Vereador e carteiro.","Perito judicial e juiz de direito.","Delegado de polícia e jurado do Tribunal do Júri.","Prefeito municipal e carcereiro.","Defensor dativo e professor."],"correta":4,"explicacao":"Gabarito oficial: E. Professor não é necessariamente funcionário público (pode ser da rede privada); defensor dativo também não.","origem":"prova","fonte":"Vunesp · TJSP · Oficial de Justiça · 2009 · questão 39"},{"id":"oj-tjsp09-40","materia":"penal","assunto":"Tráfico de influência (art. 332)","enunciado":"Examine as afirmações sobre o crime de tráfico de influência. I. Ocorre se o agente solicita para si ou para outrem vantagem a pretexto de influir em ato praticado por funcionário público no exercício da função. II. É praticado, ainda que sem intenção, e de forma imprudente, se o agente exige para si ou para outrem vantagem a pretexto de influir em ato praticado por funcionário público no exercício da função. III. Tem a sua pena aumentada se o agente alega que a vantagem solicitada é também destinada ao funcionário público que se deixará influenciar. Está correto o contido em","alternativas":["I, somente.","I e II, somente.","I e III, somente.","II e III, somente.","I, II e III."],"correta":2,"explicacao":"Gabarito oficial: C. I correta; II errada (o crime é doloso); III correta: a pena aumenta da metade se o agente alega que a vantagem também é destinada ao funcionário.","origem":"prova","fonte":"Vunesp · TJSP · Oficial de Justiça · 2009 · questão 40"},{"id":"oj-tjsp09-41","materia":"penal","assunto":"Autoacusação falsa (art. 341)","enunciado":"“X” mãe de “Z”, ao descobrir que o filho praticou o furto de um veículo, dirige-se à delegacia de polícia e se apresenta como a autora do delito. Em tese, “X” praticou o crime de","alternativas":["condescendência criminosa.","falso testemunho.","autoacusação falsa.","denunciação caluniosa.","prevaricação."],"correta":2,"explicacao":"Gabarito oficial: C. Art. 341: acusar-se, perante a autoridade, de crime inexistente ou praticado por outrem.","origem":"prova","fonte":"Vunesp · TJSP · Oficial de Justiça · 2009 · questão 41"},{"id":"oj-tjsp09-42","materia":"const","assunto":"Princípios fundamentais (art. 4º)","enunciado":"A República Federativa do Brasil rege-se nas suas relações internacionais, entre outros, pelo princípio","alternativas":["da cidadania.","do pluralismo político.","da livre iniciativa.","da prevalência dos direitos humanos.","da intervenção."],"correta":3,"explicacao":"Gabarito oficial: D. Art. 4º, II: prevalência dos direitos humanos rege as relações internacionais. Cidadania e pluralismo são fundamentos (art. 1º).","origem":"prova","fonte":"Vunesp · TJSP · Oficial de Justiça · 2009 · questão 42"},{"id":"oj-tjsp09-43","materia":"const","assunto":"Direitos e garantias (art. 5º)","enunciado":"É correto afirmar que","alternativas":["a lei penal não retroagirá, mesmo para beneficiar o réu.","haverá tribunal de exceção.","é assegurado a todos o acesso à informação, mas não o sigilo da fonte.","será concedida a extradição de estrangeiro, desde que o crime seja político.","o preso tem direito à identificação dos responsáveis por sua prisão."],"correta":4,"explicacao":"Gabarito oficial: E. Art. 5º, LXIV: o preso tem direito à identificação dos responsáveis por sua prisão.","origem":"prova","fonte":"Vunesp · TJSP · Oficial de Justiça · 2009 · questão 43"},{"id":"oj-tjsp09-44","materia":"const","assunto":"Estabilidade (art. 41)","enunciado":"O servidor público estável só perderá o cargo","alternativas":["em virtude de sentença judicial.","mediante procedimento de avaliação periódica, assegurada ampla defesa.","pela extinção do cargo.","mediante ato discricionário de seu superior hierárquico.","mediante declaração administrativa que proclama a desnecessidade do servidor."],"correta":1,"explicacao":"Gabarito oficial: B. Art. 41, § 1º: o estável perde o cargo por sentença transitada em julgado, processo administrativo ou avaliação periódica de desempenho.","origem":"prova","fonte":"Vunesp · TJSP · Oficial de Justiça · 2009 · questão 44"},{"id":"oj-tjsp09-45","materia":"const","assunto":"Poder Judiciário (arts. 92 a 99)","enunciado":"Aos juízes, é vedado I. exercer, salvo se em disponibilidade, outro cargo ou função; II. dedicar-se à atividade político-partidária; III. exercer a advocacia no Tribunal do qual se afastou antes de decorridos 3 anos do afastamento do cargo por aposentadoria ou exoneração; IV. exercer o magistério. Estão corretas somente as assertivas","alternativas":["I, II e IV.","I e III.","II e III.","I, II e III.","II, III e IV."],"correta":2,"explicacao":"Gabarito oficial: C. Art. 95, parágrafo único: vedado exercer outro cargo \"ainda que em disponibilidade\", salvo magistério; II e III corretas.","origem":"prova","fonte":"Vunesp · TJSP · Oficial de Justiça · 2009 · questão 45"},{"id":"oj-tjsp09-46","materia":"const","assunto":"Tribunais dos Estados (art. 125)","enunciado":"A competência dos Tribunais dos Estados será definida na Constituição do Estado, sendo a lei de organização judiciária de iniciativa do","alternativas":["Tribunal de Justiça.","Governador do Estado.","Legislativo Estadual.","Supremo Tribunal Federal.","Superior Tribunal de Justiça."],"correta":0,"explicacao":"Gabarito oficial: A. Art. 125, § 1º: a lei de organização judiciária é de iniciativa do Tribunal de Justiça.","origem":"prova","fonte":"Vunesp · TJSP · Oficial de Justiça · 2009 · questão 46"},{"id":"oj-tjsp09-47","materia":"const","assunto":"Poder Judiciário","enunciado":"A homologação de sentenças estrangeiras e a concessão do exequatur às cartas rogatórias compete ao","alternativas":["Tribunal de Justiça do Estado.","Juiz Federal.","Tribunal Regional Federal.","Superior Tribunal de Justiça.","Supremo Tribunal Federal."],"correta":3,"explicacao":"Gabarito oficial: D. Art. 105, I, \"i\": compete ao STJ homologar sentenças estrangeiras e conceder exequatur.","origem":"prova","fonte":"Vunesp · TJSP · Oficial de Justiça · 2009 · questão 47","extra":true},{"id":"oj-tjsp09-48","materia":"const","assunto":"Poder Judiciário (art. 93)","enunciado":"Leia as proposições: I. a distribuição de processos será imediata, em todos os graus de jurisdição; II. o juiz titular residirá na respectiva comarca, salvo autorização do tribunal; III. as decisões administrativas dos tribunais serão motivadas e em sessão pública. É correto afirmar que","alternativas":["apenas I está correta.","apenas II está correta.","apenas III está correta.","todas estão erradas.","todas estão corretas. 10 sos.com.br"],"correta":4,"explicacao":"Gabarito oficial: E. Art. 93, VII, X e XV: as três afirmações estão no texto constitucional.","origem":"prova","fonte":"Vunesp · TJSP · Oficial de Justiça · 2009 · questão 48"},{"id":"oj-tjsp09-49","materia":"adm","assunto":"Estatuto SP - proibições (art. 242)","enunciado":"Conforme o Estatuto dos Funcionários Públicos do Estado de São Paulo, ao funcionário é proibido","alternativas":["guardar sigilo sobre os assuntos da repartição e, especialmente, sobre despachos, decisões ou providências.","fazer qualquer tipo de referência em informação, parecer ou despacho, ou pela imprensa, ou qualquer meio de divulgação, às autoridades constituídas e aos atos da Administração.","servir de intermediário perante qualquer repartição pública para tratar de interesse de cônjuge ou parente até segundo grau.","promover ou subscrever listas de donativos dentro da repartição.","ser acionista, quotista ou comanditário de sociedades comerciais."],"correta":3,"explicacao":"Gabarito oficial: D. Art. 242 da Lei 10.261/68: é proibido promover ou subscrever listas de donativos dentro da repartição.","origem":"prova","fonte":"Vunesp · TJSP · Oficial de Justiça · 2009 · questão 49"},{"id":"oj-tjsp09-50","materia":"adm","assunto":"Estatuto SP - penalidades","enunciado":"Considerando-se o disposto na Lei n.º 10.261/68, se um funcionário público solicitar presentes a alguém, ainda que fora de suas funções mas em razão delas, ficará sujeito à pena de","alternativas":["suspensão simples.","demissão simples.","exoneração.","demissão a bem do serviço público.","suspensão, com perda dos direitos e vantagens do cargo."],"correta":3,"explicacao":"Gabarito oficial: D. Art. 257: pedir ou aceitar presentes em razão das funções gera demissão a bem do serviço público.","origem":"prova","fonte":"Vunesp · TJSP · Oficial de Justiça · 2009 · questão 50","extra":true},{"id":"oj-tjsp09-51","materia":"adm","assunto":"Estatuto SP - prescrição","enunciado":"Nos termos da Lei n.º 10.261/68, no que se refere à falta do funcionário público sujeita à cassação de aposentadoria, a sua punibilidade prescreverá no prazo de","alternativas":["1 ano.","2 anos.","5 anos.","8 anos.","10 anos."],"correta":2,"explicacao":"Gabarito oficial: C. Art. 261: prescrevem em 5 anos as faltas sujeitas a demissão e cassação de aposentadoria.","origem":"prova","fonte":"Vunesp · TJSP · Oficial de Justiça · 2009 · questão 51","extra":true},{"id":"oj-tjsp09-52","materia":"adm","assunto":"Estatuto SP - processo disciplinar","enunciado":"Determinada a instauração de sindicância ou processo administrativo, ou no seu curso, havendo conveniência para a instrução ou para o serviço, poderá o Chefe de Gabinete, por despacho fundamentado, nos termos do que dispõe a Lei n.º 10.261/68, ordenar a seguinte providência:","alternativas":["afastamento imediato do servidor, com prejuízo de vencimentos ou vantagens, até 180 (cento e oitenta) dias, prorrogáveis uma única vez por igual período.","designação do servidor acusado para o exercício de atividades exclusivamente burocráticas até decisão final do procedimento.","colocar o servidor acusado em disponibilidade, sem prejuízos dos seus vencimentos ou vantagens do cargo, por até um ano ou até que sobrevenha a decisão final do respectivo processo administrativo.","proibição de comparecer ao órgão público onde se encontra lotado até a solução final do procedimento.","comparecimento facultativo, em periodicidade mensal, para tomar ciência dos atos do procedimento."],"correta":1,"explicacao":"Gabarito oficial: B. Art. 266: o servidor pode ser designado para atividades exclusivamente burocráticas até a decisão final.","origem":"prova","fonte":"Vunesp · TJSP · Oficial de Justiça · 2009 · questão 52","extra":true},{"id":"oj-tjsp09-65","materia":"mat","assunto":"Frações","enunciado":"Uma dívida será paga em 20 parcelas mensais fixas e iguais, sendo que, hoje, o valor de cada parcela representa 1/4 do salário líquido mensal do devedor. Hoje, o salário líquido mensal do devedor representa, do valor total da dívida,","alternativas":["1/10.","1/9.","1/8.","1/7.","1/5."],"correta":4,"explicacao":"Gabarito oficial: E. Parcela = S/4 → dívida = 20 × S/4 = 5S. Logo S = 1/5 da dívida.","origem":"prova","fonte":"Vunesp · TJSP · Oficial de Justiça · 2009 · questão 65"},{"id":"oj-tjsp09-66","materia":"mat","assunto":"Geometria: perímetro e área","enunciado":"Um terreno retangular, de lados iguais a x e y, tem 72 metros de perímetro. Outro terreno, também retangular e de lados iguais a y e z, tem 104 metros de perímetro. Sabendo-se que a medida do lado x é igual ao dobro da medida do lado y, pode-se concluir que a diferença entre as áreas desses dois terrenos é","alternativas":["144 m².","192 m².","222 m².","240 m².","248 m²."],"correta":1,"explicacao":"Gabarito oficial: B. x = 2y e 2(x+y) = 72 → y = 12, x = 24. 2(y+z) = 104 → z = 40. Áreas: 288 e 480; diferença 192 m².","origem":"prova","fonte":"Vunesp · TJSP · Oficial de Justiça · 2009 · questão 66"},{"id":"oj-tjsp09-67","materia":"mat","assunto":"Juros simples","enunciado":"Em um mesmo dia, 1/3 de certo capital foi aplicado por 8 meses a uma taxa de juro simples de 18% ao ano, e o restante foi aplicado também por 8 meses, mas a uma taxa de juro simples de 21% ao ano. No final, obteve-se um total de R$ 6.800,00 de juros pelas duas aplicações. O valor total aplicado foi","alternativas":["R$ 51.000,00.","R$ 48.000,00.","R$ 45.000,00.","R$ 42.000,00.","R$ 40.000,00."],"correta":0,"explicacao":"Gabarito oficial: A. C/3 × 0,12 + 2C/3 × 0,14 = 6.800 (taxas de 8 meses) → C(0,04 + 0,0933) = 6.800 → C = 51.000.","origem":"prova","fonte":"Vunesp · TJSP · Oficial de Justiça · 2009 · questão 67"},{"id":"oj-tjsp09-68","materia":"mat","assunto":"Divisão proporcional","enunciado":"Face a uma emergência, uma pessoa emprestou R$ 1.200,00 de um amigo, R$ 1.080,00 de outro e R$ 920,00 de um terceiro amigo, prometendo pagar a todos em uma determinada data, sem juros. Na data combinada, essa pessoa dispunha de apenas R$ 2.800,00, e decidiu pagar a cada um deles quantias diretamente proporcionais aos valores emprestados. Dessa maneira, ao amigo que emprestou a maior quantia ela continuou devendo","alternativas":["R$ 170,00.","R$ 165,00.","R$ 150,00.","R$ 135,00.","R$ 125,00."],"correta":2,"explicacao":"Gabarito oficial: C. Total devido 3.200; paga 2.800 = 87,5%. Ao de 1.200 paga 1.050 e fica devendo 150.","origem":"prova","fonte":"Vunesp · TJSP · Oficial de Justiça · 2009 · questão 68"},{"id":"oj-tjsp09-69","materia":"mat","assunto":"Sistemas de equações","enunciado":"Em uma biblioteca escolar, uma pilha de 50 livros tinha 1,8 m de altura e era formada por livros paradidáticos iguais, de 3 cm de espessura, e livros didáticos iguais, de 6 cm de espessura. A bibliotecária retirou metade dos livros didáticos da pilha, para arrumá-los numa estante e, assim, a altura da pilha foi reduzida em","alternativas":["30 cm.","42 cm.","50 cm.","56 cm.","60 cm."],"correta":0,"explicacao":"Gabarito oficial: A. p + d = 50 e 3p + 6d = 180 → d = 10. Retirar 5 didáticos reduz 30 cm.","origem":"prova","fonte":"Vunesp · TJSP · Oficial de Justiça · 2009 · questão 69"},{"id":"oj-tjsp09-70","materia":"mat","assunto":"Porcentagem","enunciado":"Para obter dinheiro rapidamente e não perder um negócio de ocasião, uma pessoa vendeu os dois carros que possuía por R$ 24.000,00 cada um, tendo, em relação aos preços pagos ao comprá-los, um prejuízo de 20% na venda do carro A e um lucro de igual porcentual na venda do carro B. Em relação aos preços de compra, é correto afirmar que, na venda de ambos, essa pessoa","alternativas":["teve um lucro total de R$ 2.000,00.","teve um lucro total de R$ 1.200,00.","não teve lucro nem prejuízo.","teve um prejuízo total de R$ 1.200,00.","teve um prejuízo total de R$ 2.000,00."],"correta":4,"explicacao":"Gabarito oficial: E. A custou 30.000 (perda 6.000); B custou 20.000 (ganho 4.000). Prejuízo total: 2.000.","origem":"prova","fonte":"Vunesp · TJSP · Oficial de Justiça · 2009 · questão 70"},{"id":"oj-tjsp09-72","materia":"mat","assunto":"Razão e proporção","enunciado":"No tanque completamente vazio de um carro bicombustível, foram colocados 9 litros de gasolina e 15 litros de álcool. Num segundo momento, sem que o carro tivesse saído do posto, foram colocados mais alguns litros de álcool, e a razão entre o número de litros de álcool e o número de litros de gasolina contidos no tanque passou a ser de 3 para 1. O número de litros de álcool colocados nesse segundo momento foi","alternativas":["8.","9.","12.","15.","16."],"correta":2,"explicacao":"Gabarito oficial: C. Álcool = 3 × 9 = 27 litros; já havia 15, logo foram colocados 12.","origem":"prova","fonte":"Vunesp · TJSP · Oficial de Justiça · 2009 · questão 72"},{"id":"oj-tjm11-04","materia":"port","assunto":"Interpretação de texto","enunciado":"De acordo com o texto, a inseminação do sêmen do israelense morto","alternativas":["será permitida em função de sua declaração escrita, mas, mesmo assim, a decisão dos magistrados enfrentará um problema ético e, por isso, alterará radicalmente a lei.","encontra barreira na lei para acontecer, por isso os magistrados não apenas se restringirão a ela para decidir, mas também se fundamentarão nos costumes e hábitos do povo.","é fato incapaz de gerar polêmica entre os magistrados, pois estes certamente desconsiderarão a vontade do próprio morto e a dos seus pais.","ocorrerá se os pais do moço a quiserem realmente, sem que a decisão dos magistrados implique a possibilidade de que haja alterações na legislação de Israel.","seria impossível mesmo com um documento do rapaz, pois é certo que a decisão dos magistrados jamais convalidaria valores contrários à filosofia prática."],"correta":1,"explicacao":"Gabarito oficial: B. A lei não endossa a inseminação, e os juízes \"não poderão ficar somente com o código nas mãos\": vão considerar o ethos (costumes) do povo.","origem":"prova","fonte":"Vunesp · TJM-SP · Oficial de Justiça · 2011 · questão 4","texto":"O sêmen em busca de uma ética\n\nO moço israelense está morto. Todavia, ele ainda pode gerar uma vida. Seus pais estão de posse de seu sêmen e querem a autorização da justiça de Israel para terem um neto. A Ciência permite, mas a lei não endossa. A notícia está na Folha de S.Paulo de 10.02.11.\n(...)\nAs leis de Israel, segundo uma boa parte dos seus juízes, dizem que a inseminação não poderá ser efetuada. Não há qualquer documento que o morto tenha deixado escrito dizendo que gostaria de ter um filho após sua morte e com uma mulher escolhida pelos pais. Mas os pais argumentam que, se o filho era um doador de órgãos, por qual razão o que é expelido por um órgão do seu corpo também não poderia ser utilizado em favor da vida?\nCom efeito, nem todos os juízes pendem para o mesmo lado. Assim, eis que os magistrados não poderão ficar somente com o código nas mãos. (...)\nO que os magistrados enfrentarão será um problema típico de filosofia prática, ou seja, de ética. Eles estarão enredados na decisão sobre se o ethos* do povo, os costumes e hábitos, pedem ou não para que a lei mude.\n\n* ethos: conjunto dos costumes e hábitos fundamentais, no âmbito do comportamento (instituições, afazeres etc.) e da cultura (valores, ideias ou crenças), característicos de uma determinada coletividade, época ou região.\n(Filosofia: Conhecimento Prático, n.º 29, 2011. Adaptado)"},{"id":"oj-tjm11-05","materia":"port","assunto":"Sinônimos","enunciado":"O termo destacado no trecho – ... mas a lei não endossa. – é sinônimo de","alternativas":["invalida.","obriga.","prescreve.","proíbe.","apoia."],"correta":4,"explicacao":"Gabarito oficial: E. \"Endossar\" = apoiar, aprovar.","origem":"prova","fonte":"Vunesp · TJM-SP · Oficial de Justiça · 2011 · questão 5","texto":"O sêmen em busca de uma ética\n\nO moço israelense está morto. Todavia, ele ainda pode gerar uma vida. Seus pais estão de posse de seu sêmen e querem a autorização da justiça de Israel para terem um neto. A Ciência permite, mas a lei não endossa. A notícia está na Folha de S.Paulo de 10.02.11.\n(...)\nAs leis de Israel, segundo uma boa parte dos seus juízes, dizem que a inseminação não poderá ser efetuada. Não há qualquer documento que o morto tenha deixado escrito dizendo que gostaria de ter um filho após sua morte e com uma mulher escolhida pelos pais. Mas os pais argumentam que, se o filho era um doador de órgãos, por qual razão o que é expelido por um órgão do seu corpo também não poderia ser utilizado em favor da vida?\nCom efeito, nem todos os juízes pendem para o mesmo lado. Assim, eis que os magistrados não poderão ficar somente com o código nas mãos. (...)\nO que os magistrados enfrentarão será um problema típico de filosofia prática, ou seja, de ética. Eles estarão enredados na decisão sobre se o ethos* do povo, os costumes e hábitos, pedem ou não para que a lei mude.\n\n* ethos: conjunto dos costumes e hábitos fundamentais, no âmbito do comportamento (instituições, afazeres etc.) e da cultura (valores, ideias ou crenças), característicos de uma determinada coletividade, época ou região.\n(Filosofia: Conhecimento Prático, n.º 29, 2011. Adaptado)"},{"id":"oj-tjm11-06","materia":"port","assunto":"Conectivos e reescrita","enunciado":"Sem que haja alteração de sentido, unindo-se em um só período as frases do trecho – O moço israelense está morto. Todavia, ele ainda pode gerar uma vida. – obtém-se:","alternativas":["Se o moço israelense está morto, ele ainda pode gerar uma vida.","O moço israelense está morto, portanto ele ainda pode gerar uma vida.","Apesar de o moço israelense estar morto, ele ainda pode gerar uma vida.","Quando o moço israelense estiver morto, ele ainda poderá gerar uma vida.","O moço israelense está morto, pois ele ainda pode gerar uma vida."],"correta":2,"explicacao":"Gabarito oficial: C. \"Todavia\" indica oposição/concessão; \"Apesar de\" mantém esse sentido.","origem":"prova","fonte":"Vunesp · TJM-SP · Oficial de Justiça · 2011 · questão 6","texto":"O sêmen em busca de uma ética\n\nO moço israelense está morto. Todavia, ele ainda pode gerar uma vida. Seus pais estão de posse de seu sêmen e querem a autorização da justiça de Israel para terem um neto. A Ciência permite, mas a lei não endossa. A notícia está na Folha de S.Paulo de 10.02.11.\n(...)\nAs leis de Israel, segundo uma boa parte dos seus juízes, dizem que a inseminação não poderá ser efetuada. Não há qualquer documento que o morto tenha deixado escrito dizendo que gostaria de ter um filho após sua morte e com uma mulher escolhida pelos pais. Mas os pais argumentam que, se o filho era um doador de órgãos, por qual razão o que é expelido por um órgão do seu corpo também não poderia ser utilizado em favor da vida?\nCom efeito, nem todos os juízes pendem para o mesmo lado. Assim, eis que os magistrados não poderão ficar somente com o código nas mãos. (...)\nO que os magistrados enfrentarão será um problema típico de filosofia prática, ou seja, de ética. Eles estarão enredados na decisão sobre se o ethos* do povo, os costumes e hábitos, pedem ou não para que a lei mude.\n\n* ethos: conjunto dos costumes e hábitos fundamentais, no âmbito do comportamento (instituições, afazeres etc.) e da cultura (valores, ideias ou crenças), característicos de uma determinada coletividade, época ou região.\n(Filosofia: Conhecimento Prático, n.º 29, 2011. Adaptado)"},{"id":"oj-tjm11-07","materia":"port","assunto":"Colocação pronominal e regência","enunciado":"Considere as versões da frase \"A Ciência permite, mas a lei não endossa\": I. A Ciência permite a inseminação, mas a lei não a endossa. II. A Ciência permite que seja feita a inseminação, mas a lei não endossa-a. III. A Ciência permite que se realize a inseminação, mas a lei não lhe endossa. De acordo com a norma-padrão, está correto apenas o contido em","alternativas":["I.","II.","III.","I e II.","I e III."],"correta":0,"explicacao":"Gabarito oficial: A. \"Endossar\" é transitivo direto (pronome \"a\", não \"lhe\"), e o \"não\" atrai o pronome (próclise): \"não a endossa\". Só I está correta.","origem":"prova","fonte":"Vunesp · TJM-SP · Oficial de Justiça · 2011 · questão 7","texto":"O sêmen em busca de uma ética\n\nO moço israelense está morto. Todavia, ele ainda pode gerar uma vida. Seus pais estão de posse de seu sêmen e querem a autorização da justiça de Israel para terem um neto. A Ciência permite, mas a lei não endossa. A notícia está na Folha de S.Paulo de 10.02.11.\n(...)\nAs leis de Israel, segundo uma boa parte dos seus juízes, dizem que a inseminação não poderá ser efetuada. Não há qualquer documento que o morto tenha deixado escrito dizendo que gostaria de ter um filho após sua morte e com uma mulher escolhida pelos pais. Mas os pais argumentam que, se o filho era um doador de órgãos, por qual razão o que é expelido por um órgão do seu corpo também não poderia ser utilizado em favor da vida?\nCom efeito, nem todos os juízes pendem para o mesmo lado. Assim, eis que os magistrados não poderão ficar somente com o código nas mãos. (...)\nO que os magistrados enfrentarão será um problema típico de filosofia prática, ou seja, de ética. Eles estarão enredados na decisão sobre se o ethos* do povo, os costumes e hábitos, pedem ou não para que a lei mude.\n\n* ethos: conjunto dos costumes e hábitos fundamentais, no âmbito do comportamento (instituições, afazeres etc.) e da cultura (valores, ideias ou crenças), característicos de uma determinada coletividade, época ou região.\n(Filosofia: Conhecimento Prático, n.º 29, 2011. Adaptado)"},{"id":"oj-tjm11-09","materia":"port","assunto":"Pronomes relativos","enunciado":"Garantindo a coesão e a coerência do texto, a lacuna deve ser preenchida com","alternativas":["dos quais","cujos","que os","aos quais os","onde"],"correta":1,"explicacao":"Gabarito oficial: B. \"Operação cujos rastros...\": \"cujo\" indica posse e concorda com o termo seguinte (rastros).","origem":"prova","fonte":"Vunesp · TJM-SP · Oficial de Justiça · 2011 · questão 9","texto":"A política nunca foi tão cabeluda\n\nUma ideia tentadora vem mexendo com a cabeça de políticos brasileiros – do alto e do baixo clero, da esquerda e da direita, de diferentes idades e dos mais variados estados da federação. Trata-se de uma operação cabeluda, ________ rastros os envolvidos se esforçam para ocultar. Feita entre quatro paredes, conta sempre com pouquíssimas testemunhas e apresenta risco baixíssimo. Já o resultado é altamente compensador, segundo os que já participaram dela. E eles nunca foram tantos. No mundo inteiro, a cirurgia de implante capilar cresceu 50% entre 2004 e 2008.\n(Veja, 25.05.2011)"},{"id":"oj-tjm11-10","materia":"port","assunto":"Sentido figurado","enunciado":"Considerando o texto, é correto afirmar que o termo cabeluda, no título, sinaliza que os políticos têm","alternativas":["proibido o implante de cabelo.","coibido as ilegalidades.","se envolvido em ilegalidades.","assumido visuais ridículos.","aderido ao implante capilar."],"correta":4,"explicacao":"Gabarito oficial: E. O texto brinca com o duplo sentido: a \"operação cabeluda\" é o implante capilar, que cresceu entre os políticos.","origem":"prova","fonte":"Vunesp · TJM-SP · Oficial de Justiça · 2011 · questão 10","texto":"A política nunca foi tão cabeluda\n\nUma ideia tentadora vem mexendo com a cabeça de políticos brasileiros – do alto e do baixo clero, da esquerda e da direita, de diferentes idades e dos mais variados estados da federação. Trata-se de uma operação cabeluda, ________ rastros os envolvidos se esforçam para ocultar. Feita entre quatro paredes, conta sempre com pouquíssimas testemunhas e apresenta risco baixíssimo. Já o resultado é altamente compensador, segundo os que já participaram dela. E eles nunca foram tantos. No mundo inteiro, a cirurgia de implante capilar cresceu 50% entre 2004 e 2008.\n(Veja, 25.05.2011)"},{"id":"oj-tjm11-11","materia":"mat","assunto":"Frações","enunciado":"Do valor total recebido por um trabalho executado, Pedro ficou com 2/5 e João ficou com o restante. Da parte que lhe coube, João emprestou R$ 800,00 a Pedro, para que ele pudesse comprar uma televisão e, assim, Pedro ficou com o quádruplo da quantia que restou a João. Após o empréstimo, Pedro ficou com","alternativas":["R$ 2.000,00.","R$ 1.800,00.","R$ 1.700,00.","R$ 1.600,00.","R$ 1.400,00."],"correta":3,"explicacao":"Gabarito oficial: D. 2T/5 + 800 = 4(3T/5 − 800) → T = 2.000. Pedro: 800 + 800 = R$ 1.600,00.","origem":"prova","fonte":"Vunesp · TJM-SP · Oficial de Justiça · 2011 · questão 11"},{"id":"oj-tjm11-12","materia":"mat","assunto":"MDC","enunciado":"Ao longo de um dia, um supermercado fez vários anúncios dos produtos A, B e C, todos eles com o mesmo tempo de duração. Os tempos totais de aparição dos produtos A, B e C foram, respectivamente, iguais a 90 s, 108 s e 144 s. Se a duração de cada anúncio, em segundos, foi a maior possível, então, a soma do número de aparições dos três produtos, nesse dia, foi igual a","alternativas":["14.","15.","17.","18.","19."],"correta":4,"explicacao":"Gabarito oficial: E. MDC(90, 108, 144) = 18 s. Aparições: 5 + 6 + 8 = 19.","origem":"prova","fonte":"Vunesp · TJM-SP · Oficial de Justiça · 2011 · questão 12"},{"id":"oj-tjm11-13","materia":"mat","assunto":"Divisão inversamente proporcional","enunciado":"Três estudantes dividiram o gasto de uma maquete de forma inversamente proporcional às horas trabalhadas. Bruno pagou R$ 100,00 e trabalhou 20 horas; Eduardo pagou x e trabalhou 25 horas; Flávio pagou R$ 125,00 e trabalhou y horas. Então x e y valem, respectivamente,","alternativas":["R$ 125,00 e 18 horas.","R$ 80,00 e 16 horas.","R$ 80,00 e 18 horas.","R$ 70,00 e 16 horas.","R$ 60,00 e 14 horas."],"correta":1,"explicacao":"Gabarito oficial: B. Valor × horas é constante: 100 × 20 = 2.000. x = 2.000/25 = 80; y = 2.000/125 = 16.","origem":"prova","fonte":"Vunesp · TJM-SP · Oficial de Justiça · 2011 · questão 13"},{"id":"oj-tjm11-14","materia":"mat","assunto":"Porcentagem","enunciado":"No 2.º semestre, a receita líquida (RL) de certa empresa subiu 45% em relação à do semestre anterior, totalizando 725 milhões, enquanto o lucro líquido (LL) teve uma queda de 15% em relação ao do semestre anterior, totalizando 85 milhões. No semestre anterior, a razão LL/RL foi igual a","alternativas":["1/6.","1/5.","1/4.","3/8.","2/5."],"correta":1,"explicacao":"Gabarito oficial: B. RL anterior = 725/1,45 = 500; LL anterior = 85/0,85 = 100. Razão = 100/500 = 1/5.","origem":"prova","fonte":"Vunesp · TJM-SP · Oficial de Justiça · 2011 · questão 14"},{"id":"oj-tjm11-15","materia":"mat","assunto":"Regra de três","enunciado":"O veículo de entregas transporta 60 caixas S (maiores) ou 300 caixas T (menores), mantida a proporcionalidade. Se forem colocadas apenas 45 caixas S no veículo, será possível transportar, no mesmo carregamento, um número de caixas T igual a","alternativas":["75.","70.","65.","60.","55."],"correta":0,"explicacao":"Gabarito oficial: A. 45 S ocupam 3/4 do veículo; sobra 1/4, que cabe 300/4 = 75 caixas T.","origem":"prova","fonte":"Vunesp · TJM-SP · Oficial de Justiça · 2011 · questão 15"},{"id":"oj-tjm11-16","materia":"mat","assunto":"Média ponderada","enunciado":"Um atacadista teve o faturamento do dia distribuído assim: 15% à vista; 20% em 30 dias; 35% em 60 dias; 20% em 90 dias; 10% em 120 dias. O prazo médio, em dias, para pagamento das vendas desse dia é igual a","alternativas":["75.","67.","60.","57.","55."],"correta":3,"explicacao":"Gabarito oficial: D. 0,15×0 + 0,20×30 + 0,35×60 + 0,20×90 + 0,10×120 = 6 + 21 + 18 + 12 = 57 dias.","origem":"prova","fonte":"Vunesp · TJM-SP · Oficial de Justiça · 2011 · questão 16"},{"id":"oj-tjm11-17","materia":"mat","assunto":"Equações do 1º grau","enunciado":"Em um treino, o piloto A deu mais voltas que o piloto B, e a soma das voltas dos dois foi 100. Dividindo-se as voltas de A pelas de B, o quociente é 5 e o resto é 10. A diferença entre as voltas de A e de B, nessa ordem, é igual a","alternativas":["85.","80.","70.","65.","60."],"correta":2,"explicacao":"Gabarito oficial: C. A = 5B + 10 e A + B = 100 → 6B = 90 → B = 15, A = 85. Diferença: 70.","origem":"prova","fonte":"Vunesp · TJM-SP · Oficial de Justiça · 2011 · questão 17"},{"id":"oj-tjm11-19","materia":"mat","assunto":"Volume","enunciado":"Um recipiente em forma de paralelepípedo mede 15 cm de comprimento por 10 cm de largura e contém água até a metade da sua capacidade. Se retirarmos 2/5 da água, o volume restante será 360 cm³. A altura desse recipiente, em centímetros, é","alternativas":["14.","12.","10.","9.","8."],"correta":4,"explicacao":"Gabarito oficial: E. 3/5 da metade = 360 → metade = 600 → capacidade 1.200 = 15 × 10 × h → h = 8 cm.","origem":"prova","fonte":"Vunesp · TJM-SP · Oficial de Justiça · 2011 · questão 19"},{"id":"oj-tjm11-31","materia":"const","assunto":"Direito de petição","enunciado":"Relativamente ao direito de petição, é correto afirmar que I. é assegurado a qualquer pessoa, física ou jurídica, independentemente de pagamento; II. ao servidor é assegurado o direito de requerer ou representar, bem como pedir reconsideração e recorrer de decisões, no prazo de 30 dias, salvo previsão legal específica; III. é assegurado a pessoa física, independentemente de pagamento, e a pessoa jurídica mediante recolhimento de taxa; IV. a administração somente poderá recusar quando verificar a falta de fundamento que justifique o pedido. Está correto o contido em","alternativas":["I, II e III, apenas.","I e II, apenas.","I, II e IV, apenas.","III e IV, apenas.","I, II, III e IV."],"correta":1,"explicacao":"Gabarito oficial: B. CF, art. 5º, XXXIV, \"a\": direito de petição a todos, sem pagamento de taxas. O Estatuto SP garante ao servidor requerer, pedir reconsideração e recorrer.","origem":"prova","fonte":"Vunesp · TJM-SP · Oficial de Justiça · 2011 · questão 31"},{"id":"oj-tjm11-32","materia":"adm","assunto":"Estatuto SP - abandono de cargo","enunciado":"Nos termos do Estatuto dos Funcionários Públicos Civis do Estado de São Paulo, o processo instaurado exclusivamente para apurar o abandono do cargo ou função será extinto","alternativas":["na hipótese de o funcionário faltar novamente ao serviço, após a sua apresentação legal, passando à condição de contumaz.","quando o funcionário pedir exoneração, até a data da solução final do processo.","apenas na hipótese de morte do funcionário.","se o indiciado pedir exoneração até a data designada para o interrogatório, ou por ocasião deste.","quando a revelia do funcionário for declarada administrativamente e publicada."],"correta":3,"explicacao":"Gabarito oficial: D. Lei 10.261/68: o processo só para apurar abandono se extingue se o indiciado pedir exoneração até o interrogatório, ou nele.","origem":"prova","fonte":"Vunesp · TJM-SP · Oficial de Justiça · 2011 · questão 32","extra":true},{"id":"oj-tjm11-33","materia":"adm","assunto":"Estatuto SP - prescrição","enunciado":"Extingue-se a punibilidade pela prescrição da falta sujeita à pena de:","alternativas":["repreensão, demissão e suspensão, em 4 (quatro) anos.","demissão e de cassação da aposentadoria, em 10 (dez) anos.","advertência, suspensão ou multa, em 2 (dois) anos.","repreensão, expulsão ou multa, em 5 (cinco) anos.","repreensão, suspensão ou multa, em 2 (dois) anos."],"correta":4,"explicacao":"Gabarito oficial: E. Lei 10.261/68, art. 261: repreensão, suspensão ou multa prescrevem em 2 anos; demissão e cassação, em 5 anos.","origem":"prova","fonte":"Vunesp · TJM-SP · Oficial de Justiça · 2011 · questão 33","extra":true},{"id":"oj-tjm11-34","materia":"adm","assunto":"Estatuto SP - proibições (art. 243)","enunciado":"Nos termos do Estatuto dos Funcionários Públicos Civis do Estado de São Paulo, é proibido ao funcionário público I. participar na gerência ou administração de empresas bancárias ou industriais, ou de sociedades comerciais, que mantenham relações com o Governo do Estado, sejam por este subvencionadas ou estejam relacionadas com a finalidade da repartição em que esteja lotado; II. entreter-se, durante as horas de trabalho, em palestras, leituras ou outras atividades estranhas ao serviço; III. referir-se depreciativamente, em informação, parecer ou despacho, ou pela imprensa, às autoridades constituídas; IV. exercer, mesmo fora das horas de trabalho, emprego ou função em empresas que tenham relações com o Governo, em matéria que se relacione com a finalidade da repartição em que esteja lotado. Está correto o contido em","alternativas":["I, II e IV, apenas.","III e IV, apenas.","I, II e III, apenas.","I e III, apenas.","I, II, III e IV."],"correta":0,"explicacao":"Gabarito oficial: A (I, II e IV, arts. 242 e 243 da Lei 10.261/68). Atenção: o art. 242 também proíbe a referência depreciativa às autoridades, mas ressalva a crítica em trabalho assinado; a banca considerou a III incorreta.","origem":"prova","fonte":"Vunesp · TJM-SP · Oficial de Justiça · 2011 · questão 34"},{"id":"oj-tjm11-41","materia":"penal","assunto":"Advocacia administrativa (art. 321)","enunciado":"Assinale a alternativa que completa, correta e respectivamente, as lacunas do art. 321 do CP (advocacia administrativa): \"Patrocinar, ______, interesse ______ perante a administração pública, valendo-se da qualidade de funcionário.\"","alternativas":["diretamente ... próprio","direta ou indiretamente ... privado","ainda que indiretamente ... próprio","diretamente ... pessoal ou de terceiro","direta ou indiretamente ... público ou privado"],"correta":1,"explicacao":"Gabarito oficial: B. Art. 321, CP: \"Patrocinar, direta ou indiretamente, interesse privado perante a administração pública, valendo-se da qualidade de funcionário\".","origem":"prova","fonte":"Vunesp · TJM-SP · Oficial de Justiça · 2011 · questão 41"},{"id":"oj-tjm11-42","materia":"penal","assunto":"Corrupção passiva (art. 317)","enunciado":"No crime de corrupção passiva (CP, art. 317), o agente ______, para si ou para outrem, direta ou indiretamente, ainda que fora da função ou antes de assumi-la, mas em razão dela, vantagem indevida. Completa corretamente a lacuna:","alternativas":["exige ou ordena","solicita ou recebe","recebe ou adquire","pleiteia ou sugere","estipula ou agencia"],"correta":1,"explicacao":"Gabarito oficial: B. Art. 317: \"Solicitar ou receber... ou aceitar promessa de tal vantagem\". \"Exigir\" é concussão (art. 316).","origem":"prova","fonte":"Vunesp · TJM-SP · Oficial de Justiça · 2011 · questão 42"},{"id":"oj-tjm11-43","materia":"penal","assunto":"Desobediência a decisão judicial (art. 359)","enunciado":"O crime de desobediência a decisão judicial sobre perda ou suspensão de direito (art. 359 do CP)","alternativas":["comina, cumulativamente, pena de reclusão e multa.","comina, cumulativamente, pena de detenção e multa.","tem pena aumentada se o agente pratica o fato com intuito de lucro.","tem pena aumentada se do fato resulta prejuízo à administração pública.","não exige, em sua descrição típica, que a decisão tenha transitado em julgado."],"correta":4,"explicacao":"Gabarito oficial: E. Art. 359: \"Exercer função, atividade, direito... de que foi suspenso ou privado por decisão judicial\" — pena de detenção de 3 meses a 2 anos, ou multa; o tipo não exige trânsito em julgado.","origem":"prova","fonte":"Vunesp · TJM-SP · Oficial de Justiça · 2011 · questão 43"},{"id":"oj-tjm11-47","materia":"const","assunto":"Direitos e garantias (art. 5º)","enunciado":"Determina o inc. IX do art. 5.º da Constituição que é livre a expressão da atividade intelectual, artística, científica e de comunicação,","alternativas":["mediante prévia obtenção de licença.","mediante prévia análise do órgão censor.","independentemente de censura ou licença.","mediante prévia aprovação por órgão catalogador.","independentemente de censura com relação às três primeiras atividades e mediante licença com relação à última."],"correta":2,"explicacao":"Gabarito oficial: C. Art. 5º, IX: \"independentemente de censura ou licença\".","origem":"prova","fonte":"Vunesp · TJM-SP · Oficial de Justiça · 2011 · questão 47"},{"id":"oj-tjm11-48","materia":"const","assunto":"Estabilidade (art. 41)","enunciado":"São estáveis após três anos de efetivo exercício os servidores nomeados para cargo de provimento efetivo em virtude de concurso público. O servidor estável perderá o cargo: I. em virtude de sentença judicial, ainda que não transitada em julgado; II. mediante processo administrativo em que lhe seja assegurada ampla defesa; III. mediante procedimento de avaliação periódica de desempenho, na forma de lei complementar, assegurada ampla defesa. Completa corretamente a proposição o que se afirma em","alternativas":["II, apenas.","I e II, apenas.","I e III, apenas.","II e III, apenas.","I, II e III."],"correta":3,"explicacao":"Gabarito oficial: D. Art. 41, § 1º: a sentença judicial precisa ter transitado em julgado. II e III estão corretas.","origem":"prova","fonte":"Vunesp · TJM-SP · Oficial de Justiça · 2011 · questão 48"},{"id":"oj-tjm11-49","materia":"const","assunto":"Poder Judiciário (art. 93)","enunciado":"Sobre os princípios aplicados aos magistrados (art. 93 da CF): I. não será promovido o juiz que, injustificadamente, retiver autos em seu poder além do prazo legal, não podendo devolvê-los ao cartório sem o devido despacho ou decisão; II. o juiz titular residirá na respectiva comarca, salvo autorização do tribunal; III. o ingresso na carreira dar-se-á mediante concurso público de provas e títulos, com a participação da OAB em todas as fases. É correto o que se afirma em","alternativas":["I, apenas.","II, apenas.","I e II, apenas.","II e III, apenas.","I, II e III."],"correta":4,"explicacao":"Gabarito oficial: E. Art. 93, I, II \"e\" e VII: as três afirmações reproduzem a Constituição.","origem":"prova","fonte":"Vunesp · TJM-SP · Oficial de Justiça · 2011 · questão 49"},{"id":"oj-q001","materia":"pcivil","assunto":"Oficial de justiça (art. 154)","enunciado":"Nos termos do art. 154 do CPC, incumbe ao oficial de justiça fazer pessoalmente citações, prisões, penhoras, arrestos e demais diligências próprias do seu ofício, sempre que possível","alternativas":["na presença do escrivão, certificando no mandado o ocorrido.","na presença de 2 (duas) testemunhas, certificando no mandado o ocorrido, com menção ao lugar, ao dia e à hora.","acompanhado de força policial, que assinará o auto.","na presença do advogado do autor, que rubricará a certidão.","na presença de 3 (três) testemunhas, que assinarão o mandado."],"correta":1,"explicacao":"Art. 154, I, CPC: \"sempre que possível na presença de 2 (duas) testemunhas, certificando no mandado o ocorrido, com menção ao lugar, ao dia e à hora\".","origem":"inedita","fonte":"Questão inédita (formato Vunesp)"},{"id":"oj-q002","materia":"pcivil","assunto":"Oficial de justiça (art. 154)","enunciado":"O oficial de justiça, ao cumprir mandado de citação, ouviu do réu uma proposta de acordo para encerrar a ação. De acordo com o CPC, o oficial deve","alternativas":["recusar-se a registrar a proposta, por não ter atribuição para tanto.","registrar a proposta apenas se o réu estiver acompanhado de advogado.","certificar a proposta no mandado; o juiz então intimará a outra parte para se manifestar em 5 dias, e o silêncio valerá como recusa.","certificar a proposta no mandado; o juiz suspenderá o processo por 30 dias para as partes negociarem.","comunicar a proposta diretamente ao advogado do autor, por telefone."],"correta":2,"explicacao":"Art. 154, VI e parágrafo único, CPC: o oficial certifica a proposta de autocomposição; o juiz intima a parte contrária para manifestar-se em 5 dias, sem prejuízo do andamento; o silêncio é recusa.","origem":"inedita","fonte":"Questão inédita (formato Vunesp)"},{"id":"oj-q003","materia":"pcivil","assunto":"Oficial de justiça (art. 155)","enunciado":"O escrivão, o chefe de secretaria e o oficial de justiça são responsáveis, civil e regressivamente, quando","alternativas":["praticarem qualquer ato posteriormente anulado, ainda que sem culpa.","sem justo motivo, se recusarem a cumprir no prazo os atos impostos pela lei ou pelo juiz, ou praticarem ato nulo com dolo ou culpa.","o processo demorar mais de um ano para ser julgado.","deixarem de recolher a taxa judiciária devida pelas partes.","a parte vencida não pagar as custas do processo."],"correta":1,"explicacao":"Art. 155, I e II, CPC: recusa sem justo motivo a cumprir no prazo os atos impostos, ou prática de ato nulo com dolo ou culpa.","origem":"inedita","fonte":"Questão inédita (formato Vunesp)"},{"id":"oj-q004","materia":"pcivil","assunto":"Auxiliares da justiça (art. 151)","enunciado":"Segundo o CPC, em cada comarca, seção ou subseção judiciária haverá, no mínimo,","alternativas":["um oficial de justiça para cada mil processos em andamento.","dois oficiais de justiça por vara.","tantos oficiais de justiça quantos forem os juízos.","um oficial de justiça por fórum, independentemente do número de juízos.","o número de oficiais de justiça fixado pelo Conselho Nacional de Justiça."],"correta":2,"explicacao":"Art. 151, CPC: \"Em cada comarca, seção ou subseção judiciária haverá, no mínimo, tantos oficiais de justiça quantos sejam os juízos.\"","origem":"inedita","fonte":"Questão inédita (formato Vunesp)"},{"id":"oj-q005","materia":"pcivil","assunto":"Depositário (arts. 159 a 161)","enunciado":"Sobre o depositário ou administrador de bens penhorados, é correto afirmar que","alternativas":["responde pelos prejuízos que, por dolo ou culpa, causar à parte, perdendo a remuneração que lhe foi arbitrada, mas tem direito a haver o que legitimamente despendeu.","não responde por prejuízos, pois atua por ordem do juiz.","se for infiel, pode ter a prisão civil decretada pelo juiz.","não tem direito a remuneração em nenhuma hipótese.","só responde se agir com dolo, nunca por culpa."],"correta":0,"explicacao":"Art. 161, CPC. A prisão civil do depositário infiel é proibida (Súmula Vinculante 25 do STF); ele responde civilmente, sem prejuízo da responsabilidade penal e de sanção por ato atentatório à dignidade da justiça.","origem":"inedita","fonte":"Questão inédita (formato Vunesp)"},{"id":"oj-q006","materia":"pcivil","assunto":"Tempo dos atos processuais (art. 212)","enunciado":"Os atos processuais serão realizados em dias úteis, das 6 às 20 horas. Independentemente de autorização judicial, podem ser realizados no período de férias forenses, nos feriados ou nos dias úteis fora desse horário","alternativas":["as audiências de instrução.","as citações, intimações e penhoras, observado o art. 5º, XI, da Constituição.","apenas os atos de tutela de urgência.","somente as citações por edital.","apenas as penhoras de dinheiro."],"correta":1,"explicacao":"Art. 212, § 2º, CPC. Atenção ao limite constitucional: em casa, sem consentimento, só durante o dia (CF, art. 5º, XI).","origem":"inedita","fonte":"Questão inédita (formato Vunesp)"},{"id":"oj-q007","materia":"pcivil","assunto":"Tempo dos atos processuais (art. 212)","enunciado":"O oficial de justiça iniciou uma penhora às 19h30 e, às 20h, ainda não a havia terminado. Se o adiamento prejudicar a diligência, ele","alternativas":["deve suspender o ato e voltar no dia seguinte, sob pena de nulidade.","pode concluir o ato depois das 20 horas.","precisa pedir autorização verbal ao juiz por telefone.","deve lavrar auto de penhora incompleto e devolver o mandado.","só pode continuar se o executado concordar por escrito."],"correta":1,"explicacao":"Art. 212, § 1º, CPC: serão concluídos depois das 20 horas os atos iniciados antes, quando o adiamento prejudicar a diligência ou causar grave dano.","origem":"inedita","fonte":"Questão inédita (formato Vunesp)"},{"id":"oj-q008","materia":"pcivil","assunto":"Prazos processuais (arts. 219 e 220)","enunciado":"Sobre a contagem de prazos no CPC, é correto afirmar:","alternativas":["prazos em dias são contados de forma contínua, incluindo sábados e domingos.","na contagem de prazo em dias, computam-se somente os dias úteis, e o curso dos prazos fica suspenso entre 20 de dezembro e 20 de janeiro, inclusive.","o prazo começa a correr no próprio dia da intimação.","durante a suspensão de fim de ano, os juízes ficam proibidos de despachar.","os prazos não se suspendem em nenhuma hipótese."],"correta":1,"explicacao":"Art. 219 (só dias úteis) e art. 220 (suspensão de 20/12 a 20/01), CPC.","origem":"inedita","fonte":"Questão inédita (formato Vunesp)"},{"id":"oj-q009","materia":"pcivil","assunto":"Início do prazo (art. 231)","enunciado":"Quando a citação ou intimação for feita por oficial de justiça, considera-se dia do começo do prazo","alternativas":["a data em que o réu assinou o mandado.","a data de juntada aos autos do mandado cumprido.","o quinto dia útil após a diligência.","a data da expedição do mandado.","o dia útil seguinte à publicação no Diário da Justiça."],"correta":1,"explicacao":"Art. 231, II, CPC. Pelo correio, conta da juntada do aviso de recebimento (inciso I). Com vários réus, da última juntada (§ 1º).","origem":"inedita","fonte":"Questão inédita (formato Vunesp)"},{"id":"oj-q010","materia":"pcivil","assunto":"Citação (arts. 238 a 240)","enunciado":"Sobre a citação no CPC, assinale a alternativa correta.","alternativas":["A citação válida, desde que ordenada por juiz competente, induz litispendência e constitui em mora o devedor.","O comparecimento espontâneo do réu não supre a falta de citação.","A citação válida, ainda quando ordenada por juízo incompetente, induz litispendência, torna litigiosa a coisa e constitui em mora o devedor.","A interrupção da prescrição só ocorre na data em que o réu é efetivamente citado.","A citação deve ser efetivada em até 90 dias da propositura da ação."],"correta":2,"explicacao":"Art. 240, CPC. O comparecimento espontâneo supre a falta (art. 239, § 1º); a interrupção da prescrição retroage à data da propositura (art. 240, § 1º); prazo de 45 dias para efetivar a citação (art. 238, parágrafo único).","origem":"inedita","fonte":"Questão inédita (formato Vunesp)"},{"id":"oj-q011","materia":"pcivil","assunto":"Citação (art. 244)","enunciado":"Salvo para evitar o perecimento do direito, NÃO se fará a citação","alternativas":["de noivos, nos 7 dias seguintes ao casamento.","de quem estiver participando de ato de culto religioso.","do cônjuge do morto, no dia do falecimento e nos 3 dias seguintes.","de quem estiver trabalhando.","de idosos com mais de 80 anos."],"correta":1,"explicacao":"Art. 244, CPC: culto religioso; parentes do morto no dia e nos 7 dias seguintes; noivos nos 3 primeiros dias após o casamento; doente enquanto grave o estado.","origem":"inedita","fonte":"Questão inédita (formato Vunesp)"},{"id":"oj-q012","materia":"pcivil","assunto":"Citação (art. 245)","enunciado":"Ao chegar para citar o réu, o oficial de justiça verifica que ele aparenta ser mentalmente incapaz de receber a citação. O oficial deve","alternativas":["citá-lo assim mesmo, entregando a contrafé a um parente.","deixar de citá-lo e descrever e certificar minuciosamente a ocorrência; o juiz nomeará médico para examiná-lo.","citá-lo por hora certa.","devolver o mandado sem certidão, para nova distribuição.","citar o síndico do prédio, que repassará a informação à família."],"correta":1,"explicacao":"Art. 245, CPC: não se faz a citação; o oficial certifica minuciosamente; o juiz nomeia médico (laudo em 5 dias) e, reconhecida a impossibilidade, nomeia curador, a quem se fará a citação.","origem":"inedita","fonte":"Questão inédita (formato Vunesp)"},{"id":"oj-q013","materia":"pcivil","assunto":"Modalidades de citação (arts. 246 e 247)","enunciado":"Desde a Lei 14.195/2021, a citação será feita preferencialmente","alternativas":["por oficial de justiça.","por edital publicado na internet.","por meio eletrônico, em até 2 dias úteis da decisão que a determinar, pelos endereços eletrônicos cadastrados.","pelo correio, com aviso de recebimento.","por telefone, com gravação da ligação."],"correta":2,"explicacao":"Art. 246, caput, CPC. Sem confirmação em 3 dias úteis, a citação segue pelo correio, oficial de justiça, escrivão ou edital (§ 1º-A).","origem":"inedita","fonte":"Questão inédita (formato Vunesp)"},{"id":"oj-q014","materia":"pcivil","assunto":"Modalidades de citação (art. 247)","enunciado":"A citação pelo correio é admitida para qualquer comarca do país, EXCETO, entre outros casos, quando","alternativas":["o réu for pessoa jurídica de direito privado.","o citando for incapaz ou pessoa de direito público, ou nas ações de estado.","o réu morar em outro estado.","o valor da causa passar de 40 salários mínimos.","o autor for beneficiário da gratuidade."],"correta":1,"explicacao":"Art. 247, CPC: ações de estado; citando incapaz; citando pessoa de direito público; local não atendido pela entrega domiciliar; autor que, justificadamente, pedir outra forma.","origem":"inedita","fonte":"Questão inédita (formato Vunesp)"},{"id":"oj-q015","materia":"pcivil","assunto":"Mandado de citação (art. 250)","enunciado":"Segundo o art. 250 do CPC, o mandado que o oficial de justiça tiver de cumprir conterá, entre outros elementos,","alternativas":["a assinatura do juiz e do advogado do autor.","a menção do prazo para contestar, sob pena de revelia, ou para embargar a execução.","o valor dos honorários do oficial de justiça.","a cópia integral dos autos.","a qualificação das testemunhas que acompanharão a diligência."],"correta":1,"explicacao":"Art. 250, II, CPC. O mandado é assinado pelo escrivão ou chefe de secretaria, que declara subscrevê-lo por ordem do juiz (inciso VI).","origem":"inedita","fonte":"Questão inédita (formato Vunesp)"},{"id":"oj-q016","materia":"pcivil","assunto":"Como citar (art. 251)","enunciado":"Incumbe ao oficial de justiça procurar o citando e, onde o encontrar, citá-lo","alternativas":["lendo-lhe o mandado e entregando-lhe a contrafé; portando por fé se recebeu ou recusou a contrafé; obtendo a nota de ciente ou certificando que o citando não a apôs no mandado.","entregando o mandado original e retendo a contrafé.","apenas por telefone, se o citando estiver viajando.","na presença obrigatória de um policial.","somente se o citando apresentar documento com foto."],"correta":0,"explicacao":"Art. 251, I a III, CPC.","origem":"inedita","fonte":"Questão inédita (formato Vunesp)"},{"id":"oj-q017","materia":"pcivil","assunto":"Citação por hora certa (art. 252)","enunciado":"Para a citação por hora certa no CPC, é necessário que o oficial de justiça","alternativas":["tenha procurado o citando 3 vezes, em dias diferentes.","tenha procurado o citando 2 vezes em seu domicílio ou residência sem o encontrar e haja suspeita de ocultação.","tenha autorização prévia do juiz em despacho específico.","encontre o citando e este se recuse a assinar o mandado.","não localize o endereço do citando."],"correta":1,"explicacao":"Art. 252, CPC: duas procuras sem êxito + suspeita de ocultação. O oficial intima pessoa da família ou, na falta, vizinho, de que voltará no dia útil imediato, na hora que designar. Não depende de despacho do juiz.","origem":"inedita","fonte":"Questão inédita (formato Vunesp)"},{"id":"oj-q018","materia":"pcivil","assunto":"Citação por hora certa (art. 252)","enunciado":"Em condomínio edilício com controle de acesso, a intimação da citação por hora certa (aviso de que o oficial voltará no dia seguinte) é válida quando feita","alternativas":["somente ao síndico.","a funcionário da portaria responsável pelo recebimento de correspondência.","apenas a morador do mesmo andar.","somente ao porteiro, desde que maior de 21 anos.","por bilhete deixado na caixa de correio."],"correta":1,"explicacao":"Art. 252, parágrafo único, CPC.","origem":"inedita","fonte":"Questão inédita (formato Vunesp)"},{"id":"oj-q019","materia":"pcivil","assunto":"Citação por hora certa (art. 253)","enunciado":"No dia e hora designados para a citação por hora certa, se o citando não estiver presente,","alternativas":["o oficial devolve o mandado e o juiz determina a citação por edital.","o oficial procura informar-se das razões da ausência e dá por feita a citação, ainda que o citando tenha se ocultado em outra comarca.","a citação só se completa se o familiar intimado estiver presente.","o oficial deve voltar mais uma vez no dia seguinte.","o oficial precisa de novo despacho judicial para concluir o ato."],"correta":1,"explicacao":"Art. 253, § 1º, CPC. A citação vale mesmo se o familiar/vizinho estiver ausente ou se recusar a receber o mandado (§ 2º). A contrafé fica com a pessoa da família ou vizinho (§ 3º), com advertência de curador especial (§ 4º).","origem":"inedita","fonte":"Questão inédita (formato Vunesp)"},{"id":"oj-q020","materia":"pcivil","assunto":"Citação por hora certa (art. 254)","enunciado":"Feita a citação com hora certa, o escrivão ou chefe de secretaria enviará ao réu carta, telegrama ou correspondência eletrônica, dando-lhe de tudo ciência, no prazo de","alternativas":["5 dias, contado da diligência.","10 dias, contado da data da juntada do mandado aos autos.","15 dias, contado da diligência.","48 horas, contado da juntada do mandado.","30 dias, contado da decisão que deferiu a citação."],"correta":1,"explicacao":"Art. 254, CPC.","origem":"inedita","fonte":"Questão inédita (formato Vunesp)"},{"id":"oj-q021","materia":"pcivil","assunto":"Comarcas contíguas (art. 255)","enunciado":"Nas comarcas contíguas de fácil comunicação e nas que se situem na mesma região metropolitana, o oficial de justiça","alternativas":["só pode atuar mediante carta precatória.","poderá efetuar, em qualquer delas, citações, intimações, notificações, penhoras e quaisquer outros atos executivos.","precisa de autorização do Corregedor-Geral.","só pode realizar intimações, nunca penhoras.","depende de concordância do juiz da outra comarca."],"correta":1,"explicacao":"Art. 255, CPC (veja também art. 782, § 1º, para atos executivos).","origem":"inedita","fonte":"Questão inédita (formato Vunesp)"},{"id":"oj-q022","materia":"pcivil","assunto":"Citação por edital (arts. 256 e 257)","enunciado":"Sobre a citação por edital, é correto afirmar que","alternativas":["é feita quando o réu se recusa a receber o oficial de justiça.","o prazo do edital será fixado pelo juiz entre 20 e 60 dias, e a publicação ocorre na internet, no sítio do tribunal e na plataforma de editais do CNJ.","dispensa a advertência de nomeação de curador especial.","é cabível em qualquer caso, a critério do autor.","a parte que a requerer dolosamente não sofre sanção."],"correta":1,"explicacao":"Art. 257, II a IV, CPC. A parte que requer edital alegando dolosamente os requisitos paga multa de 5 salários mínimos (art. 258).","origem":"inedita","fonte":"Questão inédita (formato Vunesp)"},{"id":"oj-q023","materia":"pcivil","assunto":"Intimações (arts. 269 a 275)","enunciado":"A intimação será feita por oficial de justiça quando","alternativas":["o intimando for advogado.","frustrada a realização por meio eletrônico ou pelo correio.","o autor preferir.","for intimação do Ministério Público.","o processo tramitar em segredo de justiça."],"correta":1,"explicacao":"Art. 275, CPC. Se necessário, a intimação pode ser feita com hora certa ou por edital (§ 2º).","origem":"inedita","fonte":"Questão inédita (formato Vunesp)"},{"id":"oj-q024","materia":"pcivil","assunto":"Intimações (art. 275)","enunciado":"A certidão de intimação feita por oficial de justiça deve conter, entre outros elementos,","alternativas":["a assinatura de duas testemunhas, sob pena de nulidade.","a indicação do lugar e a descrição da pessoa intimada, mencionando, quando possível, o número de seu documento de identidade e o órgão que o expediu.","a cópia do documento do intimado.","a fotografia do imóvel visitado.","o recolhimento das custas de diligência."],"correta":1,"explicacao":"Art. 275, § 1º, CPC: I lugar e descrição da pessoa (com documento, se possível); II declaração de entrega da contrafé; III nota de ciente ou certidão de que não a apôs.","origem":"inedita","fonte":"Questão inédita (formato Vunesp)"},{"id":"oj-q025","materia":"pcivil","assunto":"Intimações (art. 274)","enunciado":"Presumem-se válidas as intimações dirigidas ao endereço constante dos autos, ainda que não recebidas pessoalmente pelo interessado,","alternativas":["em nenhuma hipótese.","se a modificação temporária ou definitiva do endereço não tiver sido devidamente comunicada ao juízo.","apenas se o processo for eletrônico.","somente quando o intimado for pessoa jurídica.","desde que haja duas tentativas frustradas."],"correta":1,"explicacao":"Art. 274, parágrafo único, CPC.","origem":"inedita","fonte":"Questão inédita (formato Vunesp)"},{"id":"oj-q026","materia":"pcivil","assunto":"Execução: citação e penhora (art. 829)","enunciado":"Na execução por quantia certa, o executado é citado para pagar a dívida no prazo de","alternativas":["24 horas.","3 dias, contado da citação; não pago, o oficial procede à penhora e à avaliação, lavrando auto e intimando o executado.","5 dias, contado da juntada do mandado.","15 dias úteis.","10 dias, contado da citação."],"correta":1,"explicacao":"Art. 829, caput e § 1º, CPC. Pagando em 3 dias, os honorários de 10% caem pela metade (art. 827, § 1º).","origem":"inedita","fonte":"Questão inédita (formato Vunesp)"},{"id":"oj-q027","materia":"pcivil","assunto":"Arresto executivo (art. 830)","enunciado":"Se o oficial de justiça não encontrar o executado, deverá","alternativas":["devolver o mandado imediatamente.","arrestar-lhe tantos bens quantos bastem para garantir a execução e, nos 10 dias seguintes, procurá-lo 2 vezes em dias distintos; havendo suspeita de ocultação, citá-lo por hora certa.","aguardar 30 dias e tentar novamente.","pedir ao juiz a citação por edital antes de qualquer ato.","penhorar apenas bens imóveis."],"correta":1,"explicacao":"Art. 830, caput e § 1º, CPC. Aperfeiçoada a citação e passado o prazo de pagamento, o arresto se converte em penhora (§ 3º).","origem":"inedita","fonte":"Questão inédita (formato Vunesp)"},{"id":"oj-q028","materia":"pcivil","assunto":"Bens impenhoráveis (art. 833)","enunciado":"São impenhoráveis, entre outros,","alternativas":["os veículos de qualquer valor.","a quantia depositada em caderneta de poupança até o limite de 40 salários mínimos.","os imóveis comerciais.","as joias, mesmo de elevado valor.","os créditos a receber do executado."],"correta":1,"explicacao":"Art. 833, X, CPC. Também: móveis que guarnecem a residência (salvo de elevado valor), salários, instrumentos de profissão, seguro de vida, pequena propriedade rural trabalhada pela família.","origem":"inedita","fonte":"Questão inédita (formato Vunesp)"},{"id":"oj-q029","materia":"pcivil","assunto":"Ordem da penhora (art. 835)","enunciado":"Na ordem preferencial de penhora do CPC, o primeiro lugar é ocupado por","alternativas":["bens imóveis.","veículos de via terrestre.","dinheiro, em espécie ou em depósito ou aplicação em instituição financeira.","pedras e metais preciosos.","ações e quotas de sociedades."],"correta":2,"explicacao":"Art. 835, I, CPC: dinheiro é prioritário (§ 1º). Seguem títulos da dívida pública, títul
