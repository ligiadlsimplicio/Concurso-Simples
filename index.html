os e valores mobiliários, veículos, imóveis, móveis, semoventes...","origem":"inedita","fonte":"Questão inédita (formato Vunesp)"},{"id":"oj-q030","materia":"pcivil","assunto":"Penhora inútil (art. 836)","enunciado":"Não se levará a efeito a penhora quando ficar evidente que o produto da execução dos bens encontrados será totalmente absorvido pelo pagamento das custas. Nesse caso, o oficial de justiça","alternativas":["nada certifica.","descreverá na certidão os bens que guarnecem a residência ou o estabelecimento do executado, quando este for pessoa jurídica.","penhora os bens mesmo assim.","leva os bens ao depósito público.","intima o exequente a indicar bens no prazo de 24 horas."],"correta":1,"explicacao":"Art. 836, § 1º, CPC. O executado ou seu representante é nomeado depositário provisório desses bens (§ 2º).","origem":"inedita","fonte":"Questão inédita (formato Vunesp)"},{"id":"oj-q031","materia":"pcivil","assunto":"Auto de penhora (arts. 838 e 839)","enunciado":"Considera-se feita a penhora","alternativas":["com a simples intimação do executado.","mediante a apreensão e o depósito dos bens, lavrando-se um só auto se as diligências forem concluídas no mesmo dia.","com o registro no cartório de imóveis.","quando o exequente indica os bens.","com a avaliação do bem."],"correta":1,"explicacao":"Art. 839, CPC. O auto contém dia, mês, ano e lugar; nomes de exequente e executado; descrição dos bens; nomeação do depositário (art. 838).","origem":"inedita","fonte":"Questão inédita (formato Vunesp)"},{"id":"oj-q032","materia":"pcivil","assunto":"Depósito dos bens penhorados (art. 840)","enunciado":"Serão preferencialmente depositados em poder do executado, mediante caução idônea,","alternativas":["as quantias em dinheiro.","as joias e pedras preciosas.","os imóveis rurais, os direitos aquisitivos sobre eles e as máquinas e utensílios necessários à atividade agrícola.","os veículos automotores.","os móveis urbanos de qualquer natureza."],"correta":2,"explicacao":"Art. 840, III, CPC. Dinheiro vai a banco oficial (I); móveis, semoventes e imóveis urbanos, ao depositário judicial (II).","origem":"inedita","fonte":"Questão inédita (formato Vunesp)"},{"id":"oj-q033","materia":"pcivil","assunto":"Intimação da penhora (arts. 841 e 842)","enunciado":"Formalizada a penhora de imóvel de executado casado em regime de comunhão parcial de bens,","alternativas":["basta intimar o executado.","deve ser intimado também o cônjuge do executado.","o cônjuge só é intimado se for coproprietário registrado.","a penhora é nula, pois o imóvel do casal é impenhorável.","o cônjuge é citado como litisconsorte necessário."],"correta":1,"explicacao":"Art. 842, CPC: recaindo sobre imóvel ou direito real sobre imóvel, intima-se também o cônjuge, salvo separação absoluta de bens.","origem":"inedita","fonte":"Questão inédita (formato Vunesp)"},{"id":"oj-q034","materia":"pcivil","assunto":"Arrombamento (art. 846)","enunciado":"O executado fecha as portas da casa para impedir a penhora. Segundo o CPC, o oficial de justiça","alternativas":["arromba a porta imediatamente, com dois vizinhos como testemunhas.","comunica o fato ao juiz, solicitando ordem de arrombamento; deferida, 2 oficiais cumprem o mandado e lavram auto circunstanciado assinado por 2 testemunhas.","desiste da penhora e devolve o mandado.","chama a polícia, que arromba a porta sem ordem judicial.","penhora os bens que estiverem do lado de fora."],"correta":1,"explicacao":"Art. 846, caput e § 1º, CPC. O juiz requisita força policial se necessário (§ 2º); o auto é lavrado em duplicata: uma via ao escrivão e outra à autoridade policial (§ 3º).","origem":"inedita","fonte":"Questão inédita (formato Vunesp)"},{"id":"oj-q035","materia":"pcivil","assunto":"Avaliação (arts. 870 a 873)","enunciado":"A avaliação dos bens penhorados","alternativas":["é sempre feita por perito contratado pelo exequente.","será feita pelo oficial de justiça; se forem necessários conhecimentos especializados e o valor da execução comportar, o juiz nomeará avaliador.","é dispensada em qualquer execução.","só pode ser feita depois do leilão.","é feita pelo escrivão."],"correta":1,"explicacao":"Art. 870, CPC. Dispensa-se quando uma parte aceita a estimativa da outra, ou para bens com cotação em bolsa, títulos e veículos com preço médio conhecido (art. 871).","origem":"inedita","fonte":"Questão inédita (formato Vunesp)"},{"id":"oj-q036","materia":"pcivil","assunto":"Avaliação (art. 872)","enunciado":"A avaliação realizada pelo oficial de justiça constará de vistoria e de laudo anexados ao auto de penhora, que deverão especificar","alternativas":["apenas o valor dos bens.","os bens, com suas características e o estado em que se encontram, e o valor dos bens.","o nome do comprador provável.","a comparação com três orçamentos de lojas.","a opinião do executado sobre o valor."],"correta":1,"explicacao":"Art. 872, I e II, CPC.","origem":"inedita","fonte":"Questão inédita (formato Vunesp)"},{"id":"oj-q037","materia":"pcivil","assunto":"Busca e apreensão no cumprimento de sentença (art. 536)","enunciado":"No cumprimento de obrigação de fazer ou não fazer, o mandado de busca e apreensão de pessoas ou coisas será cumprido","alternativas":["por um oficial de justiça, sem testemunhas.","por 2 oficiais de justiça, observando-se, se houver necessidade de arrombamento, o art. 846, §§ 1º a 4º.","apenas pela polícia militar.","pelo próprio exequente.","por oficial de justiça acompanhado do juiz."],"correta":1,"explicacao":"Art. 536, § 2º, CPC.","origem":"inedita","fonte":"Questão inédita (formato Vunesp)"},{"id":"oj-q038","materia":"pcivil","assunto":"Ações possessórias (arts. 554 e 560 a 563)","enunciado":"Nas ações possessórias, considerada suficiente a justificação prévia, o juiz","alternativas":["sentencia o processo.","fará logo expedir mandado de manutenção ou de reintegração.","determina perícia obrigatória.","remete os autos ao Ministério Público.","extingue o processo sem resolução de mérito."],"correta":1,"explicacao":"Art. 563, CPC. A propositura de uma possessória em vez de outra não impede que o juiz conheça do pedido (fungibilidade, art. 554).","origem":"inedita","fonte":"Questão inédita (formato Vunesp)"},{"id":"oj-q039","materia":"pcivil","assunto":"Ações de família (art. 695)","enunciado":"Nas ações de família, o mandado de citação para a audiência de mediação e conciliação","alternativas":["deve vir acompanhado de cópia da petição inicial.","conterá apenas os dados necessários à audiência e estará desacompanhado de cópia da petição inicial; a citação será feita na pessoa do réu, com antecedência mínima de 15 dias.","pode ser entregue a qualquer morador da casa.","dispensa a presença do réu na audiência.","é sempre feito por edital."],"correta":1,"explicacao":"Art. 695, §§ 1º a 3º, CPC.","origem":"inedita","fonte":"Questão inédita (formato Vunesp)"},{"id":"oj-q040","materia":"pcivil","assunto":"Recursos (arts. 994, 1.003, 1.009, 1.015)","enunciado":"Sobre os recursos no CPC, é correto afirmar:","alternativas":["dos despachos cabe agravo de instrumento.","o prazo para interpor os recursos e para responder-lhes é de 15 dias, exceto os embargos de declaração.","da sentença cabe agravo interno.","os embargos de declaração têm prazo de 15 dias.","a apelação é interposta diretamente no tribunal."],"correta":1,"explicacao":"Art. 1.003, § 5º, CPC (embargos de declaração: 5 dias). Dos despachos não cabe recurso (art. 1.001); da sentença cabe apelação (art. 1.009).","origem":"inedita","fonte":"Questão inédita (formato Vunesp)"},{"id":"oj-q041","materia":"pcivil","assunto":"Embargos de declaração (art. 1.022)","enunciado":"Cabem embargos de declaração contra qualquer decisão judicial para","alternativas":["reformar a decisão por discordância com o mérito.","esclarecer obscuridade ou eliminar contradição, suprir omissão ou corrigir erro material.","produzir novas provas.","substituir a apelação.","pedir a anulação do processo por falta de citação."],"correta":1,"explicacao":"Art. 1.022, I a III, CPC.","origem":"inedita","fonte":"Questão inédita (formato Vunesp)"},{"id":"oj-q042","materia":"pcivil","assunto":"Lei 9.099/95 (arts. 18 e 19)","enunciado":"No Juizado Especial Cível, a citação","alternativas":["pode ser feita por edital.","far-se-á por correspondência com aviso de recebimento em mão própria; se necessário, por oficial de justiça, independentemente de mandado ou carta precatória; não se admite citação por edital.","é sempre feita por oficial de justiça.","depende de expedição de carta precatória para outra comarca.","é feita apenas por telefone."],"correta":1,"explicacao":"Art. 18, I a III e § 2º, Lei 9.099/95. O comparecimento espontâneo supre a falta ou nulidade (§ 3º).","origem":"inedita","fonte":"Questão inédita (formato Vunesp)"},{"id":"oj-q043","materia":"pcivil","assunto":"Lei 9.099/95 (arts. 8º e 9º)","enunciado":"Podem propor ação perante o Juizado Especial Cível, entre outros,","alternativas":["as pessoas jurídicas de direito público.","as pessoas físicas capazes, excluídos os cessionários de direito de pessoas jurídicas, e as microempresas e empresas de pequeno porte.","o preso e o incapaz.","a massa falida.","as empresas públicas da União."],"correta":1,"explicacao":"Art. 8º, § 1º, Lei 9.099/95. Até 20 salários mínimos a parte pode ir sem advogado; acima disso a assistência é obrigatória (art. 9º).","origem":"inedita","fonte":"Questão inédita (formato Vunesp)"},{"id":"oj-q044","materia":"ppenal","assunto":"Citação no processo penal (arts. 351 a 357)","enunciado":"São requisitos da citação por mandado no processo penal:","alternativas":["leitura do mandado ao citando pelo oficial e entrega da contrafé, na qual se mencionarão dia e hora da citação; declaração do oficial, na certidão, da entrega da contrafé e de sua aceitação ou recusa.","apenas a entrega do mandado ao citando.","assinatura do citando e de duas testemunhas.","presença do defensor do réu.","a citação em horário comercial."],"correta":0,"explicacao":"Art. 357, I e II, CPP.","origem":"inedita","fonte":"Questão inédita (formato Vunesp)"},{"id":"oj-q045","materia":"ppenal","assunto":"Citação do réu preso (art. 360)","enunciado":"O réu preso será","alternativas":["citado por edital.","pessoalmente citado.","citado na pessoa do diretor do presídio.","apenas requisitado, dispensada a citação.","citado por carta com aviso de recebimento."],"correta":1,"explicacao":"Art. 360, CPP. A requisição para comparecer à audiência não substitui a citação pessoal.","origem":"inedita","fonte":"Questão inédita (formato Vunesp)"},{"id":"oj-q046","materia":"ppenal","assunto":"Citação por hora certa no CPP (art. 362)","enunciado":"Verificando que o réu se oculta para não ser citado, o oficial de justiça certificará a ocorrência e","alternativas":["o juiz determinará a citação por edital, com prazo de 15 dias.","procederá à citação com hora certa, na forma do CPC; completada a citação, se o acusado não comparecer, ser-lhe-á nomeado defensor dativo.","o processo ficará suspenso até o réu ser encontrado.","será decretada a prisão preventiva do réu.","o réu será considerado citado na data da primeira procura."],"correta":1,"explicacao":"Art. 362, caput e parágrafo único, CPP.","origem":"inedita","fonte":"Questão inédita (formato Vunesp)"},{"id":"oj-q047","materia":"ppenal","assunto":"Citação por edital (arts. 361 e 363)","enunciado":"No processo penal, o réu não encontrado será citado por edital, com o prazo de","alternativas":["10 dias.","15 dias.","20 dias.","30 dias.","60 dias."],"correta":1,"explicacao":"Art. 361, CPP. Atenção: no CPC o prazo do edital é de 20 a 60 dias (art. 257, III).","origem":"inedita","fonte":"Questão inédita (formato Vunesp)"},{"id":"oj-q048","materia":"ppenal","assunto":"Funcionário público acusado (art. 359)","enunciado":"Quando o funcionário público tiver de comparecer em juízo como acusado, o dia designado será","alternativas":["comunicado só ao chefe da repartição.","notificado assim a ele como ao chefe de sua repartição.","publicado no Diário Oficial, dispensada a notificação.","comunicado por e-mail ao funcionário.","informado apenas ao advogado do funcionário."],"correta":1,"explicacao":"Art. 359, CPP. O militar é citado por intermédio do chefe do respectivo serviço (art. 358).","origem":"inedita","fonte":"Questão inédita (formato Vunesp)"},{"id":"oj-q049","materia":"ppenal","assunto":"Intimações no processo penal (art. 370)","enunciado":"No processo penal, a intimação do Ministério Público e do defensor nomeado","alternativas":["é feita por publicação no órgão oficial.","será pessoal.","é feita por e-mail.","dispensa formalidade.","é feita por edital."],"correta":1,"explicacao":"Art. 370, § 4º, CPP. O defensor constituído, o advogado do querelante e o do assistente são intimados por publicação, com o nome do acusado (§ 1º).","origem":"inedita","fonte":"Questão inédita (formato Vunesp)"},{"id":"oj-q050","materia":"ppenal","assunto":"Prisão (arts. 283 e 284)","enunciado":"Sobre a prisão no CPP, assinale a alternativa correta.","alternativas":["A prisão só pode ser efetuada em dias úteis.","A prisão poderá ser efetuada em qualquer dia e a qualquer hora, respeitadas as restrições relativas à inviolabilidade do domicílio.","O emprego de força é sempre permitido.","A prisão por mandado pode ser feita à noite dentro da casa, sem consentimento.","A prisão dispensa ordem escrita da autoridade."],"correta":1,"explicacao":"Art. 283, § 2º, CPP. Força só se indispensável no caso de resistência ou tentativa de fuga (art. 284).","origem":"inedita","fonte":"Questão inédita (formato Vunesp)"},{"id":"oj-q051","materia":"ppenal","assunto":"Mandado de prisão (arts. 285 e 286)","enunciado":"O mandado de prisão será passado em duplicata, e o executor","alternativas":["ficará com as duas vias.","entregará ao preso, logo depois da prisão, um dos exemplares com declaração do dia, hora e lugar da diligência; o preso passará recibo no outro.","entregará as duas vias ao delegado.","devolverá o mandado sem certidão.","entregará uma via ao advogado do preso, se houver."],"correta":1,"explicacao":"Art. 286, CPP. Se o preso se recusar, não souber ou não puder escrever, o fato é declarado e assinado por 2 testemunhas.","origem":"inedita","fonte":"Questão inédita (formato Vunesp)"},{"id":"oj-q052","materia":"ppenal","assunto":"Réu escondido em casa (art. 293)","enunciado":"O executor do mandado de prisão verifica, com segurança, que o réu se escondeu em uma casa e, à noite, o morador se recusa a entregá-lo. O executor deve","alternativas":["entrar à força imediatamente.","fazer guardar todas as saídas, tornando a casa incomunicável, e, logo que amanheça, arrombar as portas e efetuar a prisão.","desistir da prisão.","pedir novo mandado ao juiz para entrar à noite.","prender o morador no lugar do réu."],"correta":1,"explicacao":"Art. 293, CPP. De dia, convoca 2 testemunhas e entra à força. O morador que se recusa a entregar o réu é levado à autoridade (parágrafo único).","origem":"inedita","fonte":"Questão inédita (formato Vunesp)"},{"id":"oj-q053","materia":"ppenal","assunto":"Prisão em flagrante (arts. 301 a 303)","enunciado":"Considera-se em flagrante delito quem","alternativas":["é encontrado uma semana depois com objetos do crime.","é perseguido, logo após, pela autoridade, pelo ofendido ou por qualquer pessoa, em situação que faça presumir ser autor da infração.","confessa o crime ao delegado dias depois.","é reconhecido por fotografia.","foi denunciado anonimamente."],"correta":1,"explicacao":"Art. 302, III, CPP. Qualquer do povo pode e a polícia deve prender quem esteja em flagrante (art. 301). Nos crimes permanentes, o flagrante dura enquanto não cessar a permanência (art. 303).","origem":"inedita","fonte":"Questão inédita (formato Vunesp)"},{"id":"oj-q054","materia":"ppenal","assunto":"Busca domiciliar (arts. 243 e 245)","enunciado":"As buscas domiciliares serão executadas","alternativas":["a qualquer hora, sem formalidades.","de dia, salvo se o morador consentir que se realizem à noite; antes de entrar, os executores mostrarão e lerão o mandado ao morador, intimando-o a abrir a porta.","apenas com a presença do juiz.","somente se o morador assinar autorização escrita.","à noite, para não causar constrangimento."],"correta":1,"explicacao":"Art. 245, CPP. Em caso de desobediência, a porta é arrombada (§ 2º). Finda a diligência, lavra-se auto circunstanciado assinado por 2 testemunhas (§ 7º).","origem":"inedita","fonte":"Questão inédita (formato Vunesp)"},{"id":"oj-q055","materia":"ppenal","assunto":"Busca pessoal (art. 249)","enunciado":"A busca em mulher será feita","alternativas":["sempre por policial do sexo masculino.","por outra mulher, se não importar retardamento ou prejuízo da diligência.","apenas com ordem judicial.","somente na delegacia.","pelo oficial de justiça."],"correta":1,"explicacao":"Art. 249, CPP.","origem":"inedita","fonte":"Questão inédita (formato Vunesp)"},{"id":"oj-q056","materia":"ppenal","assunto":"Testemunhas (arts. 202 a 204)","enunciado":"Sobre a prova testemunhal no CPP, é correto afirmar que","alternativas":["apenas maiores de 21 anos podem ser testemunhas.","toda pessoa poderá ser testemunha, e o depoimento será prestado oralmente, não sendo permitido à testemunha trazê-lo por escrito.","a testemunha pode ler depoimento escrito.","o compromisso é dispensado para todas as testemunhas.","a testemunha pode recusar-se a depor em qualquer caso."],"correta":1,"explicacao":"Arts. 202 e 204, CPP. É permitida breve consulta a apontamentos (art. 204, parágrafo único).","origem":"inedita","fonte":"Questão inédita (formato Vunesp)"},{"id":"oj-q057","materia":"ppenal","assunto":"Prazos penais (arts. 798 e 798-A)","enunciado":"Sobre os prazos no CPP, assinale a alternativa correta.","alternativas":["Contam-se apenas os dias úteis, como no CPC.","Os prazos são contínuos e peremptórios; não se computa o dia do começo, incluindo-se o do vencimento; suspende-se o curso entre 20 de dezembro e 20 de janeiro, salvo processos de réus presos, Lei Maria da Penha e medidas urgentes.","O prazo que termina no domingo é antecipado para sexta-feira.","Não há suspensão de prazos no fim do ano no processo penal.","Inclui-se o dia do começo na contagem."],"correta":1,"explicacao":"Art. 798, caput, §§ 1º e 3º, e art. 798-A, CPP (Lei 14.365/2022).","origem":"inedita","fonte":"Questão inédita (formato Vunesp)"},{"id":"oj-q058","materia":"ppenal","assunto":"Nulidades (arts. 563 a 570)","enunciado":"A falta ou nulidade da citação, da intimação ou da notificação","alternativas":["gera sempre nulidade absoluta do processo.","estará sanada desde que o interessado compareça antes de o ato consumar-se, embora declare que o faz para o único fim de argui-la.","só pode ser sanada pelo tribunal.","não é causa de nulidade.","torna o oficial de justiça réu no processo."],"correta":1,"explicacao":"Art. 570, CPP. Nenhum ato é declarado nulo se não resultar prejuízo para a acusação ou para a defesa (art. 563).","origem":"inedita","fonte":"Questão inédita (formato Vunesp)"},{"id":"oj-q059","materia":"ppenal","assunto":"Habeas corpus (arts. 647 e 654)","enunciado":"O habeas corpus poderá ser impetrado","alternativas":["apenas por advogado.","por qualquer pessoa, em seu favor ou de outrem, bem como pelo Ministério Público.","somente pelo próprio preso.","apenas pela Defensoria Pública.","somente com pagamento de custas."],"correta":1,"explicacao":"Art. 654, CPP. Cabe HC sempre que alguém sofrer ou se achar na iminência de sofrer violência ou coação ilegal na liberdade de ir e vir (art. 647).","origem":"inedita","fonte":"Questão inédita (formato Vunesp)"},{"id":"oj-q060","materia":"ppenal","assunto":"Lei 9.099/95 (arts. 60 a 62)","enunciado":"Consideram-se infrações penais de menor potencial ofensivo","alternativas":["os crimes com pena mínima de até 1 ano.","as contravenções penais e os crimes a que a lei comine pena máxima não superior a 2 anos, cumulada ou não com multa.","apenas as contravenções penais.","os crimes com pena máxima de até 4 anos.","os crimes culposos em geral."],"correta":1,"explicacao":"Art. 61, Lei 9.099/95.","origem":"inedita","fonte":"Questão inédita (formato Vunesp)"},{"id":"oj-q061","materia":"ppenal","assunto":"Lei 9.099/95 (arts. 66 a 68)","enunciado":"No Juizado Especial Criminal, não encontrado o acusado para ser citado,","alternativas":["faz-se a citação por edital no próprio Juizado.","o juiz encaminhará as peças existentes ao Juízo comum, para adoção do procedimento previsto em lei.","o processo é arquivado.","decreta-se a revelia.","cita-se o acusado por hora certa no Juizado."],"correta":1,"explicacao":"Art. 66, parágrafo único, Lei 9.099/95. A citação é pessoal, no próprio Juizado ou por mandado (caput).","origem":"inedita","fonte":"Questão inédita (formato Vunesp)"},{"id":"oj-q062","materia":"ppenal","assunto":"Crimes de funcionários públicos (arts. 513 a 518)","enunciado":"Nos crimes afiançáveis praticados por funcionário público, estando a denúncia em devida forma, o juiz mandará notificar o acusado para responder por escrito no prazo de","alternativas":["5 dias.","10 dias.","15 dias.","20 dias.","30 dias."],"correta":2,"explicacao":"Art. 514, CPP (defesa preliminar em 15 dias).","origem":"inedita","fonte":"Questão inédita (formato Vunesp)"},{"id":"oj-q063","materia":"penal","assunto":"Aplicação da lei penal (arts. 1º a 4º)","enunciado":"Sobre a aplicação da lei penal, é correto afirmar que","alternativas":["a lei posterior que de qualquer modo favorecer o agente não se aplica a fatos já julgados.","considera-se praticado o crime no momento da ação ou omissão, ainda que outro seja o momento do resultado.","a lei excepcional deixa de ser aplicada aos fatos praticados durante sua vigência quando ela termina.","o crime é considerado praticado apenas no lugar do resultado.","não há crime sem lei anterior que o defina, mas a pena pode ser criada depois."],"correta":1,"explicacao":"Art. 4º, CP (teoria da atividade). A lei mais benéfica retroage mesmo após o trânsito em julgado (art. 2º, parágrafo único); a lei excepcional ou temporária é ultra-ativa (art. 3º); quanto ao lugar, vale a ubiquidade (art. 6º).","origem":"inedita","fonte":"Questão inédita (formato Vunesp)"},{"id":"oj-q064","materia":"penal","assunto":"Contagem de prazo penal (art. 10)","enunciado":"Na contagem de prazo de natureza penal,","alternativas":["exclui-se o dia do começo.","o dia do começo inclui-se no cômputo do prazo, e contam-se os dias, os meses e os anos pelo calendário comum.","contam-se apenas os dias úteis.","o prazo termina sempre em dia útil.","desprezam-se os meses com 31 dias."],"correta":1,"explicacao":"Art. 10, CP. Atenção: é o contrário do prazo processual penal (art. 798, § 1º, CPP).","origem":"inedita","fonte":"Questão inédita (formato Vunesp)"},{"id":"oj-q065","materia":"penal","assunto":"Ação penal (arts. 100 a 106)","enunciado":"O direito de queixa ou de representação decai se não for exercido dentro do prazo de","alternativas":["30 dias, contado do fato.","6 meses, contado do dia em que o ofendido veio a saber quem é o autor do crime.","1 ano, contado do fato.","3 meses, contado do inquérito.","2 anos, contado do conhecimento da autoria."],"correta":1,"explicacao":"Art. 103, CP. A representação é irretratável depois de oferecida a denúncia (art. 102).","origem":"inedita","fonte":"Questão inédita (formato Vunesp)"},{"id":"oj-q066","materia":"penal","assunto":"Extinção da punibilidade (art. 107)","enunciado":"Extingue-se a punibilidade, entre outras hipóteses,","alternativas":["pela confissão espontânea.","pela morte do agente, pela anistia, graça ou indulto e pela prescrição, decadência ou perempção.","pela reincidência.","pelo arrependimento do agente após a sentença.","pelo pagamento das custas."],"correta":1,"explicacao":"Art. 107, I a IX, CP.","origem":"inedita","fonte":"Questão inédita (formato Vunesp)"},{"id":"oj-q067","materia":"penal","assunto":"Prescrição (art. 115)","enunciado":"São reduzidos de metade os prazos de prescrição quando o criminoso era, ao tempo do crime,","alternativas":["maior de 60 anos.","menor de 21 anos, ou, na data da sentença, maior de 70 anos.","primário.","servidor público.","menor de 25 anos."],"correta":1,"explicacao":"Art. 115, CP.","origem":"inedita","fonte":"Questão inédita (formato Vunesp)"},{"id":"oj-q068","materia":"penal","assunto":"Violação de domicílio (art. 150)","enunciado":"Não constitui crime de violação de domicílio a entrada ou permanência em casa alheia","alternativas":["à noite, para cumprir mandado de penhora.","durante o dia, com observância das formalidades legais, para efetuar prisão ou outra diligência.","a qualquer hora, para cobrar dívida.","quando o morador estiver viajando.","para vistoria de rotina sem mandado."],"correta":1,"explicacao":"Art. 150, § 3º, I, CP. Também não é crime a qualquer hora, quando algum crime está sendo ali praticado ou na iminência de o ser (inciso II).","origem":"inedita","fonte":"Questão inédita (formato Vunesp)"},{"id":"oj-q069","materia":"penal","assunto":"Violação de domicílio (art. 150)","enunciado":"Para os fins do crime de violação de domicílio, a expressão \"casa\" NÃO compreende","alternativas":["qualquer compartimento habitado.","aposento ocupado de habitação coletiva.","compartimento não aberto ao público, onde alguém exerce profissão ou atividade.","taverna, casa de jogo e outras do mesmo gênero.","o quarto de hotel ocupado por hóspede."],"correta":3,"explicacao":"Art. 150, §§ 4º e 5º, CP. Quarto de hotel ocupado é aposento de habitação coletiva e é protegido.","origem":"inedita","fonte":"Questão inédita (formato Vunesp)"},{"id":"oj-q070","materia":"penal","assunto":"Peculato (art. 312)","enunciado":"No peculato culposo, a reparação do dano","alternativas":["não tem efeito algum.","se precede à sentença irrecorrível, extingue a punibilidade; se lhe é posterior, reduz de metade a pena imposta.","reduz a pena de um terço, em qualquer momento.","só tem efeito se feita antes do inquérito.","transforma o crime em contravenção."],"correta":1,"explicacao":"Art. 312, § 3º, CP.","origem":"inedita","fonte":"Questão inédita (formato Vunesp)"},{"id":"oj-q071","materia":"penal","assunto":"Concussão x corrupção passiva (arts. 316 e 317)","enunciado":"O oficial de justiça que EXIGE dinheiro do executado para \"esquecer\" a penhora pratica, em tese,","alternativas":["corrupção passiva.","concussão.","prevaricação.","advocacia administrativa.","peculato."],"correta":1,"explicacao":"Art. 316, CP (concussão: exigir). Na corrupção passiva o verbo é solicitar, receber ou aceitar promessa (art. 317).","origem":"inedita","fonte":"Questão inédita (formato Vunesp)"},{"id":"oj-q072","materia":"penal","assunto":"Prevaricação (art. 319)","enunciado":"Retardar ou deixar de praticar, indevidamente, ato de ofício, ou praticá-lo contra disposição expressa de lei, para satisfazer interesse ou sentimento pessoal, é o crime de","alternativas":["condescendência criminosa.","prevaricação.","corrupção passiva.","desobediência.","concussão."],"correta":1,"explicacao":"Art. 319, CP.","origem":"inedita","fonte":"Questão inédita (formato Vunesp)"},{"id":"oj-q073","materia":"penal","assunto":"Funcionário público (art. 327)","enunciado":"Para os efeitos penais, considera-se funcionário público","alternativas":["apenas quem ocupa cargo efetivo.","quem, embora transitoriamente ou sem remuneração, exerce cargo, emprego ou função pública.","somente o servidor concursado e remunerado.","apenas quem trabalha em órgão do Poder Executivo.","qualquer pessoa que pague impostos."],"correta":1,"explicacao":"Art. 327, CP. Equipara-se quem trabalha em entidade paraestatal ou em empresa contratada para atividade típica da Administração (§ 1º).","origem":"inedita","fonte":"Questão inédita (formato Vunesp)"},{"id":"oj-q074","materia":"penal","assunto":"Resistência e desobediência (arts. 329 e 330)","enunciado":"Durante o cumprimento de mandado de penhora, o executado empurra o oficial de justiça e o ameaça para impedir o ato, que acaba não sendo executado. Em tese, o executado praticou","alternativas":["desobediência simples.","resistência qualificada, punida com reclusão de 1 a 3 anos, sem prejuízo das penas da violência.","desacato apenas.","exercício arbitrário das próprias razões.","nenhum crime, pois o bem é dele."],"correta":1,"explicacao":"Art. 329, § 1º e § 2º, CP. Sem violência ou ameaça, o mero descumprimento da ordem é desobediência (art. 330).","origem":"inedita","fonte":"Questão inédita (formato Vunesp)"},{"id":"oj-q075","materia":"penal","assunto":"Desacato (art. 331)","enunciado":"Desacatar funcionário público no exercício da função ou em razão dela é crime punido com","alternativas":["reclusão de 2 a 8 anos.","detenção de 6 meses a 2 anos, ou multa.","multa apenas.","detenção de 15 dias a 6 meses e multa.","reclusão de 1 a 4 anos e multa."],"correta":1,"explicacao":"Art. 331, CP. A pena de 15 dias a 6 meses e multa é a da desobediência (art. 330).","origem":"inedita","fonte":"Questão inédita (formato Vunesp)"},{"id":"oj-q076","materia":"penal","assunto":"Corrupção ativa (art. 333)","enunciado":"Oferecer ou prometer vantagem indevida a funcionário público, para determiná-lo a praticar, omitir ou retardar ato de ofício, configura","alternativas":["corrupção passiva.","corrupção ativa.","tráfico de influência.","exploração de prestígio.","concussão."],"correta":1,"explicacao":"Art. 333, CP. A pena aumenta de 1/3 se o funcionário retarda, omite ou pratica o ato infringindo dever funcional (parágrafo único).","origem":"inedita","fonte":"Questão inédita (formato Vunesp)"},{"id":"oj-q077","materia":"penal","assunto":"Inutilização de edital ou de sinal (art. 336)","enunciado":"Rasgar edital afixado por ordem de funcionário público, ou violar selo empregado por ordem de funcionário público para cerrar um objeto, é o crime de","alternativas":["dano qualificado.","inutilização de edital ou de sinal.","fraude processual.","supressão de documento.","desobediência."],"correta":1,"explicacao":"Art. 336, CP (detenção de 1 mês a 1 ano, ou multa).","origem":"inedita","fonte":"Questão inédita (formato Vunesp)"},{"id":"oj-q078","materia":"penal","assunto":"Crimes contra a Administração da Justiça (art. 342)","enunciado":"Fazer afirmação falsa, negar ou calar a verdade como testemunha em processo judicial é o crime de","alternativas":["denunciação caluniosa.","falso testemunho.","fraude processual.","comunicação falsa de crime.","autoacusação falsa."],"correta":1,"explicacao":"Art. 342, CP. O fato deixa de ser punível se, antes da sentença no processo em que ocorreu o ilícito, o agente se retrata ou declara a verdade (§ 2º).","origem":"inedita","fonte":"Questão inédita (formato Vunesp)"},{"id":"oj-q079","materia":"penal","assunto":"Exercício arbitrário (arts. 345 e 346)","enunciado":"Tirar, suprimir, destruir ou danificar coisa própria que se acha em poder de terceiro por determinação judicial (por exemplo, bem penhorado entregue ao depositário) é","alternativas":["fato atípico, pois a coisa é do próprio agente.","crime previsto no art. 346 do CP.","furto.","apropriação indébita.","estelionato."],"correta":1,"explicacao":"Art. 346, CP.","origem":"inedita","fonte":"Questão inédita (formato Vunesp)"},{"id":"oj-q080","materia":"penal","assunto":"Fraude processual (art. 347)","enunciado":"Inovar artificiosamente, na pendência de processo civil ou administrativo, o estado de lugar, de coisa ou de pessoa, com o fim de induzir a erro o juiz ou o perito, é","alternativas":["falsidade ideológica.","fraude processual.","coação no curso do processo.","favorecimento real.","exploração de prestígio."],"correta":1,"explicacao":"Art. 347, CP. Se a inovação visa produzir efeito em processo penal, ainda que não iniciado, as penas aplicam-se em dobro (parágrafo único).","origem":"inedita","fonte":"Questão inédita (formato Vunesp)"},{"id":"oj-q081","materia":"penal","assunto":"Exploração de prestígio (art. 357)","enunciado":"Solicitar ou receber dinheiro a pretexto de influir em juiz, jurado, órgão do MP, funcionário de justiça, perito, tradutor, intérprete ou testemunha é o crime de","alternativas":["tráfico de influência.","exploração de prestígio.","corrupção ativa.","advocacia administrativa.","concussão."],"correta":1,"explicacao":"Art. 357, CP. O tráfico de influência (art. 332) é o mesmo comportamento em relação a funcionário público em geral.","origem":"inedita","fonte":"Questão inédita (formato Vunesp)"},{"id":"oj-q082","materia":"const","assunto":"Princípios fundamentais (art. 1º)","enunciado":"São fundamentos da República Federativa do Brasil, entre outros,","alternativas":["a independência nacional e a autodeterminação dos povos.","a soberania, a cidadania, a dignidade da pessoa humana, os valores sociais do trabalho e da livre iniciativa e o pluralismo político.","a erradicação da pobreza.","a prevalência dos direitos humanos.","a defesa da paz."],"correta":1,"explicacao":"Art. 1º, CF (memorize \"SO-CI-DI-VA-PLU\"). Erradicar a pobreza é objetivo (art. 3º); independência nacional, direitos humanos e defesa da paz são princípios das relações internacionais (art. 4º).","origem":"inedita","fonte":"Questão inédita (formato Vunesp)"},{"id":"oj-q083","materia":"const","assunto":"Direitos e garantias (art. 5º)","enunciado":"Sobre a prisão, a Constituição dispõe que","alternativas":["há prisão civil por dívida do depositário infiel.","ninguém será preso senão em flagrante delito ou por ordem escrita e fundamentada de autoridade judiciária competente, salvo transgressão militar ou crime propriamente militar.","a prisão de qualquer pessoa pode ser comunicada à família em até 30 dias.","o preso não tem direito de permanecer calado.","a prisão ilegal só pode ser relaxada pelo tribunal."],"correta":1,"explicacao":"Art. 5º, LXI, CF. A prisão é comunicada imediatamente ao juiz e à família (LXII); o preso pode permanecer calado (LXIII); prisão civil só do devedor de alimentos (LXVII e Súmula Vinculante 25).","origem":"inedita","fonte":"Questão inédita (formato Vunesp)"},{"id":"oj-q084","materia":"const","assunto":"Direitos políticos (art. 14)","enunciado":"O alistamento eleitoral e o voto são","alternativas":["obrigatórios para todos os maiores de 16 anos.","obrigatórios para os maiores de 18 anos e facultativos para analfabetos, maiores de 70 anos e maiores de 16 e menores de 18 anos.","facultativos para todos.","obrigatórios para os conscritos durante o serviço militar.","proibidos aos analfabetos."],"correta":1,"explicacao":"Art. 14, § 1º, CF. Os conscritos não podem alistar-se (§ 2º).","origem":"inedita","fonte":"Questão inédita (formato Vunesp)"},{"id":"oj-q085","materia":"const","assunto":"Administração Pública (art. 37)","enunciado":"O prazo de validade do concurso público será de","alternativas":["até 4 anos, improrrogável.","até 2 anos, prorrogável uma vez, por igual período.","1 ano, prorrogável duas vezes.","até 2 anos, prorrogável indefinidamente.","5 anos."],"correta":1,"explicacao":"Art. 37, III, CF.","origem":"inedita","fonte":"Questão inédita (formato Vunesp)"},{"id":"oj-q086","materia":"const","assunto":"Estabilidade (art. 41)","enunciado":"Como condição para a aquisição da estabilidade, é obrigatória","alternativas":["a aprovação em curso de formação.","a avaliação especial de desempenho por comissão instituída para essa finalidade.","a nomeação para cargo em comissão.","a indicação do chefe imediato.","a aprovação em novo concurso interno."],"correta":1,"explicacao":"Art. 41, § 4º, CF. A estabilidade vem após 3 anos de efetivo exercício (caput).","origem":"inedita","fonte":"Questão inédita (formato Vunesp)"},{"id":"oj-q087","materia":"const","assunto":"Poder Judiciário (art. 95)","enunciado":"Os juízes gozam das garantias de","alternativas":["vitaliciedade, que no primeiro grau só é adquirida após 2 anos de exercício; inamovibilidade, salvo por interesse público; e irredutibilidade de subsídio.","estabilidade após 3 anos, inamovibilidade e foro privilegiado.","vitaliciedade desde a posse, em todos os graus.","imunidade penal absoluta.","irredutibilidade de subsídio apenas."],"correta":0,"explicacao":"Art. 95, I a III, CF.","origem":"inedita","fonte":"Questão inédita (formato Vunesp)"},{"id":"oj-q088","materia":"const","assunto":"Poder Judiciário (art. 95)","enunciado":"Ao juiz que se aposenta ou é exonerado é vedado exercer a advocacia no juízo ou tribunal do qual se afastou antes de decorridos","alternativas":["1 ano.","2 anos.","3 anos.","5 anos.","10 anos."],"correta":2,"explicacao":"Art. 95, parágrafo único, V, CF (\"quarentena\" de 3 anos).","origem":"inedita","fonte":"Questão inédita (formato Vunesp)"},{"id":"oj-q089","materia":"const","assunto":"Juizados especiais (art. 98)","enunciado":"A Constituição determina a criação de juizados especiais, providos por juízes togados, ou togados e leigos, competentes para","alternativas":["crimes hediondos.","a conciliação, o julgamento e a execução de causas cíveis de menor complexidade e infrações penais de menor potencial ofensivo.","causas de família.","ações contra a União.","execuções fiscais."],"correta":1,"explicacao":"Art. 98, I, CF.","origem":"inedita","fonte":"Questão inédita (formato Vunesp)"},{"id":"oj-q090","materia":"const","assunto":"Funções essenciais à justiça (arts. 127 e 134)","enunciado":"O Ministério Público é instituição permanente, essencial à função jurisdicional do Estado, incumbindo-lhe","alternativas":["a defesa da ordem jurídica, do regime democrático e dos interesses sociais e individuais indisponíveis.","a orientação jurídica e a defesa dos necessitados.","a representação judicial da União.","o julgamento das contas públicas.","a advocacia privada."],"correta":0,"explicacao":"Art. 127, CF. A defesa dos necessitados é da Defensoria Pública (art. 134).","origem":"inedita","fonte":"Questão inédita (formato Vunesp)"},{"id":"oj-q091","materia":"adm","assunto":"Estatuto SP - conceitos (arts. 3º e 4º)","enunciado":"Nos termos da Lei 10.261/68, funcionário público é","alternativas":["qualquer pessoa que preste serviço ao Estado.","a pessoa legalmente investida em cargo público.","apenas o servidor estável.","o empregado de empresa pública.","quem ocupa função de confiança, exclusivamente."],"correta":1,"explicacao":"Art. 3º, Lei 10.261/68. Cargo público é o conjunto de atribuições e responsabilidades cometidas a um funcionário (art. 4º).","origem":"inedita","fonte":"Questão inédita (formato Vunesp)"},{"id":"oj-q092","materia":"adm","assunto":"Estatuto SP - penalidades (art. 251)","enunciado":"São penas disciplinares previstas no Estatuto dos Funcionários Públicos Civis de SP:","alternativas":["advertência, suspensão e demissão.","repreensão, suspensão, multa, demissão, demissão a bem do serviço público e cassação de aposentadoria ou disponibilidade.","censura, prisão administrativa e exoneração.","exoneração, demissão e destituição de cargo em comissão.","multa e advertência verbal."],"correta":1,"explicacao":"Art. 251, Lei 10.261/68. Atenção: no Estatuto paulista é \"repreensão\", não \"advertência\" (que é da Lei 8.112/90).","origem":"inedita","fonte":"Questão inédita (formato Vunesp)"},{"id":"oj-q093","materia":"adm","assunto":"Estatuto SP - deveres (art. 241)","enunciado":"É dever do funcionário público estadual, entre outros,","alternativas":["cumprir todas as ordens superiores, inclusive as manifestamente ilegais.","ser assíduo e pontual, tratar com urbanidade os companheiros e o público e guardar sigilo sobre os assuntos de natureza reservada.","participar da gerência de empresas que contratam com o Estado.","promover listas de donativos na repartição.","residir obrigatoriamente na capital."],"correta":1,"explicacao":"Art. 241, Lei 10.261/68. As ordens manifestamente ilegais devem ser representadas, não cumpridas.","origem":"inedita","fonte":"Questão inédita (formato Vunesp)"},{"id":"oj-q094","materia":"adm","assunto":"Improbidade - enriquecimento ilícito (art. 9º)","enunciado":"Constitui ato de improbidade que importa enriquecimento ilícito, nos termos do art. 9º da Lei 8.429/92,","alternativas":["frustrar a licitude de concurso público.","receber, para si ou para outrem, dinheiro, bem ou qualquer vantagem econômica, direta ou indireta, de quem tenha interesse que possa ser atingido por ação ou omissão decorrente das atribuições do agente público.","negligenciar a conservação do patrimônio público.","revelar fato de que tem ciência em razão das atribuições.","deixar de prestar contas, por esquecimento."],"correta":1,"explicacao":"Art. 9º, I, Lei 8.429/92. Desde a Lei 14.230/2021, exige-se dolo. As outras hipóteses são dos arts. 10 e 11.","origem":"inedita","fonte":"Questão inédita (formato Vunesp)"},{"id":"oj-q095","materia":"adm","assunto":"Improbidade - declaração de bens (art. 13)","enunciado":"Segundo o art. 13 da Lei 8.429/92 (redação da Lei 14.230/2021), a posse e o exercício de agente público ficam condicionados","alternativas":["à apresentação de declaração de imposto de renda e proventos de qualquer natureza, que tenha sido apresentada à Receita Federal, para arquivo no serviço de pessoal.","à apresentação de certidão negativa de protestos.","à prova de que não possui imóveis.","a exame psicotécnico.","à declaração de parentes no serviço público."],"correta":0,"explicacao":"Art. 13, Lei 8.429/92. A declaração é atualizada anualmente e na saída; quem se recusa a prestá-la no prazo ou presta declaração falsa é punido com demissão (§§ 2º e 3º).","origem":"inedita","fonte":"Questão inédita (formato Vunesp)"},{"id":"oj-q096","materia":"civil","assunto":"Personalidade e capacidade (arts. 1º a 5º)","enunciado":"De acordo com o Código Civil, são absolutamente incapazes de exercer pessoalmente os atos da vida civil","alternativas":["os maiores de 16 e menores de 18 anos.","os menores de 16 anos.","os pródigos.","os ébrios habituais.","as pessoas com deficiência."],"correta":1,"explicacao":"Art. 3º, CC (redação do Estatuto da Pessoa com Deficiência). Pródigos, ébrios habituais e quem não pode exprimir sua vontade são relativamente incapazes (art. 4º).","origem":"inedita","fonte":"Questão inédita (formato Vunesp)"},{"id":"oj-q097","materia":"civil","assunto":"Emancipação (art. 5º)","enunciado":"Cessa a incapacidade para os menores, entre outras hipóteses,","alternativas":["aos 16 anos, automaticamente.","pelo casamento e pelo exercício de emprego público efetivo.","pela aprovação no vestibular.","pela simples mudança de domicílio.","pela inscrição no título de eleitor."],"correta":1,"explicacao":"Art. 5º, parágrafo único, CC: concessão dos pais (instrumento público) ou sentença, com 16 anos completos; casamento; emprego público efetivo; colação de grau em curso superior; estabelecimento ou emprego com economia própria (16 anos completos).","origem":"inedita","fonte":"Questão inédita (formato Vunesp)"},{"id":"oj-q098","materia":"civil","assunto":"Morte presumida (arts. 6º a 8º)","enunciado":"Se dois ou mais indivíduos falecerem na mesma ocasião, não se podendo averiguar se algum precedeu aos outros,","alternativas":["presume-se que o mais velho morreu primeiro.","presumir-se-ão simultaneamente mortos.","presume-se que o mais novo morreu primeiro.","o juiz decide por sorteio.","presume-se que a mulher morreu primeiro."],"correta":1,"explicacao":"Art. 8º, CC (comoriência).","origem":"inedita","fonte":"Questão inédita (formato Vunesp)"},{"id":"oj-q099","materia":"civil","assunto":"Direitos da personalidade (art. 11)","enunciado":"Com exceção dos casos previstos em lei, os direitos da personalidade são","alternativas":["transmissíveis e renunciáveis.","intransmissíveis e irrenunciáveis, não podendo o seu exercício sofrer limitação voluntária.","transmissíveis apenas por testamento.","renunciáveis por escritura pública.","negociáveis livremente."],"correta":1,"explicacao":"Art. 11, CC.","origem":"inedita","fonte":"Questão inédita (formato Vunesp)"},{"id":"oj-q100","materia":"civil","assunto":"Pessoas jurídicas (arts. 40 a 45)","enunciado":"São pessoas jurídicas de direito público interno:","alternativas":["as sociedades de economia mista.","a União, os Estados, o Distrito Federal, os Territórios, os Municípios, as autarquias (inclusive associações públicas) e as demais entidades de caráter público criadas por lei.","as fundações privadas.","os partidos políticos.","os Estados estrangeiros."],"correta":1,"explicacao":"Art. 41, CC. Estados estrangeiros são de direito público externo (art. 42); partidos e fundações privadas, de direito privado (art. 44).","origem":"inedita","fonte":"Questão inédita (formato Vunesp)"},{"id":"oj-q101","materia":"civil","assunto":"Desconsideração da personalidade (art. 50)","enunciado":"Pelo art. 50 do Código Civil, o abuso da personalidade jurídica que autoriza a desconsideração é caracterizado","alternativas":["por qualquer inadimplemento.","pelo desvio de finalidade ou pela confusão patrimonial.","pela simples existência de dívidas trabalhistas.","pela falência da sociedade.","pelo encerramento irregular, exclusivamente."],"correta":1,"explicacao":"Art. 50, CC (redação da Lei 13.874/2019).","origem":"inedita","fonte":"Questão inédita (formato Vunesp)"},{"id":"oj-q102","materia":"civil","assunto":"Domicílio (arts. 70 a 78)","enunciado":"Têm domicílio necessário","alternativas":["os comerciantes e os profissionais liberais.","o incapaz, o servidor público, o militar, o marítimo e o preso.","os aposentados.","os estudantes universitários.","os estrangeiros."],"correta":1,"explicacao":"Art. 76, CC. O do servidor público é o lugar em que exerce permanentemente suas funções; o do preso, o lugar em que cumpre a sentença.","origem":"inedita","fonte":"Questão inédita (formato Vunesp)"},{"id":"oj-q103","materia":"civil","assunto":"Domicílio (arts. 70 a 73)","enunciado":"Ter-se-á por domicílio da pessoa natural que não tenha residência habitual","alternativas":["o último endereço declarado à Receita Federal.","o lugar onde for encontrada.","a capital do Estado.","o domicílio dos pais.","o local de nascimento."],"correta":1,"explicacao":"Art. 73, CC. Com várias residências, qualquer delas é domicílio (art. 71).","origem":"inedita","fonte":"Questão inédita (formato Vunesp)"},{"id":"oj-q104","materia":"civil","assunto":"Bens (arts. 79 a 84)","enunciado":"Consideram-se bens móveis para os efeitos legais","alternativas":["o direito à sucessão aberta.","as energias que tenham valor econômico.","os direitos reais sobre imóveis.","as edificações removidas para outro local, conservando sua unidade.","os materiais separados de um prédio para nele se reempregarem."],"correta":1,"explicacao":"Art. 83, I, CC. O direito à sucessão aberta e os direitos reais sobre imóveis são imóveis por lei (art. 80); as hipóteses D e E não perdem o caráter de imóveis (art. 81).","origem":"inedita","fonte":"Questão inédita (formato Vunesp)"},{"id":"oj-q105","materia":"civil","assunto":"Bens públicos (arts. 98 a 103)","enunciado":"Sobre os bens públicos, é correto afirmar:","alternativas":["os bens dominicais são inalienáveis em qualquer hipótese.","os bens públicos não estão sujeitos a usucapião.","as ruas e praças são bens dominicais.","os bens de uso especial podem ser alienados livremente.","o uso comum dos bens públicos é sempre gratuito."],"correta":1,"explicacao":"Art. 102, CC. Ruas e praças são de uso comum (art. 99, I); os dominicais podem ser alienados, observadas as exigências legais (art. 101); o uso comum pode ser gratuito ou retribuído (art. 103).","origem":"inedita","fonte":"Questão inédita (formato Vunesp)"},{"id":"oj-q106","materia":"civil","assunto":"Benfeitorias (art. 96)","enunciado":"A benfeitoria que tem por fim conservar o bem ou evitar que se deteriore é","alternativas":["voluptuária.","útil.","necessária.","acessória.","pertença."],"correta":2,"explicacao":"Art. 96, § 3º, CC. Úteis aumentam ou facilitam o uso; voluptuárias são de mero deleite ou recreio.","origem":"inedita","fonte":"Questão inédita (formato Vunesp)"},{"id":"oj-q107","materia":"civil","assunto":"Defeitos do negócio jurídico (arts. 156 e 157)","enunciado":"Configura-se o estado de perigo quando alguém","alternativas":["sob premente necessidade, ou por inexperiência, se obriga a prestação manifestamente desproporcional.","premido da necessidade de salvar-se, ou a pessoa de sua família, de grave dano conhecido pela outra parte, assume obrigação excessivamente onerosa.","é induzido a erro por artifício da outra parte.","sofre ameaça de dano iminente à sua pessoa.","pratica negócio para prejudicar credores."],"correta":1,"explicacao":"Art. 156, CC. A alternativa A descreve a lesão (art. 157); C, o dolo (art. 145); D, a coação (art. 151); E, a fraude contra credores (art. 158).","origem":"inedita","fonte":"Questão inédita (formato Vunesp)"},{"id":"oj-q108","materia":"civil","assunto":"Invalidade (arts. 166 a 171)","enunciado":"É nulo o negócio jurídico quando","alternativas":["celebrado por relativamente incapaz sem assistência.","celebrado por pessoa absolutamente incapaz.","houver erro substancial.","resultar de coação.","houver lesão."],"correta":1,"explicacao":"Art. 166, I, CC. As demais hipóteses tornam o negócio anulável (art. 171). O negócio nulo não é suscetível de confirmação nem convalesce com o tempo (art. 169).","origem":"inedita","fonte":"Questão inédita (formato Vunesp)"},{"id":"oj-q109","materia":"civil","assunto":"Prescrição (arts. 189 a 206)","enunciado":"Prescreve em 3 anos a pretensão","alternativas":["de cobrar prestações alimentares.","de reparação civil.","de cobrança de dívidas líquidas constantes de instrumento público.","do segurado contra o segurador.","de qualquer natureza, quando a lei não fixar prazo menor."],"correta":1,"explicacao":"Art. 206, § 3º, V, CC. Alimentos: 2 anos (§ 2º); dívidas líquidas: 5 anos (§ 5º, I); segurado: 1 ano (§ 1º, II); regra geral: 10 anos (art. 205).","origem":"inedita","fonte":"Questão inédita (formato Vunesp)"},{"id":"oj-q110","materia":"civil","assunto":"Prescrição (arts. 197 e 198)","enunciado":"NÃO corre a prescrição","alternativas":["entre vizinhos.","contra os absolutamente incapazes e entre cônjuges, na constância da sociedade conjugal.","contra quem mora em outro Estado.","contra pessoas jurídicas.","enquanto o processo estiver em grau de recurso."],"correta":1,"explicacao":"Arts. 197, I, e 198, I, CC.","origem":"inedita","fonte":"Questão inédita (formato Vunesp)"},{"id":"oj-q111","materia":"civil","assunto":"Decadência (arts. 207 a 211)","enunciado":"Sobre a decadência, é correto afirmar:","alternativas":["o juiz não pode conhecê-la de ofício.","deve o juiz, de ofício, conhecer da decadência quando estabelecida por lei, sendo nula a renúncia a ela.","a ela se aplicam todas as causas de interrupção da prescrição.","pode ser renunciada a qualquer tempo.","só pode ser alegada em primeira instância."],"correta":1,"explicacao":"Arts. 209 e 210, CC. Se a decadência for convencional, o juiz não pode suprir a alegação da parte (art. 211).","origem":"inedita","fonte":"Questão inédita (formato Vunesp)"},{"id":"oj-q112","materia":"civil","assunto":"Mandato (arts. 653 a 666)","enunciado":"Sobre o mandato, é correto afirmar que","alternativas":["o mandato em termos gerais confere poderes para alienar e hipotecar.","para alienar, hipotecar, transigir ou praticar atos que exorbitem da administração ordinária, depende-se de procuração com poderes especiais e expressos.","o menor de 18 anos não pode ser mandatário.","o mandato presume-se oneroso sempre.","a procuração deve ser sempre por instrumento público."],"correta":1,"explicacao":"Art. 661, § 1º, CC. O maior de 16 e menor de 18 não emancipado pode ser mandatário (art. 666); presume-se gratuito, salvo ofício ou profissão lucrativa (art. 658); a procuração pode ser particular (art. 654).","origem":"inedita","fonte":"Questão inédita (formato Vunesp)"},{"id":"oj-q113","materia":"civil","assunto":"Posse (arts. 1.196 a 1.203)","enunciado":"É justa a posse que","alternativas":["for de boa-fé.","não for violenta, clandestina ou precária.","tiver mais de um ano.","estiver registrada em cartório.","for exercida pelo proprietário."],"correta":1,"explicacao":"Art. 1.200, CC. Boa-fé é outra coisa: o possuidor ignora o vício (art. 1.201). O detentor conserva a posse em nome de outro, em relação de dependência (art. 1.198).","origem":"inedita","fonte":"Questão inédita (formato Vunesp)"},{"id":"oj-q114","materia":"civil","assunto":"Penhor (arts. 1.431 e 1.432)","enunciado":"No penhor comum, a garantia se constitui","alternativas":["por registro no cartório de imóveis.","pela transferência efetiva da posse de coisa móvel ao credor; no penhor rural, industrial, mercantil e de veículos, as coisas continuam em poder do devedor.","apenas por escritura pública.","sobre bens imóveis.","sem qualquer registro."],"correta":1,"explicacao":"Art. 1.431 e parágrafo único, CC. O instrumento é registrado no Cartório de Títulos e Documentos (art. 1.432).","origem":"inedita","fonte":"Questão inédita (formato Vunesp)"},{"id":"oj-q115","materia":"civil","assunto":"Curatela (arts. 1.767 e 1.775)","enunciado":"O cônjuge ou companheiro, não separado judicialmente ou de fato, é, de direito,","alternativas":["tutor do outro.","curador do outro, quando interdito.","herdeiro necessário exclusivo.","administrador provisório dos bens do casal.","representante legal em qualquer caso."],"correta":1,"explicacao":"Art. 1.775, CC. Na falta, são curadores o pai ou a mãe e, depois, o descendente mais apto (§ 1º).","origem":"inedita","fonte":"Questão inédita (formato Vunesp)"},{"id":"oj-q116","materia":"civil","assunto":"LINDB","enunciado":"Salvo disposição contrária, a lei começa a vigorar em todo o país","alternativas":["na data de sua publicação.","45 dias depois de oficialmente publicada; nos Estados estrangeiros, 3 meses depois.","30 dias depois da sanção.","90 dias depois da publicação.","1 ano depois da publicação."],"correta":1,"explicacao":"Art. 1º, LINDB (Decreto-Lei 4.657/42). Lei revogada não se restaura por ter a revogadora perdido a vigência (art. 2º, § 3º).","origem":"inedita","fonte":"Questão inédita (formato Vunesp)"},{"id":"oj-q117","materia":"civil","assunto":"LINDB","enunciado":"Quando a lei for omissa, o juiz decidirá o caso","alternativas":["pela equidade, exclusivamente.","de acordo com a analogia, os costumes e os princípios gerais de direito.","conforme a jurisprudência estrangeira.","consultando o tribunal.","pela opinião das partes."],"correta":1,"explicacao":"Art. 4º, LINDB.","origem":"inedita","fonte":"Questão inédita (formato Vunesp)"},{"id":"oj-q118","materia":"legesp","assunto":"Lei 6.830/80 (execução fiscal)","enunciado":"Na execução fiscal, o executado será citado para, no prazo de","alternativas":["3 dias, pagar a dívida.","5 dias, pagar a dívida com os juros, multa de mora e encargos indicados na Certidão de Dívida Ativa, ou garantir a execução.","15 dias, apresentar embargos.","10 dias, indicar bens.","30 dias, pagar ou parcelar."],"correta":1,"explicacao":"Art. 8º, Lei 6.830/80. No CPC, o prazo para pagar na execução comum é de 3 dias (art. 829).","origem":"inedita","fonte":"Questão inédita (formato Vunesp)"},{"id":"oj-q119","materia":"legesp","assunto":"Lei 6.830/80 (execução fiscal)","enunciado":"Na execução fiscal, a citação é feita","alternativas":["sempre por oficial de justiça.","pelo correio, com aviso de recebimento, se a Fazenda Pública não a requerer por outra forma; se o aviso não retornar em 15 dias, por oficial de justiça ou por edital.","apenas por edital.","por meio eletrônico, obrigatoriamente.","pelo próprio Procurador da Fazenda."],"correta":1,"explicacao":"Art. 8º, I e III, Lei 6.830/80. O edital tem prazo de 30 dias (inciso IV) e, para executado ausente do país, 60 dias (§ 1º).","origem":"inedita","fonte":"Questão inédita (formato Vunesp)"},{"id":"oj-q120","materia":"legesp","assunto":"Lei 6.830/80 (execução fiscal)","enunciado":"O despacho do juiz que deferir a inicial da execução fiscal importa em ordem para","alternativas":["apenas a citação.","citação, penhora (se não paga a dívida nem garantida a execução), arresto (se o executado não tiver domicílio ou dele se ocultar), registro da penhora ou do arresto e avaliação dos bens.","a imediata alienação dos bens.","a prisão do devedor.","a intimação do cônjuge apenas."],"correta":1,"explicacao":"Art. 7º, I a V, Lei 6.830/80.","origem":"inedita","fonte":"Questão inédita (formato Vunesp)"},{"id":"oj-q121","materia":"legesp","assunto":"Lei 6.830/80 (execução fiscal)","enunciado":"Segundo a Lei de Execução Fiscal, o oficial de justiça deverá efetuar as diligências que lhe forem ordenadas no prazo de","alternativas":["24 horas.","5 dias.","10 dias, salvo motivo de força maior devidamente justificado perante o juízo.","30 dias.","60 dias."],"correta":2,"explicacao":"Art. 37, parágrafo único, Lei 6.830/80. O auxiliar que, por ação ou omissão, culposa ou dolosa, prejudicar a execução responde civil, penal e administrativamente (caput).","origem":"inedita","fonte":"Questão inédita (formato Vunesp)"},{"id":"oj-q122","materia":"legesp","assunto":"Lei 6.830/80 (execução fiscal)","enunciado":"Na ordem de penhora da Lei de Execução Fiscal, logo depois do dinheiro vem","alternativas":["imóveis.","título da dívida pública, bem como título de crédito, que tenham cotação em bolsa.","veículos.","navios e aeronaves.","direitos e ações."],"correta":1,"explicacao":"Art. 11, Lei 6.830/80: dinheiro; títulos com cotação; pedras e metais preciosos; imóveis; navios e aeronaves; veículos; móveis ou semoventes; direitos e ações.","origem":"inedita","fonte":"Questão inédita (formato Vunesp)"},{"id":"oj-q123","materia":"legesp","assunto":"Lei 6.830/80 (execução fiscal)","enunciado":"Segundo a Lei 6.830/80, constitui Dívida Ativa da Fazenda Pública","alternativas":["apenas a dívida tributária.","aquela definida como tributária ou não tributária na Lei 4.320/64.","somente as multas de trânsito.","apenas os débitos de autarquias.","qualquer dívida entre particulares."],"correta":1,"explicacao":"Art. 2º, Lei 6.830/80. A lei rege a cobrança da Dívida Ativa da União, Estados, DF, Municípios e autarquias (art. 1º).","origem":"inedita","fonte":"Questão inédita (formato Vunesp)"},{"id":"oj-q124","materia":"legesp","assunto":"Resolução CNJ 354/2020","enunciado":"Nos termos da Resolução CNJ 354/2020, nos casos em que cabível a citação e a intimação pelo correio, por oficial de justiça ou pelo escrivão ou chefe de secretaria,","alternativas":["o ato só pode ser cumprido presencialmente.","o ato poderá ser cumprido por meio eletrônico que assegure ter o destinatário tomado conhecimento do seu conteúdo.","é obrigatória a videoconferência.","a comunicação deve ser feita por carta registrada.","o ato depende de autorização do CNJ."],"correta":1,"explicacao":"Art. 8º, Resolução CNJ 354/2020 (cumprimento digital de atos processuais).","origem":"inedita","fonte":"Questão inédita (formato Vunesp)"},{"id":"oj-q125","materia":"legesp","assunto":"Resolução CNJ 354/2020","enunciado":"Segundo a Resolução CNJ 354/2020, o cumprimento da citação e da intimação por meio eletrônico","alternativas":["é feito apenas pelo juiz.","poderá ser realizado pela secretaria do juízo ou pelos oficiais de justiça, e será documentado por comprovante de envio e recebimento ou por certidão detalhada de como o destinatário foi identificado e tomou conhecimento do teor.","pode ser feito por mensagem de voz em qualquer caso.","dispensa qualquer registro nos autos.","só vale para pessoas jurídicas."],"correta":1,"explicacao":"Art. 10, I, II e § 1º, Resolução CNJ 354/2020. Salvo ocultação, é vedado o cumprimento por mensagem de voz (§ 2º).","origem":"inedita","fonte":"Questão inédita (formato Vunesp)"},{"id":"oj-q126","materia":"legesp","assunto":"Resolução CNJ 354/2020","enunciado":"Pela Resolução CNJ 354/2020, quem requerer a citação ou intimação deverá fornecer, além dos dados de qualificação,","alternativas":["cópia do imposto de renda do citando.","os dados necessários para comunicação eletrônica por aplicativos de mensagens, redes sociais e correspondência eletrônica, salvo impossibilidade de fazê-lo.","fotografia do citando.","o endereço de trabalho do citando, obrigatoriamente.","procuração do citando."],"correta":1,"explicacao":"Art. 9º, parágrafo único, Resolução CNJ 354/2020. As partes informam seus endereços eletrônicos na primeira intervenção e os mantêm atualizados (caput).","origem":"inedita","fonte":"Questão inédita (formato Vunesp)"},{"id":"oj-q127","materia":"legesp","assunto":"Lei 11.608/2003 (taxa judiciária SP)","enunciado":"A taxa judiciária do Estado de São Paulo (Lei 11.608/2003) tem por fato gerador","alternativas":["a propriedade de imóveis.","a prestação de serviços públicos de natureza forense, devida pelas partes ao Estado.","a contratação de advogado.","a emissão de certidões de antecedentes.","o salário do servidor do Judiciário."],"correta":1,"explicacao":"Art. 1º, Lei 11.608/2003: devida nas ações de conhecimento, na execução, nas cautelares, na jurisdição voluntária e nos recursos.","origem":"inedita","fonte":"Questão inédita (formato Vunesp)"},{"id":"oj-q128","materia":"legesp","assunto":"Lei 11.608/2003 (taxa judiciária SP)","enunciado":"Pela Lei 11.608/2003, estão isentos da taxa judiciária","alternativas":["os advogados.","a União, o Estado, o Município e respectivas autarquias e fundações, assim como o Ministério Público.","as empresas de pequeno porte.","todos os réus.","as pessoas jurídicas de direito privado sem fins lucrativos."],"correta":1,"explicacao":"Art. 6º, Lei 11.608/2003. A gratuidade da justiça também afasta a cobrança para quem a obtém.","origem":"inedita","fonte":"Questão inédita (formato Vunesp)"},{"id":"oj-q129","materia":"atual","assunto":"Estatuto da Pessoa com Deficiência","enunciado":"Segundo a Lei 13.146/2015, considera-se pessoa com deficiência aquela que tem impedimento de longo prazo de natureza física, mental, intelectual ou sensorial, o qual, em interação com","alternativas":["três ou mais barreiras, impede totalmente sua vida civil.","uma ou mais barreiras, pode obstruir sua participação plena e efetiva na sociedade em igualdade de condições com as demais pessoas.","qualquer doença, gera incapacidade absoluta.","barreiras arquitetônicas, exclusivamente, limita sua locomoção.","a idade avançada, reduz sua autonomia."],"correta":1,"explicacao":"Art. 2º, Lei 13.146/2015. Quando necessária, a avaliação é biopsicossocial, feita por equipe multiprofissional e interdisciplinar (§ 1º).","origem":"inedita","fonte":"Questão inédita (formato Vunesp)"},{"id":"oj-q130","materia":"atual","assunto":"Estatuto da Pessoa com Deficiência","enunciado":"De acordo com o Estatuto da Pessoa com Deficiência, a curatela","alternativas":["é medida definitiva e alcança todos os atos da vida civil.","é medida protetiva extraordinária e afeta tão somente os atos relacionados aos direitos de natureza patrimonial e negocial.","impede o casamento e o voto.","é obrigatória para toda pessoa com deficiência intelectual.","substitui a tomada de decisão apoiada em todos os casos."],"correta":1,"explicacao":"Arts. 84, § 3º, e 85, Lei 13.146/2015. Não alcança o direito ao próprio corpo, à sexualidade, ao matrimônio, à privacidade, à educação, à saúde, ao trabalho e ao voto (art. 85, § 1º).","origem":"inedita","fonte":"Questão inédita (formato Vunesp)"},{"id":"oj-q131","materia":"atual","assunto":"Estatuto da Pessoa com Deficiência","enunciado":"Sobre o acesso à justiça da pessoa com deficiência (arts. 79 e 80 da Lei 13.146/2015), é correto afirmar que","alternativas":["os recursos de tecnologia assistiva só são garantidos quando ela é parte no processo.","serão oferecidos todos os recursos de tecnologia assistiva disponíveis sempre que ela figure como parte, testemunha, advogado, defensor público, magistrado ou membro do Ministério Público.","o acesso aos atos processuais depende de autorização do juiz.","a pessoa com deficiência não pode exercer a advocacia.","o Judiciário não tem dever de capacitar servidores para atendê-la."],"correta":1,"explicacao":"Art. 80, Lei 13.146/2015. O poder público deve capacitar membros e servidores do Judiciário (art. 79, § 1º).","origem":"inedita","fonte":"Questão inédita (formato Vunesp)"},{"id":"oj-q132","materia":"atual","assunto":"Estatuto da Pessoa com Deficiência","enunciado":"No direito ao trabalho da pessoa com deficiência (art. 34 da Lei 13.146/2015), é vedada","alternativas":["a contratação por empresas privadas.","a restrição ao trabalho e qualquer discriminação em razão de sua condição, inclusive nas etapas de recrutamento, seleção, contratação, exames admissional e periódico, permanência e ascensão profissional, bem como a exigência de aptidão plena.","a participação em concursos públicos.","a promoção por merecimento.","a adaptação do posto de trabalho."],"correta":1,"explicacao":"Art. 34, § 3º, Lei 13.146/2015.","origem":"inedita","fonte":"Questão inédita (formato Vunesp)"},{"id":"oj-q133","materia":"port","assunto":"Crase","enunciado":"Assinale a alternativa em que o acento indicativo de crase está empregado de acordo com a norma-padrão.","alternativas":["O oficial foi à pé até o endereço.","O mandado foi entregue à uma pessoa da família.","Compareceu à audiência marcada para as 14 horas.","Começou à chover durante a diligência.","Referiu-se à todos os presentes."],"correta":2,"explicacao":"\"Comparecer a\" + \"a audiência\" = \"à audiência\". Não há crase antes de palavra masculina (pé), artigo indefinido (uma), verbo (chover) ou pronome indefinido (todos).","origem":"inedita","fonte":"Questão inédita (formato Vunesp)"},{"id":"oj-q134","materia":"port","assunto":"Concordância verbal","enunciado":"Assinale a alternativa correta quanto à concordância verbal.","alternativas":["Fazem dois anos que o processo tramita.","Houveram muitas tentativas de citação.","Devem haver outros bens penhoráveis.","Faz dois anos que o processo tramita, e houve muitas tentativas de citação.","Existe muitas certidões nos autos."],"correta":3,"explicacao":"\"Fazer\" (tempo) e \"haver\" (existir) são impessoais: ficam no singular, inclusive na locução (\"deve haver\"). \"Existir\" concorda: \"existem certidões\".","origem":"inedita","fonte":"Questão inédita (formato Vunesp)"},{"id":"oj-q135","materia":"port","assunto":"Regência verbal","enunciado":"De acordo com a norma-padrão, a regência está correta em:","alternativas":["O réu não obedeceu a ordem judicial.","Prefiro mais cumprir mandados de dia do que à noite.","O oficial assistiu à audiência e informou o juiz do ocorrido.","Ele namora com a escrevente da vara.","Esqueci do horário da diligência."],"correta":2,"explicacao":"\"Assistir\" (presenciar) pede \"a\": \"assistiu à audiência\"; \"informar alguém de algo\". O correto seria \"obedeceu à ordem\", \"prefiro cumprir... a...\", \"namora a escrevente\", \"esqueci o horário\" ou \"esqueci-me do horário\".","origem":"inedita","fonte":"Questão inédita (formato Vunesp)"},{"id":"oj-q136","materia":"port","assunto":"Colocação pronominal","enunciado":"Assinale a alternativa em conformidade com a norma-padrão de colocação pronominal.","alternativas":["Me entregaram o mandado ontem.","Não entregaram-me o mandado.","Jamais o encontraram em casa.","Quando encontraram-no, citaram-no.","Se ocultou para não ser citado."],"correta":2,"explicacao":"Advérbio de negação (\"jamais\", \"não\") e conjunção subordinativa (\"quando\") atraem o pronome (próclise). Não se inicia frase com pronome oblíquo átono.","origem":"inedita","fonte":"Questão inédita (formato Vunesp)"},{"id":"oj-q137","materia":"port","assunto":"Pontuação","enunciado":"Assinale a alternativa pontuada de acordo com a norma-padrão.","alternativas":["O oficial de justiça, cumpriu o mandado.","O oficial de justiça cumpriu o mandado, e, depois, devolveu-o ao cartório.","O réu que se ocultava, foi citado por hora certa.","Os documentos, foram juntados aos autos.","Penhorou, o oficial, os bens do executado."],"correta":1,"explicacao":"Não se separa o sujeito do verbo por vírgula (A, C, D). Em B, o advérbio \"depois\" está corretamente isolado. Em E, o sujeito posposto não deve vir entre vírgulas.","origem":"inedita","fonte":"Questão inédita (formato Vunesp)"},{"id":"oj-q138","materia":"port","assunto":"Pronomes relativos","enunciado":"Assinale a alternativa em que o pronome relativo está empregado corretamente.","alternativas":["O bem que o oficial se referiu foi penhorado.","A casa onde o réu mora fica no centro.","O executado cujo o carro foi penhorado recorreu.","A vara aonde trabalho é cível.","O processo que eu gosto foi arquivado."],"correta":1,"explicacao":"\"Onde\" indica lugar físico em que se está. Corrigindo: \"ao qual o oficial se referiu\", \"cujo carro\" (sem artigo), \"onde trabalho\" (sem movimento), \"de que eu gosto\".","origem":"inedita","fonte":"Questão inédita (formato Vunesp)"},{"id":"oj-q139","materia":"mat","assunto":"Regra de três composta","enunciado":"Três oficiais de justiça cumprem 60 mandados em 4 dias. Mantido o mesmo ritmo, quantos mandados 5 oficiais cumprirão em 6 dias?","alternativas":["100","120","150","180","90"],"correta":2,"explicacao":"Mandados são proporcionais a oficiais e dias: 60 × (5/3) × (6/4) = 150.","origem":"inedita","fonte":"Questão inédita (formato Vunesp)"},{"id":"oj-q140","materia":"mat","assunto":"Porcentagem","enunciado":"Um bem penhorado foi avaliado em R$ 40.000,00. No leilão, foi arrematado por 80% do valor da avaliação. Quanto faltou para atingir o valor da avaliação?","alternativas":["R$ 6.000,00","R$ 8.000,00","R$ 10.000,00","R$ 32.000,00","R$ 4.000,00"],"correta":1,"explicacao":"80% de 40.000 = 32.000. Faltaram 40.000 − 32.000 = R$ 8.000,00.","origem":"inedita","fonte":"Questão inédita (formato Vunesp)"},{"id":"oj-q141","materia":"mat","assunto":"Juros simples","enunciado":"Uma dívida de R$ 12.000,00 foi corrigida com juros simples de 1% ao mês durante 18 meses. O valor total ficou em","alternativas":["R$ 13.800,00","R$ 14.160,00","R$ 14.400,00","R$ 12.180,00","R$ 15.000,00"],"correta":1,"explicacao":"J = 12.000 × 0,01 × 18 = 2.160. Total = R$ 14.160,00.","origem":"inedita","fonte":"Questão inédita (formato Vunesp)"},{"id":"oj-q142","materia":"mat","assunto":"MMC","enunciado":"Um oficial visita a comarca A a cada 6 dias e a comarca B a cada 8 dias. Se visitou as duas hoje, voltará a visitar as duas no mesmo dia daqui a","alternativas":["14 dias","24 dias","48 dias","12 dias","16 dias"],"correta":1,"explicacao":"MMC(6, 8) = 24.","origem":"inedita","fonte":"Questão inédita (formato Vunesp)"},{"id":"oj-q143","materia":"mat","assunto":"Raciocínio lógico: negação","enunciado":"A negação de \"Todos os mandados foram cumpridos\" é:","alternativas":["Nenhum mandado foi cumprido.","Algum mandado não foi cumprido.","Todos os mandados não foram cumpridos.","Alguns mandados foram cumpridos.","Nenhum mandado deixou de ser cumprido."],"correta":1,"explicacao":"A negação de \"todo A é B\" é \"algum A não é B\" (pelo menos um).","origem":"inedita","fonte":"Questão inédita (formato Vunesp)"},{"id":"oj-q144","materia":"mat","assunto":"Raciocínio lógico: equivalência","enunciado":"Uma afirmação equivalente a \"Se o réu se oculta, então é citado por hora certa\" é:","alternativas":["Se o réu não se oculta, então não é citado por hora certa.","Se o réu não é citado por hora certa, então não se oculta.","O réu se oculta e não é citado por hora certa.","O réu se oculta ou é citado por hora certa.","Se o réu é citado por hora certa, então se oculta."],"correta":1,"explicacao":"p → q equivale à contrapositiva ~q → ~p (e também a ~p ∨ q).","origem":"inedita","fonte":"Questão inédita (formato Vunesp)"},{"id":"oj-q145","materia":"info","assunto":"Windows: atalhos","enunciado":"No MS-Windows 10 ou superior, em sua configuração padrão, o atalho que abre o Explorador de Arquivos é","alternativas":["Ctrl + E","Windows + E","Alt + F4","Windows + L","Ctrl + Shift + Esc"],"correta":1,"explicacao":"Windows + E abre o Explorador. Windows + L bloqueia a sessão; Ctrl + Shift + Esc abre o Gerenciador de Tarefas; Alt + F4 fecha a janela.","origem":"inedita","fonte":"Questão inédita (formato Vunesp)"},{"id":"oj-q146","materia":"info","assunto":"MS-Word","enunciado":"No MS-Word (Microsoft 365), em sua configuração padrão, o atalho para inserir uma quebra de página é","alternativas":["Ctrl + Enter","Shift + Enter","Alt + Enter","Ctrl + P","Ctrl + Shift + Q"],"correta":0,"explicacao":"Ctrl + Enter insere quebra de página. Shift + Enter cria quebra de linha; Ctrl + P imprime.","origem":"inedita","fonte":"Questão inédita (formato Vunesp)"},{"id":"oj-q147","materia":"info","assunto":"MS-Excel","enunciado":"No MS-Excel, a célula A1 contém 10, A2 contém 20 e A3 contém 30. O resultado da fórmula =MÉDIA(A1:A3)+MÁXIMO(A1:A3) é","alternativas":["40","50","60","30","20"],"correta":1,"explicacao":"Média = 20; máximo = 30; soma = 50.","origem":"inedita","fonte":"Questão inédita (formato Vunesp)"},{"id":"oj-q148","materia":"info","assunto":"MS-Excel","enunciado":"No MS-Excel, a fórmula =$A$1*B1 é copiada de C1 para C2. A fórmula em C2 será","alternativas":["=$A$1*B1","=$A$2*B2","=$A$1*B2","=A2*B2","=$A$1*C2"],"correta":2,"explicacao":"O cifrão fixa a referência ($A$1 não muda); B1 é relativa e desce uma linha (B2).","origem":"inedita","fonte":"Questão inédita (formato Vunesp)"},{"id":"oj-q149","materia":"info","assunto":"OneDrive","enunciado":"No OneDrive, para que outra pessoa possa editar um arquivo armazenado na nuvem, o usuário deve","alternativas":["enviar o arquivo por pen drive.","usar a opção Compartilhar e conceder permissão de edição.","renomear o arquivo com a extensão .edit.","salvar o arquivo como PDF.","mover o arquivo para a Lixeira."],"correta":1,"explicacao":"O compartilhamento do OneDrive permite escolher entre \"pode exibir\" e \"pode editar\".","origem":"inedita","fonte":"Questão inédita (formato Vunesp)"},{"id":"oj-q150","materia":"info","assunto":"MS-Teams","enunciado":"No MS-Teams, uma reunião agendada pelo calendário do aplicativo pode ser gravada, e a gravação","alternativas":["é proibida em qualquer hipótese.","fica disponível, em geral, no chat da reunião e armazenada no OneDrive ou SharePoint.","só pode ser vista pelo organizador.","é enviada por correio físico.","fica salva apenas no computador de quem gravou, sem acesso pelos demais."],"correta":1,"explicacao":"As gravações do Teams ficam no OneDrive (reuniões) ou SharePoint (canais) e aparecem no chat da reunião.","origem":"inedita","fonte":"Questão inédita (formato Vunesp)"}],"aviso":"Prova objetiva com 70 questões de mesmo peso, nota de 0 a 10. É preciso acertar metade do Bloco I (Português) e metade do Bloco II (Conhecimentos Específicos) e tirar nota 5 ou mais no total. A distribuição das 40 questões do Bloco II entre as matérias é uma estimativa: o edital não a divulga. A discursiva (2 questões) é no mesmo dia; o simulado do app reserva 4 das 5 horas para a parte objetiva.","notaExtra":"Questões marcadas \"fora deste edital\" vêm de provas da Vunesp para o TJSP (Escrevente e Oficial de Justiça), mas tratam de artigos que o edital de Oficial de Justiça 2026 não pede. Servem de treino e ficam fora dos simulados. Provas antigas seguem a lei da época: confira sempre a explicação.","maisQuestoes":{"antes":"O","nome":"Gran Questões","url":"https://questoes.grancursosonline.com.br/concursos/oficial-de-justica","depois":"tem mais provas de oficial de justiça para treinar no site deles."},"carimboAulas":{"assunto":"Citação por hora certa (art. 252)","nome":"Mandado cumprido","desc":"Concluiu a aula de citação por hora certa"}}]</script>
<script>
{
const $=s=>document.querySelector(s);
const esc=t=>String(t??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const md=t=>esc(t).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>');
const LET='ABCDE';
const KEY='caderneta:v1';
const store={get(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const _emb=JSON.parse(document.getElementById('dados-padrao').textContent);
const embutidos=Array.isArray(_emb)?_emb:[_emb];
const padrao=embutidos[0];

const ICON={
 inicio:'<path d="M4 11l8-7 8 7v9h-5v-6H9v6H4z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>',
 estudar:'<path d="M4 5h6a2 2 0 012 2v13a2 2 0 00-2-2H4zM20 5h-6a2 2 0 00-2 2v13a2 2 0 012-2h6z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>',
 questoes:'<rect x="4" y="3" width="16" height="18" rx="3" fill="none" stroke="currentColor" stroke-width="2"/><path d="M8 9l2 2 4-4M8 16h8" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>',
 simulados:'<circle cx="12" cy="13" r="8" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 9v4l3 2M9 2h6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>',
 perfil:'<circle cx="12" cy="12" r="8.5" fill="none" stroke="currentColor" stroke-width="2" stroke-dasharray="3 2"/><path d="M8 12.5l2.5 2.5L16 9.5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>'
};
const TABS=[['inicio','Início'],['estudar','Estudar'],['questoes','Questões'],['simulados','Simulados'],['perfil','Carimbos']];

const CARIMBOS=[
 ['primeira-aula','Primeira página','Concluiu a primeira aula'],
 ['dez-acertos','Olho de fiscal','10 acertos no total'],
 ['cem-questoes','Cem autos','Respondeu 100 questões'],
 ['seq-3','Três dias seguidos','Estudou 3 dias seguidos'],
 ['seq-7','Semana cheia','Estudou 7 dias seguidos'],
 ['meta','Meta batida','Cumpriu a meta do dia'],
 ['posturas','Código na mão','Todas as aulas do Código de Posturas'],
 ['simulado','Primeiro simulado','Terminou um simulado completo'],
 ['aprovada','Nota de corte','50 pontos ou mais no simulado completo'],
 ['setenta','Rumo à vaga','70 pontos ou mais no simulado completo'],
 ['revisao','Erros zerados','Revisou todos os erros pendentes']
];
const NIVEIS=['Estagiária','Fiscal em treinamento','Fiscal de campo','Fiscal sênior','Chefe de fiscalização','Lenda da Prefeitura'];
const META=15;

function stampSvg(on,label){
 const c=on?'var(--stamp)':'var(--line)';
 return `<svg viewBox="0 0 64 64" aria-hidden="true"><g transform="rotate(-10 32 32)"><circle cx="32" cy="32" r="27" fill="none" stroke="${c}" stroke-width="3"/><circle cx="32" cy="32" r="21" fill="none" stroke="${c}" stroke-width="1.5" stroke-dasharray="2 3"/><text x="32" y="37" text-anchor="middle" font-family="Archivo,sans-serif" font-weight="800" font-size="13" fill="${c}">${esc(label)}</text></g></svg>`;
}

/* ---------- estado ---------- */
let S=store.get(KEY)||{};
S.extras=S.extras||[];
S.ativo=S.ativo||padrao.id;
S.p=S.p||{};
let concursos=[];
function carregarConcursos(){concursos=[...embutidos,...S.extras.filter(c=>!embutidos.some(e=>e.id===c.id))];}
carregarConcursos();
let C=concursos.find(c=>c.id===S.ativo)||padrao;
function P(){
 const p=S.p[C.id]=S.p[C.id]||{};
 p.xp=p.xp||0;p.resp=p.resp||{};p.aulas=p.aulas||{};p.sims=p.sims||[];p.carimbos=p.carimbos||{};p.dias=p.dias||{};p.seq=p.seq||0;p.ultimo=p.ultimo||'';
 return p;
}
const salvar=()=>store.set(KEY,S);
const hoje=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
function nivel(xp){const n=Math.floor(Math.sqrt(xp/60));const base=60*n*n,prox=60*(n+1)*(n+1);return{n,nome:NIVEIS[Math.min(n,NIVEIS.length-1)],pct:Math.round((xp-base)/(prox-base)*100),falta:prox-xp};}
function marcarDia(){
 const p=P(),h=hoje();
 if(p.ultimo===h)return;
 const ont=new Date();ont.setDate(ont.getDate()-1);
 const o=ont.getFullYear()+'-'+String(ont.getMonth()+1).padStart(2,'0')+'-'+String(ont.getDate()).padStart(2,'0');
 p.seq=p.ultimo===o?p.seq+1:1;p.ultimo=h;
 if(p.seq>=3)ganhar('seq-3');if(p.seq>=7)ganhar('seq-7');
}
