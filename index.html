e causa).","origem":"prova","fonte":"Vunesp · TJSP · Escrevente Técnico Judiciário · 2021 · questão 21","texto":"O Dia Nacional de Combate ao Fumo (29 de agosto) foi criado em 1986, com o objetivo de reforçar as ações nacionais de conscientização sobre os danos sociais, de saúde, econômicos e ambientais causados pelo tabaco. A campanha promovida pelo Inca (Instituto Nacional de Câncer) este ano chama-se Comprometa-se a parar de fumar. O instituto lembra que o tabagismo é um fator de risco importante para a Covid-19, por isso parar de fumar se torna uma medida de proteção à saúde de todos os cidadãos.\n\nPeças criadas para redes sociais com a frase “Cringe mesmo é fumar” fazem parte da campanha. Os materiais desenvolvidos pelo Ministério da Saúde, em parceria com a Organização Pan-Americana de Saúde, destacam a importância de proteger a saúde de crianças, jovens e adolescentes, que são alvo de estratégias de venda para que possam se tornar um mercado repositor de novos consumidores, já que o consumo de tabaco mata mais da metade de seus usuários. Vale lembrar que os cigarros eletrônicos, ou pods, não são opções mais saudáveis ao cigarro tradicional. No Brasil, a comercialização desses dispositivos é proibida, já que não foi autorizada pela Agência Nacional de Vigilância Sanitária (Anvisa). Muitos países que liberaram sua venda estão revendo as suas posições depois de novas orientações da Organização Mundial da Saúde (OMS).\n\n(https://doutorjairo.uol.com.br)\n\nCringe: Para os integrantes da geração Z, é um adjetivo usado para classificar pessoas que fazem coisas fora de moda, ultrapassadas, cafonas mesmo. Eles também costumam classificar atitudes ou objetos. Nesse caso, ela é usada como sinônimo de vergonha alheia. (https://g1.globo.com)"},{"id":"oj-esc21-22","materia":"port","assunto":"Plural dos substantivos","enunciado":"Nas passagens – proteção à saúde de todos os cidadãos (2o parágrafo) – e – proteger a saúde de crianças, jovens e adolescentes (3o parágrafo) –, o substantivo “cidadão” faz o plural com “ãos”, e o substantivo feminino “crianças” refere-se tanto ao sexo masculino quanto ao feminino. Substantivos com essas mesmas propriedades gramaticais, empregados em sua forma singular, estão destacados, correta e respectivamente, em:","alternativas":["Durante a missa, o padre pediu a atenção a todos os presentes e orientou aos fiéis para que fossem bons com toda pessoa.","Na sessão de terapia, o rapaz parecia fazer uma confissão ao referir-se à forma como tratava sua colega de trabalho.","Quando saiu da igreja, o sacristão ficou aterrorizado com o acidente e preocupado para saber se houve alguma vítima.","O patrão chegou alterado na empresa, tinha sido informado de que um assaltante estava rondando aquela região.","O tabelião confundiu-se na hora de assinar o contrato, e pediu desculpas ao agente que esperava o documento para conferir."],"correta":2,"explicacao":"Gabarito oficial: C (\"sacristão/sacristãos\" segue o modelo de \"cidadãos\").","origem":"prova","fonte":"Vunesp · TJSP · Escrevente Técnico Judiciário · 2021 · questão 22","texto":"O Dia Nacional de Combate ao Fumo (29 de agosto) foi criado em 1986, com o objetivo de reforçar as ações nacionais de conscientização sobre os danos sociais, de saúde, econômicos e ambientais causados pelo tabaco. A campanha promovida pelo Inca (Instituto Nacional de Câncer) este ano chama-se Comprometa-se a parar de fumar. O instituto lembra que o tabagismo é um fator de risco importante para a Covid-19, por isso parar de fumar se torna uma medida de proteção à saúde de todos os cidadãos.\n\nPeças criadas para redes sociais com a frase “Cringe mesmo é fumar” fazem parte da campanha. Os materiais desenvolvidos pelo Ministério da Saúde, em parceria com a Organização Pan-Americana de Saúde, destacam a importância de proteger a saúde de crianças, jovens e adolescentes, que são alvo de estratégias de venda para que possam se tornar um mercado repositor de novos consumidores, já que o consumo de tabaco mata mais da metade de seus usuários. Vale lembrar que os cigarros eletrônicos, ou pods, não são opções mais saudáveis ao cigarro tradicional. No Brasil, a comercialização desses dispositivos é proibida, já que não foi autorizada pela Agência Nacional de Vigilância Sanitária (Anvisa). Muitos países que liberaram sua venda estão revendo as suas posições depois de novas orientações da Organização Mundial da Saúde (OMS).\n\n(https://doutorjairo.uol.com.br)\n\nCringe: Para os integrantes da geração Z, é um adjetivo usado para classificar pessoas que fazem coisas fora de moda, ultrapassadas, cafonas mesmo. Eles também costumam classificar atitudes ou objetos. Nesse caso, ela é usada como sinônimo de vergonha alheia. (https://g1.globo.com)"},{"id":"oj-esc21-23","materia":"port","assunto":"Crase","enunciado":"De acordo com a norma-padrão da língua portuguesa, as lacunas do texto devem ser preenchidas, respectivamente, com","alternativas":["a ... a ... a","à ... à ... a","a ... à ... à","a ... à ... a","à ... à ... à"],"correta":3,"explicacao":"Gabarito oficial: D (a ... à ... a).","origem":"prova","fonte":"Vunesp · TJSP · Escrevente Técnico Judiciário · 2021 · questão 23","texto":"Motivação é a energia que nos leva ____ agir – e não sou a única pessoa que acha difícil encontrar essa motivação. Alguns de nós sofreram um burnout total depois de mais de um ano de perdas, dor e problemas relacionados ____ pandemia. Outros se sentem mais como estou me sentindo – nada está terrivelmente errado, mas não conseguimos encontrar inspiração. Seja qual for a situação em que nos encontramos, um exame mais profundo da motivação pode nos dar mais incentivo para avançar, não só no dia ____ dia, mas num futuro incerto. (Cameron Walker, The New York Times. Em: https://economia.estadao.com.br. Adaptado)"},{"id":"oj-esc21-24","materia":"port","assunto":"Colocação pronominal","enunciado":"Em conformidade com a norma-padrão e o sentido do texto, a frase – ... e não sou a única pessoa que acha difícil encontrar essa motivação. – está adequadamente reescrita em:","alternativas":["... e outras pessoas, tanto quanto eu, acham difícil encontrar-na.","... e eu e também outras pessoas achamos difícil encontrar ela.","... e outras pessoas, tal qual eu, achamos difícil encontrar-lhe.","... e eu e outras pessoas também acham difícil encontrar esta.","... e outras pessoas, assim como eu, acham difícil encontrá-la."],"correta":4,"explicacao":"Gabarito oficial: E. \"Encontrá-la\": pronome oblíquo \"a\" com verbo terminado em r vira \"la\".","origem":"prova","fonte":"Vunesp · TJSP · Escrevente Técnico Judiciário · 2021 · questão 24","texto":"Motivação é a energia que nos leva ____ agir – e não sou a única pessoa que acha difícil encontrar essa motivação. Alguns de nós sofreram um burnout total depois de mais de um ano de perdas, dor e problemas relacionados ____ pandemia. Outros se sentem mais como estou me sentindo – nada está terrivelmente errado, mas não conseguimos encontrar inspiração. Seja qual for a situação em que nos encontramos, um exame mais profundo da motivação pode nos dar mais incentivo para avançar, não só no dia ____ dia, mas num futuro incerto. (Cameron Walker, The New York Times. Em: https://economia.estadao.com.br. Adaptado)"},{"id":"oj-esc21-25","materia":"penal","assunto":"Falsidade ideológica (art. 299)","enunciado":"O proprietário do veículo que indica falsamente outra pessoa como condutora do veículo no momento da infração de trânsito em formulário (notificação de multa) da autoridade de trânsito, em tese, pratica o crime de:","alternativas":["Falsificação de documento público.","Falsidade ideológica.","Falsificação de documento particular.","Falsa identidade.","Uso de documento falso."],"correta":1,"explicacao":"Gabarito oficial: B. Inserir declaração falsa em documento verdadeiro (indicar falsamente o condutor) é falsidade ideológica.","origem":"prova","fonte":"Vunesp · TJSP · Escrevente Técnico Judiciário · 2021 · questão 25"},{"id":"oj-esc21-26","materia":"penal","assunto":"Petrechos de falsificação (art. 294)","enunciado":"A respeito do crime de petrechos de falsificação, previsto no artigo 294, do Código Penal, é correto dizer que","alternativas":["Admite a modalidade culposa.","É crime próprio de funcionário público.","É tipo misto alternativo.","É crime material.","É instantâneo."],"correta":2,"explicacao":"Gabarito oficial: C. O art. 294 tem vários verbos (fabricar, adquirir, fornecer, possuir, guardar): tipo misto alternativo.","origem":"prova","fonte":"Vunesp · TJSP · Escrevente Técnico Judiciário · 2021 · questão 26"},{"id":"oj-esc21-27","materia":"penal","assunto":"Uso de documento falso (art. 304)","enunciado":"Mévio, aprovado em processo seletivo para trabalhar como operador de trator, a fim de cumprir exigência da empresa contratante, apresenta atestado médico, por ele adquirido, em que consta a falsa informação de não uso de medicação controlada, de uso contínuo. A respeito da conduta de Mévio, é correto dizer que, em tese, caracteriza o crime de","alternativas":["falsidade material de atestado ou certidão.","certidão ou atestado ideologicamente falso.","falsidade ideológica.","uso de documento falso.","falsidade de atestado médico."],"correta":3,"explicacao":"Gabarito oficial: D. Mévio não falsificou: adquiriu e apresentou o atestado falso — uso de documento falso.","origem":"prova","fonte":"Vunesp · TJSP · Escrevente Técnico Judiciário · 2021 · questão 27"},{"id":"oj-esc21-28","materia":"penal","assunto":"Art. 308 do CP","enunciado":"Caio, tendo conhecimento que possui contra si mandado de prisão expedido por falta de pagamento de pensão alimentícia, ao ser parado em blitz policial, apresenta ao policial carteira de habilitação de Tício, amigo que estava no carro e consentiu com a apresentação de seu documento. A respeito da situação hipotética, assinale a alternativa correta.","alternativas":["Caio e Tício, em tese, praticaram o crime previsto no artigo 308, do Código Penal (usar como próprio documento de identificação alheio).","Caio, em tese, praticou o crime de falsa identidade, previsto no artigo 307, do Código Penal; enquanto Tício não incorreu em qualquer prática delitiva, visto que sua conduta é atípica.","Caio, em tese, praticou o crime de falsa identidade, previsto no artigo 307, do Código Penal; enquanto Tício, em tese, praticou o crime previsto no artigo 308, do Código Penal (ceder documento de identificação para outrem).","Caio e Tício, em tese, praticaram o crime de falsa identidade, previsto no artigo 307, do Código Penal, em coautoria.","Caio não incorreu em qualquer prática delitiva, haja vista o direito fundamental à não autoincriminação."],"correta":0,"explicacao":"Gabarito oficial: A. Art. 308: usar como próprio documento alheio (Caio) e ceder documento próprio para outro usar (Tício).","origem":"prova","fonte":"Vunesp · TJSP · Escrevente Técnico Judiciário · 2021 · questão 28"},{"id":"oj-esc21-29","materia":"penal","assunto":"Fraudes em certames (art. 311-A)","enunciado":"Tício, funcionário do órgão privado responsável pela realização de concurso público, chateado por não lhe ter sido conferido direito a férias no período almejado, objetivando denegrir a imagem da instituição, fez cópia de uma das versões da prova, sigilosa, já que ainda não aplicada, e a divulgou na internet. Tício não auferiu qualquer vantagem com a divulgação, tendo por móvel apenas abalar a imagem da instituição em que trabalhava. No entanto, em razão da divulgação, o concurso foi adiado e toda a prova refeita. Sobre a situação hipotética, é correto dizer que","alternativas":["a conduta de Tício é atípica, pois inexistiu vantagem com a violação do sigilo da prova, elemento comum aos crimes de fraude em certames de interesse público; violação de sigilo funcional e impedimento, perturbação ou fraude de concorrência.","Tício, em tese, praticou o crime de impedimento, perturbação ou fraude de concorrência.","Tício, em tese, praticou o crime de violação de sigilo funcional.","a conduta de Tício é atípica, já que ele não é funcionário público, condição necessária do agente nos crimes de fraude em certames de interesse público; violação de sigilo funcional e de impedimento, perturbação ou fraude de concorrência.","Tício, em tese, praticou o crime de fraudes em certames de interesse público."],"correta":4,"explicacao":"Gabarito oficial: E. Art. 311-A: divulgar conteúdo sigiloso de concurso para comprometer a credibilidade do certame; não exige funcionário público.","origem":"prova","fonte":"Vunesp · TJSP · Escrevente Técnico Judiciário · 2021 · questão 29"},{"id":"oj-esc21-30","materia":"penal","assunto":"Crimes contra a Administração da Justiça","enunciado":"Sobre os crimes contra a Administração da Justiça, previstos no Código Penal, assinale a alternativa correta.","alternativas":["O crime de exploração de prestígio (art. 357, do CP) é próprio, podendo ser praticado apenas pelos sujeitos previstos no tipo penal.","Dar causa a ação de improbidade administrativa, imputando a alguém ato improbo de que sabe inocente, valendo-se de nome suposto, em tese, caracteriza o crime de denunciação caluniosa.","O crime de exercício arbitrário das próprias razões, previsto no artigo 345, do CP, somente se procede mediante queixa.","O crime de favorecimento pessoal caracteriza-se pelo auxílio prestado a autor de crime, a fim de que ele escape da ação das autoridades públicas, desde que o crime praticado seja punido com reclusão.","Oferecer dinheiro a testemunha para fazer afirmação falsa em depoimento, em tese, caracteriza o crime de coação no curso do processo, previsto no artigo 344, do CP. Direito Processual Penal"],"correta":1,"explicacao":"Gabarito oficial: B. Art. 339 (denunciação caluniosa) inclui dar causa a ação de improbidade contra quem sabe inocente; com nome suposto, a pena aumenta.","origem":"prova","fonte":"Vunesp · TJSP · Escrevente Técnico Judiciário · 2021 · questão 30"},{"id":"oj-esc21-31","materia":"ppenal","assunto":"Impedimento e suspeição do juiz","enunciado":"A respeito do impedimento e da suspeição do Juiz, é correto afirmar que","alternativas":["o Juiz restará suspeito para atuar em processo em que o próprio já tenha atuado como autoridade policial ou mesmo órgão do Ministério Público.","as causas de impedimento e suspeição do Juiz não se aplicam aos serventuários e servidores da justiça.","mesmo dissolvido o casamento, ainda que sem filhos em comum, o Juiz não poderá figurar em processos em que são partes os pais e irmãos do ex-cônjuge.","as causas de impedimento estão relacionadas ao animus subjetivo do juiz quanto às partes; enquanto as de suspeição referem-se a vínculos objetivos do Juiz com o processo.","o Juiz restará impedido de atuar no processo se ele ou seu cônjuge, seus ascendentes ou descendentes estiverem respondendo a processo por fato análogo."],"correta":2,"explicacao":"Gabarito oficial: C. Art. 255, CPP: mesmo dissolvido o casamento sem filhos, o juiz não funciona em processo de sogro, padrasto, cunhado...","origem":"prova","fonte":"Vunesp · TJSP · Escrevente Técnico Judiciário · 2021 · questão 31","extra":true},{"id":"oj-esc21-32","materia":"ppenal","assunto":"Citação no processo penal","enunciado":"A respeito da citação e intimação do acusado, nos termos do Código de Processo Penal, assinale a alternativa correta.","alternativas":["Estando o acusado no estrangeiro, em lugar conhecido, a citação dar-se-á por carta rogatória, suspendendo-se o curso do prazo prescricional até o efetivo cumprimento.","Citado por hora certa, o não comparecimento do réu implicará a suspensão do processo e do prazo prescricional, podendo o Juiz decretar-lhe a prisão preventiva.","Na hipótese de suspeita de ocultação do réu, para se furtar a citação, certificada pelo oficial de justiça, o Juiz determinará a citação, por edital.","Intimado pessoalmente para qualquer ato, o não comparecimento do réu implicará a suspensão do processo e do prazo prescricional, podendo o Juiz decretar-lhe a prisão preventiva.","São previstas a citação pessoal, por hora certa, por edital, por requisição, na hipótese de réu militar e via postal, na hipótese de réu preso."],"correta":0,"explicacao":"Gabarito oficial: A. Art. 368, CPP: réu no estrangeiro em lugar sabido é citado por carta rogatória, suspendendo-se a prescrição até o cumprimento.","origem":"prova","fonte":"Vunesp · TJSP · Escrevente Técnico Judiciário · 2021 · questão 32"},{"id":"oj-esc21-33","materia":"ppenal","assunto":"Rejeição da denúncia e absolvição sumária","enunciado":"São causas de rejeição da denúncia e absolvição sumária, respectivamente, previstas nos artigos 395 e 397, do Código de Processo penal:","alternativas":["inépcia e falta de justa causa para a ação penal.","falta de justa causa para a ação penal e falta de condição para o exercício da ação penal.","inépcia e prescrição.","existência manifesta de excludente de ilicitude do fato e falta de condições para o exercício da ação penal.","inimputabilidade e atipicidade."],"correta":2,"explicacao":"Gabarito oficial: C. Art. 395 (rejeição): inépcia. Art. 397 (absolvição sumária): extinção da punibilidade, como a prescrição.","origem":"prova","fonte":"Vunesp · TJSP · Escrevente Técnico Judiciário · 2021 · questão 33","extra":true},{"id":"oj-esc21-34","materia":"ppenal","assunto":"Recursos e revisão criminal","enunciado":"A respeito dos recursos e das ações constitucionais, previstos no Código de Processo Penal, assinale a alternativa correta:","alternativas":["Da decisão de pronúncia ou impronúncia do réu, nos processos da competência do tribunal de júri, caberá apelação.","A interposição de recursos será sempre voluntária, inexistindo hipótese de interposição de recurso de ofício pelo juiz.","Das decisões proferidas pelos Tribunais, quando não unânimes e favoráveis ao réu, caberão embargos infringentes, a serem interpostos pelo órgão de acusação, no prazo de 10 dias.","A revisão criminal tem por objeto tanto inocentar o condenado quanto diminuir-lhe a pena, na hipótese de surgimento de circunstâncias que autorizem ou determinem diminuição especial da pena.","A legitimidade para impetrar Habeas Corpus é privativa do advogado, admitindo-se, excepcionalmente, o Ministério Público como fiscal da lei."],"correta":3,"explicacao":"Gabarito oficial: D. Art. 621, CPP: a revisão criminal pode absolver ou reduzir a pena.","origem":"prova","fonte":"Vunesp · TJSP · Escrevente Técnico Judiciário · 2021 · questão 34","extra":true},{"id":"oj-esc21-35","materia":"ppenal","assunto":"Procedimentos ordinário e sumário","enunciado":"A respeito dos procedimentos ordinário e sumário, de acordo com o texto legal previsto no Código de Processo Penal, é correto afirmar que:","alternativas":["em ambos os procedimentos, as alegações finais serão orais, apresentadas em audiência, admitindo-se memoriais por escrito, no prazo de 03 dias, em caso de complexidade do feito.","em ambos os procedimentos, em regra, as alegações finais serão por escrito, sendo facultada a apresentação oral, em audiência, caso haja concordância de todas as partes.","no procedimento ordinário, admitem-se alegações finais por escrito, no prazo de 05 (cinco) dias e, no sumário, no prazo de 03 dias.","no procedimento ordinário, as alegações finais serão por escrito e, no sumário, em regra, orais, apresentadas em audiência.","no procedimento ordinário, admitem-se alegações finais por escrito quando há elevado número de acusados, regra inaplicável ao procedimento sumário."],"correta":4,"explicacao":"Gabarito oficial: E. Art. 403, § 3º, CPP: no ordinário, memoriais escritos se o caso for complexo ou houver muitos acusados.","origem":"prova","fonte":"Vunesp · TJSP · Escrevente Técnico Judiciário · 2021 · questão 35","extra":true},{"id":"oj-esc21-36","materia":"ppenal","assunto":"Júri (art. 406)","enunciado":"A respeito do procedimento relativo ao Tribunal do Júri, assinale a alternativa correta.","alternativas":["Oferecida a denúncia por crime de competência do Tribunal do Júri, o Juiz Singular pode, desde logo, rejeitá-la, se presentes as hipóteses previstas no artigo 395, do Código de Processo Penal.","Recebida a denúncia, não sendo localizado o réu, para fins de citação pessoal, far-se-á a citação por edital. Findo o prazo fixado no edital, caso o réu não compareça, o juiz lhe nomeará defensor, prosseguindo o feito, até a finalização da fase de pronúncia.","Citado o acusado, não apresentada a resposta à acusação no prazo legal, o Juiz nomeará defensor para oferecê-la, no prazo de 05 dias.","O desaforamento do julgamento para outra Comarca da mesma região poderá ser feito apenas a requerimento do acusado.","Encerrada a instrução processual da primeira fase do Júri, poderá o Juiz pronunciar o acusado, impronunciar, absolver sumariamente ou reconhecer a prática de crime não sujeito à competência do Tribunal do Júri, proferindo, desde logo, a sentença condenatória."],"correta":0,"explicacao":"Gabarito oficial: A. No júri também se aplica o art. 395: o juiz pode rejeitar liminarmente a denúncia (art. 406 e seguintes).","origem":"prova","fonte":"Vunesp · TJSP · Escrevente Técnico Judiciário · 2021 · questão 36"},{"id":"oj-esc21-37","materia":"ppenal","assunto":"Lei 9.099/95 (arts. 60 a 62)","enunciado":"A respeito da Lei no 9.099/95, é correto afirmar que:","alternativas":["a transação penal, nas ações penais públicas condicionadas à representação, oferecida pelo Ministério Público ao autor da infração e por ele aceita, não será homologada pelo Juiz se não contar com a anuência da vítima.","na eventual reunião de processos, perante o juízo comum, decorrentes da aplicação de regra de conexão e continência, às infrações de menor potencial ofensivo aplicar-se-ão os institutos da transação penal e composição dos danos civis.","são infrações de menor potencial ofensivo as contravenções penais e os crimes cuja pena mínima não exceda a 1 (um) ano.","a suspensão condicional do processo, prevista no artigo 89 da Lei, aplica-se aos crimes cuja pena mínima não exceda a 2 (dois) anos.","não cabe prisão em flagrante nos crimes de menor potencial ofensivo. Direito Processual Civil"],"correta":1,"explicacao":"Gabarito oficial: B. Art. 60, parágrafo único, Lei 9.099: reunidos os processos no juízo comum, aplicam-se transação e composição civil.","origem":"prova","fonte":"Vunesp · TJSP · Escrevente Técnico Judiciário · 2021 · questão 37"},{"id":"oj-esc21-38","materia":"pcivil","assunto":"Impedimento e suspeição de auxiliares","enunciado":"Mariana estava voltando para casa com um carro dirigido por um motorista de aplicativo. No trajeto para casa, o carro capotou em uma curva e, como consequência, Mariana ficou internada por três semanas experimentando diversos gastos médicos. Buscando ressarcir seus gastos, Mariana propõe ação de indenização por danos materiais em face de Cleber, o motorista, alegando que ele foi imprudente e estava trafegando acima da velocidade permitida na via. A ação foi proposta perante a 5a Vara Cível da Comarca de Santa Madalena, cujo Chefe de Secretaria era amigo íntimo de Cleber. No momento de produção de provas, o juiz nomeou perito para averiguar se Cleber estava trafegando ou não acima da velocidade permitida na via. Cleber nomeou assistente técnico para auxiliar na perícia. O assistente técnico, no entanto, era proprietário do imóvel que Mariana locava e autor da ação de despejo que estava em fase de recurso perante a 2a Vara Cível da Comarca de Santa Madalena. Diante da situação hipotética, Mariana poderá alegar que, em relação do processo de indenização,","alternativas":["o assistente técnico é impedido.","o assistente técnico é suspeito.","o chefe de Secretaria é suspeito.","o chefe de Secretaria é impedido.","tanto o chefe de Secretaria como o assistente técnico são suspeitos."],"correta":2,"explicacao":"Gabarito oficial: C. Art. 148, CPC: motivos de suspeição alcançam o escrivão/chefe de secretaria; o assistente técnico não se sujeita a eles.","origem":"prova","fonte":"Vunesp · TJSP · Escrevente Técnico Judiciário · 2021 · questão 38","extra":true},{"id":"oj-esc21-39","materia":"pcivil","assunto":"Citação (art. 244)","enunciado":"A citação poderá ser feita em qualquer lugar em que se encontre o réu, o executado ou o interessado. No entanto, não se fará a citação, salvo para evitar o perecimento do direito","alternativas":["de noivos, nos 5 (cinco) primeiros dias seguintes ao casamento.","de cônjuge, de companheiro ou de qualquer parente do morto, consanguíneo ou afim, em linha reta ou na linha colateral em terceiro grau, no dia do falecimento e nos 7 (sete) dias seguintes.","de doente, enquanto grave o seu estado.","quando se verificar que o citando é mentalmente incapaz ou está impossibilitado de recebê-la.","de quem estiver participando de ato de culto religioso, desde que aos domingos."],"correta":2,"explicacao":"Gabarito oficial: C. Art. 244, IV, CPC: não se faz citação de doente enquanto grave o seu estado (salvo para evitar perecimento do direito).","origem":"prova","fonte":"Vunesp · TJSP · Escrevente Técnico Judiciário · 2021 · questão 39"},{"id":"oj-esc21-40","materia":"pcivil","assunto":"Tutela cautelar antecedente","enunciado":"A petição inicial da ação, que visa à prestação de tutela cautelar em caráter antecedente, indicará a lide e seu fundamento, a exposição sumária do direito que se objetiva assegurar e o perigo de dano ou o risco ao resultado útil do processo. No que diz respeito ao procedimento da tutela cautelar requerida em caráter antecedente, é correto afirmar:","alternativas":["a causa de pedir poderá ser aditada no momento de formulação do pedido principal.","se por qualquer motivo cessar a eficácia da tutela cautelar, é permitido à parte renovar o pedido, sob o mesmo fundamento, no prazo de 30 (trinta) dias.","o pedido principal deverá ser formulado em separado do pedido de tutela cautelar.","apresentado o pedido principal, as partes serão intimadas para a audiência de conciliação ou de mediação, sendo necessária nova citação do réu.","efetivada a tutela cautelar, o pedido principal terá de ser formulado pelo autor no prazo de 30 (trinta) dias, caso em que será apresentado nos mesmos autos em que deduzido o pedido de tutela cautelar, dependendo de novas custas processuais."],"correta":0,"explicacao":"Gabarito oficial: A. Art. 308, § 2º, CPC: a causa de pedir pode ser aditada quando formulado o pedido principal.","origem":"prova","fonte":"Vunesp · TJSP · Escrevente Técnico Judiciário · 2021 · questão 40","extra":true},{"id":"oj-esc21-41","materia":"pcivil","assunto":"Pedido","enunciado":"Joana assinou um contrato de prestação de serviços com Pedro, no valor de R$ 200,00 (duzentos reais mensais) no qual restou estabelecido que ele entregaria, mensalmente, em sua casa de campo, uma cesta de alimentos ou de bebidas. Passados oito meses, Pedro não entregou nenhuma cesta e, por isso, Joana decidiu propor ação de obrigação de fazer em face de Pedro para que ele cumprisse o contratado. Diante da situação hipotética, considerando que","alternativas":["Pedro ainda não foi citado, Joana poderá, até o saneamento do processo, alterar o pedido, independentemente de consentimento do réu.","o pedido deve ser certo e determinado, compreendem-se no principal os juros legais, a correção monetária, devendo ser especificado, de forma apartada, as verbas de sucumbência, inclusive os honorários advocatícios.","o pedido é cumulativo, é lícito formular mais de um pedido em ordem subsidiária, a fim de que o juiz conheça do posterior, quando não acolher o anterior.","o pedido é alternativo, o juiz assegurará ao devedor o direito de cumprir a prestação de um ou de outro modo, ainda que o autor não tenha formulado pedido alternativo.","a ação que tem por objeto cumprimento de obrigação em prestações sucessivas, deverá haver declaração expressa do autor para que sejam incluídas na condenação, enquanto durar a obrigação."],"correta":3,"explicacao":"Gabarito oficial: D. Art. 325, parágrafo único, CPC: em obrigação alternativa, o juiz assegura ao devedor cumprir de um ou outro modo.","origem":"prova","fonte":"Vunesp · TJSP · Escrevente Técnico Judiciário · 2021 · questão 41","extra":true},{"id":"oj-esc21-42","materia":"pcivil","assunto":"Embargos de declaração","enunciado":"Dentre os recursos previstos no Código de Processo Civil, é correto afirmar que os embargos de declaração","alternativas":["consideram-se incluídos no acórdão os elementos que o embargante suscitou, para fins de pré-questionamento, desde que os embargos de declaração sejam admitidos e o tribunal superior considere existentes erro, omissão, contradição ou obscuridade.","serão opostos, no prazo de 5 (cinco) dias, em petição dirigida ao juiz, com indicação do erro, obscuridade, contradição ou omissão, mediante preparo no valor de um por cento sobre o valor da causa.","possuem efeito suspensivo e interrompem o prazo para a interposição de recurso.","podem ser opostos contra qualquer decisão judicial para esclarecer obscuridade ou eliminar contradição, considerando-se obscura a decisão que deixe de se manifestar sobre tese firmada em julgamento de casos repetitivos aplicável ao caso sob julgamento.","quando manifestamente protelatórios, sujeitam o embargante a pagar ao embargado multa não excedente a dois por cento sobre o valor atualizado da causa, desde que previsto em decisão fundamentada do juiz ou do tribunal."],"correta":4,"explicacao":"Gabarito oficial: E. Art. 1.026, § 2º, CPC: embargos protelatórios geram multa de até 2% do valor da causa.","origem":"prova","fonte":"Vunesp · TJSP · Escrevente Técnico Judiciário · 2021 · questão 42","extra":true},{"id":"oj-esc21-43","materia":"pcivil","assunto":"Lei 9.099/95 - JEC","enunciado":"É permitido nos Juizados Especiais Cíveis","alternativas":["que os atos processuais sejam realizados em horário noturno, sendo que a prática de atos processuais em outras comarcas poderá ser solicitada por qualquer meio idôneo de comunicação.","a citação por correspondência, com aviso de recebimento em mão própria, por oficial de justiça, independentemente de mandado ou carta precatória ou por edital.","a propositura de ações de alimentos, desde que o valor não exceda a quarenta vezes o salário mínimo.","o incidente de desconsideração da personalidade jurídica e a assistência.","mandato verbal ao advogado para assinar declaração de hipossuficiência econômica."],"correta":0,"explicacao":"Gabarito oficial: A. Art. 12 e 13, § 2º, Lei 9.099: atos podem ocorrer em horário noturno; atos em outras comarcas por qualquer meio idôneo.","origem":"prova","fonte":"Vunesp · TJSP · Escrevente Técnico Judiciário · 2021 · questão 43","extra":true},{"id":"oj-esc21-44","materia":"pcivil","assunto":"Juizado da Fazenda Pública","enunciado":"A Empresa NTO – EPP é proprietária de um grande terreno na cidade de Andrenópolis, que tem por confinante uma praça Municipal. Passando por dificuldades financeiras, a empresa NTO decide vender o seu terreno, no entanto, quando foi verificar as medidas exatas, seus sócios perceberam que parte do terreno da empresa estava sendo utilizado como estacionamento da praça. Inconformados, decidem, em nome da empresa, propor ação demarcatória em face do Município de Andrenópolis. A ação foi proposta perante o Juizado Especial da Fazenda Pública de Andrenópolis, a certidão da propriedade e os demais documentos necessários foram juntados ao processo e foi dado à causa o valor de 50 (cinquenta salários mínimos). O juiz recebeu a ação e, de ofício, deferiu tutela de urgência de natureza cautelar para evitar dano de difícil ou incerta reparação. Diante da situação hipotética, assinale a alternativa correta.","alternativas":["A ação não é de competência do Juizado Especial da Fazenda Pública, pois ultrapassa o valor de 40 (quarenta) salários mínimos.","A ação não é de competência do Juizado Especial da Fazenda Pública, pois trata de ação de demarcação.","É defeso ao juiz, nas causas propostas perante o Juizado Especial da Fazenda Pública, deferir, de ofício, providências cautelares no curso do processo.","Haverá prazo em dobro apenas para a interposição de recursos, devendo a citação para a audiência de conciliação ser efetuada com antecedência mínima de 15 (quinze) dias.","A ação deve ser julgada improcedente considerando a incompetência absoluta do Juizado Especial da Fazenda Pública, uma vez que o autor é Empresa de Pequeno Porte."],"correta":1,"explicacao":"Gabarito oficial: B. Lei 12.153, art. 2º, § 1º, I: ações de demarcação não são da competência do JEFP.","origem":"prova","fonte":"Vunesp · TJSP · Escrevente Técnico Judiciário · 2021 · questão 44","extra":true},{"id":"oj-esc21-45","materia":"const","assunto":"Direitos e garantias (art. 5º)","enunciado":"Assinale a alternativa que contempla hipótese de crime para o qual a Constituição Federal não veda o arbitramento de fiança.","alternativas":["Prática do racismo.","Ação de grupos armados contra a ordem constitucional e o Estado Democrático.","Crime doloso contra a vida.","Tráfico ilícito de entorpecentes e drogas afins.","Crime hediondo."],"correta":2,"explicacao":"Gabarito oficial: C. CF, art. 5º, XLII a XLIV: são inafiançáveis racismo, tortura, tráfico, terrorismo, hediondos e ação de grupos armados. Crime doloso contra a vida não está na lista.","origem":"prova","fonte":"Vunesp · TJSP · Escrevente Técnico Judiciário · 2021 · questão 45"},{"id":"oj-esc21-46","materia":"const","assunto":"Direitos e garantias (art. 5º)","enunciado":"Considerando o disposto na Constituição Federal, assinale a alternativa que aponta uma situação que, em tese, viola um dos direitos ou garantias individuais do cidadão brasileiro.","alternativas":["Mandado judicial de prisão cumprido por policiais civis às 9h00 dentro da residência do réu.","Policial, sem mandado judicial, adentra em domicílio, durante à noite, sem consentimento do morador, para efetuar prisão em flagrante.","Suspensão das atividades de associação civil, de fins lícitos, por decisão judicial, em caráter liminar.","Ordem de prisão civil por dívida do responsável pelo inadimplemento voluntário e inescusável de obrigação alimentícia.","Ordem emanada de juiz que determina à polícia que seja efetuada a escuta telefônica de réu em processo civil de reparação de danos."],"correta":4,"explicacao":"Gabarito oficial: E. Art. 5º, XII: interceptação telefônica só para investigação criminal ou instrução processual penal; em processo civil viola a garantia.","origem":"prova","fonte":"Vunesp · TJSP · Escrevente Técnico Judiciário · 2021 · questão 46"},{"id":"oj-esc21-47","materia":"const","assunto":"Direitos sociais (art. 7º)","enunciado":"É um dos direitos constitucionais dos trabalhadores urbanos e rurais:","alternativas":["participação nos lucros, ou resultados, vinculada à última remuneração do trabalhador.","relação de emprego protegida contra despedida arbitrária com ou sem justa causa, nos termos de lei complementar, que preverá indenização compensatória.","licença à gestante, sem prejuízo do emprego e do salário, com a duração de 180 (cento e oitenta) dias.","assistência gratuita aos filhos e dependentes desde o nascimento até 5 (cinco) anos de idade em creches e pré-escolas.","jornada de oito horas para o trabalho realizado em turnos ininterruptos de revezamento, salvo negociação coletiva."],"correta":3,"explicacao":"Gabarito oficial: D. Art. 7º, XXV: assistência gratuita aos filhos e dependentes até 5 anos em creches e pré-escolas.","origem":"prova","fonte":"Vunesp · TJSP · Escrevente Técnico Judiciário · 2021 · questão 47"},{"id":"oj-esc21-48","materia":"const","assunto":"Nacionalidade (art. 12)","enunciado":"Considerando as hipóteses possíveis de naturalização brasileira, assinale a alternativa que descreve uma situação de naturalização compatível com a Constituição Federal.","alternativas":["O nascido no estrangeiro, de pai brasileiro ou mãe brasileira, desde que qualquer deles esteja a serviço da República Federativa do Brasil.","O nascido no estrangeiro de pai brasileiro ou de mãe brasileira, registrado em repartição brasileira ou que venha a residir no Brasil e opte, a qualquer tempo, pela nacionalidade brasileira.","O estrangeiro de qualquer nacionalidade, residente na República Federativa do Brasil há mais de dez anos ininterruptos e sem condenação penal.","Cidadão originário de país de língua portuguesa, idôneo moralmente, residente há um ano ininterrupto no Brasil, e, que, na forma da lei, adquirir a nacionalidade brasileira.","O nascido na República Federativa do Brasil, com pais estrangeiros que não estejam a serviço de seu país."],"correta":3,"explicacao":"Gabarito oficial: D. Art. 12, II, \"a\": originários de países de língua portuguesa precisam de 1 ano ininterrupto de residência e idoneidade moral.","origem":"prova","fonte":"Vunesp · TJSP · Escrevente Técnico Judiciário · 2021 · questão 48"},{"id":"oj-esc21-49","materia":"const","assunto":"Nacionalidade (art. 12)","enunciado":"É um cargo público privativo de brasileiro nato:","alternativas":["de Presidente da Câmara dos Deputados.","de Procurador Geral da República.","de Senador da República.","de Ministro do Tribunal de Contas da União.","de Presidente do Superior Tribunal de Justiça."],"correta":0,"explicacao":"Gabarito oficial: A. Art. 12, § 3º: Presidente da Câmara dos Deputados é cargo privativo de brasileiro nato.","origem":"prova","fonte":"Vunesp · TJSP · Escrevente Técnico Judiciário · 2021 · questão 49"},{"id":"oj-esc21-50","materia":"const","assunto":"Administração Pública (arts. 37 a 41)","enunciado":"Nos moldes da Constituição Federal, o servidor público titular de cargo efetivo, que tenha sofrido limitação em sua capacidade física ou mental, poderá, atendidas as demais exigências, ser readaptado,","alternativas":["para exercício de novo cargo compatível com a sua limitação, devendo receber a remuneração do cargo de destino.","para exercício de novo cargo compatível com a sua limitação, podendo o servidor optar entre a remuneração do cargo de origem e a do cargo de destino.","para exercício do mesmo cargo, com os necessários ajustes à sua limitação, garantida a mesma remuneração do cargo.","para exercício de novo cargo compatível com a sua limitação, devendo receber pelo menos 70% (setenta por cento) da remuneração do cargo de origem.","para exercício de novo cargo compatível com a sua limitação, mantida a remuneração do cargo de origem."],"correta":4,"explicacao":"Gabarito oficial: E. Art. 37, § 13: o servidor readaptado vai para cargo compatível, mantida a remuneração do cargo de origem.","origem":"prova","fonte":"Vunesp · TJSP · Escrevente Técnico Judiciário · 2021 · questão 50"},{"id":"oj-esc21-51","materia":"const","assunto":"Administração Pública (arts. 37 a 41)","enunciado":"No tocante às disposições constitucionais, que tratam do tema dos servidores públicos, é correto afirmar que","alternativas":["aplica-se ao agente público ocupante, exclusivamente, de cargo em comissão declarado em lei de livre nomeação e exoneração, de outro cargo temporário, inclusive mandato eletivo, o Regime Próprio de Previdência Social dos Servidores.","o membro de Poder, o detentor de mandato eletivo, os Ministros de Estado e os Secretários Estaduais e Municipais serão remunerados exclusivamente por subsídio fixado em parcela única, que poderá ser acrescido de gratificação, adicional, abono, prêmio e verba de representação.","é vedada a incorporação de vantagens de caráter temporário ou vinculadas ao exercício de função de confiança ou de cargo em comissão à remuneração do cargo efetivo.","por motivos de segurança, é expressamente vedado aos Poderes Executivo, Legislativo e Judiciário divulgar ou publicar os valores do subsídio e da remuneração dos cargos e empregos públicos dos seus respectivos servidores.","o tempo de contribuição federal, estadual, distrital ou municipal e o tempo de serviço público correspondente serão contados para fins de disponibilidade e aposentadoria do servidor."],"correta":2,"explicacao":"Gabarito oficial: C. Art. 39, § 9º: é vedada a incorporação de vantagens temporárias ou de função de confiança/cargo em comissão.","origem":"prova","fonte":"Vunesp · TJSP · Escrevente Técnico Judiciário · 2021 · questão 51"},{"id":"oj-esc21-52","materia":"adm","assunto":"Estatuto SP - reintegração","enunciado":"Cícero, que é funcionário público estadual, havia sido demitido do serviço público, mas, posteriormente, foi absolvido pela Justiça, em decisão que negou a existência da sua autoria. Nessa situação hipotética, portanto, considerando o Estatuto dos Funcionários Públicos Civis do Estado de São Paulo, é correto afirmar que Cícero deverá ser","alternativas":["reincorporado ao serviço público, em cargo equivalente ao que ocupava e com todos os direitos e vantagens devidas, mediante certidão do cartório judicial que comprove a decisão absolutória.","reintegrado ao serviço público, em cargo superior ao que ocupava e com todos os direitos e vantagens devidas, mediante certidão do cartório judicial que comprove o teor da decisão absolutória.","readmitido ao serviço público, no mesmo cargo ou em cargo equivalente, com todos os direitos e vantagens devidas, mediante simples comprovação do trânsito em julgado de decisão judicial.","reintegrado ao serviço público, no cargo que ocupava e com todos os direitos e vantagens devidas, mediante simples comprovação do trânsito em julgado de decisão judicial.","readmitido em outro cargo diferente do que ocupava, sem os direitos e vantagens do cargo anterior, mediante certidão do cartório judicial que comprove o teor da decisão absolutória."],"correta":3,"explicacao":"Gabarito oficial: D. Absolvido por negativa de autoria, o servidor é reintegrado no cargo que ocupava, com todos os direitos, provado o trânsito em julgado.","origem":"prova","fonte":"Vunesp · TJSP · Escrevente Técnico Judiciário · 2021 · questão 52"},{"id":"oj-esc21-53","materia":"adm","assunto":"Estatuto SP - processo disciplinar","enunciado":"Medéia, funcionária pública estadual, praticou, quando em atividade, falta grave para a qual é cominada a pena de demissão prevista no Estatuto dos Funcionários Públicos Civis do Estado de São Paulo. Porém, a portaria que instaurou o respectivo processo administrativo para apuração da infração foi publicada somente dois anos após Medéia ter se aposentado do serviço público. Nessa situação hipotética, considerando, ainda, o fato de que a falta cometida ocorreu um ano antes de sua aposentadoria, é correto afirmar que Medéia","alternativas":["estará sujeita apenas às penas de multa e ressarcimento aos cofres públicos dos valores recebidos durante todo o período da sua aposentadoria.","poderá ter sua aposentadoria cassada, uma vez que a inatividade não impede a aplicação da sanção e não se operou a prescrição nesse caso.","não mais poderá ser punida em razão de ter se aposentado, independentemente da data da portaria que instaurou o processo administrativo.","estaria sujeita à pena de cassação de sua aposentadoria, mas a portaria foi instaurada intempestivamente, tendo ocorrido a prescrição da pena.","deverá retornar ao serviço público, para trabalhar pelo mesmo período que ficou aposentada, devendo pagar multa de até 5 vezes o valor dos seus proventos mensais."],"correta":1,"explicacao":"Gabarito oficial: B. A aposentadoria não impede a cassação se não houve prescrição (5 anos para faltas punidas com demissão).","origem":"prova","fonte":"Vunesp · TJSP · Escrevente Técnico Judiciário · 2021 · questão 53","extra":true},{"id":"oj-esc21-54","materia":"adm","assunto":"Estatuto SP - processo disciplinar","enunciado":"Considerando o disposto no Estatuto dos Funcionários Públicos Civis do Estado de São Paulo, assinale a alternativa correta a respeito das normas do processo administrativo.","alternativas":["Não tendo o acusado recursos financeiros ou negando-se a constituir advogado, o presidente nomeará advogado dativo.","Não poderá ser encarregado da apuração, parente consanguíneo ou afim, em linha reta ou colateral, podendo atuar apenas como secretário no processo.","Não comparecendo o acusado no interrogatório, será decretada sua condenação, podendo, contudo, participar dos demais atos do processo até a fase recursal.","O acusado poderá, até a fase do seu interrogatório, constituir advogado para prosseguir na sua defesa, vedada a constituição depois dessa fase processual.","O acusado tem o direito de assistir à inquirição do denunciante, para que tenha ciência pessoal das declarações que aquele deverá prestar em audiência."],"correta":0,"explicacao":"Gabarito oficial: A. Sem recursos ou recusando-se a constituir advogado, o presidente nomeia advogado dativo.","origem":"prova","fonte":"Vunesp · TJSP · Escrevente Técnico Judiciário · 2021 · questão 54","extra":true},{"id":"oj-esc21-55","materia":"adm","assunto":"Estatuto SP - processo disciplinar","enunciado":"A respeito das testemunhas no processo administrativo, o Estatuto dos Funcionários Públicos Civis estabelece que","alternativas":["o presidente e cada acusado poderão arrolar até 5 (cinco) testemunhas.","se tratando de servidor público, sua oitiva em audiência se dará em segredo de justiça.","nenhuma testemunha poderá se recusar a depor em razão de função, ministério, ofício ou profissão.","o Presidente poderá recusar até três testemunhas arroladas pela defesa, que poderá substituí-las, se quiser.","as testemunhas de defesa terão competência para fazer prova dos antecedentes do acusado."],"correta":0,"explicacao":"Gabarito oficial: A. No processo administrativo, presidente e cada acusado podem arrolar até 5 testemunhas.","origem":"prova","fonte":"Vunesp · TJSP · Escrevente Técnico Judiciário · 2021 · questão 55","extra":true},{"id":"oj-esc21-56","materia":"adm","assunto":"Estatuto SP - recursos e revisão","enunciado":"A teor do que dispõe o Estatuto dos Funcionários Públicos Civis do Estado de São Paulo a respeito dos recursos e da revisão, no âmbito do processo administrativo, é correto afirmar que","alternativas":["a autoridade que aplicou a penalidade não poderá apreciar o pedido de revisão quanto à sua admissibilidade.","nenhum recurso será admitido se incorretamente denominado ou endereçado.","do recurso deverá constar a exposição das razões de inconformismo e o comprovante do recolhimento da taxa recursal.","não caberá recurso ou pedido de reconsideração de decisão tomada pelo Governador do Estado em única instância.","entre outros efeitos, a decisão que julgar procedente a revisão poderá modificar a pena ou anular o processo."],"correta":4,"explicacao":"Gabarito oficial: E. A revisão julgada procedente pode modificar a pena ou anular o processo.","origem":"prova","fonte":"Vunesp · TJSP · Escrevente Técnico Judiciário · 2021 · questão 56","extra":true},{"id":"oj-esc21-57","materia":"adm","assunto":"Improbidade administrativa","enunciado":"Perseu cometeu ato de improbidade que causou lesão ao patrimônio público e lhe propiciou enriquecimento ilícito. Narciso, que é a autoridade responsável para a apuração da referida conduta, com fundamento na Lei no 8.429/92, procedeu à abertura do inquérito cabível no caso. Nessa situação hipotética, caberá a Narciso representar","alternativas":["à Justiça Eleitoral, para a suspensão dos direitos políticos de Perseu.","ao Juiz Cível, para a aplicação de multa civil a Perseu.","ao Juiz Criminal, para as devidas sanções penais a Perseu.","ao Ministério Público, para a indisponibilidade dos bens de Perseu.","à Autoridade Policial, para a investigação da conduta de Perseu."],"correta":3,"explicacao":"Gabarito oficial: D. Lei 8.429/92 (redação 2021): a autoridade representa ao Ministério Público para a indisponibilidade dos bens.","origem":"prova","fonte":"Vunesp · TJSP · Escrevente Técnico Judiciário · 2021 · questão 57","extra":true},{"id":"oj-esc21-58","materia":"adm","assunto":"Improbidade administrativa","enunciado":"Segundo o que estabelece a Lei no 8.429/92, na hipótese de funcionário público que cometeu ato de improbidade administrativo, ensejando seu enriquecimento ilícito pessoal, devidamente comprovado pelo competente processo administrativo, mas que veio a falecer antes de ressarcir os cofres públicos, é correto afirmar que o seu sucessor","alternativas":["poderá vir a ser condenado a pagar pelos danos, se o falecido não possuía bens.","ficará sujeito às cominações da Lei até o limite do valor do dano causado.","ficará sujeito às cominações da Lei até o limite do valor da herança.","será obrigado a reparar os danos integralmente, independentemente do seu valor.","não poderá ser responsabilizado, pois a pena não pode passar da pessoa do condenado."],"correta":2,"explicacao":"Gabarito oficial: C. Art. 8º, Lei 8.429/92: o sucessor responde até o limite do valor da herança.","origem":"prova","fonte":"Vunesp · TJSP · Escrevente Técnico Judiciário · 2021 · questão 58","extra":true},{"id":"oj-esc21-59","materia":"adm","assunto":"Improbidade administrativa","enunciado":"Astrid, que é servidora pública, deixou de praticar, indevidamente, ato de ofício que era de sua responsabilidade, atentando contra os princípios da Administração Pública. Essa conduta de Astrid, nos moldes da Lei no 8.429/92,","alternativas":["ficará sujeita, entre outras sanções, à suspensão dos direitos políticos, multa civil e proibição de contratar com o poder público.","ficará sujeita às penas previstas na Lei, mas terá redução de pena em razão de sua conduta não ter sido intencional.","estará sujeita às penas da Lei, desde que a omissão de Astrid tenha causado algum prejuízo concreto aos cofres públicos.","não é passível de penalidade, tendo em vista que as penas da Lei não são aplicáveis às condutas omissivas.","deverá ensejar as sanções criminais, administrativas e civis cabíveis, mas a improbidade ensejará apenas a perda da função pública. Normas da Corregedoria Geral da Justiça"],"correta":0,"explicacao":"Gabarito oficial de 2021: A. Atenção: a Lei 14.230/2021 mudou as sanções do art. 12, III (violação de princípios) — hoje não há suspensão de direitos políticos nesse caso.","origem":"prova","fonte":"Vunesp · TJSP · Escrevente Técnico Judiciário · 2021 · questão 59","extra":true},{"id":"oj-esc21-60","materia":"legesp","assunto":"Normas da Corregedoria (NSCGJ)","enunciado":"Considerando o disposto nas Normas da Corregedoria Geral da Justiça no tocante às correições, é correto afirmar que","alternativas":["o Juiz Corregedor Permanente efetuará, uma vez por ano, sempre no mês de janeiro, correição ordinária em todas as serventias, repartições e estabelecimentos sujeitos à sua fiscalização.","a correição extraordinária pode ser realizada a qualquer momento, com prévio anúncio e poderá ser geral ou parcial, conforme as necessidades e a conveniência do serviço correcional.","no caso de registros controlados exclusivamente pela via eletrônica, não havendo relatórios de processos físicos, o Cartório ficará dispensado de apresentar os relatórios de pendências do sistema informatizado.","os estabelecimentos prisionais e outros destinados ao recolhimento de pessoas, sujeitos à atividade correcional do juízo, serão visitados uma vez por ano pelo Juiz Corregedor Permanente.","em até 30 (trinta) dias depois de assumir a corregedoria permanente em caráter definitivo, o juiz fará visita correcional às unidades sob sua corregedoria."],"correta":4,"explicacao":"Gabarito oficial: E. NSCGJ: em até 30 dias depois de assumir a corregedoria permanente em caráter definitivo, o juiz faz visita correcional às unidades.","origem":"prova","fonte":"Vunesp · TJSP · Escrevente Técnico Judiciário · 2021 · questão 60"},{"id":"oj-esc21-61","materia":"legesp","assunto":"Normas da Corregedoria (NSCGJ)","enunciado":"Suponha que em apuração preliminar concluiu-se que Arturo e Shênia, ambos servidores públicos do Tribunal de Justiça, ocupantes de cargos de provimento efetivo, cometeram infrações cujas penas previstas são, respectivamente, de suspensão e demissão. Todavia, Shênia aposentou-se logo em seguida. Nessa situação hipotética, considerando o disposto nas Normas da Corregedoria Geral da Justiça, é correto afirmar que","alternativas":["a Corregedoria poderá aplicar as referidas sanções a ambos os servidores, com base na apuração, sem a necessidade de processo administrativo.","Arturo deverá responder a uma sindicância e Shênia a um processo administrativo, podendo vir a ter cassada a sua aposentadoria.","ambos os servidores deverão responder a uma sindicância administrativa, sendo que Shênia poderá ter cassada sua aposentadoria.","Arturo deverá responder a um processo administrativo e Shênia a uma sindicância, podendo ser condenada a ressarcir aos cofres públicos pelos proventos recebidos indevidamente na aposentadoria.","Arturo deverá responder a uma sindicância e Shênia não sofrerá a pena de demissão por ter se aposentado antes da conclusão do seu caso pela Corregedoria."],"correta":1,"explicacao":"Gabarito oficial: B. Suspensão → sindicância; demissão → processo administrativo; a aposentadoria pode ser cassada.","origem":"prova","fonte":"Vunesp · TJSP · Escrevente Técnico Judiciário · 2021 · questão 61","extra":true},{"id":"oj-esc21-62","materia":"legesp","assunto":"Normas da Corregedoria (NSCGJ)","enunciado":"No tocante à movimentação dos autos, as Normas da Corregedoria Geral da Justiça determinam que deverá ser feita conclusão dos autos no prazo de","alternativas":["5(cinco) dias e executados os atos processuais no prazo de 10(dez) dias.","1(um) dia e executados os atos processuais no prazo de 2(dois) dias.","48(quarenta e oito) horas e executados os atos processuais no prazo de 7(sete) dias.","1(um) dia e executados os atos processuais no prazo de 5(cinco) dias.","48(quarenta e oito) horas e executados os atos processuais no prazo de 5(cinco) dias."],"correta":3,"explicacao":"Gabarito oficial: D. NSCGJ: conclusão dos autos em 1 dia e execução dos atos processuais em 5 dias.","origem":"prova","fonte":"Vunesp · TJSP · Escrevente Técnico Judiciário · 2021 · questão 62"},{"id":"oj-esc21-63","materia":"legesp","assunto":"Normas da Corregedoria - mandados","enunciado":"A respeito dos mandados judiciais, as Normas da Corregedoria Geral da Justiça estabelecem que","alternativas":["nos mandados em geral, constarão todos os endereços dos destinatários da ordem judicial, declinados ou existentes nos autos, exceto do seu local de trabalho.","o escrivão relacionará mensalmente os mandados em poder dos oficiais de justiça, suspendendo as cargas dos oficiais que retiverem mandados além dos prazos legais ou fixados.","nas certidões de expedição e de entrega dos mandados, em processos de livre acesso, é vedado, por motivos de segurança, constar o nome do oficial de justiça a quem confiado o mandado.","os mandados serão distribuídos, na forma determinada pelo juiz Diretor do Foro da respectiva Comarca, para cumprimento pelos oficiais de justiça nela lotados.","os mandados de prisão não serão entregues aos oficiais de justiça, mas encaminhados ao Instituto de Identificação Ricardo Gumbleton Daunt – IIRGD."],"correta":4,"explicacao":"Gabarito oficial: E. NSCGJ: mandados de prisão não vão aos oficiais de justiça; são encaminhados ao IIRGD.","origem":"prova","fonte":"Vunesp · TJSP · Escrevente Técnico Judiciário · 2021 · questão 63"},{"id":"oj-esc21-64","materia":"legesp","assunto":"Normas da Corregedoria (NSCGJ)","enunciado":"Assinale a alternativa que, nos moldes das Normas da Corregedoria Geral da Justiça, contempla alternativa correta a respeito da consulta de movimentações processuais e decisões.","alternativas":["Será fornecida senha às partes para acesso à íntegra de seu processo eletrônico juntamente com a citação ou quando solicitada, sendo vedada a retirada de senha por meio de advogado constituído.","O acesso à integra dos processos digitais que não tramitem sob segredo de justiça a terceiro interessado será franqueado mediante uso de senha pessoal e intransferível, desde que comprove documentalmente seu interesse pessoal no processo.","Os processos que tramitam no sistema de processamento eletrônico do Tribunal de Justiça do Estado de São Paulo, em segredo de justiça, só poderão ser consultados pelas partes e procuradores habilitados a atuar no processo.","Os defensores públicos, procuradores e membros do Ministério Público, não vinculados a processo, previamente identificados, poderão acessar todos os atos e documentos processuais armazenados, incluindo processos em sigilo ou segredo de justiça.","É livre a consulta, no sítio do Tribunal de Justiça do Estado de São Paulo, às movimentações processuais, inteiro teor das decisões, sentenças, votos, acórdãos, exceto quanto aos mandados de prisão registrados no BNMP."],"correta":2,"explicacao":"Gabarito oficial: C. NSCGJ: processos eletrônicos em segredo de justiça só podem ser consultados pelas partes e procuradores habilitados.","origem":"prova","fonte":"Vunesp · TJSP · Escrevente Técnico Judiciário · 2021 · questão 64"},{"id":"oj-esc21-69","materia":"atual","assunto":"Estatuto da Pessoa com Deficiência","enunciado":"Assinale a alternativa que está em conformidade com o disposto na Lei no 13.146/2015 (Estatuto da Pessoa com Deficiência).","alternativas":["A pessoa com deficiência tem direito a receber atendimento prioritário, exceto para fins de recebimento de restituição de imposto de renda.","É facultado a qualquer pessoa comunicar à autoridade competente ameaça ou violação aos direitos da pessoa com deficiência.","Os fatores socioambientais, psicológicos e pessoais não devem ser considerados para fins de avaliação da deficiência.","A pessoa com deficiência não está obrigada à fruição de benefícios decorrentes de ação afirmativa.","A deficiência não afeta a plena capacidade civil da pessoa, exceto para exercer o direito à guarda, à tutela, à curatela e à adoção."],"correta":3,"explicacao":"Gabarito oficial: D. Lei 13.146/2015, art. 4º, § 2º: a pessoa com deficiência não está obrigada à fruição de benefícios de ação afirmativa.","origem":"prova","fonte":"Vunesp · TJSP · Escrevente Técnico Judiciário · 2021 · questão 69"},{"id":"oj-esc21-70","materia":"atual","assunto":"Estatuto da Pessoa com Deficiência","enunciado":"No tocante ao direito ao trabalho da pessoa com deficiência, nos moldes da Lei no 13.146/2015, é correto afirmar que","alternativas":["o cooperativismo e o associativismo devem prever a participação da pessoa com deficiência e a disponibilização de linhas de crédito, quando necessárias.","a pessoa com deficiência tem direito à remuneração maior do que à das demais pessoas por trabalho de igual valor.","o empregador deve sempre oferecer maiores oportunidades de trabalho às pessoas com deficiência do que às demais pessoas.","é vedada restrição ao trabalho da pessoa com deficiência em razão de sua condição, exceto nas etapas de recrutamento e seleção.","a pessoa com deficiência terá prioridade sobre os demais empregados em promoções, bonificações e incentivos profissionais oferecidos pelo empregador. Matemática"],"correta":0,"explicacao":"Gabarito oficial: A. Lei 13.146/2015, art. 35, parágrafo único: cooperativismo e associativismo devem prever a participação da pessoa com deficiência e linhas de crédito.","origem":"prova","fonte":"Vunesp · TJSP · Escrevente Técnico Judiciário · 2021 · questão 70"},{"id":"oj-esc21-71","materia":"mat","assunto":"Porcentagem","enunciado":"O PIX é um meio de pagamento eletrônico, lançado no Brasil no final de 2020. Na ocasião, especialistas tinham diferentes expectativas sobre o seu impacto nos meios de pagamentos eletrônicos. De toda forma, esses especialistas entendiam que qualquer pequena variação nesse mercado seria muita coisa já que, em 2019, por exemplo, esse mercado movimentou 1,8 trilhão de reais. Considerando o valor movimentado em 2019 pelo mercado de pagamentos eletrônicos, uma variação de 0,1% corresponderia a","alternativas":["0,18 bilhão de reais.","1,8 bilhão de reais.","180 bilhões de reais.","18 bilhões de reais.","1 800 bilhões de reais."],"correta":1,"explicacao":"Gabarito oficial: B (1,8 bilhão de reais).","origem":"prova","fonte":"Vunesp · TJSP · Escrevente Técnico Judiciário · 2021 · questão 71"},{"id":"oj-esc21-72","materia":"mat","assunto":"Operações com números reais","enunciado":"Um processo seletivo para o cargo de digitador em um escritório adota na prova prática o seguinte cálculo para nota: NOTA = 10 – (D × 0,05) – (F × 0,2) Nessa fórmula, D corresponde ao número de erros de digitação e F ao número de erros na formatação do documento. Considere um candidato cujo número de erros de digitação superou o número de erros de formatação em 20 e que teve um total de erros, considerando digitação e formatação, igual a 28. De acordo com o cálculo apresentado, a nota desse candidato será","alternativas":["7,4.","8,0.","2,0.","5,6.","5,0."],"correta":1,"explicacao":"Gabarito oficial: B (nota 8,0). Substitua D e F na fórmula.","origem":"prova","fonte":"Vunesp · TJSP · Escrevente Técnico Judiciário · 2021 · questão 72"},{"id":"oj-esc21-73","materia":"mat","assunto":"Porcentagem","enunciado":"Na reunião do balanço anual, o síndico apresentou a ____ R A S C U ____ N H ____ O prestação de contas de um conjunto habitacional. Chamou a atenção dos presentes à inadimplência por atraso no pagamento do condomínio. Segundo regimento do local, está estabelecida a cobrança de multa, a juros simples diários de 0,03% sobre a mensalidade do condomínio. O valor fixo do condomínio mensal desse conjunto habitacional é de R$ 900,00. O síndico comentou que o habitual observado mensalmente no local é que, em média, 45 moradores atrasam o pagamento em 5 dias. Considerando o número médio mensal de moradores que atrasam o pagamento da mensalidade do condomínio e o número médio mensal de dias desses atrasos, o total anual de multas cobradas por atraso no pagamento do condomínio é um valor","alternativas":["entre R$ 750,00 e R$ 800,00.","entre R$ 650,00 e R$ 700,00.","superior a R$ 800,00.","inferior a R$ 650,00.","entre R$ 700,00 e R$ 750,00."],"correta":4,"explicacao":"Gabarito oficial: E (entre R$ 700,00 e R$ 750,00).","origem":"prova","fonte":"Vunesp · TJSP · Escrevente Técnico Judiciário · 2021 · questão 73"},{"id":"oj-esc21-75","materia":"mat","assunto":"Geometria e medidas","enunciado":"O plano de reabertura do comércio de uma cidade, devido à pandemia de covid-19, determinava a ocupação máxima dos estabelecimentos, considerando certo raio de afastamento entre as pessoas, de acordo com o seguinte cálculo: Nesse cálculo, a área de circulação deve ser apresentada em metros quadrados. No caso de o resultado ser um número decimal, deve-se considerar o número 0,7 como decimal referência de arredondamento para o próximo número inteiro. Por exemplo, se o resultado for um número maior do que 12 e menor ou igual a 12,7, o número máximo de pessoas a ser considerado é 12, mas se o resultado for maior do que 12,7 e menor do que 13, o número máximo de pessoas a ser considerado é 13. Uma galeria instalada nessa cidade possui área de circulação composta por um quadrado e dois retângulos, sendo que cada retângulo possui um lado em comum com o quadrado. O quadrado tem 8 metros de lado, enquanto um retângulo tem 20 metros de comprimento, e o outro retângulo tem 25 metros de comprimento. Nesse caso, a ocupação máxima da área de circulação dessa galeria é de","alternativas":["60 pessoas.","80 pessoas.","81 pessoas.","51 pessoas.","61 pessoas."],"correta":0,"explicacao":"Gabarito oficial: A (60 pessoas).","origem":"prova","fonte":"Vunesp · TJSP · Escrevente Técnico Judiciário · 2021 · questão 75"},{"id":"oj-esc21-77","materia":"info","assunto":"Windows: área de transferência","enunciado":"A Área de Transferência do MS-Windows 10, em sua configuração padrão, permite que o conjunto de aplicativos do MS-Office 2016 possa copiar itens de documentos do Office, e os cole em outro documento do Office. Em relação à quantidade máxima de itens que podem ser copiados na Área de Transferência, tem-se que ela","alternativas":["depende do tamanho do disco do computador.","é maior ou igual a 1 000 itens.","é maior ou igual 100 e inferior a 1 000 itens.","depende do tamanho da memória do computador.","é maior ou igual a 20 e inferior a 100 itens."],"correta":4,"explicacao":"Gabarito oficial: E. A Área de Transferência do Office guarda até 24 itens, ou seja, entre 20 e 100.","origem":"prova","fonte":"Vunesp · TJSP · Escrevente Técnico Judiciário · 2021 · questão 77"},{"id":"oj-esc21-78","materia":"info","assunto":"Windows: atalhos","enunciado":"O sistema operacional MS-Windows 10 permite a criação de um atalho para um programa na Área de Trabalho. Para tanto, uma das formas de se realizar tal tarefa é localizar o programa por meio do Explorador de Arquivos e, utilizando o mouse em sua configuração padrão,","alternativas":["selecionar o programa, pressionar o botão direito e, na janela exibida na tela, selecionar a opção Criar atalho na Área de Trabalho.","clicar duas vezes com o botão esquerdo no nome do programa, posicionar o mouse na Área de Trabalho e clicar duas vezes.","clicar com o botão esquerdo no nome do programa e arrastá-lo para a Área de Trabalho.","selecionar o programa, selecionar as teclas Ctrl + C, posicionar o mouse na Área de Trabalho e selecionar as teclas Ctrl + V.","selecionar o programa, pressionar o botão direito e, na janela exibida na tela, selecionar a opção Propriedades e em seguida, selecionar Atalho."],"correta":2,"explicacao":"Gabarito oficial: C. Arrastar o programa com o botão esquerdo para a Área de Trabalho cria o atalho (gabarito oficial C).","origem":"prova","fonte":"Vunesp · TJSP · Escrevente Técnico Judiciário · 2021 · questão 78"},{"id":"oj-esc21-79","materia":"info","assunto":"Windows: pastas","enunciado":"Um usuário de um computador com o sistema operacional MS-Windows 10, em sua configuração padrão, deseja criar uma nova pasta na Área de Trabalho. Uma das formas de criar essa pasta é com o mouse, em sua configuração padrão, selecionar","alternativas":["o Explorador de Arquivos e selecionar a opção Área de Trabalho e, em seguida, selecionar Criar pasta.","um espaço vazio na Área de Trabalho, pressionar o seu botão direito e, na janela que surge na tela, selecionar Novo e selecionar a opção Pasta.","um espaço vazio na Área de Trabalho, pressionar o seu botão direito e, na janela que surge na tela, selecionar o Explorador de Arquivos e selecionar a opção Criar nova pasta.","o Explorador de Arquivos e selecionar a opção Criar nova pasta e, em seguida, selecionar Área de Trabalho.","um espaço vazio na Barra de Ferramentas, pressionar o seu botão esquerdo e, na janela que surge na tela, selecionar Nova Pasta."],"correta":1,"explicacao":"Gabarito oficial: B. Botão direito em área vazia > Novo > Pasta.","origem":"prova","fonte":"Vunesp · TJSP · Escrevente Técnico Judiciário · 2021 · questão 79"},{"id":"oj-esc21-80","materia":"info","assunto":"Windows: propriedades de pasta","enunciado":"No sistema operacional MS-Windows 10, selecionou-se uma pasta com o botão direito do mouse, este em sua configuração padrão, e selecionou-se Propriedades na relação de opções que foi exibida. Na janela que se abriu, há a possibilidade de se escolher os atributos da pasta, que são:","alternativas":["Somente leitura (arquivos da pasta) e Oculto.","Oculto e Visível.","Compactada e Somente leitura (arquivos da pasta).","Compactada, Criptografada e Protegida.","Somente escrita e Somente leitura."],"correta":0,"explicacao":"Gabarito oficial: A. Na guia Geral das Propriedades da pasta aparecem os atributos \"Somente leitura\" e \"Oculto\".","origem":"prova","fonte":"Vunesp · TJSP · Escrevente Técnico Judiciário · 2021 · questão 80"},{"id":"oj-esc21-81","materia":"info","assunto":"MS-Word","enunciado":"Um usuário do MS-Word 2016, em português e na sua configuração padrão, selecionou uma palavra de um parágrafo que estava com estilo normal de fonte. A seguir, com essa palavra selecionada, escolheu, na guia Página Inicial, grupo Fonte, um efeito de fonte que deixou essa palavra com letras bem pequenas acima da linha de texto. O efeito selecionado foi o","alternativas":["Subscrito.","Todas em maiúsculas.","Versalete.","Sobrescrito.","Tachado."],"correta":3,"explicacao":"Gabarito oficial: D. Sobrescrito eleva o texto (como em m²).","origem":"prova","fonte":"Vunesp · TJSP · Escrevente Técnico Judiciário · 2021 · questão 81"},{"id":"oj-esc21-82","materia":"info","assunto":"MS-Word: impressão","enunciado":"Deseja-se, no MS-Word 2016, em português e na sua configuração padrão, imprimir um documento que possui mais de 20 páginas. Ao se navegar no aplicativo via Arquivo > Imprimir, pode-se configurar a impressão. Em particular, a opção de configuração Impressão Personalizada permite, por exemplo,","alternativas":["colocar uma cor de fundo no documento a ser impresso.","configurar uma marca d´água no documento a ser impresso.","inserir numeração de páginas no documento a ser impresso.","inserir data de impressão no documento a ser impresso.","imprimir somente as páginas e/ou intervalo de páginas digitadas no quadro “Páginas:”."],"correta":4,"explicacao":"Gabarito oficial: E. \"Impressão Personalizada\" imprime só as páginas ou intervalos digitados em \"Páginas:\".","origem":"prova","fonte":"Vunesp · TJSP · Escrevente Técnico Judiciário · 2021 · questão 82"},{"id":"oj-esc21-84","materia":"info","assunto":"MS-Excel","enunciado":"Em uma planilha do MS-Excel 2016, em português e na sua configuração padrão, as colunas C e D foram selecionadas. Em seguida, na guia Página Inicial, grupo Células, clicou-se sobre o botão Inserir, selecionando-se no menu que aparece a opção Inserir Colunas na Planilha. Assinale a alternativa que apresenta a ação decorrente da operação realizada.","alternativas":["A coluna B foi eliminada, sendo criada no seu lugar uma nova coluna vazia.","Duas colunas novas foram criadas entre as colunas B e C originais. As colunas C e D originais passaram a ser as colunas E e F, respectivamente.","Uma coluna nova foi criada entre as colunas B e C originais. As colunas C e D originais passaram a ser as colunas D e E, respectivamente.","A coluna C foi eliminada, sendo criada no seu lugar uma nova coluna vazia.","As colunas C e D foram eliminadas, sendo criadas nos seus lugares duas novas colunas vazias."],"correta":1,"explicacao":"Gabarito oficial: B. Inserir colunas com C e D selecionadas cria 2 colunas novas antes de C; as antigas C e D viram E e F.","origem":"prova","fonte":"Vunesp · TJSP · Escrevente Técnico Judiciário · 2021 · questão 84"},{"id":"oj-esc21-85","materia":"info","assunto":"MS-Excel","enunciado":"No MS-Excel 2016, em português e na sua configuração padrão, tem-se as guias com os nomes das planilhas existentes no arquivo aberto, localizadas na parte inferior da janela do aplicativo. Ao se clicar com o botão direito do mouse (em sua configuração padrão) sobre o nome de uma planilha, por exemplo, de nome P1, pode-se realizar algumas ações sobre ela, como:","alternativas":["limpar todo o conteúdo de P1.","mudar a cor da guia de P1.","inserir linhas de grade em P1.","enviar P1 para outro usuário por e-mail.","imprimir P1."],"correta":1,"explicacao":"Gabarito oficial: B. O menu da guia da planilha (botão direito) permite mudar a cor da guia.","origem":"prova","fonte":"Vunesp · TJSP · Escrevente Técnico Judiciário · 2021 · questão 85"},{"id":"oj-esc21-86","materia":"info","assunto":"Correio eletrônico","enunciado":"Considerando-se os softwares de correio eletrônico, suponha que um usuário recebeu duas mensagens diferentes de um mesmo remetente, cada uma contendo um arquivo anexo. Esse usuário deseja retransmitir esses dois arquivos, como anexos, para outro destinatário. Nesse caso,","alternativas":["é possível reunir ambos os arquivos em uma mesma mensagem, desde que a soma de seus tamanhos não ultrapasse o limite imposto pelo software de correio eletrônico.","será necessário enviar cada um desses dois arquivos anexos em duas mensagens separadas, ainda que destinadas ao mesmo destinatário.","o envio dos dois arquivos estará sujeito a uma aprovação prévia a ser gerada pelo sistema operacional do computador do usuário.","será possível enviar esses dois arquivos em uma mesma mensagem desde que ambos tenham a mesma extensão (por exemplo, txt, doc, etc.).","será possível enviar ambos os arquivos em uma mesma mensagem, porém o software de correio eletrônico irá impor uma defasagem mínima de 1 minuto entre o envio de cada um dos dois arquivos."],"correta":0,"explicacao":"Gabarito oficial: A. É possível reunir vários anexos numa mensagem, respeitado o limite de tamanho do serviço.","origem":"prova","fonte":"Vunesp · TJSP · Escrevente Técnico Judiciário · 2021 · questão 86"},{"id":"oj-esc21-87","materia":"info","assunto":"Correio eletrônico","enunciado":"Os softwares de correio eletrônico contêm uma pasta especial denominada pasta de spam. O correio eletrônico filtra essas mensagens, utilizando como um de seus critérios, mensagens","alternativas":["recebidas de remetentes situados em países diferentes do receptor da mensagem.","originadas de remetentes corporativos e não de pessoas físicas.","que contenham um número muito grande de destinatários.","consideradas como sendo de caráter publicitário.","com muitas imagens em seu conteúdo."],"correta":3,"explicacao":"Gabarito oficial: D. Filtros de spam consideram, entre outros critérios, mensagens de caráter publicitário.","origem":"prova","fonte":"Vunesp · TJSP · Escrevente Técnico Judiciário · 2021 · questão 87"},{"id":"oj-esc21-88","materia":"info","assunto":"Navegadores","enunciado":"Os navegadores para Internet possibilitam que se faça a navegação no modo anônimo. Tal modo possui algumas características peculiares, sendo correto que, nesse modo de navegação,","alternativas":["o tempo de permanência em cada página é limitado.","permissões concedidas a sites são salvas.","o histórico de navegação não é salvo.","informações inseridas em formulários são salvas.","o número de páginas que podem ser visitadas é restrito pelo navegador."],"correta":2,"explicacao":"Gabarito oficial: C. No modo anônimo o histórico de navegação não é salvo.","origem":"prova","fonte":"Vunesp · TJSP · Escrevente Técnico Judiciário · 2021 · questão 88"},{"id":"oj-esc21-89","materia":"info","assunto":"Internet: URL","enunciado":"Ao navegar pela internet, deve-se conhecer a URL de um site. Considerando-se que a URL é composta por três partes principais: caminho, protocolo e domínio, a estrutura adotada para a URL é:","alternativas":["caminho://protocolo/domínio","domínio://caminho/protocolo","protocolo://domínio/caminho","domínio://protocolo/caminho","protocolo://caminho/domínio"],"correta":2,"explicacao":"Gabarito oficial: C. Estrutura da URL: protocolo://domínio/caminho.","origem":"prova","fonte":"Vunesp · TJSP · Escrevente Técnico Judiciário · 2021 · questão 89"},{"id":"oj-esc21-90","materia":"info","assunto":"MS-Teams","enunciado":"Considerando o software Microsoft Teams, é correto afirmar que","alternativas":["um canal de uma equipe deve incluir todos os membros dessa equipe.","todas as equipes criadas no Teams devem ser públicas.","uma equipe representa um grupo de pessoas que podem compartilhar, por exemplo, conversas.","cada usuário do Teams não pode pertencer a mais de uma equipe.","cada equipe comporta um máximo de cinco canais. Raciocínio Lógico"],"correta":2,"explicacao":"Gabarito oficial: C. No Teams, uma equipe é um grupo de pessoas que compartilham conversas, arquivos e ferramentas.","origem":"prova","fonte":"Vunesp · TJSP · Escrevente Técnico Judiciário · 2021 · questão 90"},{"id":"oj-esc21-91","materia":"mat","assunto":"Raciocínio lógico: argumentação","enunciado":"Considere as afirmações: I. Não existe mecânico que não goste de carro. II. Alguns funileiros gostam de carro. A partir dessas afirmações, é correto concluir que","alternativas":["se José gosta de carro, então José é funileiro.","qualquer mecânico é funileiro.","quem gosta de carro é mecânico ou funileiro.","alguns funileiros são mecânicos.","se Carlos não gosta de carro, então Carlos não é mecânico."],"correta":4,"explicacao":"Gabarito oficial: E. \"Todo mecânico gosta de carro\". Contrapositiva: quem não gosta de carro não é mecânico.","origem":"prova","fonte":"Vunesp · TJSP · Escrevente Técnico Judiciário · 2021 · questão 91"},{"id":"oj-esc21-92","materia":"mat","assunto":"Raciocínio lógico: proposições","enunciado":"Sabe-se que das afirmações a seguir, apenas a afirmação (III) é falsa. I. Em um mesmo dia, ou João corre 10 km ou João pratica meditação. II. Se João corre 10 km, então ele fica o dia todo bem humorado. III. Ontem João estava bem humorado. IV. No dia em que João pratica meditação, ele não conversa com ninguém. Sendo assim, é correto concluir que ontem João","alternativas":["não estava bem humorado e conversou com alguém.","não conversou com ninguém.","não estava bem humorado e correu 10 km.","correu 10 km.","correu 10 km ou não praticou meditação."],"correta":1,"explicacao":"Gabarito oficial: B. Use I e II verdadeiras e III falsa para deduzir o que aconteceu.","origem":"prova","fonte":"Vunesp · TJSP · Escrevente Técnico Judiciário · 2021 · questão 92"},{"id":"oj-esc21-94","materia":"mat","assunto":"Raciocínio lógico: negação","enunciado":"Identifique a afirmação que corresponda à negação lógi- ____ R A S C U ____ N H ____ O ca da afirmação a seguir: Se a questão é fácil, então todos os candidatos acertam.","alternativas":["A questão é fácil e pelo menos um candidato não acerta.","Se a questão não é fácil, então nenhum candidato acerta.","A questão não é fácil e todos os candidatos acertam.","A questão é fácil ou pelo menos um candidato acerta.","Se todos os candidatos não acertam, então a questão não é fácil."],"correta":0,"explicacao":"Gabarito oficial: A. Negação de \"Se P, então todos Q\" é \"P e pelo menos um não Q\".","origem":"prova","fonte":"Vunesp · TJSP · Escrevente Técnico Judiciário · 2021 · questão 94"},{"id":"oj-esc21-95","materia":"mat","assunto":"Raciocínio lógico: equivalências","enunciado":"Uma afirmação equivalente à afirmação ‘Se Alice estuda, então ela faz uma boa prova, e se Alice estuda, então ela não fica triste’ é","alternativas":["Alice estuda e ela faz uma boa prova e não fica triste.","Alice não estuda, e ela faz uma boa prova ou não fica triste.","Se Alice estuda, então ela não faz uma boa prova ou ela fica triste.","Se Alice estuda, então ela faz uma boa prova e ela não fica triste.","Se Alice fica triste e não faz uma boa prova, então ela não estuda."],"correta":3,"explicacao":"Gabarito oficial: D. (p→q) ∧ (p→r) equivale a p → (q ∧ r).","origem":"prova","fonte":"Vunesp · TJSP · Escrevente Técnico Judiciário · 2021 · questão 95"},{"id":"oj-esc21-96","materia":"mat","assunto":"Raciocínio lógico: sequências","enunciado":"Na sequência a seguir (45, 41, 42, 38, 40, 36, 39, 35, 39, 35, 40, 36, 42, 38, 45, 41, 49, ...), a soma entre o elemento da posição 21 e o elemento da posição 26 é igual a","alternativas":["131.","143.","134.","138.","129."],"correta":0,"explicacao":"Gabarito oficial: A (131).","origem":"prova","fonte":"Vunesp · TJSP · Escrevente Técnico Judiciário · 2021 · questão 96"},{"id":"oj-tjsp09-04","materia":"port","assunto":"Interpretação de texto","enunciado":"De acordo com o texto, em relação aos programas adotados no governo federal para lidar com os problemas sociais, a ONU deixa evidente que eles","alternativas":["se mostram arrojados.","devem ser ampliados.","não precisarão de melhorias.","extinguiram as desigualdades.","combatem eficazmente a pobreza."],"correta":1,"explicacao":"Gabarito oficial: B. A ONU diz que os programas não bastam e devem ser ampliados.","origem":"prova","fonte":"Vunesp · TJSP · Oficial de Justiça · 2009 · questão 4","texto":"ONU pede ampliação de programas sociais do Brasil SÃO PAULO – Os programas adotados no governo federal ainda não são suficientes para lidar com problemas de desigualdade, reforma
